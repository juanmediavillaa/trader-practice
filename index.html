<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trader practice</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315130F'/%3E%3Cpath d='M17.5 5 9 17h7l-1.5 10L23 15h-7z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F5F4F1; --surface:#FFFFFF; --surface-2:#F2F1ED; --surface-3:#E9E7E2; --line:#E4E2DC; --line-strong:#CFCCC4;
  --ink:#15130F; --ink-2:#46423B; --ink-3:#6A655C;
  --accent:#E4571B; --accent-soft:#FCEBE2; --accent-ink:#B8410E;
  --quant:#C4480F; --quant-soft:#FCEBE2; --tech:#1F5E55; --tech-soft:#E3EFEC;
  --ok:#0ca30c; --ok-ink:#006300; --warn:#fab219; --warn-ink:#8A5A00; --bad:#d03b3b; --bad-ink:#B02C2C;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948; --c9:#8C877E; --c10:#0e8fa3; --c11:#8a5a2b; --c12:#b0459b; --c13:#6f7f00; --c14:#3f6c8f; --c15:#c2410c;
  --h0:#EEEDE9; --h1:#b7d3f6; --h2:#6da7ec; --h3:#2a78d6; --h4:#184f95;
  --grid:#E6E4DE; --axis:#C9C6BE;
  --shadow:0 1px 2px rgba(20,18,14,.04),0 1px 1px rgba(20,18,14,.03);
  --r:12px; --r-sm:8px;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E0E0D; --surface:#181816; --surface-2:#1F1F1C; --surface-3:#282824; --line:#2A2A27; --line-strong:#3B3B37;
  --ink:#F3F1EC; --ink-2:#CCC7BD; --ink-3:#9F998E;
  --accent:#FF7433; --accent-soft:#2C1A10; --accent-ink:#FF8B55;
  --quant:#FF7433; --quant-soft:#2C1A10; --tech:#63B3A4; --tech-soft:#14241F;
  --ok:#0ca30c; --ok-ink:#3FC03F; --warn:#fab219; --warn-ink:#F2B53A; --bad:#d03b3b; --bad-ink:#EE7B7B;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c9:#8F8A80; --c10:#2fb3c6; --c11:#c08a55; --c12:#d77cc4; --c13:#a6b830; --c14:#6c9cc4; --c15:#f07a3f;
  --h0:#222220; --h1:#104281; --h2:#256abf; --h3:#3987e5; --h4:#86b6ef;
  --grid:#2A2A27; --axis:#3B3B37;
  --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E0E0D; --surface:#181816; --surface-2:#1F1F1C; --surface-3:#282824; --line:#2A2A27; --line-strong:#3B3B37;
  --ink:#F3F1EC; --ink-2:#CCC7BD; --ink-3:#9F998E;
  --accent:#FF7433; --accent-soft:#2C1A10; --accent-ink:#FF8B55;
  --quant:#FF7433; --quant-soft:#2C1A10; --tech:#63B3A4; --tech-soft:#14241F;
  --ok:#0ca30c; --ok-ink:#3FC03F; --warn:#fab219; --warn-ink:#F2B53A; --bad:#d03b3b; --bad-ink:#EE7B7B;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c9:#8F8A80; --c10:#2fb3c6; --c11:#c08a55; --c12:#d77cc4; --c13:#a6b830; --c14:#6c9cc4; --c15:#f07a3f;
  --h0:#222220; --h1:#104281; --h2:#256abf; --h3:#3987e5; --h4:#86b6ef;
  --grid:#2A2A27; --axis:#3B3B37;
  --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--sans)}
h1{font-size:26px;font-weight:650;letter-spacing:-.015em;line-height:1.2}
h2{font-size:16px;font-weight:600;letter-spacing:-.005em;line-height:1.3}
h3{font-size:13.5px;font-weight:600;color:var(--ink-2)}
a{color:inherit}
p{margin:0 0 10px}p:last-child{margin-bottom:0}
svg{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)}
.num-t{font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere;line-height:1.55}
.muted{color:var(--ink-3)}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px 16px;display:flex;flex-direction:column;gap:6px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 14px;font-weight:700;font-size:16.5px;letter-spacing:-.01em}
.brand .logo{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.brand .logo svg{width:15px;height:15px}
.brand small{display:block;font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.navgrp{display:grid;gap:1px;margin-bottom:10px}
.navgrp>span{font-size:11.5px;font-weight:600;color:var(--ink-3);padding:8px 10px 4px;letter-spacing:.02em}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink-2);font:inherit;font-size:14.5px;font-weight:500;padding:7px 10px;border-radius:8px;cursor:pointer;text-align:left}
.nav svg{width:18px;height:18px;flex:none;color:var(--ink-3)}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--surface-3);color:var(--ink);font-weight:600}
.nav[aria-current="page"] svg{color:var(--ink)}
.nav .badge{margin-left:auto;font-size:11.5px;font-weight:600;background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;line-height:19px}
.side-timer{display:flex;align-items:center;gap:9px;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;margin:0 0 12px;text-align:left}
.side-timer b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.side-timer.at .pulse{background:var(--ok)}
.side-timer .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.side-foot{margin-top:auto;display:grid;gap:8px;padding:12px 6px 0;border-top:1px solid var(--line)}
.side-foot .row{display:flex;gap:6px;flex-wrap:wrap}
.side-foot .small{font-size:12px;color:var(--ink-3)}
.main{min-width:0;padding:30px 36px 90px}
.main-in{max-width:1180px;margin:0 auto}
.topbar{display:none}
.scrim{display:none}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:22px}
.page-h p{margin:4px 0 0;color:var(--ink-3);font-size:14.5px}
.page-h .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
section[role="tabpanel"]{display:grid;gap:18px}
.cols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.cols>*,.cols3>*{min-width:0}
.cols3{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.span2{grid-column:span 2}
section[role="tabpanel"]>.span2{grid-column:auto}
@media (max-width:1100px){.span2{grid-column:auto}}

/* ---------- cards ---------- */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;min-width:0;box-shadow:var(--shadow)}
.card.q::before,.card.t::before{content:"";position:absolute;left:-1px;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0}
.card.q::before{background:var(--quant)}
.card.t::before{background:var(--tech)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-bottom:14px}
.card-h>*{min-width:0}
.card-h h2{flex:1 1 auto}
.card-h .small{color:var(--ink-3)}
.card>h2{margin-bottom:12px}
.card.flat{box-shadow:none;background:var(--surface-2)}

/* ---------- controls ---------- */
input,select,textarea{font:inherit;font-size:14.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 10px;max-width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink-3);box-shadow:0 0 0 3px var(--surface-3)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input[type=checkbox],input[type=radio]{width:17px;height:17px;accent-color:var(--ink);padding:0}
input[type=range]{accent-color:var(--ink);border:0;padding:0;box-shadow:none}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px,4px 4px;background-repeat:no-repeat;padding-right:28px}
textarea{width:100%;min-height:76px;resize:vertical}
label.small{display:grid;gap:5px;min-width:0;font-size:13px;font-weight:600;color:var(--ink-2)}
label.small input,label.small select{font-weight:400}
.btn{font:inherit;font-size:14px;font-weight:600;background:var(--ink);color:var(--bg);border:1px solid var(--ink);cursor:pointer;padding:9px 16px;border-radius:var(--r-sm);white-space:nowrap;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{opacity:.88}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--surface-2);opacity:1}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.big{font-size:15.5px;padding:12px 22px;border-radius:10px}
.btn svg{width:16px;height:16px}
button.mini{font:inherit;font-size:13px;font-weight:500;background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;padding:4px 10px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
button.mini:hover{color:var(--ink);background:var(--surface-2)}
button.mini:disabled{opacity:.4;cursor:default}
button.mini.icon{padding:0;width:30px;height:30px;display:inline-grid;place-items:center;line-height:0;flex:none}
button.mini.icon.step{line-height:1;font-size:18px;font-weight:500}
button.mini.icon svg{width:15px;height:15px;display:block;pointer-events:none}
button.mini.danger{background:var(--bad);color:#FFF;border-color:var(--bad)}
.theme-btn{font:inherit;font-size:13px;font-weight:500;background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;padding:4px 10px;cursor:pointer;color:var(--ink-2)}
form.grid{display:grid;gap:14px 16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));align-items:end}
form.grid .full{grid-column:1/-1}
form.grid>*{min-width:0}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:13.5px;font-weight:500;border:0;background:none;color:var(--ink-2);padding:5px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ---------- tags, chips ---------- */
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;flex:none;border:1px solid var(--line)}
.tag.q{background:var(--quant-soft);color:var(--quant);border-color:transparent}
.tag.t{background:var(--tech-soft);color:var(--tech);border-color:transparent}
.chip{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line)}
.chip.test{background:var(--quant-soft);color:var(--quant);border-color:transparent}
.chip.interview{background:var(--tech-soft);color:var(--tech);border-color:transparent}
.chip.offer,.chip.solo,.chip.good{background:transparent;color:var(--ok-ink);border-color:var(--ok)}
.chip.rejected{color:var(--ink-3)}
.chip.hint,.chip.warnc{background:transparent;color:var(--warn-ink);border-color:var(--warn)}
.chip.failed,.chip.badc{background:transparent;color:var(--bad-ink);border-color:var(--bad)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:1px}
.tagrow .lab{font-size:12.5px;font-weight:600;color:var(--ink-3);margin-right:2px}
button.tagchip{font:inherit;font-size:12.5px;font-weight:500;background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-2);border-radius:999px;padding:3px 10px;cursor:pointer;white-space:nowrap}
button.tagchip:hover{color:var(--ink);border-color:var(--ink-3)}
button.tagchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.tagchip.sug{border-style:dashed;border-color:var(--accent);color:var(--accent-ink)}
.tgs{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.tg{font-size:12px;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.dhint{display:block;font-size:13px;font-weight:400;color:var(--ink-3);margin:0 0 4px;line-height:1.45}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}

/* ---------- lists ---------- */
ul.check{list-style:none;margin:0;padding:0;display:grid}
ul.check li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
ul.check li:last-child{border-bottom:0}
ul.check input{margin-top:3px;flex:none}
ul.check label{flex:1 1 auto;cursor:pointer;min-width:0;overflow-wrap:anywhere;font-size:15px}
ul.check .done{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.idx{font-family:var(--mono);font-size:12px;color:var(--ink-3);padding-top:3px;flex:none}
.num{font-weight:650;font-size:30px;line-height:1.05;letter-spacing:-.02em}
.stat-row{display:flex;gap:14px 34px;flex-wrap:wrap}
.stat{min-width:66px}
.stat .num{display:block}
.stat span.lab{font-size:13px;font-weight:500;color:var(--ink-3);display:block;margin-top:6px}
.tablewrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:540px}
th{font-size:12.5px;font-weight:600;color:var(--ink-3);text-align:left;padding:0 12px 9px 0;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:11px 12px 11px 0;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere;font-size:14.5px}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
table.compact{min-width:0}
table.compact td{padding:8px 12px 8px 0;font-size:14px}
tr.editing td{background:var(--surface-2);padding:16px 14px;border-radius:8px}
.rowacts{display:inline-flex;gap:5px;justify-content:flex-end;white-space:nowrap}
.links{display:grid}
.links a{display:flex;justify-content:space-between;gap:16px;align-items:center;text-decoration:none;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.links a:last-child{border-bottom:0}
.links a:hover b{color:var(--accent-ink)}
.links a>*{min-width:0}
.links a b{font-weight:600;font-size:14.5px}
.links .what{font-size:13px;color:var(--ink-3);text-align:right;flex:0 1 auto}
.links .mono.small{font-size:12.5px;color:var(--ink-3)}
.bar{display:block;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.bar.q i{background:var(--quant)}.bar.t i{background:var(--tech)}
.bar.ok i{background:var(--ok)}
.setrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px 16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow>*{min-width:0}
.counter{display:flex;gap:8px;align-items:center;font-size:14px}
.counter b{min-width:24px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.note{border-left:3px solid var(--line-strong);padding:2px 0 2px 12px;margin:0 0 14px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;z-index:80;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.plan td:first-child{font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--accent-ink)}
.figcap{display:block;font-size:13px;color:var(--ink-3);margin:4px 0 10px;line-height:1.5}
.runstrip{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.runstrip span{font-size:13px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-variant-numeric:tabular-nums}
.runstrip span.empty{border:0;padding-left:0;color:var(--ink-3)}
ul.hints{list-style:none;margin:10px 0 0;padding:0;display:grid}
ul.hints li{font-size:13.5px;color:var(--ink-3);padding:7px 0;border-bottom:1px solid var(--line)}
ul.hints li:last-child{border-bottom:0}
ul.hints li::before{content:"–";color:var(--ink-3);margin-right:9px}
.drows{display:grid;gap:0;margin-top:14px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow .small{overflow-wrap:normal}
.drow>*{min-width:0}
.drow .mono{font-size:12.5px;color:var(--ink-3)}
.dtrack{position:relative;display:block;height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.dtrack i{display:block;height:100%;background:var(--ink);border-radius:99px}
#f-doss textarea{min-height:92px}

/* ---------- tick lists ---------- */
details.grp{border-bottom:1px solid var(--line)}
details.grp:last-of-type{border-bottom:0}
details.grp>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:13px 0;font-weight:600;font-size:15px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:"\25B8";color:var(--ink-3);margin-right:10px;font-size:12px;transition:transform .15s;display:inline-block}
details.grp[open]>summary::before{transform:rotate(90deg)}
details.grp>summary>span:first-child{flex:1;min-width:0}
details.grp .gc{font-size:13px;color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums}
.subh{font-size:13px;font-weight:600;color:var(--ink-2);margin:12px 0 2px}
.tick{padding:9px 0;border-top:1px solid var(--line)}
.tick .tk{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;min-width:0}
.tick .tk label{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1 1 260px;min-width:0}
.tick .tn{font-size:15px;overflow-wrap:anywhere}
.tick.done .tn{color:var(--ink-2)}
.tick .df{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.tick .df.dE{color:var(--ok-ink)}.tick .df.dH{color:var(--bad-ink)}
.tick .lc{font-size:13px;color:var(--ink-3);text-decoration:none;white-space:nowrap}
.tick .lc:hover{color:var(--accent-ink)}
.tick .tx{display:grid;grid-template-columns:max-content max-content max-content minmax(180px,1fr);gap:8px 12px;margin:8px 0 2px 27px;align-items:end}
.tick .tx select,.tick .tx input{font-size:14px;min-width:0;padding:6px 9px}
.unconf{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:8px 0 2px 27px;padding:9px 12px;background:var(--surface-2);border-radius:8px;font-size:14px;border-left:3px solid var(--bad)}
.unconf span{flex:1 1 200px}

/* ---------- life: tiles, rings ---------- */
.hero{display:flex;flex-wrap:wrap;gap:18px 30px;align-items:center}
.hero .kpi{flex:1 1 140px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:118px;height:118px;display:block;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .in b{font-size:30px;font-weight:650;letter-spacing:-.02em;line-height:1}
.ring .in span{font-size:12px;color:var(--ink-3);margin-top:4px;max-width:84px;line-height:1.2}
.ringwrap{display:grid;justify-items:center;gap:6px;flex:none}
.ringcap{font-size:12px;color:var(--ink-3);text-align:center;max-width:118px;line-height:1.3}
.kpi{min-width:0}
.kpi .lab{font-size:13px;color:var(--ink-3);font-weight:500}
.kpi .val{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.15;margin-top:3px}
.kpi .val small{font-size:14px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.kpi .dl{font-size:12.5px;font-weight:600;margin-top:3px;color:var(--ink-3)}
.kpi .dl.up{color:var(--ok-ink)}.kpi .dl.down{color:var(--bad-ink)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.kpis .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.nudges{display:grid;gap:6px;margin-top:4px}
.nudge{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.nudge svg{width:16px;height:16px;flex:none;color:var(--accent)}

/* ---------- habits ---------- */
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .hn{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.hrow .hg{font-size:12.5px;color:var(--ink-3)}
.hrow.met .hn{color:var(--ink)}
.hctl{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.hctl input[type=time]{padding:5px 8px;font-size:14px;width:auto}
.hctl .val{min-width:62px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:14.5px}
.cbox{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line-strong);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;color:transparent;padding:0;flex:none}
.cbox svg{width:17px;height:17px}
.cbox[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cbox.auto[aria-pressed="true"]{background:var(--surface-3);border-color:var(--line-strong);color:var(--ink)}
.cbox:disabled{cursor:default;opacity:.35}
.streak{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:600;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:44px;justify-content:flex-end}
.streak svg{width:15px;height:15px}
.streak.hot{color:var(--accent-ink)}
.okmark{display:inline-flex;align-items:center;gap:3px;color:var(--ok-ink);font-size:12.5px;font-weight:600}
.okmark svg{width:14px;height:14px}
.wgrid{min-width:900px}
.wgrid td:first-child{min-width:170px}
.wgrid td.num-t{white-space:nowrap;font-size:13.5px}
.wgrid th,.wgrid td{text-align:center;padding:8px 4px;vertical-align:middle}
.wgrid th:first-child,.wgrid td:first-child{text-align:left;padding-left:0}
.wgrid td.today{background:var(--surface-2)}
.wgrid th.today{color:var(--ink)}
.wgrid input[type=number]{width:62px;text-align:center;padding:5px 4px;font-size:14px}
.wgrid input[type=time]{width:112px;padding:5px 4px;font-size:13.5px}
.wgrid .cbox{width:28px;height:28px}
.wgrid td.fut{opacity:.35}
.wgrid .hname{font-weight:600;font-size:14.5px}
.wgrid .hsub{font-size:12.5px;color:var(--ink-3);font-weight:400}

/* ---------- timer ---------- */
.clock{font-size:clamp(44px,8vw,64px);font-weight:650;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.clock.sm{font-size:40px}
.tnow{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:600}
.catchips{display:flex;flex-wrap:wrap;gap:7px}
.catchip{font:inherit;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px 6px 10px;cursor:pointer}
.catchip:hover{background:var(--surface-2)}
.catchip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.catchip .sw{width:10px;height:10px;border-radius:50%}
.timeline{position:relative;height:30px;background:var(--surface-2);border-radius:8px;overflow:hidden;margin:6px 0 4px}
.timeline i{position:absolute;top:0;bottom:0;border-left:2px solid var(--surface);min-width:3px}
.tl-axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.catbars{display:grid;gap:8px;margin-top:10px}
.catbar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:14px}
.catbar>span:first-child{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catbar .trk{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.catbar .trk i{display:block;height:100%;border-radius:99px}
.catbar b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:13.5px}
.erow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:4px 14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow .when{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.erow .dur{font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.erow .what{min-width:0;overflow-wrap:anywhere;font-size:14.5px}
.erow .what small{display:block;color:var(--ink-3);font-size:13px}
.dayhead{font-size:13px;font-weight:600;color:var(--ink-3);margin:14px 0 2px;display:flex;justify-content:space-between}
.dayhead:first-child{margin-top:0}
.flag{font-size:12px;font-weight:600;color:var(--warn-ink);border:1px solid var(--warn);border-radius:999px;padding:0 7px;margin-left:6px}

/* ---------- energy ---------- */
.energy{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.energy button{font:inherit;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 4px 7px;cursor:pointer;display:grid;gap:2px;justify-items:center;color:var(--ink-2)}
.energy button b{font-size:19px;font-weight:650;color:var(--ink)}
.energy button span{font-size:11.5px;color:var(--ink-3)}
.energy button:hover{background:var(--surface-2)}
.energy button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.energy button[aria-pressed="true"] b,.energy button[aria-pressed="true"] span{color:var(--bg)}

/* ---------- charts ---------- */
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--ink-3)}
.chart .col:hover .seg,.chart .col:focus .seg{filter:brightness(1.1)}
.chart .col:focus{outline:none}
.chart .col:focus .hit{stroke:var(--ink-3);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:14px;height:2px;border-radius:2px;display:inline-block}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:8px 11px;box-shadow:0 8px 28px rgba(0,0,0,.14);font-size:13px;min-width:120px;max-width:280px}
.tip .tt{font-size:12px;color:var(--ink-3);margin-bottom:4px}
.tip .tr{display:flex;align-items:center;gap:8px;line-height:1.5}
.tip .tr b{font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums}
.tip .tr span{color:var(--ink-2)}
.tip .tr i{width:12px;height:2px;border-radius:2px;flex:none}
details.tv{margin-top:10px}
details.tv>summary{cursor:pointer;font-size:13px;color:var(--ink-3);font-weight:500;list-style:none;display:inline-block}
details.tv>summary::-webkit-details-marker{display:none}
details.tv>summary:hover{color:var(--ink)}
details.tv table{margin-top:8px;min-width:0}
details.tv td,details.tv th{font-size:13px;padding:5px 10px 5px 0}
.heats{display:grid;gap:18px 22px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.heat h3{margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.heat h3 span{font-weight:500;color:var(--ink-3)}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;justify-content:start}
.hm i{width:13px;height:13px;border-radius:3px;background:var(--h0);display:block}
.hm i.l1{background:var(--h1)}.hm i.l2{background:var(--h2)}.hm i.l3{background:var(--h3)}.hm i.l4{background:var(--h4)}
.hm i.fut{background:transparent}
.hm i.td{box-shadow:0 0 0 1.5px var(--ink-3)}
.hmleg{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--ink-3);margin-top:8px}
.hmleg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.corr td{font-size:14px}
.corr td b{font-weight:650}

/* ---------- plan ---------- */
.pl-rows{display:grid;gap:2px}
.pl-row{display:grid;grid-template-columns:24px 104px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;border-radius:8px}
.pl-row.now{background:color-mix(in srgb,var(--accent) 12%,var(--surface));box-shadow:inset 3px 0 0 var(--accent)}
.pl-row.done .pl-what b{text-decoration:line-through;color:var(--ink-3)}
.pl-time{font-size:12.5px;color:var(--ink-3)}
.pl-what{display:grid;gap:1px;min-width:0}
.pl-what b{font-size:14px}
.pl-acts{display:flex;gap:4px;align-items:center}
.pl-chk input{width:16px;height:16px}
.pl-edit{display:grid;gap:6px}
.pl-erow{display:grid;grid-template-columns:92px 92px minmax(0,1fr) minmax(0,2fr) 130px 34px;gap:6px}
.pl-erow input,.pl-erow select{font:inherit;font-size:13px;padding:5px 7px;min-width:0}
.pl-banner{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.pl-list{margin:0 0 10px;padding-left:18px;display:grid;gap:4px}
.pl-tg{width:70px;font:inherit;font-size:13px;padding:3px 6px}
@media (max-width:760px){.pl-row{grid-template-columns:24px minmax(0,1fr) auto}.pl-time{grid-column:2}.pl-what{grid-column:2}.pl-acts{grid-column:3;grid-row:1/3}.pl-erow{grid-template-columns:1fr 1fr}}
.pl-late{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px;margin-bottom:10px;border:1px solid var(--line);border-radius:10px}
.pl-late label{display:flex;gap:8px;align-items:center}
/* ---------- time fields ---------- */
.tm-src{display:none!important}
.tm{display:inline-flex;align-items:center;gap:2px;min-width:0;vertical-align:middle}
.tm input{width:3.3em;min-width:2.6em;padding-left:4px!important;padding-right:4px!important;flex:1 1 0;text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.tm input::-webkit-inner-spin-button,.tm input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.tm-c{color:var(--ink-3);font-weight:600}
/* ---------- today ---------- */
.hm-line{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13.5px;color:var(--ink-2);margin:-6px 0 16px}
.hm-line b{color:var(--ink)}
.hm-calcard{min-width:0}
.gcal iframe{display:block;width:100%;height:460px;border:0;border-radius:8px;background:#fff}
:root[data-theme="dark"] .gcal iframe{filter:invert(.9) hue-rotate(180deg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gcal iframe{filter:invert(.9) hue-rotate(180deg)}}
.gc-set{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:0 0 10px}
.gc-set label{flex:1 1 300px;display:grid;gap:4px}
.hm-stack{display:grid;gap:18px;align-content:start}
.hm-up{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.hm-tile{display:grid;gap:4px;align-content:start;justify-items:start;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2)}
.hm-tile .lab{font-size:12px;color:var(--ink-3);font-weight:600}
.hm-tile b{font-size:20px}
/* ---------- progress ---------- */
.pg-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.pg-tile{display:grid;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.pg-tile .lab{font-size:12px;color:var(--ink-3);font-weight:600}
.pg-tile b{font-size:24px;line-height:1.1}
.pg-tile b small{font-size:13px;color:var(--ink-3);font-weight:500}
.pg-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-3);min-width:60px}
.pg-bar i{display:block;height:100%;background:var(--accent)}
.pg-rows{display:grid;gap:7px}
.pg-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.pg-row.pg-goal{grid-template-columns:minmax(0,150px) minmax(0,1fr) auto auto}
.pg-gb{display:flex;gap:4px}
.pg-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-key{display:flex;gap:6px 14px;align-items:center;margin-top:10px}
.pg-key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:-8px}
.pg-spark{width:100%;height:26px}
.pg-spark polyline{fill:none;stroke:var(--accent);stroke-width:2}
.pg-more{margin-top:12px}
.pg-more>summary{cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:500}
.pg-ticks{margin-top:8px}
.pg-add{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pg-add input{flex:1 1 120px;min-width:0}
.pg-add #pg-name{flex:3 1 200px}
.sh-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.sh-modes>div{display:grid;gap:6px;align-content:start;justify-items:start;padding:12px;border-radius:var(--r-sm);background:var(--surface-2)}
.sh-lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.sh-ltile{display:grid;gap:3px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.sh-ltile:hover,.sh-ltile:focus-visible{border-color:var(--line-strong);background:var(--surface-2)}
.sh-ltile.done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.sh-lesson p{font-size:15px;line-height:1.65;margin:0 0 10px;max-width:78ch}
.sh-why{font-weight:500;color:var(--ink)}
.sh-exs{display:grid;gap:6px}
.sh-ex{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)}
.sh-ex>summary{cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:baseline;list-style:none}
.sh-ex>summary::-webkit-details-marker{display:none}
.sh-exq{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.sh-ex[open]{background:var(--surface-2)}
.sh-ex p{margin:6px 0 0;font-size:14px}
.sh-traps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.sh-links{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 2px}
.sh-path{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.sh-step{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.sh-step.done{background:color-mix(in srgb,var(--ok) 18%,var(--surface));border-color:var(--ok)}
.sh-arrow{color:var(--ink-3);font-size:12px}
.sh-kind{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--surface-3);color:var(--ink-2)}
.sh-prompt{font-size:15.5px;line-height:1.6;margin-bottom:6px}
.sh-sol p{margin:0 0 8px;font-size:14.5px;line-height:1.6}
@media (max-width:640px){.pg-row,.pg-row.pg-goal{grid-template-columns:minmax(0,1fr) auto}.pg-row .pg-bar{grid-column:1/-1}}
/* ---------- applications ---------- */
.jb-strip{flex-wrap:wrap}
.jb-next{display:grid;gap:4px}
.jb-nrow{display:grid;grid-template-columns:150px minmax(90px,auto) minmax(0,1fr);gap:10px;align-items:baseline;padding:5px 8px;border-radius:7px;background:var(--surface-2)}
.jb-nrow.today{box-shadow:inset 3px 0 0 var(--warn)}
.jb-nrow.late{box-shadow:inset 3px 0 0 var(--bad)}
.jb-tab{min-width:1320px;table-layout:fixed;width:100%}
.jb-tab th:nth-child(1){width:130px}.jb-tab th:nth-child(2){width:180px}.jb-tab th:nth-child(3){width:112px}.jb-tab th:nth-child(4){width:132px}
.jb-tab th:nth-child(5){width:180px}.jb-tab th:nth-child(6){width:132px}.jb-tab th:nth-child(7){width:70px}.jb-tab th:nth-child(8){width:150px}.jb-tab th:nth-child(10){width:44px}
.jb-tab td{vertical-align:top;padding:4px 4px}
.jb-tab input,.jb-tab select,.jb-tab textarea{width:100%;box-sizing:border-box;font:inherit;font-size:13px;padding:5px 7px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink)}
.jb-tab input:hover,.jb-tab select:hover,.jb-tab textarea:hover{border-color:var(--line)}
.jb-tab input:focus,.jb-tab select:focus,.jb-tab textarea:focus{border-color:var(--accent);background:var(--surface);outline:none}
.jb-tab textarea{resize:vertical;min-height:30px}
.jb-tab .jb-add td{border-top:2px solid var(--line);padding-top:8px}
.jb-tab .jb-add input,.jb-tab .jb-add select{border-color:var(--line);background:var(--surface)}
.jb-lk{display:flex;gap:4px;align-items:center}
.jb-lk a{text-decoration:none}
tr.jb-dead td{opacity:.55}
.jb-notes{width:100%;box-sizing:border-box;font:inherit;font-size:14px;line-height:1.5;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);resize:vertical}
/* ---------- interview stories ---------- */
.sty-cover{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sty-chip{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink-3)}
.sty-chip.on{border-color:color-mix(in srgb,var(--ok) 50%,var(--line));color:var(--ink);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.sty-list{display:grid;gap:6px;margin-top:12px}
.sty{border:1px solid var(--line);border-radius:var(--r-sm);padding:0 12px}
.sty>summary{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;cursor:pointer}
.sty-tags{display:flex;flex-wrap:wrap;gap:4px}
.sty-body{display:grid;gap:10px;padding:0 0 12px}
.sty-title{font:inherit;font-weight:600;padding:7px 10px}
.sty-part{display:grid;gap:4px;margin-top:8px}
.sty-part textarea,.sty-body textarea{width:100%;box-sizing:border-box;font:inherit;font-size:14px;line-height:1.5;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);resize:vertical}
.sty-pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sty-pick .mini.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.sty-quiz{margin-top:12px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:var(--r-sm)}

.pick.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:color-mix(in srgb,var(--hc) 14%,var(--surface))}
.pick.col i{width:18px;height:18px;border-radius:50%;background:var(--hc);display:block}

/* ---------- habits week: no scrolling ---------- */
.hweek{padding-top:10px}
.hw-row{display:grid;grid-template-columns:minmax(200px,1.15fr) minmax(0,2fr) 150px;grid-template-areas:"name days week";gap:10px 18px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hw-name{grid-area:name;display:flex;align-items:center;gap:11px;min-width:0}
.hw-nt{min-width:0;flex:1}
.hw-nt .hn{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.hw-nt .hg{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.hw-editbtn{opacity:.55}
.hw-row:hover .hw-editbtn,.hw-editbtn:focus-visible{opacity:1}
.hw-days{grid-area:days;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.hw-week{grid-area:week;display:grid;gap:5px;min-width:0}
.hw-wv{display:flex;align-items:center;gap:6px}
.hw-wv b{font-size:15px;font-weight:650}
.hw-wv small{font-size:12.5px;color:var(--ink-3);font-weight:500}
.hw-wv .okmark svg{width:15px;height:15px}
.hbar{display:block;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.hbar i{display:block;height:100%;border-radius:99px}
.hw-week .streak{justify-content:flex-start;min-width:0;font-size:12.5px}
.hw-head{padding:6px 0 8px;border-bottom:1px solid var(--line-strong)}
.hw-head .hw-days span{display:grid;justify-items:center;font-size:12px;color:var(--ink-3);font-weight:500;line-height:1.25}
.hw-head .hw-days span b{font-size:14px;color:var(--ink-2);font-weight:600}
.hw-head .hw-days span.td b{color:var(--ink)}
.hw-head .hw-days span.td{color:var(--ink)}
.hw-head .hw-week{font-size:12.5px;color:var(--ink-3);font-weight:600}
.dc{height:40px;min-width:0;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0;font:inherit;font-size:12.5px;font-weight:650;color:var(--ink-2);font-variant-numeric:tabular-nums;position:relative;overflow:hidden;transition:transform .08s}
.dc:hover{border-color:var(--hc)}
.dc:active{transform:scale(.96)}
.dc svg{width:18px;height:18px;stroke-width:2.4}
.dc span{position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:clip;max-width:100%;padding:0 2px}
.dc.met{background:var(--hc);border-color:var(--hc);color:var(--hon,#fff)}
.dc.part{border-color:color-mix(in srgb,var(--hc) 60%,var(--line-strong));background:linear-gradient(to top,color-mix(in srgb,var(--hc) 26%,var(--surface)) var(--fr,50%),var(--surface) var(--fr,50%));color:var(--ink)}
.dc.td{border-color:var(--ink-2);border-width:2px}
.dc.open{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--hc)}
.dc.fut{border-style:dashed;background:transparent;cursor:default;opacity:.5}
.dc[data-auto]{cursor:default}
.hw-edit{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;margin:2px 0 10px;background:color-mix(in srgb,var(--hc) 8%,var(--surface-2));border-radius:10px;border-left:3px solid var(--hc)}
.hw-edit b{font-size:14px}
.hw-edit input[type=time]{width:auto}
.hw-form{padding:14px 0;border-bottom:1px solid var(--line)}
.hw-key{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:14px;font-size:13px;color:var(--ink-3)}
.hw-key span{display:inline-flex;align-items:center;gap:7px}
.hw-key i.dc{width:18px;height:18px;border-radius:5px;display:inline-block}
.heat h3{align-items:center}
.heat h3 .hh{flex:1;color:var(--ink-2);font-weight:600}
.heat{--hc:var(--c1)}
.hm i.l1{background:color-mix(in srgb,var(--hc) 30%,var(--h0))}
.hm i.l2{background:color-mix(in srgb,var(--hc) 55%,var(--h0))}
.hm i.l3{background:color-mix(in srgb,var(--hc) 80%,var(--h0))}
.hm i.l4{background:var(--hc)}
.hmleg i.g1{background:color-mix(in srgb,var(--ink-3) 30%,var(--h0))}
.hmleg i.g2{background:color-mix(in srgb,var(--ink-3) 55%,var(--h0))}
.hmleg i.g3{background:color-mix(in srgb,var(--ink-3) 80%,var(--h0))}
.hmleg i.g4{background:var(--ink-3)}
@media (max-width:900px){
  .hw-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name week" "days days";gap:10px 12px}
  .hw-week{justify-items:end;text-align:right}
  .hw-week .hbar{width:90px}
  .hw-head{grid-template-areas:"days days"}
  .hw-head .hw-name,.hw-head .hw-week{display:none}
  .hw-editbtn{opacity:1}
  .hrow{grid-template-columns:auto minmax(0,1fr) auto}
  .hrow .hctl{grid-column:1/-1;grid-row:2}
}
@media (max-width:420px){.dc{height:36px;font-size:11.5px}.hw-days{gap:4px}}

.sync{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;color:var(--ink-3);line-height:1.4}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--line-strong);flex:none;margin-top:4px}
.sync.on i{background:var(--ok)}
.sync.off i{background:var(--warn)}

/* ---------- study ---------- */
.sc{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.sc label{display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0;font-size:14.5px}
.sc label span{overflow-wrap:anywhere}
.sc.on label span{color:var(--ink-2)}
.sc .sm,.sq .sm{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.sq .sm{white-space:normal}
.duec{color:var(--accent-ink);font-weight:600}
.sdeck{margin:0 0 0 14px;border-top:1px solid var(--line)}
.sdeck>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:9px 0;font-size:14.5px;font-weight:500}
.sdeck>summary::-webkit-details-marker{display:none}
.sdeck>summary::before{content:"\25B8";color:var(--ink-3);margin-right:8px;font-size:11px;display:inline-block;transition:transform .15s}
.sdeck[open]>summary::before{transform:rotate(90deg)}
.sdeck>summary>span:first-child{flex:1}
.sdeck .sc{margin-left:18px}
.sq{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sq>div:first-child{flex:1 1 240px;min-width:0}
.sqc{font-size:15px;font-weight:600}
.sqb{display:flex;gap:5px;flex-wrap:wrap}
.sqb .g1{border-color:var(--bad)}.sqb .g4{border-color:var(--ok)}
@media (max-width:900px){.sq{grid-template-columns:1fr}.sc{grid-template-columns:minmax(0,1fr) auto}.sc .sm{grid-column:1/-1;margin-left:27px}.sdeck{margin-left:4px}.sdeck .sc{margin-left:4px}}

/* ---------- supplements ---------- */
.supp-grp{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 6px}
.supp-grp:first-of-type{margin-top:2px}
.supp.rest{opacity:.6}
.supps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.supp{font:inherit;display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.supp:hover{border-color:var(--hc)}
.supp span{display:grid;min-width:0}
.supp b{font-weight:600;font-size:14.5px}
.supp small{font-size:12px;color:var(--ink-3)}
.supp.on{border-color:var(--hc);background:color-mix(in srgb,var(--hc) 12%,var(--surface))}
.supp.on small{color:var(--ink-2)}
.hw-sec{font-size:12.5px;font-weight:600;color:var(--ink-3);padding:16px 0 4px;border-bottom:1px solid var(--line)}

.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.cmpi{border:1.5px solid var(--line-strong);border-radius:12px;padding:12px 14px;display:grid;gap:6px;align-content:start}
.cmpi.s1{border-color:var(--c4)}.cmpi.s2{border-color:var(--c6);background:color-mix(in srgb,var(--c6) 8%,var(--surface))}
.cmph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cmpl{display:flex;flex-wrap:wrap;gap:10px;font-size:13px}
.cmpl a{color:var(--c1);text-decoration:none;font-weight:600}.cmpl a:hover{text-decoration:underline}

.bdr{display:grid;grid-template-columns:minmax(150px,1.1fr) 2fr 92px;gap:6px 16px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.bdr.bdhead{border-top:0;padding:0 0 2px}
.bdn{font-size:14px;font-weight:600}
.bdtrack{position:relative;height:18px;margin:0 8px;background:linear-gradient(var(--grid),var(--grid)) center/100% 2px no-repeat}
.bdscale{position:relative;height:16px;margin:0 8px}
.bdscale span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--ink-3);white-space:nowrap}
.bdscale span:first-child{transform:none}.bdscale span:last-child{transform:translateX(-100%)}
.bdl{position:absolute;top:8px;height:2px;background:var(--ink-3)}
.bdd{position:absolute;top:3px;width:12px;height:12px;border-radius:50%;margin-left:-6px;box-sizing:border-box}
.bdd.yes{background:var(--c1)}
.bdd.no{background:var(--surface);border:2px solid var(--ink-3)}
.bdd.static{position:relative;display:inline-block;top:1px;margin:0 6px 0 0}
.bds{margin:4px 8px 0}
.bdv{font-size:13px;text-align:right}
.bdv b{font-size:16px}
.bdv.up b{color:var(--ok-ink)}.bdv.down b{color:var(--bad-ink)}
@media (max-width:640px){.bdr{grid-template-columns:1fr 80px}.bdr .bdt{grid-column:1/-1;grid-row:2}.bdhead .bdn,.bdhead .bdv{display:none}}
.slk{color:var(--accent-ink);text-decoration:none;white-space:nowrap}.slk:hover{text-decoration:underline}
.slrow{margin:0 0 8px;line-height:1.9}.slrow.sdk{margin:0 0 4px 18px;font-size:12.5px}

/* hyde */
.hy-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.hy-tabs .mini.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.hy-q{border:1px solid var(--line);border-radius:12px;padding:14px 16px}.hy-qt{font-size:17px;font-weight:600;line-height:1.45;margin:6px 0 4px}
.hy-a{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6;margin-top:8px}
.hy-ta{width:100%;box-sizing:border-box;font:inherit;font-size:14px;line-height:1.5;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical;margin-top:4px}
.hy-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hy-grid select,.hy-grid input{width:100%;box-sizing:border-box;margin-top:4px}
.hy-ready{display:flex;gap:16px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.hy-bar{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(60px,1fr) 38px;gap:8px;align-items:center;font-size:12.5px;margin:3px 0}.hy-bar .bar{margin:0}.hy-bar b{text-align:right;font-weight:600}
.hy-facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px 16px}.hy-facts div{font-size:13.5px;line-height:1.5}.hy-facts b{display:block;font-size:12.5px;color:var(--ink-2)}
.hy-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}.hy-row label{display:flex;gap:8px;align-items:flex-start;font-size:14px}.hy-row a{color:var(--ink);text-decoration:none}.hy-row a:hover{text-decoration:underline}
.hy-row.on label{opacity:.75}.hy-note{width:100%;box-sizing:border-box;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)}
.hy-story{padding:4px 0 10px 18px}.hy-story .small{margin:2px 0}
.hy-cf{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}.hy-cf input,.hy-cf select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)}.hy-cf input[name=min]{width:70px}.hy-cf input[name=note]{flex:1;min-width:140px}
.hy-mt{width:100%;min-width:0!important;font-size:13px;border-collapse:collapse;table-layout:fixed}.hy-mt th:first-child{width:38%}.hy-mt th{text-align:left;font-weight:600;color:var(--ink-2);padding:3px}.hy-mt td{padding:3px}.hy-mt input{width:100%;min-width:0;box-sizing:border-box;font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink)}
.okc{color:var(--ok-ink)}
@media (max-width:640px){.hy-row{grid-template-columns:1fr}.hy-grid{grid-template-columns:1fr}}
#p-hyde .sc label input,#p-hyde .hy-row label input{flex:none}

/* ---------- cheat sheets: one full-width formula sheet, laid out like an exam handout ---------- */
.main-in:has(>#p-cheat:not([hidden])){max-width:none}
.cs-root{min-width:0}
.cs-bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 0;border-bottom:2px solid var(--ink)}
.cs-title{font-size:18px;font-weight:700;letter-spacing:-.01em;margin-right:4px}
.cs-seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden;flex:none}
.cs-seg button{font:inherit;font-size:13px;font-weight:600;padding:5px 14px;border:0;background:var(--surface);color:var(--ink-2);cursor:pointer}
.cs-seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cs-q{flex:0 1 260px;padding:6px 10px}
.cs-hint{margin-left:auto}
.cs-chips{display:none}
.cs-chip{font:inherit;font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;white-space:nowrap;flex:none}
.cs-chip.off{opacity:.35}
.cs-sheet{columns:320px;column-gap:28px;column-rule:1px solid var(--line);margin-top:12px}
.cs-topic{margin:0 0 14px}
.cs-topic[hidden],.cs-it[hidden]{display:none!important}
.cs-topic>h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink);margin:0 0 3px;padding:2px 0 3px;border-bottom:1px solid var(--line-strong);break-after:avoid}
.cs-it{break-inside:avoid;padding:3px 0 5px}
.cs-t{font-size:11.5px;font-weight:650;color:var(--ink-3);margin:0}
.cs-f{font-size:13px}
.cs-fl{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:1.5em;row-gap:2px;margin:3px 0}
.cs-fp{position:relative;box-sizing:border-box;max-width:calc(100% + 8px);overflow-x:auto;overflow-y:hidden;padding:5px 4px 6px;margin:-5px -4px -6px}
.cs-n{font-size:12px;color:var(--ink-2);margin:2px 0 0;line-height:1.45}
.cs-tabw{position:relative;overflow-x:auto;overflow-y:hidden;margin:3px 0;padding-bottom:2px}
.cs-tab{border-collapse:collapse;width:100%;min-width:0;font-size:12px;font-variant-numeric:tabular-nums}
.cs-tab th,.cs-tab td{padding:3px 8px 3px 0;line-height:1.5;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:normal;word-break:normal}
.cs-tab th{color:var(--ink-3);font-weight:600;font-size:11px}
.cs-tab tr:last-child td{border-bottom:0}
.cs-plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:6px 0}
.cs-plots.one{grid-template-columns:minmax(0,340px)}
.cs-plot{margin:0;min-width:0}
.cs-svg{display:block;width:100%;height:auto;background:var(--surface-2);border-radius:6px}
.cs-svg path{fill:none;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.cs-svg .cs-ax{stroke:var(--axis);stroke-width:1}
.cs-svg .cs-mk{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.cs-svg .cs-st{stroke-width:4;stroke-linecap:butt;opacity:.85}
.cs-svg .cs-st.cs-thin{stroke-width:2.5}
.cs-l0{stroke:var(--accent)}.cs-l1{stroke:var(--c1)}.cs-l2{stroke:var(--c3)}.cs-l3{stroke:var(--c4)}.cs-l4{stroke:var(--c5)}
.cs-plot figcaption{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.35}
.cs-d{margin-top:4px;font-size:13px}
.cs-d>summary{cursor:pointer;color:var(--ink-3);font-size:12px;width:max-content}
.cs-d ol{margin:4px 0 2px;padding-left:20px;overflow-x:auto}
.cs-d .katex-display{margin:.2em 0;text-align:left}
.cs-why{display:block;font-size:12px;color:var(--ink-3);margin-top:-2px}
.cs-none{margin-top:14px}
.sh-qtools{display:inline-flex;align-items:center;gap:10px}
/* overlay: the whole screen, like the sheet on your desk */
.cs-over{position:fixed;inset:0;z-index:70;display:flex}
.cs-over[hidden]{display:none}
.cs-scrim{display:none}
.cs-panel{position:relative;display:flex;flex-direction:column;width:100%;height:100%;background:var(--bg)}
.cs-phead{display:flex;align-items:center;gap:12px;padding:8px 20px;padding-top:calc(8px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.cs-phead button{margin-left:auto}
.cs-pbody{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 20px calc(24px + env(safe-area-inset-bottom,0px))}
.cs-pbody .cs-title,.cs-pbody .cs-hint{display:none}
body.cs-lock{overflow:hidden}
@media (max-width:760px){
  #p-cheat .cs-bar{top:calc(53px + env(safe-area-inset-top,0px))}
  .cs-q{flex:1 1 160px}
  .cs-hint{display:none}
  .cs-chips{display:flex;flex-basis:100%;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .cs-phead,.cs-pbody{padding-left:16px;padding-right:16px}
}
@media print{.cs-bar,.cs-over{display:none!important}.cs-sheet{columns:3;column-gap:18px}}

/* ---------- phones ---------- */
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:0 auto 10px}
.kp-k{font:inherit;font-size:24px;font-weight:600;height:54px;padding:0;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
.kp-k:active,.kp-k.on{background:var(--surface-3)}
.kp-fn{color:var(--ink-2);font-size:21px}
.kp-go{grid-column:span 2;font-size:16px;background:var(--ink);border-color:var(--ink);color:var(--bg)}
.kp-go:active,.kp-go.on{background:var(--ink-2)}
.kp-end{margin-top:6px}
#sh-left{white-space:nowrap;font-variant-numeric:tabular-nums;margin-left:10px}
.sh-links .mini{white-space:normal;height:auto;max-width:100%;padding:5px 10px;line-height:1.35}
/* inline maths can't wrap: a block holding a formula wider than the screen scrolls sideways instead of the page (texWide) */
.tex-wide{overflow-x:auto;overflow-y:hidden;padding-top:4px;padding-bottom:6px}
@media (max-width:760px){
  .sh-round{margin-top:10px;padding-left:12px;padding-right:12px}
  .sh-round .sh-in{font-size:26px;padding:8px 12px;margin-bottom:10px}
  .sh-top{text-align:left}
  input:not(.sh-in),select,textarea{font-size:16px}
  .cm-tools input[type=search]{flex-basis:100%;max-width:none}
  .cm-tools select{flex:1 1 130px}
  .sh-ans input{max-width:none}
  /* question lists: title on its own line, details underneath */
  .cm-list button{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;row-gap:1px;padding:7px 6px}
  .cm-list button .cm-dot{grid-row:1/3;align-self:start;margin-top:5px}
  .cm-list button span:not(.cm-dot){white-space:normal}
  .cm-list button .muted,.sh-list .muted{margin-left:0;white-space:normal}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Navigation"></aside>
  <div class="scrim" id="scrim"></div>
  <div style="min-width:0">
    <header class="topbar" id="topbar"></header>

function shParse(s){s=String(s).trim().replace(/\s+/g,"").replace(",",".").replace("−","-");if(!s)return null;

function shGenL(k){var a,b,n,d,q;
