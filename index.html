(4) clip rewards or normalise them, and use a Huber loss and gradient clipping; (5) lower the learning rate (Adam with a small step); (6) Double DQN to reduce maximisation bias; (7) monitor Q-value statistics and TD error, and the fraction of out-of-range actions; (8) consider $n$-step returns or prioritised replay only after stability. Trap: raising model capacity or training longer; the problem is the target, not the underfitting.","category":"rl","kind":"scenario","difficulty":"medium","tags":["DQN","deadly triad","target network","debugging"],"origin":"original","status":"self-marked"},{"id":"m-rl-reward-shaping-loop","title":"Scenario: reward shaping that the agent exploits","prompt":"In a navigation task you added a dense reward of $+1$ each time the agent gets closer to the goal. The trained agent now walks back and forth near the goal and never finishes. Explain what has gone wrong and how you would fix it without changing the optimal policy.","hints":["Consider potential-based shaping $F(s,s')=\\gamma\\Phi(s')-\\Phi(s)$."],"answer":"The shaping reward creates a positive cycle that is more profitable than finishing. Use potential-based shaping, which preserves optimal policies.","answer_type":"free-text","solution":"A reward for 'getting closer' is not the same as the true objective: oscillating (step closer, step away) collects $+1$ per cycle forever, which has a higher discounted return than terminating once, so the agent exploits the shaping term (reward hacking). The principled fix is potential-based shaping (Ng et al.): add $F(s,s')=\\gamma\\Phi(s')-\\Phi(s)$, with $\\Phi$ e.g. the negative distance to the goal. Along any trajectory the shaping telescopes to $\\gamma^T\\Phi(s_T)-\\Phi(s_0)$, so the ordering of policies by return is unchanged and the optimal policy is preserved, while the learning signal is denser. A closed loop gains no net reward because $\\Phi$ returns to its original value (with $\\gamma=1$ exactly zero). Practical checks: ensure the terminal potential is zero, keep the shaping small relative to the goal reward, add a step penalty or time limit, and evaluate the policy on the original sparse reward. Trap: stacking ad hoc bonuses and then discovering that the optimal policy for the new reward is not the intended one.","category":"rl","kind":"scenario","difficulty":"medium","tags":["reward shaping","potential-based","reward hacking"],"origin":"in the style of COMP0086 2024-25 exam, Q3(e)","status":"self-marked"},{"id":"m-ir-heaps-law","title":"Heaps' law vocabulary growth","prompt":"You are indexing a large, mostly unknown text collection. By inspecting the first 2 million tokens you find 40,000 distinct terms.\n\n(a) Using Heaps' law $V=kN^\\beta$, roughly how many distinct terms do you expect in the first 200 million tokens if $\\beta=0.5$? Show your reasoning.\n\n(b) How does the answer change if $\\beta=0.6$?\n\n(c) Why does this matter for the design of an inverted index, and how does Zipf's law relate to it?","hints":["Take the ratio of the two equations so that $k$ cancels."],"answer":"(a) $40{,}000\\times100^{0.5}=400{,}000$. (b) $40{,}000\\times100^{0.6}\\approx634{,}000$. (c) The dictionary keeps growing, so you cannot assume a fixed vocabulary.","answer_type":"free-text","solution":"Heaps' law says the vocabulary grows as $V=kN^\\beta$ with $\\beta$ typically between $0.4$ and $0.6$. (a) Taking the ratio of the two equations, $k$ cancels: $V_2=V_1(N_2/N_1)^\\beta=40{,}000\\times(100)^{0.5}=400{,}000$ terms (here $k=40{,}000/\\sqrt{2\\times10^6}\\approx28$). (b) With $\\beta=0.6$, $V_2=40{,}000\\times100^{0.6}=40{,}000\\times15.85\\approx634{,}000$; the answer is quite sensitive to $\\beta$, which is why you would fit $k$ and $\\beta$ on two or more prefix sizes rather than guess. (c) The vocabulary does not saturate: new terms (names, typos, numbers) keep arriving, so the dictionary must be dynamic and compressed (front coding, hashing or a B-tree), and you cannot size a fixed term table in advance. Zipf's law ($\\text{cf}_r\\propto1/r$) describes the frequency distribution: a few terms are extremely common and most terms are rare, so a large fraction of the dictionary is hapax legomena and postings lists are very skewed (stop words have huge lists; rare terms have tiny lists). Trap: assuming vocabulary grows linearly with tokens; it is sub-linear.","category":"ir","kind":"exam","difficulty":"easy","tags":["Heaps' law","Zipf's law","vocabulary","indexing"],"origin":"in the style of COMP0084 mock exam, Q1","status":"self-marked"},{"id":"m-ir-eval-measures","title":"Precision, recall, F1, P@5 and average precision","prompt":"A system returns 8 results whose relevance status is $[+,-,+,+,-,-,-,+]$ ($+$ is relevant). There are 6 relevant documents in the collection. Compute (1) precision, (2) recall, (3) F1, (4) precision at 5, and (5) average precision. State what happens to AP if one relevant document is never retrieved.","hints":["AP averages the precision at the rank of each relevant retrieved document, divided by the total number of relevant documents."],"answer":"$P=0.5$, $R=2/3$, $F_1=0.571$, $P@5=0.6$, $AP=2.917/6=0.486$.","answer_type":"free-text","solution":"Four relevant documents are retrieved out of 8, and there are 6 relevant in total. (1) $P=4/8=0.5$. (2) $R=4/6=0.667$. (3) $F_1=\\frac{2PR}{P+R}=\\frac{2(0.5)(0.667)}{1.167}=0.571$ (the harmonic mean). (4) $P@5$: three relevant in the top 5, so $0.6$. (5) The relevant documents are at ranks 1, 3, 4 and 8, with precisions $1/1$, $2/3$, $3/4$ and $4/8$, which sum to $1+0.667+0.75+0.5=2.917$; dividing by the 6 relevant documents gives $AP=0.486$. A relevant document that is never retrieved contributes zero to the numerator but still counts in the denominator, so AP penalises incomplete recall; dividing by the number retrieved instead would be a common error. Intuition: AP rewards putting the relevant documents early. Trap: dividing by 4 instead of 6, which gives $0.729$.","category":"ir","kind":"exam","difficulty":"easy","tags":["evaluation","precision","recall","average precision"],"origin":"in the style of COMP0084 mock exam, Q10","status":"self-marked"},{"id":"m-ir-unigram-lm-smoothing","title":"Unigram language models and query likelihood smoothing","prompt":"(a) Let $M$ be a unigram language model for a \"text mining\" topic. If two words are drawn independently from $M$, compare the probabilities of \"text mining\" and \"mining text\". What if $M$ were a bigram model?\n\n(b) For query likelihood retrieval, a document of length 50 has $c(\\text{text},d)=3$ and $c(\\text{mining},d)=0$. The collection model has $p(\\text{text}\\mid C)=0.01$ and $p(\\text{mining}\\mid C)=0.002$. Compute $p(q\\mid d)$ for $q=$ \"text mining\" with Dirichlet smoothing ($\\mu=100$) and with Jelinek-Mercer smoothing ($\\lambda=0.5$). Why is smoothing needed?","hints":["Dirichlet: $p(w\\mid d)=\\frac{c(w,d)+\\mu p(w\\mid C)}{|d|+\\mu}$. JM: $(1-\\lambda)\\,\\frac{c(w,d)}{|d|}+\\lambda\\,p(w\\mid C)$."],"answer":"(a) Equal for a unigram model; they can differ for a bigram. (b) Dirichlet $3.56\\times10^{-5}$, JM $3.5\\times10^{-5}$.","answer_type":"free-text","solution":"(a) Under a unigram model the words are independent, so $p(\\text{text mining})=p(\\text{text})p(\\text{mining})=p(\\text{mining text})$: word order is ignored (bag of words). A bigram model has $p(\\text{text})p(\\text{mining}\\mid\\text{text})$ versus $p(\\text{mining})p(\\text{text}\\mid\\text{mining})$, which differ, and \"text mining\" would be far likelier. (b) Dirichlet: $p(\\text{text}\\mid d)=\\frac{3+100(0.01)}{50+100}=0.02667$ and $p(\\text{mining}\\mid d)=\\frac{0+100(0.002)}{150}=0.001333$, so $p(q\\mid d)=3.56\\times10^{-5}$. JM with $\\lambda=0.5$: $p(\\text{text}\\mid d)=0.5(0.06)+0.5(0.01)=0.035$ and $p(\\text{mining}\\mid d)=0.5(0)+0.5(0.002)=0.001$, so $p(q\\mid d)=3.5\\times10^{-5}$. Without smoothing, $p(\\text{mining}\\mid d)=0$ makes the whole product zero for any document missing one query term, so no ranking is possible; smoothing also plays an IDF-like role by down-weighting terms that are common in the collection. Dirichlet adapts to document length (long documents rely less on the collection), while JM uses a fixed mix. Trap: smoothing the numerator only but not renormalising, so the probabilities no longer sum to one.","category":"ir","kind":"exam","difficulty":"medium","tags":["language models","smoothing","query likelihood","Dirichlet"],"origin":"in the style of COMP0084 mock exam, Q11","status":"self-marked"},{"id":"m-ir-lsa-plsa-lda","title":"LSA vs pLSA vs LDA","prompt":"How does pLSA differ from LSA, and how does LDA differ from pLSA? Mention what is being modelled, the objective, the number of parameters, and what happens to unseen documents.","hints":["One is linear algebra, one is a mixture model and one adds a prior."],"answer":"LSA is an SVD of the term-document matrix; pLSA is a probabilistic mixture of topics fitted by EM; LDA adds Dirichlet priors on the document-topic mixtures, giving a proper generative model for new documents.","answer_type":"free-text","solution":"LSA takes a truncated SVD of the term-document (or tf-idf) matrix, $X\\approx U_kS_kV_k^\\top$, giving dense low-rank 'topic' dimensions that can be negative and are not probabilities; it is a least-squares method with no generative model. pLSA is a probabilistic version: $p(w\\mid d)=\\sum_zp(w\\mid z)p(z\\mid d)$, fitted by maximum likelihood with EM. Its topics are proper distributions, but $p(z\\mid d)$ is a free parameter for each training document, so the number of parameters grows linearly with the corpus, it overfits, and it cannot assign topics to a new document without refitting ('fold-in' heuristics). LDA places a Dirichlet prior on each document's topic mixture $\\theta_d\\sim\\text{Dir}(\\alpha)$ (and on the topic-word distributions, in the smoothed version), so the document-level parameters become latent variables with a prior: the model is fully generative, regularises against overfitting, and gives sensible inference for unseen documents. Inference is approximate (variational Bayes or collapsed Gibbs sampling). Trap: saying LDA 'is pLSA with more topics'; the key point is the prior and generative treatment of $\\theta_d$.","category":"ir","kind":"concept","difficulty":"medium","tags":["LSA","pLSA","LDA","topic models"],"origin":"in the style of COMP0084 mock exam, Q3-Q4","status":"self-marked"},{"id":"m-ir-negative-sampling-analogies","title":"Word2vec: negative sampling and word analogies","prompt":"What is negative sampling in word2vec's skip-gram, and why is it useful? How do word analogies such as king - man + woman $\\approx$ queen arise, and how would you test them?","hints":["The softmax normaliser sums over the whole vocabulary."],"answer":"Negative sampling replaces the full softmax with a binary logistic loss on one positive pair and $k$ sampled negatives, making each update $O(k)$ rather than $O(|V|)$. Analogies arise as roughly linear offsets in the learned space.","answer_type":"free-text","solution":"Skip-gram predicts context words $c$ from a centre word $w$ with a softmax $p(c\\mid w)\\propto\\exp(u_c^\\top v_w)$, whose normaliser sums over the entire vocabulary and makes each update $O(|V|)$. Negative sampling replaces this with a binary classification problem: maximise $\\log\\sigma(u_c^\\top v_w)+\\sum_{i=1}^k\\mathbb E_{n\\sim P_n}\\log\\sigma(-u_n^\\top v_w)$, where the negatives $n$ are drawn from a noise distribution (unigram frequency raised to the power $3/4$). Each step touches only $k+1$ output vectors, a large speed-up, and it works well in practice (it is related to implicit factorisation of a shifted PMI matrix). Analogies arise because words appearing in similar contexts get similar vectors and many semantic relations (gender, tense, capital-of) are encoded as roughly constant offsets, so $v_{\\text{king}}-v_{\\text{man}}+v_{\\text{woman}}$ is closest, by cosine similarity, to $v_{\\text{queen}}$ (excluding the query words). Test them by running an analogy benchmark and reporting top-1 accuracy. Trap: forgetting that the query words must be excluded from the nearest-neighbour search, otherwise the answer is often one of the inputs.","category":"ir","kind":"concept","difficulty":"medium","tags":["word2vec","negative sampling","embeddings","analogies"],"origin":"in the style of COMP0084 mock exam, Q5 and Q9","status":"self-marked"},{"id":"m-ir-least-squares-gd","title":"Gradient descent for 1-D least squares with an intercept","prompt":"For data $(x_i,y_i)_{i=1}^n$ fit $\\hat y=wx+b$ by minimising $L(w,b)=\\frac1{2n}\\sum_i(y_i-wx_i-b)^2$. Derive the gradients, write the gradient descent update with step size $\\eta$, and state the fixed point. Why does the learning rate matter?","hints":["Set both partial derivatives to zero to get the closed-form solution."],"answer":"$\\partial_wL=-\\frac1n\\sum(y_i-\\hat y_i)x_i$, $\\partial_bL=-\\frac1n\\sum(y_i-\\hat y_i)$; the fixed point is $w=\\mathrm{Cov}(x,y)/\\mathrm{Var}(x)$, $b=\\bar y-w\\bar x$.","answer_type":"free-text","solution":"Let $r_i=y_i-wx_i-b$. Then $\\partial_wL=-\\frac1n\\sum_ir_ix_i$ and $\\partial_bL=-\\frac1n\\sum_ir_i$. Gradient descent updates $w\\leftarrow w+\\frac\\eta n\\sum_ir_ix_i$ and $b\\leftarrow b+\\frac\\eta n\\sum_ir_i$, using simultaneous updates from the current residuals. At the fixed point both gradients vanish: $\\sum r_i=0$ gives $b=\\bar y-w\\bar x$, and substituting into $\\sum r_ix_i=0$ gives $w=\\frac{\\sum(x_i-\\bar x)(y_i-\\bar y)}{\\sum(x_i-\\bar x)^2}=\\mathrm{Cov}(x,y)/\\mathrm{Var}(x)$. The loss is convex quadratic with Hessian $\\begin{pmatrix}\\overline{x^2}&\\bar x\\\\\\bar x&1\\end{pmatrix}$, so gradient descent converges to the unique minimum iff $\\eta<2/\\lambda_{\\max}$; too large a step oscillates or diverges, and poorly scaled $x$ (large mean, small spread) makes the Hessian ill-conditioned and convergence slow, which is why inputs are centred and scaled. Intuition: the intercept absorbs the mean offset and the slope the correlation. Trap: updating $w$ and then using the new $w$ in the $b$ gradient within the same step.","category":"ir","kind":"derivation","difficulty":"easy","tags":["least squares","gradient descent","linear regression"],"origin":"in the style of COMP0084 mock exam, Q8","status":"self-marked"},{"id":"m-ir-dirichlet-smoothing-derivation","title":"Dirichlet smoothing as a Bayesian estimate","prompt":"Show that Dirichlet-prior smoothing, $p(w\\mid d)=\\frac{c(w,d)+\\mu\\,p(w\\mid C)}{|d|+\\mu}$, is the posterior mean of a multinomial document model with a Dirichlet prior, and show that it equals an interpolation between the maximum-likelihood estimate and the collection model with a length-dependent weight.","hints":["Take the prior $\\text{Dir}(\\mu p(w_1\\mid C),\\dots,\\mu p(w_V\\mid C))$."],"answer":"The posterior is $\\text{Dir}(c(w,d)+\\mu p(w|C))$, whose mean is the formula; it equals $\\frac{|d|}{|d|+\\mu}p_{ML}+\\frac{\\mu}{|d|+\\mu}p(w|C)$.","answer_type":"free-text","solution":"Let the document be generated by a multinomial with parameter $\\theta_d$ and prior $\\theta_d\\sim\\text{Dir}(\\alpha_1,\\dots,\\alpha_V)$ with $\\alpha_w=\\mu\\,p(w\\mid C)$. The Dirichlet is conjugate: after observing counts $c(w,d)$, the posterior is $\\text{Dir}(c(w,d)+\\alpha_w)$, whose mean is $\\mathbb E[\\theta_w\\mid d]=\\frac{c(w,d)+\\mu p(w\\mid C)}{\\sum_{w'}c(w',d)+\\mu\\sum_{w'}p(w'\\mid C)}=\\frac{c(w,d)+\\mu p(w\\mid C)}{|d|+\\mu}$. Rearranging, $p(w\\mid d)=\\frac{|d|}{|d|+\\mu}\\cdot\\frac{c(w,d)}{|d|}+\\frac{\\mu}{|d|+\\mu}\\,p(w\\mid C)$, i.e. Jelinek-Mercer with an adaptive weight $\\lambda_d=\\frac{\\mu}{|d|+\\mu}$ that shrinks as the document gets longer: short documents lean on the collection (little evidence), long documents trust their own counts. The parameter $\\mu$ acts as the number of 'pseudo-counts' contributed by the collection. Trap: using the posterior mode instead of the mean, which gives a different formula ($-1$ terms).","category":"ir","kind":"derivation","difficulty":"medium","tags":["Dirichlet smoothing","language models","conjugate prior","query likelihood"],"origin":"original","status":"self-marked"},{"id":"m-ir-ndcg-calc","title":"nDCG at 5","prompt":"A system's top 5 results have graded relevance $[3,2,0,1,2]$. Using $\\text{DCG@}k=\\sum_{i=1}^k\\frac{\\text{rel}_i}{\\log_2(i+1)}$, compute nDCG@5, where the ideal ranking is the best ordering of these same five documents.","hints":["The ideal ordering is $[3,2,2,1,0]$."],"answer":"0.960","answer_type":"numeric","answer_value":0.9603,"solution":"$\\text{DCG@5}=\\frac{3}{1}+\\frac{2}{1.585}+\\frac{0}{2}+\\frac{1}{2.322}+\\frac{2}{2.585}=3+1.262+0+0.431+0.774=5.466$. The ideal ordering $[3,2,2,1,0]$ gives $\\text{IDCG}=3+1.262+\\frac{2}{2}+0.431+0=5.693$. So $\\text{nDCG@5}=5.466/5.693\\approx0.960$. The metric rewards putting highly relevant documents near the top and normalises by the best achievable value so that it lies in $[0,1]$ and can be averaged across queries. Trap: using $\\log_2 i$ instead of $\\log_2(i+1)$, which divides by zero at rank 1.","category":"ir","kind":"calculation","difficulty":"easy","tags":["nDCG","evaluation","ranking metrics"],"origin":"original","status":"verified","entry":"Enter nDCG@5, a number between 0 and 1."},{"id":"m-ir-bm25-score-calc","title":"BM25 score of one query term","prompt":"Compute the BM25 contribution of a single query term to a document, using\n$$\\text{score}=\\ln\\frac{N-n+0.5}{n+0.5}\\cdot\\frac{f(k_1+1)}{f+k_1\\big(1-b+b\\,\\frac{|d|}{\\text{avgdl}}\\big)}$$\nwith $N=1000$ documents, $n=50$ documents containing the term, $f=3$ occurrences in the document, $|d|=120$, $\\text{avgdl}=100$, $k_1=1.2$, $b=0.75$.","hints":["Compute the IDF factor and the saturated term-frequency factor separately."],"answer":"4.42","answer_type":"numeric","answer_value":4.4232,"solution":"IDF: $\\ln\\frac{950.5}{50.5}=\\ln18.82=2.935$. Length normaliser: $1-b+b\\frac{120}{100}=0.25+0.9=1.15$, so the denominator is $3+1.2(1.15)=4.38$ and the TF factor is $\\frac{3(2.2)}{4.38}=1.507$. Score $=2.935\\times1.507\\approx4.42$. The TF factor saturates (it is bounded by $k_1+1=2.2$ however large $f$ is), and a longer-than-average document is penalised through $b$. Intuition: rare terms matter more (IDF), repeated occurrences give diminishing returns, long documents are discounted. Trap: setting $b=1$, which fully normalises for length and over-penalises long documents.","category":"ir","kind":"calculation","difficulty":"medium","tags":["BM25","tf-idf","ranking","probabilistic IR"],"origin":"original","status":"verified","entry":"Enter the BM25 contribution of this query term to the document: the log (IDF) factor times the term-frequency factor."},{"id":"m-ir-significance-testing-scenario","title":"Scenario: is the new ranker really better?","prompt":"You tuned a new ranker and on a test set of 50 queries MAP rises from $0.312$ to $0.331$. Your manager wants to ship it. What do you check, which statistical test would you use, and what are the pitfalls?","hints":["The comparison is paired by query, and the per-query differences are not Gaussian."],"answer":"Compare per-query AP differences with a paired test (t-test, Wilcoxon signed-rank or bootstrap), check effect size and per-query wins/losses, and avoid multiple-comparison and tuning-on-test pitfalls.","answer_type":"free-text","solution":"A mean difference of $0.019$ is meaningless without the variability across queries. Compute the per-query AP for both systems and test the paired differences $d_q$: a paired t-test, the Wilcoxon signed-rank test (less sensitive to outliers) or a bootstrap/permutation test; report the p-value and a confidence interval, and look at wins, losses and the largest changes by query. Pitfalls: (1) pairing: queries are the unit of analysis, not documents, and an unpaired test throws away power; (2) 50 queries is a small sample, and the distribution of $d_q$ is skewed and not normal; (3) multiple comparisons if you tried many variants (apply a Bonferroni or similar correction), and tuning hyperparameters on the same queries you test on, which inflates the gain; (4) statistical significance is not practical significance: a $0.02$ MAP rise may not move users, so check other metrics (nDCG@10, MRR, recall) and failure cases; (5) offline judgments are an imperfect proxy, so confirm with an online A/B test with a pre-registered metric. Trap: pooling all query-document pairs as independent samples, which overstates significance.","category":"ir","kind":"scenario","difficulty":"medium","tags":["significance testing","evaluation","paired t-test","A/B testing"],"origin":"original","status":"self-marked"},{"id":"m-slt-massart-finite","title":"Rademacher complexity of a finite set and a finite class","prompt":"(a) Let $S\\subset\\mathbb{R}^n$ be a finite set with $|S|=m$ and define $R(S)=\\mathbb{E}_\\sigma \\max_{x\\in S}\\frac1n\\sum_{j=1}^n\\sigma_j x_j$, where the $\\sigma_j$ are independent Rademacher variables. Show that $R(S)\\le \\max_{x\\in S}\\|x\\|\\,\\frac{\\sqrt{2\\log m}}{n}$.\n\n(b) Let $\\mathcal{H}$ be a finite class of functions $h:\\mathcal{X}\\to[-1,1]$ and $S=(x_i)_{i=1}^n$ a sample. Use (a) to bound the empirical Rademacher complexity $\\hat{\\mathfrak{R}}_S(\\mathcal{H})=\\mathbb{E}_\\sigma\\max_{h}\\frac1n\\sum_i\\sigma_i h(x_i)$, and say what the dependence on $|\\mathcal{H}|$ is.","hints":["For a fixed $x$, each $\\sigma_j x_j$ is centred and lies in $[-|x_j|,|x_j|]$, so Hoeffding's lemma applies.","Bound the maximum of $m$ variables by the log of the sum of their moment generating functions."],"answer":"(a) $\\mathbb{E}\\max_x \\sum_j\\sigma_jx_j\\le \\max\\|x\\|\\sqrt{2\\log m}$ via Hoeffding's lemma, Jensen and a union over $m$ terms, then divide by $n$. (b) $\\hat{\\mathfrak R}_S(\\mathcal H)\\le\\sqrt{2\\log|\\mathcal H|/n}$: logarithmic in $|\\mathcal H|$.","answer_type":"free-text","solution":"(a) Fix $x\\in S$. The variable $\\sigma_jx_j$ has mean zero and lies in an interval of length $2|x_j|$, so Hoeffding's lemma gives $\\mathbb{E}e^{\\lambda\\sum_j\\sigma_jx_j}\\le \\prod_j e^{\\lambda^2(2|x_j|)^2/8}=e^{\\lambda^2\\|x\\|^2/2}$. By Jensen, $\\exp(\\lambda\\,\\mathbb{E}\\max_x Z_x)\\le \\mathbb{E}\\max_x e^{\\lambda Z_x}\\le\\sum_{x}\\mathbb{E}e^{\\lambda Z_x}\\le m\\,e^{\\lambda^2r^2/2}$ with $r=\\max_x\\|x\\|$ and $Z_x=\\sum_j\\sigma_jx_j$. Taking logs, $\\mathbb{E}\\max_x Z_x\\le \\frac{\\log m}{\\lambda}+\\frac{\\lambda r^2}{2}$, and choosing $\\lambda=\\sqrt{2\\log m}/r$ gives $r\\sqrt{2\\log m}$. Dividing by $n$ gives the claim.\n\n(b) Apply (a) to the vectors $(h(x_i))_{i=1}^n$, one per $h\\in\\mathcal H$ (so $m=|\\mathcal H|$ at most). Each has norm at most $\\sqrt n$ because $|h|\\le1$, so $\\hat{\\mathfrak R}_S(\\mathcal H)\\le \\sqrt n\\sqrt{2\\log|\\mathcal H|}/n=\\sqrt{2\\log|\\mathcal H|/n}$.\n\nIntuition: the maximum of $m$ sub-Gaussian variables only grows like $\\sqrt{\\log m}$, so even exponentially large finite classes are cheap. Trap: forgetting the $1/n$ normalisation, or the fact that the bound depends on $\\max\\|x\\|$, not on the dimension $n$ separately.","category":"slt","kind":"exam","difficulty":"medium","tags":["Rademacher complexity","Hoeffding lemma","finite class","Massart"],"origin":"in the style of COMP0175 CW1, Problem 1","status":"self-marked"},{"id":"m-slt-max-subgaussian","title":"Expected maximum of bounded centred variables","prompt":"Let $X_1,\\dots,X_m$ be centred random variables taking values in $[a,b]$ (not necessarily independent). Derive the bound $\\mathbb{E}\\max_{i}X_i\\le\\frac{b-a}{2}\\sqrt{2\\log m}$, stating where you use Jensen's inequality, the union step and Hoeffding's lemma, and how you choose the free parameter.","hints":["Start from $\\mathbb{E}\\max_i X_i=\\frac1\\lambda\\mathbb{E}\\log e^{\\lambda \\max_i X_i}$.","Hoeffding's lemma: $\\mathbb{E}e^{\\lambda X}\\le e^{\\lambda^2(b-a)^2/8}$ for centred $X\\in[a,b]$."],"answer":"$\\mathbb{E}\\max X_i\\le \\frac{\\log m}{\\lambda}+\\frac{\\lambda(b-a)^2}{8}$, minimised at $\\lambda=\\sqrt{8\\log m}/(b-a)$ to give $\\frac{b-a}{2}\\sqrt{2\\log m}$.","answer_type":"free-text","solution":"Fix $\\lambda>0$. Since $\\exp$ is convex and increasing, Jensen gives $\\exp(\\lambda\\,\\mathbb{E}\\bar X)\\le\\mathbb{E}e^{\\lambda\\bar X}$ for $\\bar X=\\max_iX_i$, so $\\mathbb{E}\\bar X\\le\\frac1\\lambda\\log\\mathbb{E}e^{\\lambda\\bar X}$. Next, $e^{\\lambda\\max_i X_i}=\\max_ie^{\\lambda X_i}\\le\\sum_ie^{\\lambda X_i}$ (union step: the maximum is at most the sum of non-negative terms), so $\\mathbb{E}e^{\\lambda\\bar X}\\le\\sum_i\\mathbb{E}e^{\\lambda X_i}\\le m\\,e^{\\lambda^2(b-a)^2/8}$ by Hoeffding's lemma. Hence $\\mathbb{E}\\bar X\\le\\frac{\\log m}{\\lambda}+\\frac{\\lambda(b-a)^2}{8}$. This is minimised at $\\lambda^\\star=\\sqrt{8\\log m}/(b-a)$, where both terms equal $(b-a)\\sqrt{\\log m}/(2\\sqrt2)$, giving $(b-a)\\sqrt{\\log m}/\\sqrt2=\\frac{b-a}{2}\\sqrt{2\\log m}$.\n\nIntuition: a tail of $e^{-t^2}$ type means the maximum of $m$ draws sits at roughly $\\sqrt{\\log m}$ standard deviations. Trap: no independence is needed (only the sum bound), and Hoeffding's lemma needs the variables centred; if they are not, subtract the mean first.","category":"slt","kind":"derivation","difficulty":"medium","tags":["Hoeffding lemma","Jensen","union bound","maximal inequality"],"origin":"in the style of COMP0175 CW1, Problem 1","status":"self-marked"},{"id":"m-slt-surrogate-minimisers","title":"Surrogate losses: pointwise minimisers and Fisher consistency","prompt":"Binary classification with $y\\in\\{-1,1\\}$ and a known distribution $\\rho$. Write $\\eta(x)=\\rho(y=1\\mid x)$.\n\n(a) Write the Bayes decision rule $c^*$ in terms of $\\eta$.\n(b) Find the minimiser $f^*(x)$ of the expected surrogate risk $\\mathcal{E}(f)=\\int\\ell(f(x),y)\\,d\\rho$ for the (i) least squares loss, (ii) exponential loss $e^{-yf}$, (iii) logistic loss $\\log(1+e^{-yf})$, expressed through $\\eta(x)$.\n(c) For each, give a map $d:\\mathbb{R}\\to\\{-1,1\\}$ with $d(f^*(x))=c^*(x)$, so the surrogate is Fisher consistent. What about the hinge loss?","hints":["Condition on $x$ and minimise $\\eta\\,\\ell(f,1)+(1-\\eta)\\,\\ell(f,-1)$ over $f\\in\\mathbb{R}$."],"answer":"$c^*=\\mathrm{sign}(2\\eta-1)$; $f^*=2\\eta-1$ (squares), $\\frac12\\log\\frac{\\eta}{1-\\eta}$ (exponential), $\\log\\frac{\\eta}{1-\\eta}$ (logistic); in all cases $d=\\mathrm{sign}$. Hinge: $f^*=\\mathrm{sign}(2\\eta-1)$.","answer_type":"free-text","solution":"(a) The misclassification risk is $\\mathbb{E}_x[\\eta\\,1_{c=-1}+(1-\\eta)\\,1_{c=1}]$, minimised pointwise by $c^*(x)=1$ if $\\eta(x)>1/2$ and $-1$ otherwise, i.e. $c^*=\\mathrm{sign}(2\\eta-1)$.\n\n(b) Write $\\mathcal{E}(f)=\\int\\big[\\eta(x)\\ell(f(x),1)+(1-\\eta(x))\\ell(f(x),-1)\\big]d\\rho_X$ and minimise the bracket for each $x$ separately. Least squares: $\\eta(f-1)^2+(1-\\eta)(f+1)^2$ has derivative $2(f-(2\\eta-1))$, so $f^*=2\\eta-1=\\mathbb{E}[y\\mid x]$. Exponential: derivative $-\\eta e^{-f}+(1-\\eta)e^{f}=0$ gives $e^{2f}=\\eta/(1-\\eta)$, so $f^*=\\tfrac12\\log\\frac{\\eta}{1-\\eta}$. Logistic: derivative $-\\frac{\\eta}{1+e^{f}}+\\frac{(1-\\eta)e^{f}}{1+e^{f}}=0$ gives $f^*=\\log\\frac{\\eta}{1-\\eta}$, the log-odds. Hinge: the bracket is piecewise linear and is minimised at $f^*=\\mathrm{sign}(2\\eta-1)$ (any value in $[-1,1]$ is optimal when $\\eta=1/2$).\n\n(c) In all four cases $f^*>0\\iff\\eta>1/2$, so $d=\\mathrm{sign}$ gives $d(f^*)=c^*$ and hence $R(d\\circ f^*)=\\inf_cR(c)$.\n\nIntuition: each convex surrogate is calibrated, i.e. its population minimiser encodes the Bayes decision (logistic recovers the log-odds, so it also gives probabilities; hinge does not). Trap: Fisher consistency is a population statement; it says nothing about finite-sample rates, which need a comparison inequality.","category":"slt","kind":"exam","difficulty":"medium","tags":["surrogate loss","Bayes rule","Fisher consistency","logistic","hinge"],"origin":"in the style of COMP0175 CW1, Problem 2","status":"self-marked"},{"id":"m-slt-comparison-ls","title":"Comparison inequality for least squares classification","prompt":"Let $f^*(x)=\\mathbb{E}[y\\mid x]$ be the least squares minimiser for $y\\in\\{-1,1\\}$ and $R(c)=\\mathbb{P}(c(x)\\ne y)$. Show that for any $f$, $0\\le R(\\mathrm{sign}\\,f)-R(\\mathrm{sign}\\,f^*)\\le\\sqrt{\\mathcal{E}(f)-\\mathcal{E}(f^*)}$, where $\\mathcal{E}$ is the expected squared loss. Give the three steps.","hints":["Conditional on $x$, $\\mathbb{P}(y\\ne c\\mid x)=\\frac{1-c\\,f^*(x)}{2}$ for $c=\\pm1$.","Where the signs of $f$ and $f^*$ differ, $|f^*|\\le|f-f^*|$."],"answer":"Excess misclassification $=\\int_{X_f}|f^*|d\\rho_X\\le\\int|f-f^*|d\\rho_X\\le\\sqrt{\\mathbb{E}|f-f^*|^2}=\\sqrt{\\mathcal{E}(f)-\\mathcal{E}(f^*)}$, with $X_f=\\{\\mathrm{sign}f\\ne\\mathrm{sign}f^*\\}$.","answer_type":"free-text","solution":"Step 1. Since $\\mathbb{E}[y\\mid x]=f^*(x)$, for a fixed label guess $c\\in\\{\\pm1\\}$ we have $\\mathbb{P}(y\\ne c\\mid x)=\\frac{1-cf^*(x)}{2}$. Where $\\mathrm{sign}f=\\mathrm{sign}f^*$ the two rules agree and contribute nothing. On $X_f=\\{\\mathrm{sign}f\\ne\\mathrm{sign}f^*\\}$ the difference of conditional risks is $\\frac{1+|f^*|}{2}-\\frac{1-|f^*|}{2}=|f^*(x)|$. Integrating, $R(\\mathrm{sign}f)-R(\\mathrm{sign}f^*)=\\int_{X_f}|f^*|\\,d\\rho_X\\ge0$.\n\nStep 2. On $X_f$, $f$ and $f^*$ lie on opposite sides of zero, so $|f-f^*|=|f|+|f^*|\\ge|f^*|$. Therefore $\\int_{X_f}|f^*|\\le\\int_{X_f}|f-f^*|\\le\\int_{\\mathcal X}|f-f^*|\\,d\\rho_X\\le\\sqrt{\\mathbb{E}|f-f^*|^2}$ by Cauchy-Schwarz (Jensen), since $\\rho_X$ is a probability measure.\n\nStep 3. Expanding, $\\mathcal{E}(f)=\\mathbb{E}(f-f^*)^2+\\mathbb{E}(f^*-y)^2+2\\mathbb{E}[(f-f^*)(f^*-y)]$ and the cross term vanishes by conditioning on $x$ because $\\mathbb{E}[y\\mid x]=f^*$. So $\\mathcal{E}(f)-\\mathcal{E}(f^*)=\\mathbb{E}(f-f^*)^2$.\n\nIntuition: classification error only cares about getting the sign right, so a squared-error excess risk $\\epsilon$ costs at most $\\sqrt\\epsilon$ in misclassification. Trap: the square root loses a rate, so $n^{-1/2}$ regression rates become $n^{-1/4}$ classification rates unless a low-noise condition is assumed.","category":"slt","kind":"derivation","difficulty":"hard","tags":["comparison inequality","least squares","Bayes rule","Cauchy-Schwarz"],"origin":"in the style of COMP0175 CW1, Problem 2.5","status":"self-marked"},{"id":"m-slt-gd-step-size","title":"Safe gradient descent step size for ridge regression","prompt":"Take $n=4$ points in $\\mathbb{R}^2$ with $x_1=(1,0)$, $x_2=(0,2)$, $x_3=(1,1)$, $x_4=(1,-1)$ and the objective $F(w)=\\frac1n\\sum_{i=1}^n(\\langle w,x_i\\rangle-y_i)^2+\\lambda\\|w\\|_2^2$ with $\\lambda=0.1$. The gradient of $F$ is $L$-Lipschitz with $L=\\sup_w\\|\\nabla^2F(w)\\|_{op}$. What is the largest constant step size bound $2/L$ that guarantees gradient descent converges?","hints":["The Hessian is constant: $\\frac{2}{n}X^\\top X+2\\lambda I$.","The operator norm is the largest eigenvalue."],"answer":"$2/L=0.625$ since $L=3.2$.","answer_type":"numeric","answer_value":0.625,"solution":"The Hessian of the empirical risk is constant, $\\nabla^2F=\\frac2nX^\\top X+2\\lambda I$, so $L=\\|\\nabla^2F\\|_{op}=\\frac2n\\sigma_{\\max}(X)^2+2\\lambda$. Here $X^\\top X=\\begin{pmatrix}3&0\\\\0&6\\end{pmatrix}$, so $\\sigma_{\\max}^2=6$ and $L=\\frac{2\\cdot6}{4}+0.2=3.2$. Gradient descent with $\\gamma\\in(0,2/L)$ converges at rate $O(1/t)$ on convex smooth objectives, so the bound is $2/3.2=0.625$.\n\nIntuition: the step must be smaller than twice the inverse curvature along the steepest direction, otherwise the iterates overshoot and oscillate or diverge. Trap: forgetting the factor $2$ from differentiating the square (it appears in both the data term and in the $2\\lambda$ term), and using the Frobenius norm bound $2C_1^2+2\\lambda$, which is valid but looser.","category":"slt","kind":"calculation","difficulty":"easy","tags":["gradient descent","Lipschitz gradient","ridge","step size"],"origin":"in the style of COMP0175 CW2, Problem 1","status":"verified","entry":"Enter the step-size bound $2/L$ (the largest step size guaranteeing convergence), not $L$ itself."},{"id":"m-slt-gd-dual","title":"Dual representation of gradient descent and kernel early stopping","prompt":"Let $F(w)=\\frac1n\\sum_{i=1}^n\\ell(\\langle w,x_i\\rangle,y_i)$ and let $w_0=0$, $w_{t+1}=w_t-\\gamma\\nabla F(w_t)$. Let $X\\in\\mathbb{R}^{n\\times d}$ have rows $x_i$, $K=XX^\\top$, and $\\bar\\ell(z)=(\\ell'(z_1,y_1),\\dots,\\ell'(z_n,y_n))^\\top$.\n\n(a) Prove by induction that $w_t=X^\\top c_t$ with $c_0=0$, $c_{t+1}=c_t-\\frac{\\gamma}{n}\\bar\\ell(Kc_t)$.\n(b) Write the recursion for $c_t$ with the squared loss $\\ell(z,y)=(z-y)^2$ and say how $\\gamma$ can be chosen from $K$ alone.\n(c) Explain how this gives early stopping in an RKHS with kernel $k$.","hints":["$\\nabla F(w)=\\frac1nX^\\top\\bar\\ell(Xw)$."],"answer":"(a) $w_{t+1}=X^\\top\\big(c_t-\\frac\\gamma n\\bar\\ell(XX^\\top c_t)\\big)$. (b) $c_{t+1}=c_t-\\frac{2\\gamma}{n}(Kc_t-y)$, with $\\gamma<n/\\sigma_{\\max}(K)$. (c) Replace $K$ by the kernel matrix and predict $f_t(x)=\\sum_ic_{t,i}k(x,x_i)$; stop using validation error.","answer_type":"free-text","solution":"(a) We have $\\nabla F(w)=\\frac1n\\sum_i\\ell'(\\langle w,x_i\\rangle,y_i)x_i=\\frac1nX^\\top\\bar\\ell(Xw)$. Base case: $w_0=0=X^\\top c_0$. If $w_t=X^\\top c_t$ then $Xw_t=XX^\\top c_t=Kc_t$ and $w_{t+1}=X^\\top c_t-\\frac\\gamma nX^\\top\\bar\\ell(Kc_t)=X^\\top\\big(c_t-\\frac\\gamma n\\bar\\ell(Kc_t)\\big)=X^\\top c_{t+1}$. The iterates therefore always stay in the span of the data, and $\\langle w_t,x\\rangle=\\sum_ic_{t,i}\\langle x,x_i\\rangle$.\n\n(b) With $\\ell'(z,y)=2(z-y)$ we get $c_{t+1}=c_t-\\frac{2\\gamma}{n}(Kc_t-y)$. The Hessian of $F$ is $\\frac2nX^\\top X$, whose largest eigenvalue equals $\\frac2n\\sigma_{\\max}(K)$ because $X^\\top X$ and $XX^\\top$ share non-zero eigenvalues. So any $\\gamma<2/L=n/\\sigma_{\\max}(K)$ converges, and only $K$ is needed. (For the logistic loss $\\ell''\\le1/4$, so $L\\le\\sigma_{\\max}(K)/(4n)$.)\n\n(c) Nothing above uses the finite dimension: replace $K$ by the kernel matrix $K_{ij}=k(x_i,x_j)$ and predict $f_t(x)=\\sum_ic_{t,i}k(x,x_i)$. Run the $n$-dimensional recursion, evaluate on a validation set, and stop at the iteration with the lowest validation error. Cost is $O(n^2)$ per step and the number of iterations plays the role of $1/\\lambda$.\n\nTrap: the step-size condition depends on the largest eigenvalue of $K$, which grows with $n$ unless the kernel is normalised.","category":"slt","kind":"exam","difficulty":"medium","tags":["gradient descent","representer theorem","kernel","early stopping"],"origin":"in the style of COMP0175 CW2, Problem 2","status":"self-marked"},{"id":"m-slt-mistakes-markov","title":"From expectation bounds to high-probability bounds","prompt":"(a) A classifier $c$ errs on a fresh point with probability $p$. On $n$ i.i.d. points it makes $M$ mistakes. For $m>np$, give a lower bound on $\\mathbb{P}(M\\le m)$.\n\n(b) A learning algorithm satisfies: for every $\\varepsilon>0$ there is $\\eta(\\varepsilon)$ such that for $n\\ge\\eta(\\varepsilon)$, $\\mathbb{E}_S\\,\\mathcal{E}(f_S)\\le\\mathcal{E}(f^*)+\\varepsilon$. Show that for any $\\delta\\in(0,1)$, if $n\\ge\\eta(\\varepsilon\\delta)$ then $\\mathcal{E}(f_S)\\le\\mathcal{E}(f^*)+\\varepsilon$ with probability at least $1-\\delta$, and comment on how the sample size depends on $\\delta$ compared with part (a).","hints":["$M\\sim\\mathrm{Binomial}(n,p)$; use Hoeffding.","Apply Markov's inequality to the non-negative variable $\\mathcal{E}(f_S)-\\mathcal{E}(f^*)$."],"answer":"(a) $\\mathbb{P}(M\\le m)\\ge1-\\exp\\!\\big(-2n(m/n-p)^2\\big)$. (b) Markov: $\\mathbb{P}(Z>\\varepsilon)\\le\\mathbb{E}Z/\\varepsilon\\le\\delta$; the price is a $1/\\delta$ dependence rather than $\\log(1/\\delta)$.","answer_type":"free-text","solution":"(a) $M\\sim\\mathrm{Binomial}(n,p)$ is a sum of $n$ independent $\\{0,1\\}$ variables with mean $np$. Hoeffding gives $\\mathbb{P}(M/n-p\\ge t)\\le e^{-2nt^2}$. Taking $t=m/n-p>0$, $\\mathbb{P}(M>m)\\le\\mathbb{P}(M/n-p\\ge t)\\le e^{-2n(m/n-p)^2}$, so $\\mathbb{P}(M\\le m)\\ge1-e^{-2n(m/n-p)^2}$. (The exact answer is the binomial CDF $\\sum_{k\\le m}\\binom nkp^k(1-p)^{n-k}$.)\n\n(b) Let $Z=\\mathcal{E}(f_S)-\\mathcal{E}(f^*)\\ge0$. For $n\\ge\\eta(\\varepsilon\\delta)$ we have $\\mathbb{E}Z\\le\\varepsilon\\delta$, so by Markov $\\mathbb{P}(Z>\\varepsilon)\\le\\mathbb{E}Z/\\varepsilon\\le\\delta$. Hence $Z\\le\\varepsilon$ with probability at least $1-\\delta$.\n\nComparison: converting an expectation bound by Markov forces $n\\ge\\eta(\\varepsilon\\delta)$, which typically scales polynomially in $1/\\delta$ (e.g. rate $n^{-1/2}$ gives $n\\sim1/(\\varepsilon\\delta)^2$), while exponential concentration as in (a) gives only $\\log(1/\\delta)$. Intuition: Markov uses only the first moment, concentration uses the whole tail. Trap: needing $Z\\ge0$; this is why excess risk, not risk, is the variable to use.","category":"slt","kind":"exam","difficulty":"medium","tags":["Hoeffding","Markov inequality","high probability","binomial"],"origin":"in the style of COMP0175 CW1, Problems 3 and 4","status":"self-marked"},{"id":"m-slt-ridge-lambda-star","title":"Optimal regularisation parameter from a stability bound","prompt":"Suppose for Tikhonov-regularised ERM with an $L$-Lipschitz loss and kernel bound $\\kappa$, stability gives the expected excess risk bound $\\lambda\\|w^*\\|^2+\\frac{2L^2\\kappa^2}{\\lambda n}$. Take $\\|w^*\\|=2$, $L=1$, $\\kappa=1$ and $n=20000$. What value of $\\lambda$ minimises this bound?","hints":["Minimise $A\\lambda+B/\\lambda$; the minimiser is $\\sqrt{B/A}$."],"answer":"$\\lambda^*=\\sqrt{\\frac{2L^2\\kappa^2}{n\\|w^*\\|^2}}=0.005$.","answer_type":"numeric","answer_value":0.005,"solution":"The bound is $g(\\lambda)=A\\lambda+B/\\lambda$ with $A=\\|w^*\\|^2=4$ (approximation error) and $B=2L^2\\kappa^2/n=10^{-4}$ (stability/estimation error). Setting $g'(\\lambda)=A-B/\\lambda^2=0$ gives $\\lambda^*=\\sqrt{B/A}=\\sqrt{2.5\\times10^{-5}}=0.005$, with minimum value $2\\sqrt{AB}=0.04$. In general $\\lambda^*\\propto n^{-1/2}$ and the excess risk decays as $n^{-1/2}$.\n\nIntuition: a large $\\lambda$ shrinks towards zero and introduces bias ($A\\lambda$), a small $\\lambda$ makes the algorithm unstable so that the training set is over-fitted ($B/\\lambda$). Trap: this is only an upper bound, and the constants depend on the loss; in practice $\\lambda$ is chosen by cross-validation, but the $n^{-1/2}$ scaling is a useful starting point.","category":"slt","kind":"calculation","difficulty":"easy","tags":["ridge","stability","regularisation","bias-variance"],"origin":"original","status":"verified","entry":"Enter the value of $\\lambda$ that minimises the bound, not the minimum bound value."},{"id":"m-slt-rademacher-uniform","title":"Rademacher generalisation bound and why it beats a union bound","prompt":"State the Rademacher-complexity generalisation bound for a class $\\mathcal{G}$ of functions with values in $[0,1]$. Sketch the two ingredients of the proof, and explain why it handles infinite classes where the union-bound argument for finite classes fails. What does it give for linear predictors $\\{x\\mapsto\\langle w,x\\rangle:\\|w\\|\\le B\\}$ with $\\|x\\|\\le R$?","hints":["Concentration of the supremum plus a bound on its expectation."],"answer":"With probability $\\ge1-\\delta$, $\\sup_{g}(\\mathbb{E}g-\\hat{\\mathbb{E}}g)\\le2\\mathfrak{R}_n(\\mathcal{G})+\\sqrt{\\log(1/\\delta)/(2n)}$, using McDiarmid and symmetrisation; linear class: $\\mathfrak R_n\\le BR/\\sqrt n$.","answer_type":"free-text","solution":"Bound: with probability at least $1-\\delta$, for all $g\\in\\mathcal{G}$, $\\mathbb{E}g\\le\\hat{\\mathbb{E}}_Sg+2\\mathfrak{R}_n(\\mathcal{G})+\\sqrt{\\frac{\\log(1/\\delta)}{2n}}$. (With the empirical $\\hat{\\mathfrak R}_S$ instead, the deviation term becomes $3\\sqrt{\\log(2/\\delta)/(2n)}$.)\n\nIngredients: (1) McDiarmid's bounded-difference inequality: changing one sample changes $\\sup_g(\\mathbb{E}g-\\hat{\\mathbb{E}}g)$ by at most $1/n$, so the supremum is within $\\sqrt{\\log(1/\\delta)/(2n)}$ of its mean. (2) Symmetrisation with a ghost sample: $\\mathbb{E}\\sup_g(\\mathbb{E}g-\\hat{\\mathbb{E}}g)\\le2\\mathfrak{R}_n(\\mathcal{G})$ where $\\mathfrak R_n=\\mathbb{E}\\sup_g\\frac1n\\sum_i\\sigma_ig(z_i)$.\n\nWhy it beats the union bound: the union bound pays $\\sqrt{\\log|\\mathcal H|/n}$, which is infinite for infinite classes. Rademacher complexity measures how well the class can fit random signs on the actual sample, so it is finite for infinite classes and recovers the finite-class bound via Massart. For the linear class, $\\hat{\\mathfrak R}_S\\le BR/\\sqrt n$, independent of the dimension. For an $L$-Lipschitz loss, Talagrand's contraction gives $\\mathfrak R(\\ell\\circ\\mathcal H)\\le L\\,\\mathfrak R(\\mathcal H)$.\n\nTrap: the bound is for the loss class $\\ell\\circ\\mathcal H$, not for $\\mathcal H$ itself, and it needs bounded losses (or a clipped norm).","category":"slt","kind":"concept","difficulty":"hard","tags":["Rademacher complexity","McDiarmid","symmetrisation","uniform convergence"],"origin":"original","status":"self-marked"},{"id":"m-slt-early-stopping-scenario","title":"Validation loss rises during gradient descent","prompt":"You fit a kernel (or linear) least squares model with plain gradient descent on 2000 samples. Training loss falls steadily, but validation loss reaches a minimum around iteration 40 and then rises. A colleague proposes adding an explicit ridge penalty and training to convergence instead. What is going on in learning-theory terms, how do the two approaches compare, and what do you check before choosing the step size and stopping rule?","hints":["Think of the number of iterations as a regularisation parameter."],"answer":"The iteration count $t$ acts like $1/\\lambda$: early stopping and ridge are two forms of spectral filtering that control bias-variance. Both can match, so compare on validation error and choose $\\gamma<2/L$.","answer_type":"free-text","solution":"In the eigenbasis of the (kernel) matrix, gradient descent from $w_0=0$ fits directions with large eigenvalue $\\sigma_j^2$ first, and the filter on direction $j$ after $t$ steps is $1-(1-\\gamma\\sigma_j^2)^t$, versus $\\sigma_j^2/(\\sigma_j^2+\\lambda)$ for ridge. Both shrink low-variance directions that mostly contain noise; running longer fits those noisy directions, so variance grows (the validation loss rises) while bias falls. Hence $t\\approx1/(\\gamma\\lambda)$ and early stopping is implicit regularisation with a stopping time chosen by bias-variance balance, which theory shows can reach the same rates as tuned ridge.\n\nComparison: ridge needs one solve per $\\lambda$ ($O(n^3)$, or one eigen-decomposition reused for all $\\lambda$); early stopping gives the whole regularisation path along one run and is cheap, and is the only practical option for large models. Checks: step size $\\gamma<2/L$ with $L=\\frac2n\\sigma_{\\max}(X)^2$ (otherwise the curve diverges instead of overfitting), a held-out set (or cross-validation) that was not used for the stopping choice, noise in the validation curve (pick the minimum on a smoothed curve), and whether data are standardised, since badly scaled features make $L$ large and the path uneven.\n\nTrap: using the same validation set for stopping and for reporting final performance, which leaks.","category":"slt","kind":"scenario","difficulty":"medium","tags":["early stopping","implicit regularisation","ridge","gradient descent"],"origin":"original","status":"self-marked"},{"id":"m-opt-nlls-exponential","title":"Analysing a sum of squares with an exponential residual","prompt":"Let $f:\\mathbb{R}^2\\to\\mathbb{R}$, $f(x,y)=(y-e^{x})^2+(x+y-2)^2$.\n\n(a) Without using the optimality conditions, find the global minimisers of $f$ and explain why they are global.\n(b) Compute $\\nabla f$ and $\\nabla^2 f$.\n(c) Verify the first-order necessary and second-order sufficient conditions at the minimiser.\n(d) Is $f$ convex? Justify with a specific point.\n(e) Are there any other local minimisers?","hints":["Write $f=r_1^2+r_2^2$ with $r_1=y-e^x$, $r_2=x+y-2$ and use $f\\ge0$.","For the Hessian, $\\nabla^2 f=2J^\\top J+2\\sum_ir_i\\nabla^2r_i$."],"answer":"The unique global minimiser solves $y=e^x$, $y=2-x$: $x^*\\approx0.4429$, $y^*\\approx1.5571$, $f=0$. The Hessian there is $2J^\\top J\\succ0$. $f$ is not convex (indefinite Hessian, e.g. at $(0,4)$), yet this is the only stationary point, so there are no other local minimisers.","answer_type":"free-text","solution":"(a) $f$ is a sum of two squares so $f\\ge0$, with equality iff both residuals vanish: $y=e^x$ and $y=2-x$. The function $e^x+x$ is strictly increasing with value $1$ at $0$ and $e>2$ at $1$, so $e^x+x=2$ has exactly one root, $x^*\\approx0.4429$, $y^*=2-x^*\\approx1.5571$. Because $f(x^*,y^*)=0$ is the lowest possible value, this is the unique global minimiser.\n\n(b) $\\nabla f=\\big(-2e^xr_1+2r_2,\\ 2r_1+2r_2\\big)$. $\\nabla^2 f=2\\begin{pmatrix}e^{2x}+1&1-e^x\\\\1-e^x&2\\end{pmatrix}+2r_1\\begin{pmatrix}-e^x&0\\\\0&0\\end{pmatrix}$, i.e. Gauss-Newton term $2J^\\top J$ plus a residual-curvature term.\n\n(c) At the minimiser $r_1=r_2=0$ so $\\nabla f=0$ (necessary condition), and $\\nabla^2f=2J^\\top J$ with $J=\\begin{pmatrix}-e^x&1\\\\1&1\\end{pmatrix}$, $\\det J=-(e^{x^*}+1)\\ne0$. So $J^\\top J\\succ0$ and the second-order sufficient condition holds.\n\n(d) Not convex. At $(0,4)$, $r_1=3$, and the Hessian is $\\begin{pmatrix}4-2r_1&0\\\\0&4\\end{pmatrix}=\\mathrm{diag}(-2,4)$, which is indefinite.\n\n(e) $\\nabla f=0$ means $J^\\top r=0$, and $J$ is invertible everywhere because $\\det J=-(e^x+1)<0$, so $r=0$. Hence the only stationary point is the global minimiser, which is also the only local minimiser.\n\nIntuition: a zero-residual least squares problem has Gauss-Newton Hessian equal to the true Hessian at the solution. Trap: non-convexity of the function does not imply extra local minima, and convexity must be checked on the whole domain, not only at the minimiser.","category":"opt","kind":"exam","difficulty":"medium","tags":["optimality conditions","nonlinear least squares","convexity","Hessian"],"origin":"in the style of Numerical Optimisation assessment 1, Exercise 1","status":"self-marked"},{"id":"m-opt-saddle-steepest-descent","title":"Steepest descent on a function with a saddle point","prompt":"Consider $f(x,y)=4x+6y+2x^2-3y^2$.\n\n(a) Find and classify the stationary points.\n(b) Run steepest descent with fixed step $\\gamma=1/6$. Find the iterate formulas for $x_k$ and $y_k$ and describe what happens from $(x_0,y_0)=(5,1)$ and from $(5,1.001)$.\n(c) What does this tell you about global convergence of gradient descent for non-convex functions, and what does a line search change?","hints":["The gradient is $(4+4x,\\ 6-6y)$ and the Hessian is diagonal.","Look at $y_k-1$."],"answer":"Only stationary point $(-1,1)$ is a saddle (Hessian $\\mathrm{diag}(4,-6)$). From $y_0=1$ the iterates converge to the saddle ($x_k+1$ shrinks by $1/3$ each step); for $y_0=1.001$, $y_k-1$ grows by a factor $2$ and $f\\to-\\infty$. A line search does not fix this: $f$ is unbounded below.","answer_type":"free-text","solution":"(a) $\\nabla f=(4+4x,\\ 6-6y)=0$ gives $(x,y)=(-1,1)$. The Hessian is $\\mathrm{diag}(4,-6)$, which is indefinite, so the point is a saddle: there is no local minimiser, and $f\\to-\\infty$ as $|y|\\to\\infty$.\n\n(b) With $\\gamma=1/6$, $x_{k+1}+1=(1-4\\gamma)(x_k+1)=\\frac13(x_k+1)$ and $y_{k+1}-1=(1+6\\gamma)(y_k-1)=2(y_k-1)$. From $y_0=1$ the $y$-component stays exactly $1$ and $(x_k,y_k)\\to(-1,1)$, the saddle, linearly at rate $1/3$. From $y_0=1.001$ the deviation doubles every step, so $y_k\\to+\\infty$ and $f(x_k,y_k)\\to-\\infty$ (the iterates run away from the saddle along its unstable direction).\n\n(c) Gradient descent converges to a stationary point only under extra conditions (e.g. $f$ bounded below with Lipschitz gradient, step $\\le1/L$ gives $\\|\\nabla f(x_k)\\|\\to0$), and for non-convex functions this may be a saddle, not a minimiser. The first start is a measure-zero set of initialisations that happens to land on the stable manifold of the saddle. A line search enforces sufficient decrease but cannot help here since $f$ is unbounded below, so no method can converge to a minimiser.\n\nIntuition: gradient flow avoids saddles for almost every start, but the exact initialisation on the stable manifold is attracted to it. Trap: reading \"converged to a stationary point\" as \"converged to a minimiser\".","category":"opt","kind":"exam","difficulty":"medium","tags":["steepest descent","saddle point","step size","non-convex"],"origin":"in the style of Numerical Optimisation tutorial 2, Exercise 2","status":"self-marked"},{"id":"m-opt-bfgs-convex","title":"BFGS on a strictly convex function","prompt":"Let $f(x,y)=(x+y)^2+4y^4+2y^2$.\n\n(a) Show that $f$ is strictly convex and has a unique minimiser. Find it.\n(b) Write the BFGS inverse-Hessian update $H_{k+1}$ in terms of $s_k=x_{k+1}-x_k$, $y_k=\\nabla f_{k+1}-\\nabla f_k$ and $\\rho_k=1/(y_k^\\top s_k)$. Why is $y_k^\\top s_k>0$ guaranteed here for any step?\n(c) Why can the update be implemented in $O(n^2)$ operations per iteration without forming any $n\\times n$ matrix product, and what convergence rate do you expect from BFGS with a Wolfe line search near the solution?","hints":["$\\nabla^2f=\\begin{pmatrix}2&2\\\\2&6+48y^2\\end{pmatrix}$.","$y_k^\\top s_k=s_k^\\top\\big(\\int_0^1\\nabla^2f(x_k+ts_k)dt\\big)s_k$."],"answer":"(a) $\\nabla^2f\\succ0$ everywhere (det $=8+96y^2>0$), minimiser $(0,0)$. (b) $H_{k+1}=(I-\\rho s y^\\top)H_k(I-\\rho y s^\\top)+\\rho ss^\\top$. (c) Expand into matrix-vector products and rank-one terms: $O(n^2)$; BFGS converges superlinearly.","answer_type":"free-text","solution":"(a) $\\nabla f=(2(x+y),\\ 2(x+y)+16y^3+4y)$ and $\\nabla^2f=\\begin{pmatrix}2&2\\\\2&6+48y^2\\end{pmatrix}$. Its trace is positive and its determinant is $2(6+48y^2)-4=8+96y^2>0$, so the Hessian is positive definite everywhere and $f$ is strictly convex; it is also coercive, so a unique minimiser exists. $\\nabla f=0$ forces $x+y=0$ and $16y^3+4y=0\\Rightarrow y=0$, so the minimiser is $(0,0)$.\n\n(b) $H_{k+1}=(I-\\rho_ks_ky_k^\\top)H_k(I-\\rho_ky_ks_k^\\top)+\\rho_ks_ks_k^\\top$. It satisfies the secant equation $H_{k+1}y_k=s_k$ and keeps $H_{k+1}\\succ0$ iff $y_k^\\top s_k>0$. Here $y_k=\\int_0^1\\nabla^2f(x_k+ts_k)s_k\\,dt$ so $y_k^\\top s_k=s_k^\\top\\bar Hs_k>0$ since the Hessian is positive definite everywhere, for any nonzero step (no Wolfe curvature condition is needed for convex $f$, though it is needed in general).\n\n(c) Do not form $(I-\\rho sy^\\top)$ as a matrix. Compute $v=H_ky_k$ (one matrix-vector product) and then $H_{k+1}=H_k-\\rho(sv^\\top+vs^\\top)+(\\rho^2y^\\top v+\\rho)ss^\\top$, which uses only matrix-vector products and rank-one updates, so $O(n^2)$ per iteration instead of $O(n^3)$. With a Wolfe line search BFGS converges superlinearly to a strict local minimiser when the Hessian is Lipschitz there (and globally for convex $f$).\n\nIntuition: BFGS builds up curvature information from gradient differences. Trap: forgetting that curvature $y^\\top s>0$ is what keeps the approximation positive definite, which is why the line search needs the Wolfe curvature condition for non-convex $f$.","category":"opt","kind":"exam","difficulty":"medium","tags":["BFGS","quasi-Newton","secant equation","convexity"],"origin":"in the style of Numerical Optimisation assessment 1, Exercise 3","status":"self-marked"},{"id":"m-opt-newton-step-rosenbrock","title":"One Newton step on the Rosenbrock function","prompt":"For the Rosenbrock function $f(x,y)=100(y-x^2)^2+(1-x)^2$ take a full Newton step from $x_0=(-1,1)$, i.e. $x_1=x_0-[\\nabla^2f(x_0)]^{-1}\\nabla f(x_0)$. What is $f(x_1)$? (Note $f(x_0)=4$.)","hints":["$\\nabla f=(-400x(y-x^2)-2(1-x),\\ 200(y-x^2))$ and $\\nabla^2f=\\begin{pmatrix}1200x^2-400y+2&-400x\\\\-400x&200\\end{pmatrix}$."],"answer":"$x_1=(1,-3)$ and $f(x_1)=1600$.","answer_type":"numeric","answer_value":1600.0,"solution":"At $x_0=(-1,1)$, $y-x^2=0$, so $\\nabla f=(-2(1-x),0)=(-4,0)$ and $\\nabla^2f=\\begin{pmatrix}802&400\\\\400&200\\end{pmatrix}$ with determinant $802\\cdot200-400^2=400$. The inverse is $\\frac1{400}\\begin{pmatrix}200&-400\\\\-400&802\\end{pmatrix}$, so the Newton direction is $p=-H^{-1}g=(2,-4)$ and $x_1=(1,-3)$. Then $f(x_1)=100(-3-1)^2+0=1600$, compared with $f(x_0)=4$.\n\nIntuition: Newton is the exact minimiser of the local quadratic model, which can be a poor model over a full step in a curved valley, so $f$ increases by a factor of 400. Trap: this is why practical Newton uses a line search (backtracking or Wolfe) or a trust region, and why $\\alpha=1$ is only tried first.","category":"opt","kind":"calculation","difficulty":"easy","tags":["Newton method","Rosenbrock","line search"],"origin":"original","status":"verified","entry":"Enter $f(x_1)$, the Rosenbrock function value after the one full Newton step."},{"id":"m-opt-kkt-multiplier","title":"KKT multiplier for a projection onto a half-space","prompt":"Minimise $f(x,y)=(x-3)^2+(y-2)^2$ subject to $x+y\\le2$. Write the Lagrangian $L=f+\\mu(x+y-2)$ and the KKT conditions. What is the optimal multiplier $\\mu^*$?","hints":["The unconstrained minimiser $(3,2)$ violates the constraint, so the constraint is active."],"answer":"$\\mu^*=3$, at $(x,y)=(1.5,0.5)$.","answer_type":"numeric","answer_value":3.0,"solution":"KKT: $\\nabla f+\\mu a=0$ with $a=(1,1)$, $x+y\\le2$, $\\mu\\ge0$ and $\\mu(x+y-2)=0$. The unconstrained minimiser $(3,2)$ has $x+y=5>2$, so the constraint must be active, $x+y=2$. Stationarity gives $2(x-3)=-\\mu$ and $2(y-2)=-\\mu$, so $x=3-\\mu/2$, $y=2-\\mu/2$. Substituting into $x+y=2$ gives $5-\\mu=2$, so $\\mu^*=3\\ge0$ (dual feasible), at $(x,y)=(1.5,0.5)$ with $f=4.5$.\n\nIntuition: the multiplier is the sensitivity of the optimum to the constraint level: relaxing $b=2$ to $2+\\epsilon$ lowers $f^*$ by about $3\\epsilon$ (the shadow price). Trap: checking the sign of $\\mu$ and complementary slackness; if the unconstrained minimiser had satisfied the constraint, $\\mu$ would be zero.","category":"opt","kind":"calculation","difficulty":"easy","tags":["KKT","Lagrange multiplier","constrained optimisation"],"origin":"original","status":"verified","entry":"Enter the optimal multiplier $\\mu^*$ (work out the optimal point too; the solution covers it)."},{"id":"m-opt-wolfe-conditions","title":"Wolfe conditions: what each one does","prompt":"State the (strong) Wolfe conditions for a step length $\\alpha$ along a descent direction $p_k$. What does each condition protect against? Why do quasi-Newton methods such as BFGS need the curvature condition, and what typical values of $c_1$ and $c_2$ would you use for steepest descent versus BFGS?","hints":["Sufficient decrease and curvature."],"answer":"Armijo: $f(x+\\alpha p)\\le f(x)+c_1\\alpha\\nabla f^\\top p$; curvature: $|\\nabla f(x+\\alpha p)^\\top p|\\le c_2|\\nabla f^\\top p|$ with $0<c_1<c_2<1$. The first rules out too-long steps, the second too-short steps, and guarantees $y^\\top s>0$ for BFGS.","answer_type":"free-text","solution":"Strong Wolfe with $0<c_1<c_2<1$: (i) sufficient decrease (Armijo) $f(x_k+\\alpha p_k)\\le f(x_k)+c_1\\alpha\\nabla f_k^\\top p_k$, (ii) curvature $|\\nabla f(x_k+\\alpha p_k)^\\top p_k|\\le c_2|\\nabla f_k^\\top p_k|$. The first condition rules out steps that are too long (they would give little decrease relative to the predicted linear decrease); the second rules out steps that are too short, because it demands that the slope along $p_k$ has flattened out, so we are near a minimiser of the one-dimensional function $\\phi(\\alpha)$. Backtracking alone satisfies (i) but not (ii).\n\nFor BFGS the update stays positive definite iff $y_k^\\top s_k>0$. With (ii) one gets $\\nabla f_{k+1}^\\top p_k\\ge c_2\\nabla f_k^\\top p_k$ (weak form), so $y_k^\\top s_k\\ge(c_2-1)\\alpha\\nabla f_k^\\top p_k>0$. Typical values: $c_1=10^{-4}$, with $c_2=0.9$ for Newton and quasi-Newton (a loose search is enough because the unit step is usually accepted) and $c_2=0.1$ for conjugate gradient or steepest descent where more accurate line searches are useful.\n\nIntuition: Armijo prevents overshooting, curvature prevents stalling. Trap: with $c_2<c_1$ no step may exist, and with a non-descent direction ($\\nabla f^\\top p\\ge0$) the conditions are meaningless.","category":"opt","kind":"concept","difficulty":"medium","tags":["Wolfe conditions","line search","BFGS","Armijo"],"origin":"original","status":"self-marked"},{"id":"m-opt-duality-slater","title":"Weak and strong duality, and what the dual buys you","prompt":"For $\\min_x f(x)$ s.t. $g_i(x)\\le0$, $h_j(x)=0$, define the Lagrange dual function and the dual problem. State weak duality and strong duality (with Slater's condition), and explain how the KKT conditions relate to them. Give an example of why one might solve the dual in practice.","hints":["The dual function is a pointwise infimum of affine functions of the multipliers."],"answer":"$q(\\mu,\\nu)=\\inf_xL(x,\\mu,\\nu)$; dual: $\\max_{\\mu\\ge0}q$. Weak duality $q\\le p^*$ always; strong duality ($q^*=p^*$) holds for convex problems under Slater; KKT are then necessary and sufficient.","answer_type":"free-text","solution":"Lagrangian $L(x,\\mu,\\nu)=f(x)+\\sum_i\\mu_ig_i(x)+\\sum_j\\nu_jh_j(x)$. The dual function $q(\\mu,\\nu)=\\inf_xL$ is concave (an infimum of affine functions of the multipliers) for any problem, and the dual problem is $\\max_{\\mu\\ge0,\\nu}q(\\mu,\\nu)$. Weak duality: for any feasible $x$ and $\\mu\\ge0$, $q(\\mu,\\nu)\\le L(x,\\mu,\\nu)\\le f(x)$, so $d^*\\le p^*$ always; the gap $p^*-d^*$ is the duality gap. Strong duality ($d^*=p^*$) holds for convex problems under a constraint qualification such as Slater's condition (a strictly feasible point $g_i(x)<0$ with affine equalities). In that case $x^*$ and $(\\mu^*,\\nu^*)$ are primal and dual optimal iff they satisfy the KKT conditions: stationarity, primal and dual feasibility, and complementary slackness $\\mu_i^*g_i(x^*)=0$.\n\nWhy solve the dual: it may have a simple feasible set and a lower dimension (SVM: dual in $n$ variables with box constraints and kernels; min-norm problems), it decomposes across blocks (dual decomposition and ADMM), and any dual feasible point gives a lower bound that certifies suboptimality. Trap: strong duality can fail for non-convex problems, and the multipliers $\\mu\\ge0$ sign convention depends on the form of the constraints.","category":"opt","kind":"concept","difficulty":"medium","tags":["duality","KKT","Slater","Lagrangian"],"origin":"original","status":"self-marked"},{"id":"m-opt-gauss-newton","title":"Deriving Gauss-Newton and Levenberg-Marquardt","prompt":"For the nonlinear least squares problem $\\min_x f(x)=\\frac12\\|r(x)\\|^2$ with residual vector $r:\\mathbb{R}^n\\to\\mathbb{R}^m$ and Jacobian $J$, derive the Gauss-Newton step from the Newton step. When does Gauss-Newton coincide with Newton, and what does Levenberg-Marquardt add?","hints":["$\\nabla f=J^\\top r$ and $\\nabla^2f=J^\\top J+\\sum_ir_i\\nabla^2r_i$."],"answer":"Drop the second term of the Hessian: $J^\\top J\\,p=-J^\\top r$. Equivalent to solving the linearised least squares problem $\\min_p\\|r+Jp\\|^2$. Levenberg-Marquardt solves $(J^\\top J+\\lambda I)p=-J^\\top r$.","answer_type":"free-text","solution":"With $f=\\frac12\\sum_ir_i^2$ we have $\\nabla f=J^\\top r$ and $\\nabla^2f=J^\\top J+\\sum_ir_i\\nabla^2r_i$. Newton solves $\\nabla^2f\\,p=-\\nabla f$. Gauss-Newton drops the second-order residual term, giving $J^\\top J\\,p=-J^\\top r$; equivalently it linearises the residual, $r(x+p)\\approx r+Jp$, and minimises $\\frac12\\|r+Jp\\|^2$, a linear least squares problem solved by QR or SVD without forming $J^\\top J$ (better conditioned). Benefits: needs only first derivatives, $J^\\top J\\succeq0$ so $p$ is a descent direction when $J$ has full rank, $\\nabla f^\\top p=-\\|Jp\\|^2<0$.\n\nIt coincides with Newton when the residual curvature term is negligible, i.e. residuals are zero at the solution (zero-residual problems, where it converges quadratically) or the residuals are nearly linear; with large residuals the convergence is only linear. Levenberg-Marquardt solves $(J^\\top J+\\lambda I)p=-J^\\top r$, which is the trust-region solution of the linearised problem: large $\\lambda$ gives short gradient-like steps, small $\\lambda$ gives Gauss-Newton steps, and it fixes rank-deficiency.\n\nTrap: Gauss-Newton can fail when $J$ is rank-deficient or the full step overshoots; always combine it with a line search or damping.","category":"opt","kind":"derivation","difficulty":"medium","tags":["Gauss-Newton","Levenberg-Marquardt","nonlinear least squares","trust region"],"origin":"original","status":"self-marked"},{"id":"m-opt-min-norm-dual","title":"Dual of the minimum-norm problem","prompt":"Consider $\\min_x \\frac12\\|x\\|^2$ subject to $Ax=b$, with $A\\in\\mathbb{R}^{m\\times n}$ of full row rank. Derive the solution using the Lagrangian and the dual function, and state the dual problem. Why is the dual attractive when $m\\ll n$?","hints":["Minimise $L(x,\\nu)=\\frac12\\|x\\|^2+\\nu^\\top(Ax-b)$ over $x$ first."],"answer":"$x^*=A^\\top(AA^\\top)^{-1}b$ with $\\nu^*=-(AA^\\top)^{-1}b$; dual function $q(\\nu)=-\\frac12\\|A^\\top\\nu\\|^2-b^\\top\\nu$, an unconstrained concave quadratic in $m$ variables.","answer_type":"free-text","solution":"Lagrangian $L(x,\\nu)=\\frac12\\|x\\|^2+\\nu^\\top(Ax-b)$. Minimising over $x$: $\\nabla_xL=x+A^\\top\\nu=0\\Rightarrow x=-A^\\top\\nu$. Substituting, $q(\\nu)=\\frac12\\|A^\\top\\nu\\|^2-\\|A^\\top\\nu\\|^2-\\nu^\\top b=-\\frac12\\|A^\\top\\nu\\|^2-b^\\top\\nu$, a concave quadratic. Maximising: $\\nabla q=-AA^\\top\\nu-b=0\\Rightarrow\\nu^*=-(AA^\\top)^{-1}b$, so $x^*=A^\\top(AA^\\top)^{-1}b$, the pseudo-inverse solution. Strong duality holds because the problem is convex with affine constraints, and primal and dual optimal values agree, $\\frac12 b^\\top(AA^\\top)^{-1}b$.\n\nWhen $m\\ll n$ the dual has only $m$ variables and requires solving an $m\\times m$ system, cost $O(m^3+m^2n)$ instead of working in $n$ dimensions. This is the same trick as the kernel/dual form of ridge or SVM (the Gram matrix $AA^\\top$ is $m\\times m$).\n\nIntuition: the solution is the point of the affine set $\\{Ax=b\\}$ closest to the origin, which lies in the row space of $A$. Trap: signs of $\\nu$; with an equality constraint the sign is free.","category":"opt","kind":"derivation","difficulty":"medium","tags":["Lagrangian","dual","least norm","pseudo-inverse"],"origin":"original","status":"self-marked"},{"id":"m-opt-lbfgs-scenario","title":"Choosing an optimiser for large logistic regression","prompt":"You are fitting a regularised logistic regression with $10^6$ features and $5\\times10^6$ rows, and a colleague wants to use Newton's method because it \"converges quadratically\". Another suggests plain gradient descent. What would you use, and what would you check? Cover memory, line search, conditioning and when you would reach for ADMM or stochastic methods instead.","hints":["What does Newton need that costs $O(n^2)$ memory and $O(n^3)$ time?"],"answer":"L-BFGS with a Wolfe line search: stores only $m$ recent pairs $(s,y)$ ($O(mn)$ memory), superlinear-ish convergence, and uses the convex structure. Newton's $10^6\\times10^6$ Hessian is infeasible unless used matrix-free via Newton-CG.","answer_type":"free-text","solution":"Newton needs the $n\\times n$ Hessian ($10^{12}$ entries) and an $O(n^3)$ solve, so it is infeasible at $n=10^6$; plain gradient descent needs a step size $\\le1/L$ and converges at a rate that depends on the condition number $\\kappa$, which can be poor with unscaled features. A good default is L-BFGS: it keeps only the last $m\\approx10$ pairs $(s_k,y_k)$, applies the inverse Hessian approximation with the two-loop recursion in $O(mn)$ time and memory, and converges superlinearly in practice with a Wolfe line search (which keeps $y^\\top s>0$). Alternatives are Newton-CG (truncated Newton using Hessian-vector products, $O(\\mathrm{nnz})$ each) and trust-region Newton, which is common in LIBLINEAR.\n\nChecks: standardise or precondition features to lower $\\kappa$; use a sufficiently strong $\\ell_2$ term to make the problem strongly convex; monitor the gradient norm and the relative decrease in $f$ for stopping; use sparse matrix-vector products. For an $\\ell_1$ penalty (non-smooth) use proximal or coordinate methods, or ADMM when the data are split across machines (consensus form); with many rows and no need for a precise optimum, SGD or SVRG with a small validation check can be better.\n\nTrap: judging methods by the number of iterations instead of wall-clock cost per iteration; Newton's quadratic convergence is only local and per-iteration cost is far higher.","category":"opt","kind":"scenario","difficulty":"medium","tags":["L-BFGS","Newton-CG","logistic regression","ADMM","scaling"],"origin":"original","status":"self-marked"},{"id":"m-core-bias-variance","title":"Bias-variance decomposition of squared error","prompt":"Let $y=f(x)+\\varepsilon$ with $\\mathbb{E}\\varepsilon=0$, $\\mathrm{Var}\\,\\varepsilon=\\sigma^2$, and let $\\hat f_S$ be fitted on a random training set $S$. Derive the decomposition of the expected squared error at a fixed point $x$ into bias, variance and noise. Then explain how model complexity and the amount of regularisation move each term.","hints":["Add and subtract $\\mathbb{E}_S\\hat f_S(x)$ and $f(x)$, and check that the cross terms vanish."],"answer":"$\\mathbb{E}[(y-\\hat f_S(x))^2]=\\sigma^2+(\\mathbb{E}_S\\hat f_S(x)-f(x))^2+\\mathrm{Var}_S(\\hat f_S(x))$.","answer_type":"free-text","solution":"Write $\\bar f(x)=\\mathbb{E}_S\\hat f_S(x)$. Then $y-\\hat f_S=\\varepsilon+(f-\\bar f)+(\\bar f-\\hat f_S)$. Square and take expectation over $\\varepsilon$ and $S$. Cross terms vanish: $\\varepsilon$ is independent of $S$ and has mean zero, and $\\mathbb{E}_S(\\bar f-\\hat f_S)=0$ while $f-\\bar f$ is a constant. This leaves $\\mathbb{E}(y-\\hat f_S)^2=\\sigma^2+(f-\\bar f)^2+\\mathbb{E}_S(\\hat f_S-\\bar f)^2=$ noise $+$ bias$^2$ $+$ variance.\n\nEffect of complexity: flexible models (high degree, small $\\lambda$, deep trees, small $k$ in $k$-NN) have low bias but high variance because the fit changes with the particular sample; simple models have high bias and low variance. Regularisation (larger $\\lambda$, early stopping, bagging, more data) trades a small increase in bias for a larger decrease in variance. The noise term $\\sigma^2$ is irreducible.\n\nTrap: the decomposition is for squared loss; for 0-1 loss or cross-entropy there is no clean additive form. Also modern over-parameterised networks can show a \"double descent\" in which test error falls again beyond the interpolation threshold, so the classic U-shape is not the whole story.","category":"core","kind":"derivation","difficulty":"medium","tags":["bias-variance","squared error","regularisation"],"origin":"original","status":"self-marked"},{"id":"m-core-l1-vs-l2","title":"L1 versus L2 regularisation","prompt":"What is the difference between L1 (lasso) and L2 (ridge) regularisation? Cover the effect on the coefficients, the geometric picture, the Bayesian interpretation, how they behave with correlated features, and when you would use each.","hints":["Think of the constraint balls and the priors."],"answer":"L2 shrinks all weights smoothly (Gaussian prior, closed form); L1 gives sparse solutions (Laplace prior, corners of the $\\ell_1$ ball). With correlated features lasso picks one arbitrarily, ridge spreads the weight.","answer_type":"free-text","solution":"Ridge adds $\\lambda\\|w\\|_2^2$ and has the closed form $\\hat w=(X^\\top X+\\lambda I)^{-1}X^\\top y$; each coefficient along principal direction $j$ is multiplied by $s_j^2/(s_j^2+\\lambda)$, so weights shrink smoothly towards (but never exactly to) zero and the problem is always well-conditioned. Lasso adds $\\lambda\\|w\\|_1$; the soft-thresholding $\\mathrm{sign}(w)(|w|-\\lambda)_+$ sets small coefficients exactly to zero, giving feature selection. Geometrically, the loss contours first touch the $\\ell_1$ ball at its corners (on the axes), whereas the $\\ell_2$ ball has no corners. Bayesian view: ridge is MAP under a Gaussian prior and lasso under a Laplace prior.\n\nWith correlated features, lasso tends to pick one of the group arbitrarily (unstable), while ridge shares weight among them; elastic net combines both. Use ridge when you believe many small effects and want stable predictions; use lasso (or elastic net) when you expect a sparse truth or need interpretability or cheap inference. Standardise features first, since both penalties are scale-dependent, and do not penalise the intercept.\n\nTrap: lasso has no closed form (use coordinate descent or proximal gradient), and its selected set is not guaranteed to be the true support without conditions such as incoherence.","category":"core","kind":"concept","difficulty":"easy","tags":["regularisation","lasso","ridge","sparsity"],"origin":"original","status":"self-marked"},{"id":"m-core-map-ridge","title":"MAP estimation with a Gaussian prior is ridge regression","prompt":"Assume $y_i=w^\\top x_i+\\varepsilon_i$ with $\\varepsilon_i\\sim\\mathcal{N}(0,\\sigma^2)$ and a prior $w\\sim\\mathcal{N}(0,\\tau^2I)$. Show that the MLE is least squares, the MAP estimate is ridge regression, and identify $\\lambda$ in terms of $\\sigma^2$ and $\\tau^2$. Say what happens as the data grow.","hints":["Take the negative log of likelihood times prior."],"answer":"MLE: minimise $\\sum(y_i-w^\\top x_i)^2$. MAP: minimise $\\sum(y_i-w^\\top x_i)^2+\\lambda\\|w\\|^2$ with $\\lambda=\\sigma^2/\\tau^2$. As $n\\to\\infty$ the likelihood dominates and MAP approaches MLE.","answer_type":"free-text","solution":"The log-likelihood is $\\log p(y\\mid X,w)=-\\frac1{2\\sigma^2}\\sum_i(y_i-w^\\top x_i)^2+\\text{const}$, so maximising it is minimising the sum of squares: the MLE is ordinary least squares, $\\hat w=(X^\\top X)^{-1}X^\\top y$. The log-prior is $-\\frac1{2\\tau^2}\\|w\\|^2+\\text{const}$. The negative log posterior, times $2\\sigma^2$, is $\\sum_i(y_i-w^\\top x_i)^2+\\frac{\\sigma^2}{\\tau^2}\\|w\\|^2$, which is ridge regression with $\\lambda=\\sigma^2/\\tau^2$ and $\\hat w_{\\mathrm{MAP}}=(X^\\top X+\\lambda I)^{-1}X^\\top y$ (also the posterior mean, since the posterior is Gaussian).\n\nReading: a tight prior (small $\\tau^2$) or noisy data (large $\\sigma^2$) means stronger shrinkage. As $n$ grows the likelihood term scales with $n$ while the prior stays fixed, so MAP approaches the MLE; with few samples or $p>n$ the prior makes the problem well-posed. A Laplace prior gives $\\ell_1$ regularisation in the same way.\n\nTrap: MAP is a point estimate and is not invariant to reparametrisation, and unlike the full posterior it does not give uncertainty.","category":"core","kind":"derivation","difficulty":"easy","tags":["MLE","MAP","ridge","Bayesian"],"origin":"original","status":"self-marked"},{"id":"m-core-kl-value","title":"KL divergence between two Bernoulli distributions","prompt":"Compute $\\mathrm{KL}(p\\,\\|\\,q)$ in nats for $p=\\mathrm{Bernoulli}(0.7)$ and $q=\\mathrm{Bernoulli}(0.5)$. Give the answer to 4 decimal places.","hints":["$\\mathrm{KL}(p\\|q)=\\sum_xp(x)\\log\\frac{p(x)}{q(x)}$."],"answer":"$0.7\\ln1.4+0.3\\ln0.6\\approx0.0823$ nats.","answer_type":"numeric","answer_value":0.0823,"solution":"$\\mathrm{KL}(p\\|q)=0.7\\ln\\frac{0.7}{0.5}+0.3\\ln\\frac{0.3}{0.5}=0.7(0.3365)+0.3(-0.5108)=0.2355-0.1532\\approx0.0823$ nats (about $0.119$ bits). Because $q$ is uniform, this equals $\\ln2-H(p)$, where $H(p)=0.6109$ nats is the entropy of $p$.\n\nIntuition: KL is the expected extra code length (in nats) when coding data from $p$ with a code built for $q$. Trap: it is not symmetric, $\\mathrm{KL}(q\\|p)\\ne\\mathrm{KL}(p\\|q)$ in general, and it is infinite if $q(x)=0$ where $p(x)>0$. Also make sure you use the natural log if the answer is requested in nats.","category":"core","kind":"calculation","difficulty":"easy","tags":["KL divergence","entropy","information theory"],"origin":"original","status":"verified","entry":"Enter $\\mathrm{KL}(p\\,\\|\\,q)$ in nats (natural log), with $p$ the Bernoulli(0.7)."},{"id":"m-core-cross-validation","title":"Cross-validation, leakage and nested CV","prompt":"Explain $k$-fold cross-validation and what it estimates. What are the main ways it goes wrong (leakage, time series, groups, hyperparameter selection), and what is nested cross-validation for? What would you choose for $k$?","hints":["Everything learned from data must be fit inside each training fold."],"answer":"Average validation error over $k$ held-out folds estimates generalisation error; pitfalls are preprocessing before splitting, ignoring time order or groups, and reusing the CV score used to tune hyperparameters. Nested CV separates model selection from error estimation.","answer_type":"free-text","solution":"$k$-fold CV splits the data into $k$ folds, trains on $k-1$ and evaluates on the held-out one, then averages the $k$ scores; it estimates the expected generalisation error of the training procedure (including its hyperparameter choices) on data of size roughly $(k-1)n/k$, and its variance across folds gives a rough error bar. Small $k$ is cheap but pessimistically biased; large $k$ (leave-one-out) is nearly unbiased but costly with highly correlated folds; $k=5$ or $10$ is the usual compromise.\n\nFailure modes: (1) leakage, where scaling, feature selection, imputation, target encoding or oversampling is fit on all data before splitting. Put these in a pipeline fit only on the training folds. (2) Dependent data: use time-ordered splits (rolling origin) for time series, group $k$-fold for repeated measurements of the same user or patient. (3) Selection bias: if you pick hyperparameters by the best CV score, that score is optimistically biased. Nested CV uses an inner loop for tuning and an outer loop for the performance estimate, or keep a final untouched test set. (4) Imbalanced classes: use stratified folds.\n\nTrap: CV estimates how the procedure performs, not how one specific fitted model performs, and it is only valid if future data resemble the folds (no distribution shift).","category":"core","kind":"concept","difficulty":"medium","tags":["cross-validation","data leakage","nested CV","model selection"],"origin":"original","status":"self-marked"},{"id":"m-core-gd-variants","title":"Gradient descent, SGD, momentum and Adam","prompt":"Compare batch gradient descent, mini-batch SGD, momentum and Adam. Why does SGD generalise and scale, what does momentum fix, what does Adam's update look like, and what are practical learning-rate tips?","hints":["Adam uses a first and a second moment estimate with bias correction."],"answer":"SGD uses noisy mini-batch gradients (cheap, regularising); momentum accumulates gradients to damp oscillations; Adam rescales by the running RMS of gradients: $m_t/(\\sqrt{v_t}+\\epsilon)$ with bias correction. Tune the learning rate first, use warmup and decay.","answer_type":"free-text","solution":"Batch GD uses the full gradient: exact but one update per pass over the data. Mini-batch SGD uses an unbiased gradient estimate from a batch, so each step is cheap and the noise helps escape sharp minima and saddle points; it needs a decaying or small step size because the noise does not vanish. Momentum keeps $v\\leftarrow\\beta v+g$, $w\\leftarrow w-\\eta v$, which averages gradients: it damps oscillations across steep, narrow directions and accelerates along consistent ones (for quadratics the rate improves from $\\kappa$ to roughly $\\sqrt\\kappa$ with Nesterov).\n\nAdam keeps $m_t=\\beta_1m_{t-1}+(1-\\beta_1)g_t$ and $v_t=\\beta_2v_{t-1}+(1-\\beta_2)g_t^2$, with bias correction $\\hat m=m/(1-\\beta_1^t)$, $\\hat v=v/(1-\\beta_2^t)$, and updates $w\\leftarrow w-\\eta\\,\\hat m/(\\sqrt{\\hat v}+\\epsilon)$, a per-parameter step size that handles badly scaled or sparse gradients. Use AdamW (decoupled weight decay) rather than L2 added to the gradient, and typical defaults $\\beta=(0.9,0.999)$, $\\epsilon=10^{-8}$.\n\nPractice: the learning rate is the most important hyperparameter (sweep it on a log scale), use warmup then cosine or linear decay, clip gradients for transformers and RNNs, and scale the learning rate with batch size. Trap: Adam often reaches lower training loss faster but can generalise slightly worse than tuned SGD with momentum on some vision tasks.","category":"core","kind":"concept","difficulty":"medium","tags":["SGD","momentum","Adam","learning rate"],"origin":"original","status":"self-marked"},{"id":"m-core-logistic-gradient","title":"Gradient of the logistic regression loss","prompt":"For binary labels $y_i\\in\\{0,1\\}$ and $p_i=\\sigma(w^\\top x_i)$, show that the negative log-likelihood is the cross-entropy loss and derive its gradient $\\nabla_w=X^\\top(p-y)$. State why the Hessian is positive semidefinite and give its form.","hints":["Use $\\sigma'(z)=\\sigma(z)(1-\\sigma(z))$."],"answer":"$\\mathcal{L}=-\\sum_i[y_i\\log p_i+(1-y_i)\\log(1-p_i)]$, $\\nabla\\mathcal{L}=X^\\top(p-y)$, $\\nabla^2\\mathcal{L}=X^\\top\\mathrm{diag}(p_i(1-p_i))X\\succeq0$, so the loss is convex.","answer_type":"free-text","solution":"Each label is Bernoulli with parameter $p_i$, so the likelihood is $\\prod_ip_i^{y_i}(1-p_i)^{1-y_i}$ and the negative log-likelihood is $\\mathcal{L}(w)=-\\sum_i[y_i\\log p_i+(1-y_i)\\log(1-p_i)]$, the binary cross-entropy. With $z_i=w^\\top x_i$, $\\partial\\mathcal{L}/\\partial z_i=-\\big(\\frac{y_i}{p_i}-\\frac{1-y_i}{1-p_i}\\big)p_i(1-p_i)=-(y_i(1-p_i)-(1-y_i)p_i)=p_i-y_i$. The chain rule gives $\\nabla_w\\mathcal{L}=\\sum_i(p_i-y_i)x_i=X^\\top(p-y)$; the sigmoid derivative cancels the $1/p(1-p)$ factors, which is why cross-entropy trains better than squared error with a sigmoid output (no vanishing gradient when confidently wrong).\n\nDifferentiating again, $\\nabla^2\\mathcal{L}=X^\\top\\mathrm{diag}(p_i(1-p_i))X\\succeq0$, so the loss is convex (strictly if $X$ has full column rank), with no local minima. Newton's method becomes IRLS. Trap: if the data are linearly separable the MLE does not exist ($\\|w\\|\\to\\infty$), so add L2 regularisation.","category":"core","kind":"derivation","difficulty":"medium","tags":["logistic regression","cross-entropy","gradient","convexity"],"origin":"original","status":"self-marked"},{"id":"m-core-ppv-base-rate","title":"Positive predictive value with a low base rate","prompt":"A screening model has sensitivity 95% and specificity 90%. The condition has prevalence 1%. If the model flags a case as positive, what is the probability it is truly positive? (Give a decimal.)","hints":["Use Bayes' rule, or count positives out of 10,000 people."],"answer":"$\\frac{0.95\\cdot0.01}{0.95\\cdot0.01+0.10\\cdot0.99}=\\frac{19}{217}\\approx0.0876$.","answer_type":"numeric","answer_value":0.08755760368663594,"solution":"By Bayes' rule, $P(\\text{disease}\\mid+)=\\frac{P(+\\mid D)P(D)}{P(+\\mid D)P(D)+P(+\\mid\\neg D)P(\\neg D)}=\\frac{0.95\\times0.01}{0.95\\times0.01+0.10\\times0.99}=\\frac{0.0095}{0.1085}=\\frac{19}{217}\\approx0.0876$. Counting 10,000 people: 100 are positive, 95 detected; 9,900 negative, 990 false alarms; so $95/(95+990)\\approx8.8\\%$.\n\nIntuition: when the base rate is low even a good
