pare your first $50$ coins with your friend's $50$ coins, then consider the extra coin."],"answer":"$1/2$","answer_type":"numeric","answer_value":0.5,"solution":"After $50$ coins each, there is a tie, you lead, or your friend leads, with the last two equally likely by symmetry. If you lead you win; if your friend leads you cannot win; if tied you win only if the extra coin is heads. So $P = \\tfrac{1-q}{2} + q\\cdot\\tfrac12 = \\tfrac12$, where $q$ is the tie probability.","category":"statistics","difficulty":"hard","tags":["symmetry","binomial"],"origin":"adapted from a classic","status":"verified","entry":"Enter the probability that you get strictly more heads than your friend, as a probability, not a percentage."},{"id":"t-stat-regression-slope","title":"Slope from correlation and spreads","prompt":"A regression of $y$ on $x$ is run. The standard deviation of $x$ is $2$, the standard deviation of $y$ is $5$, and their correlation is $0.6$. What is the OLS slope?","hints":["Slope = covariance divided by variance of $x$."],"answer":"$1.5$","answer_type":"numeric","answer_value":1.5,"solution":"$\\beta = \\rho\\,\\dfrac{\\sigma_y}{\\sigma_x} = 0.6 \\times \\dfrac{5}{2} = 1.5$. With standardised $x$ and $y$ the slope would equal the correlation, $0.6$.","category":"statistics","difficulty":"easy","tags":["regression","correlation"],"origin":"original","status":"verified","entry":"Enter the OLS slope of $y$ on $x$."},{"id":"t-stat-sample-size-for-ci","title":"Sample size for a confidence interval","prompt":"Daily returns have a standard deviation of $10$ (in basis points). How many independent days are needed so that the half-width of a $95\\%$ confidence interval for the mean is $1$ basis point? Use $z = 1.96$ and give the unrounded value.","hints":["Half-width $= z\\,\\sigma/\\sqrt{n}$."],"answer":"$384.16$ (so $385$ days)","answer_type":"numeric","answer_value":384.16,"solution":"$n = (z\\sigma / h)^2 = (1.96 \\times 10 / 1)^2 = 19.6^2 = 384.16$, so you need $385$ days. The key intuition is the square root: to halve the interval width you need four times the data. Using $z \\approx 2$ gives $400$.","category":"statistics","difficulty":"medium","tags":["confidence-interval","sampling"],"origin":"original","status":"verified","entry":"Enter the number of independent days needed, unrounded, so the interval half-width is $1$ basis point."},{"id":"t-stat-ten-calibrated-intervals","title":"Ten calibrated 90 percent intervals","prompt":"You give $10$ independent $90\\%$ confidence intervals, and each one is perfectly calibrated. What is the probability that all $10$ contain the true value? Give a decimal to $4$ places.","hints":["Independence means the probabilities multiply."],"answer":"$0.9^{10} \\approx 0.3487$","answer_type":"numeric","answer_value":0.3487,"solution":"$0.9^{10} \\approx 0.3487$. So even a perfectly calibrated forecaster misses at least one of ten intervals about $65\\%$ of the time. If someone is right on all ten, their intervals are probably too wide; if they miss four or more (probability about $1.3\\%$), they are overconfident.","category":"statistics","difficulty":"easy","tags":["calibration","confidence-interval"],"origin":"original","status":"verified","entry":"Enter the probability that all $10$ intervals contain the true value, as a probability, not a percentage."},{"id":"t-stat-sample-variance-three-points","title":"Unbiased sample variance","prompt":"A sample is $2, 4, 6$. What is the unbiased sample variance (dividing by $n - 1$)?","hints":["The sample mean is 4."],"answer":"$4$","answer_type":"numeric","answer_value":4.0,"solution":"The mean is $4$ and the squared deviations are $4, 0, 4$, summing to $8$. Dividing by $n-1 = 2$ gives $4$ (dividing by $n$ would give $8/3 \\approx 2.67$, which is biased low because the sample mean is fitted to the same data).","category":"statistics","difficulty":"easy","tags":["variance","bessel"],"origin":"original","status":"verified","entry":"Enter the unbiased sample variance of $2, 4, 6$."},{"id":"t-stat-lln-coin-proportion","title":"How tight is the proportion of heads","prompt":"You flip a fair coin $10{,}000$ times. Using the normal approximation, what is the probability that the proportion of heads lies between $0.49$ and $0.51$? Give a decimal to $3$ places.","hints":["The standard error of the proportion is $\\sqrt{p(1-p)/n}$."],"answer":"$\\approx 0.954$","answer_type":"numeric","answer_value":0.954,"solution":"The standard error is $\\sqrt{0.25/10000} = 0.005$. The band $\\pm0.01$ is $\\pm 2$ standard errors, so the probability is $P(|Z|<2) \\approx 0.954$. The law of large numbers pulls the proportion towards $0.5$ at rate $1/\\sqrt{n}$: $100$ times more flips make the band $10$ times tighter.","category":"statistics","difficulty":"medium","tags":["lln","clt","standard-error"],"origin":"original","status":"verified","entry":"Enter the probability that the proportion of heads lies between $0.49$ and $0.51$, as a probability, not a percentage."},{"id":"t-stat-equicorrelated-average-variance","title":"Averaging correlated estimates","prompt":"You average $n$ estimates, each with variance $4$ and every pair with correlation $0.5$. As $n \\to \\infty$, what does the variance of the average tend to?","hints":["Write the variance of the average as $\\sigma^2\\,(1/n + (n-1)\\rho/n)$."],"answer":"$2$","answer_type":"numeric","answer_value":2.0,"solution":"The variance of the average is $\\frac{1}{n^2}\\big(n\\sigma^2 + n(n-1)\\rho\\sigma^2\\big) = \\sigma^2\\big(\\tfrac1n + \\rho\\tfrac{n-1}{n}\\big) \\to \\rho\\sigma^2 = 0.5\\times4 = 2$. The shared (correlated) component cannot be diversified away: only the idiosyncratic part disappears as $n$ grows, which is why $50\\%$ correlation caps the benefit of averaging at halving the variance.","category":"statistics","difficulty":"hard","tags":["variance","diversification","correlation"],"origin":"adapted from a classic","status":"verified","entry":"Enter the limiting variance of the average of the estimates as $n \\to \\infty$."},{"id":"t-stat-overfit-train-test","title":"99 percent in training, 65 percent in test","prompt":"A trading model scores $99\\%$ accuracy on its training data and $65\\%$ on held-out test data. What has probably gone wrong, and what would you do about it? Mention anything specific to financial time series.","hints":["Think about what the gap tells you, and then about how the test set was chosen."],"answer":"Overfitting; regularise or simplify, use more data, and validate with time-ordered splits.","answer_type":"free-text","solution":"A strong answer covers: (1) the large gap between training and test accuracy signals overfitting (high variance): the model has memorised noise; (2) fixes: regularisation (L1/L2, dropout, early stopping), a simpler model, fewer features, more data, ensembling; (3) check the validation design: random shuffled splits leak the future into the past in time series, so use walk-forward or time-ordered splits with a gap (embargo) to avoid look-ahead bias; (4) beware of repeated testing and tuning on the same test set (data snooping, p-hacking), keep a final untouched hold-out; (5) note that financial signals are weak, so even a genuine edge shows a modest accuracy such as $52$ to $55\\%$, and a high number should raise suspicion rather than pride.","category":"statistics","difficulty":"medium","tags":["overfitting","validation","time-series"],"origin":"original","status":"self-marked"},{"id":"t-stat-overconfident-intervals","title":"Four hits out of ten at 90 percent","prompt":"A colleague gave $10$ different $90\\%$ intervals for quantities such as the number of countries in Africa and only $4$ of them contained the true value. What does this tell you and how should they adjust?","hints":["What hit rate would you expect from a calibrated forecaster?"],"answer":"Overconfident: intervals are too narrow, widen them (aim for a hit rate near 9 in 10).","answer_type":"free-text","solution":"A strong answer covers: (1) a calibrated $90\\%$ forecaster should capture about $9$ in $10$, and getting $4$ or fewer has probability about $0.015\\%$, so this is clearly overconfidence, not bad luck; (2) people typically anchor on a point estimate and set bounds too close to it, ignoring uncertainty in their own knowledge; (3) fix by widening the intervals, thinking of the extremes first (what is the smallest and largest value that is still plausible), and starting from a wide interval and shrinking it; (4) the trader link: overconfident intervals translate into spreads that are too tight, so you get picked off by better-informed counterparties (adverse selection); (5) track hit rates over many questions to recalibrate.","category":"statistics","difficulty":"medium","tags":["calibration","overconfidence","market-making"],"origin":"original","status":"self-marked"}];
var ML_BANK=[{"id":"m-sl-bayes-cost-matrix","title":"Bayes estimator with a cost matrix","prompt":"Let $p(x,y)$ be a distribution over $X=[n]$, $Y=[k]$ and let $C\\in[0,\\infty)^{k\\times k}$ be a cost matrix with class-sensitive loss $L_C(y,\\hat y)=[y\\neq\\hat y]\\,C_{y,\\hat y}$ (cost of predicting $\\hat y$ when the truth is $y$). (a) Derive the Bayes estimator. (b) Now let $X=\\{1,2,3\\}$, $Y=\\{1,2\\}$, $P[X=i]=i/6$, $P[Y=1\\mid X=i]=\\tfrac{1}{10}+\\tfrac{i}{10}$ and $C=\\begin{pmatrix}0&3\\\\1&0\\end{pmatrix}$ (rows are the true class, columns the prediction). Give the Bayes estimator after simplifying, and its Bayes risk.","hints":["Condition on $x$: minimise the conditional expected loss $\\sum_y p(y\\mid x)L_C(y,\\hat y)$ over $\\hat y$.","For two classes, write the condition for predicting class 1 as an inequality on $p(1\\mid x)$."],"answer":"$f^*(x)=\\arg\\min_{\\hat y}\\sum_{y\\ne\\hat y}p(y\\mid x)C_{y,\\hat y}$. Here predict 1 iff $p(1\\mid x)>1/4$, so $f^*(1)=2$, $f^*(2)=f^*(3)=1$; Bayes risk $19/30$.","answer_type":"free-text","solution":"The risk is $\\sum_x p(x)\\sum_y p(y\\mid x)L_C(y,f(x))$, and $f$ can be chosen separately at each $x$, so $f^*(x)=\\arg\\min_{\\hat y}\\sum_{y\\neq\\hat y}p(y\\mid x)C_{y,\\hat y}$. For (b) predicting 1 costs $p(2\\mid x)C_{2,1}=1-p$ and predicting 2 costs $p(1\\mid x)C_{1,2}=3p$ with $p=p(1\\mid x)$, so we predict 1 iff $1-p<3p$, i.e. $p>1/4$. The values are $p=0.2,0.3,0.4$ for $x=1,2,3$, so $f^*(1)=2$ and $f^*(2)=f^*(3)=1$; $P[X=i]$ plays no role in the decision. The Bayes risk is $\\tfrac16\\cdot0.6+\\tfrac26\\cdot0.7+\\tfrac36\\cdot0.6=19/30$. Intuition: the threshold on the posterior moves away from $1/2$ towards the cheaper mistake. Trap: using the plain argmax of the posterior ignores the asymmetric costs.","category":"sl","kind":"exam","difficulty":"medium","tags":["Bayes estimator","cost-sensitive loss"],"origin":"in the style of COMP0078A7PE (2023), Q1a","status":"self-marked"},{"id":"m-sl-set-intersection-kernel","title":"A kernel between finite sets","prompt":"Let $X$ be a finite set and define $K:2^X\\times2^X\\to\\mathbb R$ by $K(A,B)=3^{|A\\cap B|}$. Prove that $K$ is a kernel. (Hint: look for a feature map indexed by subsets of $X$.) Then say whether $K'(A,B)=3^{|A\\cap B|}-1$ is also a kernel.","hints":["Use $\\sum_{C\\subseteq S}2^{|C|}=3^{|S|}$ (binomial theorem).","A function is a kernel iff it can be written as an inner product $\\langle\\phi(A),\\phi(B)\\rangle$ for some feature map."],"answer":"Take $\\phi_C(A)=2^{|C|/2}[C\\subseteq A]$ for $C\\subseteq X$; then $\\sum_C\\phi_C(A)\\phi_C(B)=\\sum_{C\\subseteq A\\cap B}2^{|C|}=3^{|A\\cap B|}$. $K'$ is also a kernel (drop the $C=\\emptyset$ feature).","answer_type":"free-text","solution":"Define features indexed by subsets $C\\in2^X$ by $\\phi_C(A)=2^{|C|/2}[C\\subseteq A]$. Then $\\sum_{C}\\phi_C(A)\\phi_C(B)=\\sum_C2^{|C|}[C\\subseteq A][C\\subseteq B]=\\sum_{C\\subseteq A\\cap B}2^{|C|}$. Grouping by size, this is $\\sum_{j=0}^{|A\\cap B|}\\binom{|A\\cap B|}{j}2^j=(1+2)^{|A\\cap B|}=3^{|A\\cap B|}$. So $K$ is an inner product in a finite-dimensional feature space, hence symmetric positive semi-definite, hence a kernel. For $K'$ the sum simply omits the $C=\\emptyset$ term (whose feature is constantly 1), so $K'(A,B)=\\sum_{C\\neq\\emptyset}\\phi_C(A)\\phi_C(B)$ is again a kernel. Intuition: the kernel counts weighted common sub-structures, as the ANOVA kernel does. Trap: checking PSD on a few examples is not a proof; either exhibit a feature map or use closure rules.","category":"sl","kind":"exam","difficulty":"medium","tags":["kernels","feature map","set kernel"],"origin":"in the style of COMP0078 sample exam, Q2b","status":"self-marked"},{"id":"m-sl-stumps-xor-weak-universal","title":"Decision stumps and the weak-learning condition","prompt":"Call a class $\\mathcal H$ weakly universal if for every generic data set (no point appears with two labels) and every weighting $D$ with $\\sum_iD_i=1$ there is $h\\in\\mathcal H$ whose weighted error is strictly below $1/2$. Let $\\mathcal H_{ds}=\\{s\\,h_{i,z}\\}$ be the signed decision stumps $h_{i,z}(x)=\\pm1$ according to $x_i\\le z$ or $x_i>z$. (a) Show that $\\mathcal H_{ds}$ is not weakly universal on $\\mathbb R^2$ by exhibiting a data set and weighting. (b) What does this mean for running AdaBoost with stumps on that data? (c) Why is $\\mathcal H_{ds}$ weakly universal on $\\mathbb R$?","hints":["Think of the XOR labelling of the four corners of the unit square.","In one dimension, compare the thresholds $z=x_{\\max}$ and $z$ just below it."],"answer":"XOR data $(0,0)\\mapsto-1,(0,1)\\mapsto+1,(1,0)\\mapsto+1,(1,1)\\mapsto-1$ with uniform weights: every signed stump has weighted error exactly $1/2$. AdaBoost then has $\\epsilon_1=1/2$, $\\alpha_1=0$ and stalls. In 1D a threshold at the largest point (or just below it) always gives error $\\ne1/2$ for some sign.","answer_type":"free-text","solution":"(a) Take the XOR set with $D_i=1/4$. A stump on coordinate $i$ either sends all four points to one side (then it predicts a constant and gets exactly two of four right), or splits them into two groups of two along one coordinate, and each group contains one $+1$ and one $-1$ point, so again exactly two are right. Hence every $\\pm h_{i,z}$ has weighted error exactly $1/2$ and none beats it. (b) AdaBoost's first round would have $\\epsilon_1=1/2$, so $\\alpha_1=\\tfrac12\\ln\\frac{1-\\epsilon_1}{\\epsilon_1}=0$ and the distribution never changes: boosting stalls although the data are separable by a small tree. (c) In 1D sort the points; the stump at $z=x_{\\max}$ predicts all $+1$, with error $e$. If $e\\ne1/2$ then use $\\pm$ to get below $1/2$. If $e=1/2$, moving the threshold just below $x_{\\max}$ flips only the last point and changes the error by $\\pm D_{\\max}\\neq0$, so one sign gives error $<1/2$. Trap: weak learning must hold for every distribution that boosting can produce, not only the uniform one.","category":"sl","kind":"exam","difficulty":"hard","tags":["boosting","weak learner","decision stump","XOR"],"origin":"in the style of COMP0078 sample exam, Q4","status":"self-marked"},{"id":"m-sl-passive-aggressive-online","title":"Passive versus aggressive updates in the mistake bound model","prompt":"An online algorithm is passive if it updates only after a mistake and aggressive if it updates on every trial. (a) Consider the halving algorithm run over a finite class $\\mathcal H$ containing the target. Suppose it also applies its update (removing the inconsistent hypotheses) on trials where its prediction is correct. Does the $\\log_2|\\mathcal H|$ mistake bound still hold? (b) Suppose the perceptron also applies $w\\leftarrow w+y_tx_t$ on correct trials. Can the Novikoff bound $(R/\\gamma)^2$ still be proved? Argue, and sketch a sequence that shows what goes wrong.","hints":["For (a) track how the version space shrinks on mistakes and whether the target is ever removed.","For (b) redo the two steps of the Novikoff proof: growth of $\\langle w,u\\rangle$ and growth of $\\|w\\|^2$. Which step used that a mistake occurred?"],"answer":"(a) Yes: extra removals only shrink the version space further and never remove the target; each mistake still halves it. (b) No: the bound on $\\|w\\|^2$ uses $y_t\\langle w_t,x_t\\rangle\\le0$, true only on mistakes. Playing many correct copies of $(1,\\varepsilon)$ then switching to $(1,-\\varepsilon)$ costs about $k$ mistakes for arbitrary $k$.","answer_type":"free-text","solution":"(a) Yes. On a mistake the majority was wrong, so at least half the version space is removed, giving at most $\\log_2|\\mathcal H|$ mistakes; the target is always consistent so it is never removed. Updating also on correct trials only removes more inconsistent hypotheses, so the potential $|V_t|$ is never larger and the same bound holds. (b) Novikoff: the numerator step $\\langle w_{t+1},u\\rangle\\ge\\langle w_t,u\\rangle+\\gamma$ holds on every update, but the denominator step $\\|w_{t+1}\\|^2=\\|w_t\\|^2+2y_t\\langle w_t,x_t\\rangle+\\|x_t\\|^2\\le\\|w_t\\|^2+R^2$ needs $y_t\\langle w_t,x_t\\rangle\\le0$, which is only guaranteed on mistakes. On correct trials the cross term is positive and $\\|w\\|$ can grow much faster than $R^2$ per step. Counterexample: $u=(0,1)$, $p=(1,\\varepsilon)$ labelled $+1$, $q=(1,-\\varepsilon)$ labelled $-1$ (margin $\\varepsilon$). After $k$ copies of $p$, $w=(k,k\\varepsilon)$; then each presentation of $q$ is a mistake that reduces $w_1$ by only 1, so about $k\\frac{1-\\varepsilon^2}{1+\\varepsilon^2}$ mistakes occur, unbounded in $k$ although $R^2/\\gamma^2$ is fixed. Moral: passive is not a technicality, the proof relies on updating only when wrong.","category":"sl","kind":"exam","difficulty":"hard","tags":["perceptron","halving","mistake bound","online learning"],"origin":"in the style of COMP0078A7PE (2023), Q5","status":"self-marked"},{"id":"m-sl-laplacian-zero-eigenvalues","title":"Graph Laplacian eigenvalues and spectral clustering","prompt":"Let $L=D-W$ be the Laplacian of a weighted undirected graph on $n$ vertices with non-negative weights. (a) Show that $L\\mathbf 1=0$ and that $u^\\top Lu=\\sum_{(i,j)\\in E}w_{ij}(u_i-u_j)^2$. (b) Suppose eigenvalue $0$ has multiplicity $3$ and every other eigenvalue is at least $c>0$. What can you say about the graph? Justify. (c) For a connected graph that you want to split in two, what is the role of the second eigenvector?","hints":["Use $D_{ii}=\\sum_jw_{ij}$ for (a), and when is $u^\\top Lu=0$?","For (c) the discrete problem is RatioCut; relax the two-valued indicator vector."],"answer":"(a) $(L\\mathbf1)_i=\\sum_jw_{ij}-\\sum_jw_{ij}=0$ and expanding the quadratic form gives the sum of squared differences. (b) $u^\\top Lu=0$ iff $u$ is constant on each connected component, so the graph has exactly 3 connected components, and the zero eigenvectors span their indicators. (c) The second eigenvector is the relaxed solution of RatioCut; its sign pattern gives the two clusters.","answer_type":"free-text","solution":"(a) $(L\\mathbf1)_i=D_{ii}-\\sum_jw_{ij}=0$, so $\\mu_1\\propto\\mathbf1$ with eigenvalue $0$. Also $u^\\top Lu=\\sum_iD_{ii}u_i^2-\\sum_{ij}w_{ij}u_iu_j=\\sum_{(i,j)\\in E}w_{ij}(u_i-u_j)^2\\ge0$, so $L$ is positive semi-definite. (b) $Lu=0$ implies $u^\\top Lu=0$, hence $u_i=u_j$ along every edge with positive weight, so $u$ is constant on each connected component; conversely the indicator of each component is in the null space. Therefore the multiplicity of the zero eigenvalue equals the number of components, here exactly $3$, and the gap $c$ says the components are internally well connected (no near-disconnections). (c) RatioCut asks for a cut with small weight relative to cluster sizes; this is a hard discrete problem on indicator vectors. Relaxing the indicator to a real vector orthogonal to $\\mathbf1$ with fixed norm and minimising $u^\\top Lu$ gives the second eigenvector (Fiedler vector); thresholding it (for instance by sign) gives the two clusters. Trap: it is only an approximation of the discrete optimum, and the unnormalised Laplacian relaxes RatioCut, not Ncut.","category":"sl","kind":"exam","difficulty":"medium","tags":["graph Laplacian","spectral clustering","semi-supervised"],"origin":"in the style of COMP0078A7PF (2024), Q5","status":"self-marked"},{"id":"m-sl-kernelised-gd","title":"Kernelising gradient descent","prompt":"Let $\\ell$ be differentiable and $M$-smooth in its first argument and consider $E_n(w)=\\frac1n\\sum_{i=1}^n\\ell(w^\\top x_i,y_i)$. (a) Write down gradient descent from $w_0=0$ with step size $\\eta$. (b) Show by induction that $w_t=\\sum_ic^{(t)}_ix_i$ and give the recursion for $c^{(t)}$. (c) How does this let you use a kernel with an infinite-dimensional feature map? (d) How does the convergence result for GD change in this setting?","hints":["The gradient of $\\ell(w^\\top x_i,y_i)$ with respect to $w$ is $\\ell'(w^\\top x_i,y_i)\\,x_i$.","Smoothness of $E_n$ is $M$ times the largest eigenvalue of $\\frac1nX^\\top X$, which equals that of $\\frac1nK$ for $K=XX^\\top$."],"answer":"$w_{t+1}=w_t-\\frac\\eta n\\sum_i\\ell'(w_t^\\top x_i,y_i)x_i$ so $c^{(t+1)}_i=c^{(t)}_i-\\frac\\eta n\\ell'\\big(\\sum_jc^{(t)}_jk(x_j,x_i),y_i\\big)$. Only the Gram matrix is needed, at $O(n^2)$ per step. Convergence is $O(1/T)$ for convex losses with smoothness $M\\lambda_{\\max}(K)/n$, independent of the feature dimension.","answer_type":"free-text","solution":"(a) $w_{t+1}=w_t-\\frac\\eta n\\sum_i\\ell'(w_t^\\top x_i,y_i)x_i$. (b) $w_0=0$ is in the span of the data. If $w_t=\\sum_jc^{(t)}_jx_j$ then $w_t^\\top x_i=\\sum_jc^{(t)}_j\\langle x_j,x_i\\rangle$ and the update adds multiples of the $x_i$, so $w_{t+1}$ is again in the span with $c^{(t+1)}_i=c^{(t)}_i-\\frac\\eta n\\ell'\\big(\\sum_jc^{(t)}_j\\langle x_j,x_i\\rangle,y_i\\big)$. (c) Everything depends on the data only through inner products, so replace $\\langle x_j,x_i\\rangle$ by $k(x_j,x_i)$: the iterate is $f_t=\\sum_ic^{(t)}_ik(x_i,\\cdot)$ in the RKHS and we never need $\\phi(x)$ explicitly, only the $n\\times n$ Gram matrix ($O(n^2)$ per step). (d) The objective is convex with gradient Lipschitz constant $M\\lambda_{\\max}(K)/n$, so with $\\eta\\le n/(M\\lambda_{\\max}(K))$ we get $E_n(w_T)-E_n(w^*)\\le\\|w^*\\|^2_{\\mathcal H}/(2\\eta T)$, which is $O(1/T)$ and has no dependence on the feature dimension. A linear rate would need strong convexity, which fails when $K$ is (nearly) singular, as for the Gaussian kernel; early stopping then acts as implicit regularisation.","category":"sl","kind":"exam","difficulty":"medium","tags":["gradient descent","kernels","representer"],"origin":"in the style of COMP0078A7PF (2024), Q3","status":"self-marked"},{"id":"m-sl-ridge-offset-centering","title":"Ridge with an unpenalised offset equals centring","prompt":"Consider $\\min_{w,b}\\ \\frac1n\\|Xw+b\\mathbf1-y\\|^2+\\lambda\\|w\\|^2$ with $b$ unpenalised. Show that $w^*$ also solves the ridge problem on centred data $X_c=X-\\mathbf1\\bar x^\\top$, $y_c=y-\\bar y\\mathbf1$, give closed forms for $w^*$ and $b^*$, and show the solution can be kernelised.","hints":["Set the derivative in $b$ to zero first and substitute back.","Check that $\\mathbf1$ is an eigenvector of $X_cX_c^\\top$ with eigenvalue 0."],"answer":"$b^*=\\bar y-\\bar x^\\top w^*$, and then the residual is $X_cw-y_c$, so $w^*=(X_c^\\top X_c+n\\lambda I)^{-1}X_c^\\top y_c$. With $c=(X_cX_c^\\top+n\\lambda I)^{-1}y_c$ we have $\\sum_ic_i=0$, so $\\langle w^*,x\\rangle=\\sum_ic_i\\langle x_i,x\\rangle$.","answer_type":"free-text","solution":"Setting $\\partial_b=\\frac2n\\mathbf1^\\top(Xw+b\\mathbf1-y)=0$ gives $b=\\bar y-\\bar x^\\top w$. Substituting, $Xw+b\\mathbf1-y=(X-\\mathbf1\\bar x^\\top)w-(y-\\bar y\\mathbf1)=X_cw-y_c$, so the objective in $w$ is exactly the centred ridge problem and $w^*$ solves it, with $w^*=(X_c^\\top X_c+n\\lambda I)^{-1}X_c^\\top y_c$ and $b^*=\\bar y-\\bar x^\\top w^*$. By the push-through identity $w^*=X_c^\\top c$ with $c=(X_cX_c^\\top+n\\lambda I)^{-1}y_c$. Since $X_cX_c^\\top\\mathbf1=0$ (rows of $X_c$ sum to zero in the data direction) and $\\mathbf1^\\top y_c=0$, the vector $y_c$ is orthogonal to the eigenvector $\\mathbf1$, so $c\\perp\\mathbf1$, i.e. $\\sum_ic_i=0$. Hence $\\langle w^*,x\\rangle=\\sum_ic_i\\langle x_i-\\bar x,x\\rangle=\\sum_ic_i\\langle x_i,x\\rangle$, which kernelises by replacing the inner product with $k$ (on centred Gram matrix). Trap: if you also penalised $b$ you would shrink the intercept towards zero, which depends on the arbitrary origin of $y$.","category":"sl","kind":"derivation","difficulty":"medium","tags":["ridge regression","centering","kernels"],"origin":"in the style of COMP0078A7PF (2024), Q1","status":"self-marked"},{"id":"m-sl-adaboost-exp-loss","title":"AdaBoost as greedy exponential-loss minimisation","prompt":"Derive AdaBoost as the greedy minimiser of the empirical exponential loss $\\frac1n\\sum_i e^{-y_if_T(x_i)}$ over $f_T=\\sum_{t\\le T}\\alpha_th_t$, $h_t\\in\\mathcal H\\subset\\{-1,1\\}^X$. Give the choice of $h_{t+1}$ and $\\alpha_{t+1}$, the update from $f_t$ to $f_{t+1}$, the resulting reweighting of examples, and the training-error bound.","hints":["Fix $f_t$ and minimise over $(\\alpha,h)$ only; define $D_t(i)\\propto e^{-y_if_t(x_i)}$.","Split the sum into correctly and incorrectly classified points."],"answer":"Greedy forward stagewise: $f_{t+1}=f_t+\\alpha_{t+1}h_{t+1}$ with $h_{t+1}$ minimising weighted error $\\epsilon_{t+1}$ and $\\alpha_{t+1}=\\tfrac12\\ln\\frac{1-\\epsilon_{t+1}}{\\epsilon_{t+1}}$. Weights update as $D_{t+1}(i)\\propto D_t(i)e^{-\\alpha y_ih(x_i)}$, and training error $\\le\\prod_t2\\sqrt{\\epsilon_t(1-\\epsilon_t)}$.","answer_type":"free-text","solution":"The loss is $\\ell(f(x),y)=e^{-yf(x)}$ and the strategy is forward stagewise: keep $f_t$ fixed and add one term, $f_{t+1}=f_t+\\alpha h$. Then $\\sum_ie^{-y_if_t(x_i)}e^{-\\alpha y_ih(x_i)}=W_t\\sum_iD_t(i)e^{-\\alpha y_ih(x_i)}$ with $D_t(i)=e^{-y_if_t(x_i)}/W_t$. With $\\epsilon=\\sum_iD_t(i)[h(x_i)\\ne y_i]$ this equals $W_t\\big[(1-\\epsilon)e^{-\\alpha}+\\epsilon e^{\\alpha}\\big]$, so for any $\\alpha>0$ the best $h$ minimises the weighted error $\\epsilon$. Setting the derivative in $\\alpha$ to zero gives $\\alpha=\\tfrac12\\ln\\frac{1-\\epsilon}{\\epsilon}$, and the minimum is $2\\sqrt{\\epsilon(1-\\epsilon)}W_t$. The weights become $D_{t+1}(i)=D_t(i)e^{-\\alpha y_ih(x_i)}/Z_t$ with $Z_t=2\\sqrt{\\epsilon_t(1-\\epsilon_t)}$, so misclassified points are upweighted. Since $[\\mathrm{sign}f_T\\ne y]\\le e^{-yf_T}$, the training error is at most $\\prod_tZ_t\\le\\exp(-2\\sum_t\\gamma_t^2)$ with $\\gamma_t=\\tfrac12-\\epsilon_t$. Trap: this is coordinate-wise greedy, not a joint optimum over all $\\alpha$'s, and exponential loss is very sensitive to noisy labels.","category":"sl","kind":"derivation","difficulty":"medium","tags":["AdaBoost","exponential loss","boosting"],"origin":"in the style of COMP0078A7PF (2024), Q2","status":"self-marked"},{"id":"m-sl-ogd-regret","title":"Regret of online (sub)gradient descent","prompt":"Let $\\ell_t$ be convex and run $\\theta_{t+1}=\\theta_t-\\eta g_t$ with $g_t\\in\\partial\\ell_t(\\theta_t)$. Prove that for every competitor $u$, $\\sum_t\\ell_t(\\theta_t)-\\sum_t\\ell_t(u)\\le\\frac{\\|u-\\theta_1\\|^2}{2\\eta}+\\frac\\eta2\\sum_t\\|g_t\\|^2$. If every $\\ell_t$ is $L$-Lipschitz, $\\theta_1=0$ and $\\|u\\|\\le B$, how should $\\eta$ be chosen and what regret follows?","hints":["Use the subgradient inequality $\\ell_t(u)\\ge\\ell_t(\\theta_t)+\\langle g_t,u-\\theta_t\\rangle$.","Expand $\\|\\theta_{t+1}-u\\|^2$ using the update rule."],"answer":"Per round: $\\ell_t(\\theta_t)-\\ell_t(u)\\le\\frac1{2\\eta}(\\|\\theta_t-u\\|^2-\\|\\theta_{t+1}-u\\|^2)+\\frac\\eta2\\|g_t\\|^2$; sum and telescope. With $\\|g_t\\|\\le L$, $\\eta=B/(L\\sqrt T)$ gives regret $\\le BL\\sqrt T$.","answer_type":"free-text","solution":"By convexity, $\\ell_t(\\theta_t)-\\ell_t(u)\\le\\langle g_t,\\theta_t-u\\rangle$. From the update, $\\|\\theta_{t+1}-u\\|^2=\\|\\theta_t-u\\|^2-2\\eta\\langle g_t,\\theta_t-u\\rangle+\\eta^2\\|g_t\\|^2$, so $\\langle g_t,\\theta_t-u\\rangle=\\frac1{2\\eta}(\\|\\theta_t-u\\|^2-\\|\\theta_{t+1}-u\\|^2)+\\frac\\eta2\\|g_t\\|^2$. Summing over $t=1,\\dots,T$ the first part telescopes to at most $\\frac1{2\\eta}\\|\\theta_1-u\\|^2$, after dropping the negative term $-\\|\\theta_{T+1}-u\\|^2/(2\\eta)$. With $\\theta_1=0$, $\\|u\\|\\le B$, $\\|g_t\\|\\le L$ the bound is $\\frac{B^2}{2\\eta}+\\frac{\\eta L^2T}{2}$, minimised at $\\eta=\\frac{B}{L\\sqrt T}$, giving regret at most $BL\\sqrt T$, which is sublinear. Intuition: a large step explores quickly but pays the noise term, a small step has a large distance term. Trap: $\\eta$ depends on $T$, $B$ and $L$ being known; otherwise use a doubling trick or decreasing $\\eta_t\\propto1/\\sqrt t$.","category":"sl","kind":"derivation","difficulty":"medium","tags":["online gradient descent","regret","subgradient"],"origin":"in the style of COMP0078A7PG (2025), Q5","status":"self-marked"},{"id":"m-sl-ridge-effective-dof","title":"Effective degrees of freedom of ridge","prompt":"A design matrix $X$ has singular values $4$, $2$ and $1$. For ridge regression $\\min_w\\|y-Xw\\|^2+\\lambda\\|w\\|^2$ with $\\lambda=4$, compute the effective degrees of freedom $\\mathrm{tr}\\big(X(X^\\top X+\\lambda I)^{-1}X^\\top\\big)$.","hints":["In the SVD basis each direction is shrunk by $s_j^2/(s_j^2+\\lambda)$; the trace is the sum of these factors."],"answer":"$1.5$","answer_type":"numeric","answer_value":1.5,"solution":"With $X=USV^\\top$ the hat matrix is $U\\,\\mathrm{diag}\\big(s_j^2/(s_j^2+\\lambda)\\big)U^\\top$, whose trace is $\\sum_js_j^2/(s_j^2+\\lambda)=\\frac{16}{20}+\\frac{4}{8}+\\frac15=0.8+0.5+0.2=1.5$. The three directions are retained at 80%, 50% and 20%, so the low-variance direction is shrunk most. As $\\lambda\\to0$ the value tends to $3$ (OLS) and as $\\lambda\\to\\infty$ to $0$. Trap: dividing by $s_j$ instead of $s_j^2$, or forgetting that $\\lambda$ multiplies the squared singular values.","category":"sl","kind":"calculation","difficulty":"easy","tags":["ridge","SVD","degrees of freedom"],"origin":"original","status":"verified","entry":"Enter the effective degrees of freedom, $\\mathrm{tr}\\big(X(X^\\top X+\\lambda I)^{-1}X^\\top\\big)$, for $\\lambda=4$."},{"id":"m-sl-adaboost-weight-update","title":"One AdaBoost round by hand","prompt":"AdaBoost starts with uniform weights on $n=10$ points. The first weak classifier misclassifies exactly $2$ of them. After the standard update (including renormalisation), what is the weight of each misclassified point?","hints":["Weighted error $\\epsilon=0.2$, so $\\alpha=\\tfrac12\\ln\\frac{1-\\epsilon}{\\epsilon}$; the normaliser is $Z=2\\sqrt{\\epsilon(1-\\epsilon)}$."],"answer":"$0.25$","answer_type":"numeric","answer_value":0.25,"solution":"The error is $\\epsilon=0.2$, so $\\alpha=\\tfrac12\\ln4=\\ln2$ and $e^{\\alpha}=2$, $e^{-\\alpha}=1/2$. The normaliser is $Z=0.8\\cdot\\frac12+0.2\\cdot2=0.8$ (which equals $2\\sqrt{0.16}$). A misclassified point has new weight $0.1\\cdot2/0.8=0.25$, and a correct one $0.1\\cdot\\frac12/0.8=0.0625$. Check: $2\\cdot0.25=0.5$ and $8\\cdot0.0625=0.5$. Key property: after the update the previous classifier has weighted error exactly $1/2$, so the next one must be different. Trap: forgetting to renormalise gives $0.2$.","category":"sl","kind":"calculation","difficulty":"easy","tags":["AdaBoost","weights"],"origin":"original","status":"verified","entry":"Enter the new normalised weight of each misclassified point after the first update, as a fraction of total weight 1 (not a percentage)."},{"id":"m-sl-knn-k-and-cover","title":"Choice of k in k-NN and the Cover bound","prompt":"True or false: 'larger $k$ in $k$-nearest neighbours leads to overfitting'? Explain the bias-variance effect of $k$. Then state the asymptotic ($n\\to\\infty$) error of 1-NN relative to the Bayes error for two classes, give a case where 1-NN is asymptotically Bayes-optimal, and say when $k$-NN is consistent.","hints":["Think of the two extremes $k=1$ and $k=n$.","Cover and Hart: $R^*\\le R_{1NN}\\le2R^*(1-R^*)$."],"answer":"False: larger $k$ smooths the boundary, lowering variance and raising bias, so it tends to underfit. Asymptotically $R^*\\le R_{1NN}\\le2R^*(1-R^*)\\le2R^*$; equality with $R^*$ when $R^*=0$ or classes are equiprobable at every $x$. $k$-NN is consistent when $k\\to\\infty$ and $k/n\\to0$.","answer_type":"free-text","solution":"False. $k=1$ gives a jagged boundary that interpolates the training set (low bias, high variance, overfitting); $k=n$ predicts the global majority class (high bias, zero variance, underfitting). Larger $k$ therefore gives smoother boundaries and tends to underfit, and $k$ is chosen by cross-validation. Cover and Hart: as $n\\to\\infty$ the 1-NN error satisfies $R^*\\le R_{1NN}\\le2R^*(1-R^*)\\le2R^*$ for two classes (for $C$ classes $R^*\\big(2-\\frac{C}{C-1}R^*\\big)$), i.e. at most twice the Bayes error. It meets the Bayes error when $R^*=0$ (deterministic labels), or when $p(y\\mid x)$ is uniform ($R^*=1-1/C$). $k$-NN is universally consistent if $k\\to\\infty$ and $k/n\\to0$. Trap: asymptotic guarantees say nothing about high dimension, where distances concentrate and the sample needed grows exponentially.","category":"sl","kind":"concept","difficulty":"easy","tags":["k-NN","bias-variance","Bayes error"],"origin":"in the style of COMP0078 sample exam, Q1","status":"self-marked"},{"id":"m-sl-svm-hinge-c","title":"Soft-margin SVM as regularised hinge loss","prompt":"Consider $\\min_{w,\\xi}\\ \\frac12\\|w\\|^2+C\\sum_i\\xi_i$ subject to $y_i\\langle w,x_i\\rangle\\ge1-\\xi_i$, $\\xi_i\\ge0$. Identify the regulariser and the loss, say how $C$ trades them off and what happens at the two extremes, and explain which points end up as support vectors.","hints":["Eliminate $\\xi_i=\\max(0,1-y_i\\langle w,x_i\\rangle)$.","In the dual $0\\le\\alpha_i\\le C$."],"answer":"Eliminating $\\xi$ gives $\\min_w\\ \\sum_i\\max(0,1-y_i\\langle w,x_i\\rangle)+\\frac1{2C}\\|w\\|^2$: hinge loss plus an $\\ell_2$ regulariser with coefficient $1/C$. Large $C$ approaches hard-margin (low bias, high variance); small $C$ gives a wide margin and underfits. Support vectors are points on or inside the margin or misclassified.","answer_type":"free-text","solution":"At the optimum $\\xi_i=\\max(0,1-y_i\\langle w,x_i\\rangle)$, so the problem is $\\min_w\\sum_iV_{\\rm hinge}(y_i,\\langle w,x_i\\rangle)+\\frac1{2C}\\|w\\|^2$. The loss is the hinge loss (a convex upper bound on the 0-1 loss) and the regulariser is the squared norm, equivalent to maximising the margin $1/\\|w\\|$, with regularisation strength $1/C$. Large $C$ penalises margin violations heavily, approaching the hard-margin SVM that needs separable data and is sensitive to outliers; small $C$ tolerates many violations and gives a wide margin, which can underfit. In the dual $0\\le\\alpha_i\\le C$: $\\alpha_i=0$ for points beyond the margin, $0<\\alpha_i<C$ for points exactly on the margin, and $\\alpha_i=C$ for margin violators, and $w=\\sum_i\\alpha_iy_ix_i$ depends only on the support vectors. Trap: with an offset $b$, do not regularise it; folding $b$ into $w$ changes the problem.","category":"sl","kind":"concept","difficulty":"medium","tags":["SVM","hinge loss","regularisation"],"origin":"in the style of COMP0078 sample exam, Q3a","status":"self-marked"},{"id":"m-sl-boosting-vs-bagging-noise","title":"Noisy labels: AdaBoost or random forest?","prompt":"You are asked to build a classifier on tabular data where you suspect about $10$-$15\\%$ of the labels are wrong. AdaBoost with depth-3 trees reaches near-zero training error but validation error rises after about $50$ rounds, while a random forest on the same features is flatter and better on validation. Explain why, and what you would try to make boosting competitive.","hints":["Look at what the exponential loss does to examples with large negative margin.","Compare which of bias or variance each method mainly reduces."],"answer":"AdaBoost's exponential loss keeps upweighting persistently misclassified (mislabelled) points, so later learners fit noise and the margin distribution is distorted. Bagging and random forests average high-variance learners and are insensitive to individual labels. To rescue boosting: early stopping, shrinkage, shallower trees or subsampling, and a robust loss (logistic or Huber).","answer_type":"free-text","solution":"Boosting reduces bias by sequentially focusing on hard points, with weights $D_t(i)\\propto e^{-y_if_t(x_i)}$. A mislabelled point always has a large negative margin, so its weight grows exponentially and the weak learners spend capacity memorising noise, which is the validation curve rising after about $50$ rounds. Bagging and random forests reduce variance by averaging decorrelated deep trees on bootstrap samples, with no reweighting, so a noisy label only affects a fraction of trees. To fix boosting: pick the number of rounds by validation or cross-validation (early stopping), use a small learning rate (shrinkage) and shallow trees, subsample rows and columns (stochastic gradient boosting), and replace the exponential loss with a loss that grows linearly for large negative margins, such as logistic loss or Huber, or clean labels first. Also check that the base learner is genuinely weak, and compare calibrated metrics rather than accuracy alone. Trap: concluding that boosting is simply worse; with regularisation it often beats forests on clean data.","category":"sl","kind":"scenario","difficulty":"medium","tags":["boosting","bagging","label noise","scenario"],"origin":"original","status":"self-marked"},{"id":"m-sl-fixed-share-drift","title":"Forecasting under drift: Hedge or fixed share?","prompt":"You combine $n=5$ forecasting models online over $T=1000$ rounds. The best model changes a few times (you expect about $k=4$ switches) as the regime shifts. Plain Hedge's weights end up stuck on a model that was best early on. What do you change, how do you set the parameter, and why does a larger expected number of switches mean a larger parameter?","hints":["Fixed share mixes a fraction $\\alpha$ of the total weight back uniformly each round.","The recommended tuning is $\\alpha\\approx k/(T-1)$."],"answer":"Use fixed share: after the Hedge update, redistribute a fraction $\\alpha$ of weight uniformly so no model's weight collapses and recovery after a switch is fast. Set $\\alpha\\approx k/(T-1)=4/999\\approx0.004$. More switches need a larger $\\alpha$; the bound pays about $k\\ln(nT)$ rather than $\\ln n$.","answer_type":"free-text","solution":"Hedge competes only with the best fixed expert: after a long stretch the weight of an earlier-good model is tiny, so a new regime needs many rounds to recover. Fixed share competes with the best sequence of experts with $k$ switches: after each multiplicative update it sets $w_i\\leftarrow(1-\\alpha)w_i+\\frac{\\alpha}{n-1}\\sum_{j\\ne i}w_j$, so every model keeps at least a fraction about $\\alpha/n$ of the weight and can regain mass within a few rounds. Tuning follows from the shifting bound, which pays roughly $k\\ln\\frac1\\alpha+T\\alpha$ in addition to $\\ln n$, minimised at $\\alpha=k/(T-1)\\approx0.004$ here, so the extra cost is about $k\\ln(nT)$ against $\\ln n$ for Hedge. A scenario with more switches therefore needs a larger $\\alpha$ (the true switching rate), while a stable environment needs a smaller one. Also tune the Hedge learning rate $\\eta$ and monitor cumulative loss against each expert. Trap: setting $\\alpha$ too large makes the algorithm forget useful history; too small recovers slowly.","category":"sl","kind":"scenario","difficulty":"medium","tags":["fixed share","Hedge","tracking the best expert","scenario"],"origin":"in the style of COMP0078 sample exam, Q8b","status":"self-marked"},{"id":"m-pul-uniform-pareto-conjugate","title":"Conjugate prior for a uniform upper limit","prompt":"A random-number device outputs $t\\sim\\mathrm{Uniform}(0,\\theta)$ with unknown upper limit $\\theta$; you observe $n$ independent outputs $t_1,\\dots,t_n$. (a) Write the likelihood and the maximum-likelihood estimate of $\\theta$. Is it unbiased? (b) Show that the Pareto-type density $p(\\theta)=\\frac{1}{Z(\\theta_0,k)}\\Theta(\\theta-\\theta_0)\\theta^{-k}$ is conjugate and find $Z$. (c) Give the posterior and the MAP estimate. With $n=4$, $\\max_it_i=3.4$, $\\theta_0=3$ and $k=2.5$, what are the MAP estimate and the posterior mean? (d) You wonder whether each of $n$ devices has its own limit drawn independently from the same prior, rather than one shared $\\theta$. Write both marginal likelihoods, and say which model is favoured if all $n$ readings are identical.","hints":["The likelihood is $\\theta^{-n}$ times an indicator that $\\theta\\ge\\max_it_i$.","The posterior is again Pareto-type with $k\\to k+n$ and $\\theta_0\\to\\max(\\theta_0,\\max_it_i)$."],"answer":"Likelihood $\\theta^{-n}\\Theta(\\theta-t_{\\max})$, MLE $t_{\\max}$ (biased low: $\\mathbb E=\\frac{n}{n+1}\\theta$). $Z=\\theta_0^{1-k}/(k-1)$ for $k>1$. Posterior has $k'=n+k$ and $\\theta_0'=\\max(\\theta_0,t_{\\max})$; MAP $=\\theta_0'=3.4$, posterior mean $\\frac{k'-1}{k'-2}\\theta_0'\\approx4.16$. If all readings are identical the single shared $\\theta$ model is favoured.","answer_type":"free-text","solution":"(a) $p(t_{1:n}\\mid\\theta)=\\theta^{-n}\\Theta(\\theta-t_{\\max})$, maximised at $\\hat\\theta=t_{\\max}$; since $t_{\\max}<\\theta$ almost surely and $\\mathbb E[t_{\\max}]=\\frac{n}{n+1}\\theta$, the MLE is biased low (it is a sensible estimate only for large $n$). (b) Multiplying prior and likelihood gives $\\Theta(\\theta-\\theta_0')\\theta^{-(k+n)}$ with $\\theta_0'=\\max(\\theta_0,t_{\\max})$, the same form, so the family is conjugate; $Z(\\theta_0,k)=\\int_{\\theta_0}^\\infty\\theta^{-k}d\\theta=\\frac{\\theta_0^{1-k}}{k-1}$ for $k>1$. (c) Posterior: $\\mathrm{Pareto}(\\theta_0',k'=k+n)$, with mode $\\theta_0'$, which is exactly the MAP, and mean $\\frac{k'-1}{k'-2}\\theta_0'$. Here $k'=6.5$, $\\theta_0'=3.4$, so MAP $=3.4$ and mean $=\\frac{5.5}{4.5}\\cdot3.4\\approx4.16$. (d) Shared $\\theta$: $\\frac{Z(\\theta_0',n+k)}{Z(\\theta_0,k)}=\\frac{(k-1)\\theta_0^{k-1}\\theta_0'^{\\,1-n-k}}{n+k-1}$. Independent limits: $\\prod_i\\frac{Z(\\max(\\theta_0,t_i),1+k)}{Z(\\theta_0,k)}=\\prod_i\\frac{(k-1)\\theta_0^{k-1}\\max(\\theta_0,t_i)^{-k}}{k}$. With identical readings $\\tau>\\theta_0$ the ratio shared/independent is $(\\tau/\\theta_0)^{(n-1)(k-1)}\\frac{k^n}{(n+k-1)(k-1)^{n-1}}$, which grows with $n$: the shared-$\\theta$ model is favoured (Occam: it would be a big coincidence for $n$ independent limits to produce identical readings). Trap: the prior hyperparameters enter the posterior only through the max and the count.","category":"pul","kind":"exam","difficulty":"hard","tags":["conjugate prior","Bayesian model comparison","uniform","Pareto"],"origin":"in the style of COMP0086 2018, Q1 and COMP0086 2020, Q1","status":"self-marked"},{"id":"m-pul-tempered-em","title":"EM with a tempered free energy","prompt":"For a latent variable model with data $X$, latents $Z$ and parameters $\\theta$, the free energy is $F(\\theta,q)=\\langle\\log P(X,Z\\mid\\theta)\\rangle_q+H[q]$. (a) Prove $F\\le\\log P(X\\mid\\theta)$ and say when equality holds. (b) For $T>0$ define $F_T(\\theta,q)=\\langle\\log P(X,Z\\mid\\theta)\\rangle_q+T\\,H[q]$ and maximise it alternately over $q$ and $\\theta$. Derive the E- and M-steps and the value of $F_T$ after the E-step. (c) For a mixture of two Gaussians with identity covariances and parameters $\\{\\mu_m,\\pi_m\\}$, give the tempered responsibilities and describe the limits $T\\to0$ and $T\\to\\infty$.","hints":["For (a) write $\\log P(X\\mid\\theta)-F=\\mathrm{KL}(q\\,\\|\\,P(Z\\mid X,\\theta))$.","For (b) add a Lagrange multiplier for $\\sum_Zq(Z)=1$ and solve $\\log P-T\\log q+\\text{const}=0$."],"answer":"(a) $\\log P(X|\\theta)-F=\\mathrm{KL}(q\\|P(Z|X,\\theta))\\ge0$, tight at $q=P(Z|X,\\theta)$. (b) E-step: $q\\propto P(X,Z|\\theta)^{1/T}$ (tempered posterior); M-step: same as standard EM with this $q$; $F_T(q^*)=T\\log\\sum_ZP(X,Z|\\theta)^{1/T}$. (c) $r_{im}\\propto\\pi_m^{1/T}e^{-\\|x_i-\\mu_m\\|^2/(2T)}$; $T\\to0$ gives hard assignments (k-means-like), $T\\to\\infty$ uniform responsibilities.","answer_type":"free-text","solution":"(a) $F=\\langle\\log P(X\\mid\\theta)+\\log P(Z\\mid X,\\theta)\\rangle_q-\\langle\\log q\\rangle_q=\\log P(X\\mid\\theta)-\\mathrm{KL}(q\\|P(Z\\mid X,\\theta))$, so $F\\le\\log P(X\\mid\\theta)$ with equality iff $q$ is the exact posterior. (b) Maximising $F_T$ over $q$ with a multiplier for normalisation gives $\\log P(X,Z\\mid\\theta)-T\\log q-T+\\lambda=0$, so $q^*(Z)\\propto P(X,Z\\mid\\theta)^{1/T}\\propto P(Z\\mid X,\\theta)^{1/T}$, a flattened (tempered) posterior. The M-step maximises $\\langle\\log P(X,Z\\mid\\theta)\\rangle_q$, the same expression as in ordinary EM with this different $q$ (the factor $T$ on the entropy plays no role in $\\theta$). After the E-step $F_T=T\\log\\sum_ZP(X,Z\\mid\\theta)^{1/T}$, which is a smoothed version of the log-likelihood and equals it at $T=1$. (c) $r_{im}\\propto\\pi_m^{1/T}\\exp\\!\\big(-\\|x_i-\\mu_m\\|^2/(2T)\\big)$, with M-steps $\\mu_m=\\sum_ir_{im}x_i/\\sum_ir_{im}$ and $\\pi_m=\\sum_ir_{im}/N$. As $T\\to0$ the responsibilities become hard assignments (k-means-like); as $T\\to\\infty$ they become uniform and all means coincide with the data mean. Starting hot and cooling slowly is deterministic annealing and helps avoid poor local optima. Trap: for $T\\ne1$ $F_T$ is no longer a bound on the log-likelihood, so monotone increase of the likelihood is not guaranteed.","category":"pul","kind":"exam","difficulty":"hard","tags":["EM","free energy","deterministic annealing","mixture of Gaussians"],"origin":"in the style of COMP0086 2021, Q1","status":"self-marked"},{"id":"m-pul-importance-sampling-optimal-q","title":"Variance of importance sampling and the optimal proposal","prompt":"Let $x_1,\\dots,x_m\\sim q$ i.i.d. and $F_m=\\frac1m\\sum_if(x_i)\\frac{p(x_i)}{q(x_i)}$ estimate $\\mathbb E_p[f]$. (a) Show $\\mathrm{Var}_q[F_m]=\\frac1m\\big(\\mathbb E_q[f^2p^2/q^2]-\\mathbb E_p[f]^2\\big)$. (b) Show $\\mathrm{Var}_q[F_m]\\ge\\frac1m\\big(\\mathbb E_p[|f|]^2-\\mathbb E_p[f]^2\\big)$. (c) For which $q$ is the bound attained, and why is this proposal not usable directly? (d) Let $p\\propto\\tilde p$ be a Gaussian restricted to the unit ball $B\\subset\\mathbb R^D$, with unknown normaliser. Propose an estimator of $\\mathbb E_p[f]$ using i.i.d. uniform draws from $[-1,1]^D$ that needs no normaliser, and explain what goes wrong as $D$ grows.","hints":["Variance of an average of i.i.d. terms is the variance of one term over $m$.","Apply Jensen (or Cauchy-Schwarz) to $\\mathbb E_q[(f p/q)^2]\\ge(\\mathbb E_q|fp/q|)^2$."],"answer":"(c) $q^*(x)=|f(x)|p(x)/\\mathbb E_p|f|$. It needs the very normaliser $\\mathbb E_p|f|$ you are trying to compute (and gives zero variance if $f\\ge0$). (d) Self-normalised estimator $\\sum_if(x_i)\\tilde p(x_i)\\mathbb 1[x_i\\in B]/\\sum_i\\tilde p(x_i)\\mathbb 1[x_i\\in B]$; the fraction of cube samples inside the ball shrinks like $\\pi^{D/2}/(\\Gamma(D/2+1)2^D)$, so almost all draws are wasted.","answer_type":"free-text","solution":"(a) The terms $f(x_i)w(x_i)$ with $w=p/q$ are i.i.d. with mean $\\mathbb E_q[fw]=\\mathbb E_p[f]$, so $\\mathrm{Var}[F_m]=\\frac1m\\big(\\mathbb E_q[f^2w^2]-\\mathbb E_p[f]^2\\big)$. (b) By Jensen, $\\mathbb E_q[(fw)^2]\\ge(\\mathbb E_q|fw|)^2=(\\mathbb E_p|f|)^2$, which gives the bound. (c) Equality in Jensen needs $|f|w$ constant, i.e. $q^*(x)=|f(x)|p(x)/\\mathbb E_p|f|$. For $f\\ge0$ the variance is then zero, but the optimal $q^*$ contains the integral $\\mathbb E_p[f]$ we want, so it is only a guide: put proposal mass where $|f|p$ is large, which is why importance sampling for rare events needs a shifted proposal. (d) With $\\tilde p$ the unnormalised truncated density and $w_i=\\tilde p(x_i)\\mathbb 1[x_i\\in B]$ (the uniform density cancels), use the self-normalised estimator $\\hat\\mu=\\sum_if(x_i)w_i/\\sum_iw_i$, which is consistent with $O(1/n)$ bias and never needs $Z_p$. In high dimension the ball occupies the fraction $\\pi^{D/2}/(\\Gamma(D/2+1)2^D)$ of the cube (about $0.25\\%$ for $D=10$ and astronomically small beyond), so almost every draw has zero weight and the effective sample size collapses. Trap: self-normalising trades unbiasedness for not needing $Z$.","category":"pul","kind":"exam","difficulty":"medium","tags":["importance sampling","variance","optimal proposal","Monte Carlo"],"origin":"in the style of COMP0086 2021, Q2","status":"self-marked"},{"id":"m-pul-chow-liu-trees","title":"Learning tree-structured models (Chow-Liu)","prompt":"You have $m$ i.i.d. joint observations of $n$ discrete variables with empirical marginals $d_i(x_i)$ and pairwise empirical marginals $d_{ij}(x_i,x_j)$. (a) For a fixed tree $T$ show that the maximum-likelihood factors are the empirical marginals $p_i=d_i$, $p_{ij}=d_{ij}$ and that the average log-likelihood is then $-\\sum_iH(X_i)+\\sum_{(ij)\\in T}\\mathrm{MI}(X_i;X_j)$. (b) Show that the maximum-likelihood tree is a maximum-weight spanning tree with edge weights $\\mathrm{MI}(X_i;X_j)$. (c) With independent Dirichlet priors on the root marginal and on each conditional table, satisfying local consistency $\\sum_{x_i}\\alpha_{ij}(x_i,x_j)=\\alpha_j(x_j)$ and $\\sum_{x_j}\\alpha_{ij}(x_i,x_j)=\\alpha_i(x_i)$, what are the edge weights for the maximum marginal-likelihood tree?","hints":["A tree distribution factorises as $p(x)=\\prod_ip_i(x_i)\\prod_{(ij)}\\frac{p_{ij}(x_i,x_j)}{p_i(x_i)p_j(x_j)}$.","Each local term $\\sum d\\log p$ is maximised by setting $p=d$ (Gibbs' inequality); then regroup into entropies and mutual informations."],"answer":"(a) Writing the tree likelihood in terms of marginals, the average log-likelihood is $\\sum_i\\sum_{x_i}d_i\\log p_i+\\sum_{(ij)}\\sum d_{ij}\\log\\frac{p_{ij}}{p_ip_j}$, maximised by $p=d$ (Gibbs' inequality), giving $-\\sum H+\\sum\\mathrm{MI}$. (b) $\\sum_iH(X_i)$ does not depend on the tree, so maximise $\\sum_{(ij)\\in T}\\mathrm{MI}$: max-weight spanning tree (Kruskal or Prim). (c) $w_{ij}=\\sum_{x_i,x_j}\\log\\frac{\\Gamma(\\alpha_{ij}+md_{ij})}{\\Gamma(\\alpha_{ij})}-\\sum_{x_i}\\log\\frac{\\Gamma(\\alpha_i+md_i)}{\\Gamma(\\alpha_i)}-\\sum_{x_j}\\log\\frac{\\Gamma(\\alpha_j+md_j)}{\\Gamma(\\alpha_j)}$, again a max-weight spanning tree.","answer_type":"free-text","solution":"(a) A tree model factorises as $p(x)=\\prod_ip_i(x_i)\\prod_{(ij)\\in T}\\frac{p_{ij}(x_i,x_j)}{p_i(x_i)p_j(x_j)}$, so the average log-likelihood under the data is $\\sum_i\\sum_{x_i}d_i\\log p_i+\\sum_{(ij)}\\sum_{x_i,x_j}d_{ij}\\log\\frac{p_{ij}}{p_ip_j}$. Each local term is a cross-entropy maximised at the empirical marginals (Gibbs' inequality, subject to consistency of marginals, which a tree allows), giving $\\sum_i\\sum d_i\\log d_i+\\sum_{(ij)}\\sum d_{ij}\\log\\frac{d_{ij}}{d_id_j}=-\\sum_iH(X_i)+\\sum_{(ij)}\\mathrm{MI}(X_i;X_j)$. (b) The entropy term does not depend on $T$, so maximising over trees means maximising $\\sum_{(ij)\\in T}\\mathrm{MI}$: a maximum-weight spanning tree, found by Kruskal or Prim in $O(n^2\\log n)$ after computing the pairwise MIs. (c) Integrating the Dirichlet-multinomial tables gives a product of Gamma-function ratios; with local consistency the root terms plus the child terms can be rearranged as $\\sum_k\\text{(node term)}+\\sum_{(ij)}w_{ij}$ with $w_{ij}$ as above, symmetric in $i,j$ and independent of root choice, so the best tree is again a maximum-weight spanning tree. Intuition: the likelihood always prefers more information, the marginal likelihood adds an Occam penalty through the node terms. Trap: Chow-Liu is exact only for trees; for general graphs structure learning is NP-hard.","category":"pul","kind":"exam","difficulty":"hard","tags":["tree-structured models","mutual information","spanning tree","Dirichlet"],"origin":"in the style of COMP0086 2018, Q4 and COMP0086 2020, Q4","status":"self-marked"},{"id":"m-pul-mh-gaussian-dimension","title":"Metropolis-Hastings step size and dimension","prompt":"Run random-walk Metropolis-Hastings on the target $p=\\mathcal N(0,\\sigma^2I_D)$ with proposal $q(z\\mid y)=\\mathcal N(y,\\tau^2I_D)$. (a) Show $\\mathbb E_{z\\sim q(\\cdot|y)}\\big[\\log\\frac{p(z)}{p(y)}\\big]=-\\frac{D\\tau^2}{2\\sigma^2}$. (b) Explain what this implies for the efficiency of the sampler for $D=2$ with $\\tau\\gg\\sigma$ and $\\tau\\ll\\sigma$, and for large $D$. (c) How should $\\tau$ scale with $D$?","hints":["Write $z=y+\\tau\\epsilon$ with $\\epsilon\\sim\\mathcal N(0,I)$ and compute $\\mathbb E\\|z\\|^2$.","The acceptance probability is $\\min(1,p(z)/p(y))$ because the proposal is symmetric."],"answer":"$\\log\\frac{p(z)}{p(y)}=-\\frac{\\|z\\|^2-\\|y\\|^2}{2\\sigma^2}$ and $\\mathbb E\\|z\\|^2=\\|y\\|^2+D\\tau^2$, giving $-\\frac{D\\tau^2}{2\\sigma^2}$. A typical proposal lowers the density by an amount growing with $D\\tau^2/\\sigma^2$, so to keep acceptance reasonable $\\tau\\propto\\sigma/\\sqrt D$, and the number of steps to traverse the target grows like $D$.","answer_type":"free-text","solution":"(a) $\\log\\frac{p(z)}{p(y)}=-\\frac{\\|z\\|^2-\\|y\\|^2}{2\\sigma^2}$. With $z=y+\\tau\\epsilon$, $\\mathbb E\\|z\\|^2=\\|y\\|^2+2\\tau\\,y^\\top\\mathbb E\\epsilon+\\tau^2\\mathbb E\\|\\epsilon\\|^2=\\|y\\|^2+D\\tau^2$, so the expected log ratio is $-\\frac{D\\tau^2}{2\\sigma^2}$. (b) For $D=2$: if $\\tau\\gg\\sigma$ the expected log ratio is very negative, so most proposals land in the tails and are rejected and the chain barely moves; if $\\tau\\ll\\sigma$ nearly all proposals are accepted but each step is tiny, so exploration is a slow random walk (diffusive, about $(\\sigma/\\tau)^2$ steps to cross the target). For large $D$ the drift $-D\\tau^2/(2\\sigma^2)$ is large unless $\\tau$ is tiny, so even moderate $\\tau/\\sigma$ gives acceptance near zero. (c) Keeping the drift $O(1)$ requires $\\tau=O(\\sigma/\\sqrt D)$; the chain then needs $O(D)$ steps to move a distance comparable with $\\sigma\\sqrt D$, and the optimal acceptance rate is about $0.234$ for large $D$. Trap: tuning the acceptance rate to near $100\\%$ or near $0\\%$ is a sign of a bad step size, not a good sampler.","category":"pul","kind":"exam","difficulty":"medium","tags":["MCMC","Metropolis-Hastings","step size","curse of dimensionality"],"origin":"in the style of COMP0086 2021, Q4(e,f)","status":"self-marked"},{"id":"m-pul-fa-latent-covariance-identity","title":"Factor analysis: posterior second moments average to the identity","prompt":"Factor analysis: $y\\sim\\mathcal N(0,I)$, $x\\mid y\\sim\\mathcal N(Ay,\\Psi)$ with zero-mean data $x_1,\\dots,x_N$. Let $\\beta=A^\\top(AA^\\top+\\Psi)^{-1}$, $\\Sigma=I-\\beta A$ be the posterior covariance, and $\\mu_n=\\beta x_n$ the posterior mean. Show that at a maximum-likelihood solution (a fixed point of EM), $\\frac1N\\sum_n\\mathbb E[y_ny_n^\\top\\mid x_n]=I$. Interpret the result.","hints":["$\\mathbb E[yy^\\top\\mid x]=\\Sigma+\\beta xx^\\top\\beta^\\top$. The M-step for $A$ is $A=\\big(\\sum_nx_n\\mu_n^\\top\\big)\\big(\\sum_n\\mathbb E[y_ny_n^\\top|x_n]\\big)^{-1}$.","Let $M=\\Sigma+\\beta S\\beta^\\top$ with $S=\\frac1N\\sum_nx_nx_n^\\top$, and multiply the stationarity equation by $\\beta$."],"answer":"Stationarity in $A$ gives $S\\beta^\\top=AM$ with $M=\\Sigma+\\beta S\\beta^\\top$. Left-multiplying by $\\beta$ and using $\\beta A=I-\\Sigma$ gives $M-\\Sigma=(I-\\Sigma)M$, so $\\Sigma M=\\Sigma$ and $M=I$ because $\\Sigma$ is invertible.","answer_type":"free-text","solution":"The M-step update for $A$ is $A=\\big(\\sum_nx_n\\mu_n^\\top\\big)\\big(\\sum_n\\mathbb E[y_ny_n^\\top\\mid x_n]\\big)^{-1}$; at a fixed point $A$ equals its own update, so $\\frac1N\\sum_nx_n\\mu_n^\\top=A\\,M$ with $M=\\frac1N\\sum_n\\mathbb E[y_ny_n^\\top|x_n]=\\Sigma+\\beta S\\beta^\\top$. Since $\\mu_n=\\beta x_n$, the left side is $S\\beta^\\top$, hence $S\\beta^\\top=AM$. Multiply on the left by $\\beta$: $\\beta S\\beta^\\top=\\beta AM=(I-\\Sigma)M$. Substituting into $M=\\Sigma+\\beta S\\beta^\\top$ gives $M=\\Sigma+(I-\\Sigma)M$, i.e. $\\Sigma M=\\Sigma$. $\\Sigma=(I+A^\\top\\Psi^{-1}A)^{-1}$ is positive definite, hence invertible, so $M=I$. Intuition: at the optimum the average posterior second moment of the latents matches their prior covariance, the same moment-matching condition as for a good fit of the marginal. Trap: this holds only at a stationary point and for centred data; away from it $M\\ne I$.","category":"pul","kind":"derivation","difficulty":"hard","tags":["factor analysis","EM","latent variable models"],"origin":"in the style of COMP0086 2018, Q2(e)","status":"self-marked"},{"id":"m-pul-em-gradient-direction","title":"Is the exact M-step aligned with the gradient?","prompt":"For a latent variable model with $\\ell(\\theta)=\\log\\int P(X,Z\\mid\\theta)\\,dZ$, free energy $F(\\theta,q)=\\langle\\log P(X,Z\\mid\\theta)\\rangle_q+H[q]$: (a) Show that after an exact E-step at $\\theta_0$ (i.e. $q=P(Z\\mid X,\\theta_0)$) the gradient of $F$ with respect to $\\theta$ at $\\theta_0$ equals $\\nabla_\\theta\\ell(\\theta_0)$. (b) For a mixture of spherical unit-variance Gaussians with responsibilities $r_{nk}$ compute the exact M-step for $\\mu_k$ and the gradient of $\\ell$ with respect to $\\mu_k$, and show the step is along the gradient. (c) Is that true in general?","hints":["$\\nabla\\ell=\\frac{\\int\\nabla P(X,Z|\\theta)\\,dZ}{P(X|\\theta)}$ and $\\nabla P=P\\,\\nabla\\log P$.","For (c) consider a Gaussian component with its own covariance $\\Sigma_k$."],"answer":"(a) $\\nabla_\\theta F|_{\\theta_0}=\\langle\\nabla\\log P(X,Z|\\theta_0)\\rangle_{P(Z|X,\\theta_0)}=\\nabla\\ell(\\theta_0)$. (b) $\\mu_k^{\\rm new}=\\sum_nr_{nk}x_n/R_k$ and $\\nabla_{\\mu_k}\\ell=\\sum_nr_{nk}(x_n-\\mu_k)=R_k(\\mu_k^{\\rm new}-\\mu_k)$, so the step is parallel to the gradient. (c) No: with general covariance the step is $\\Sigma_k\\nabla/R_k$ (a preconditioned direction), and for other parameters (e.g. $A$ in factor analysis) the direction differs from the gradient.","answer_type":"free-text","solution":"(a) With $q=P(Z\\mid X,\\theta_0)$, $\\nabla_\\theta F\\big|_{\\theta_0}=\\int P(Z|X,\\theta_0)\\nabla_\\theta\\log P(X,Z|\\theta_0)\\,dZ$. Meanwhile $\\nabla\\ell=\\frac{1}{P(X|\\theta_0)}\\int\\nabla_\\theta P(X,Z|\\theta_0)\\,dZ=\\int\\frac{P(X,Z|\\theta_0)}{P(X|\\theta_0)}\\nabla\\log P(X,Z|\\theta_0)\\,dZ$, the same quantity. (Equivalently, $\\ell-F=\\mathrm{KL}\\ge0$ is minimal (zero) at $\\theta_0$, so its gradient there vanishes.) (b) The M-step maximises $\\sum_nr_{nk}\\big(-\\tfrac12\\|x_n-\\mu_k\\|^2\\big)$ giving $\\mu_k^{\\rm new}=\\sum_nr_{nk}x_n/R_k$ with $R_k=\\sum_nr_{nk}$. The gradient is $\\nabla_{\\mu_k}\\ell=\\sum_nr_{nk}(x_n-\\mu_k)=R_k(\\mu_k^{\\rm new}-\\mu_k)$. So the exact M-step moves $\\mu_k$ exactly along the gradient, with step size $1/R_k$. (c) No. For a component with covariance $\\Sigma_k$, $\\nabla_{\\mu_k}\\ell=\\Sigma_k^{-1}R_k(\\mu_k^{\\rm new}-\\mu_k)$, so the M-step is $\\Sigma_k\\nabla/R_k$, a rotated and rescaled (Newton-like) direction, and for coupled parameters such as the loadings in factor analysis the exact M-step is again not parallel to the gradient. EM is therefore a preconditioned gradient method with an automatically chosen step size and guaranteed monotone increase, which is why it often beats plain gradient ascent at first but can be slow near flat optima.","category":"pul","kind":"derivation","difficulty":"medium","tags":["EM","free energy","gradient","mixture of Gaussians"],"origin":"in the style of COMP0086 2019, Q3","status":"self-marked"},{"id":"m-pul-mixture-linear-experts-mstep","title":"M-step for a mixture of linear experts","prompt":"Inputs $x_n\\in\\mathbb R^p$, outputs $y_n\\in\\mathbb R^d$ and a latent expert index $s_n\\in\\{1..K\\}$ with gate $g_{nk}=P(s_n=k\\mid x_n)=\\mathrm{softmax}_k\\big(-\\tfrac12\\|x_n-\\mu_k\\|^2\\big)$ and expert $y_n\\mid s_n=k,x_n\\sim\\mathcal N(W_kx_n,\\Psi)$ with a shared diagonal $\\Psi$. (a) Give the E-step posterior $r_{nk}$. (b) Derive the closed-form M-step updates for $W_k$ and $\\Psi$. (c) Why is there no closed-form update for the gate centres $\\mu_k$, and what do you do instead?","hints":["The expected complete log-likelihood is $\\sum_{n,k}r_{nk}\\big[\\log g_{nk}+\\log\\mathcal N(y_n;W_kx_n,\\Psi)\\big]$.","The $W_k$ update is a weighted least-squares problem."],"answer":"(a) $r_{nk}\\propto g_{nk}\\,\\mathcal N(y_n;W_kx_n,\\Psi)$. (b) $W_k=\\big(\\sum_nr_{nk}y_nx_n^\\top\\big)\\big(\\sum_nr_{nk}x_nx_n^\\top\\big)^{-1}$ and $\\Psi=\\mathrm{diag}\\big(\\frac1N\\sum_{n,k}r_{nk}(y_n-W_kx_n)(y_n-W_kx_n)^\\top\\big)$. (c) The softmax normaliser couples all $\\mu_j$, so use a generalised M-step: a gradient step with $\\nabla_{\\mu_k}=\\sum_n(r_{nk}-g_{nk})(x_n-\\mu_k)$.","answer_type":"free-text","solution":"(a) By Bayes, $r_{nk}=P(s_n=k|x_n,y_n)=\\frac{g_{nk}\\mathcal N(y_n;W_kx_n,\\Psi)}{\\sum_jg_{nj}\\mathcal N(y_n;W_jx_n,\\Psi)}$. (b) The expected complete log-likelihood is $Q=\\sum_{n,k}r_{nk}\\big[\\log g_{nk}-\\tfrac12(y_n-W_kx_n)^\\top\\Psi^{-1}(y_n-W_kx_n)\\big]-\\tfrac N2\\log|\\Psi|+\\text{const}$. Setting $\\partial Q/\\partial W_k=\\Psi^{-1}\\sum_nr_{nk}(y_n-W_kx_n)x_n^\\top=0$ gives the weighted least-squares solution $W_k=\\big(\\sum_nr_{nk}y_nx_n^\\top\\big)\\big(\\sum_nr_{nk}x_nx_n^\\top\\big)^{-1}$, independent of $\\Psi$. Differentiating with respect to $\\Psi^{-1}$ and using $\\sum_kr_{nk}=1$ gives $\\Psi=\\frac1N\\sum_{n,k}r_{nk}(y_n-W_kx_n)(y_n-W_kx_n)^\\top$, keeping only the diagonal as constrained. (c) $\\log g_{nk}=-\\tfrac12\\|x_n-\\mu_k\\|^2-\\log\\sum_j\\exp(-\\tfrac12\\|x_n-\\mu_j\\|^2)$, so the normaliser couples all centres and $\\partial Q/\\partial\\mu_k=\\sum_n(r_{nk}-g_{nk})(x_n-\\mu_k)=0$ has no closed form. Take a gradient (or a few Newton) steps on $Q$: this is generalised EM and still increases the free energy if each step does. Trap: the update for $\\Psi$ pools residuals across experts weighted by responsibilities.","category":"pul","kind":"derivation","difficulty":"medium","tags":["mixture of experts","EM","weighted least squares"],"origin":"in the style of COMP0086 2019, Q2","status":"self-marked"},{"id":"m-pul-periodic-gp-kernels","title":"Periodic Gaussian process kernels and feature maps","prompt":"(a) For the Bayesian linear model $f(t)=\\beta^\\top\\phi(t)$ with $\\beta\\sim\\mathcal N(0,I)$, derive the corresponding GP covariance kernel. (b) Show that $K(t,t')=s^2\\cos\\!\\big(2\\pi(t-t')/p\\big)$ is a valid kernel by constructing an explicit $\\phi$, and describe all functions with non-zero density under the resulting GP. (c) Why is the kernel $s^2\\exp\\!\\big(-2\\sin^2(\\pi|t-t'|/p)/\\ell^2\\big)$ far more commonly used for periodic data?","hints":["Use $\\cos(a-b)=\\cos a\\cos b+\\sin a\\sin b$.","The sine-squared kernel is a function of $\\cos(2\\pi(t-t')/p)$; expand its exponential in powers of the cosine."],"answer":"(a) $K(t,t')=\\mathbb E[f(t)f(t')]=\\phi(t)^\\top\\phi(t')$. (b) $\\phi(t)=s\\,(\\cos\\frac{2\\pi t}{p},\\sin\\frac{2\\pi t}{p})^\\top$, so draws are $f(t)=sR\\cos(2\\pi t/p-\\varphi)$: pure sinusoids of period $p$ with random amplitude and phase, a 2-dimensional function space. (c) The exponentiated sine-squared kernel contains all harmonics of period $p$, so it supports any smooth periodic function; $\\ell$ controls smoothness.","answer_type":"free-text","solution":"(a) With $f(t)=\\beta^\\top\\phi(t)$ and $\\beta\\sim\\mathcal N(0,I)$, $f$ is Gaussian with zero mean and $\\mathrm{Cov}(f(t),f(t'))=\\phi(t)^\\top\\mathbb E[\\beta\\beta^\\top]\\phi(t')=\\phi(t)^\\top\\phi(t')=K(t,t')$. (b) $s^2\\cos\\frac{2\\pi(t-t')}{p}=s^2\\big[\\cos\\frac{2\\pi t}{p}\\cos\\frac{2\\pi t'}{p}+\\sin\\frac{2\\pi t}{p}\\sin\\frac{2\\pi t'}{p}\\big]=\\phi(t)^\\top\\phi(t')$ with $\\phi(t)=s(\\cos\\frac{2\\pi t}{p},\\sin\\frac{2\\pi t}{p})^\\top$, so it is a kernel. Samples are $f(t)=s(\\beta_1\\cos\\frac{2\\pi t}{p}+\\beta_2\\sin\\frac{2\\pi t}{p})=sR\\cos(\\frac{2\\pi t}{p}-\\varphi)$, so only sinusoids of exactly period $p$ (random amplitude and phase) have non-zero density: the Gram matrix has rank $2$ and no other shape can be fitted without extra noise. (c) Writing $2\\sin^2(\\pi\\Delta/p)=1-\\cos(2\\pi\\Delta/p)$, the kernel is $s^2e^{-1/\\ell^2}\\exp\\!\\big(\\cos(2\\pi\\Delta/p)/\\ell^2\\big)$, whose power series (or Bessel expansion) contains $\\cos(2\\pi j\\Delta/p)$ for every harmonic $j$, so sample paths are arbitrary smooth functions with period $p$; $\\ell$ sets how fast harmonics decay (smoothness within a period) and $s$ the amplitude. Trap: a valid kernel is not necessarily a useful prior; the support of the prior matters.","category":"pul","kind":"derivation","difficulty":"medium","tags":["Gaussian process","kernels","periodic"],"origin":"in the style of COMP0086 2018, Q6","status":"self-marked"},{"id":"m-pul-sticky-coin-hmm-posterior","title":"Filtering in a sticky two-coin HMM","prompt":"Two coins A and B have $P(\\text{heads})=0.9$ and $0.1$. The chain starts on coin A at step 1; at each later step it keeps the same coin with probability $0.8$ and switches with probability $0.2$. Each step you observe one flip of the selected coin: heads, tails, tails ($x_1=1,x_2=0,x_3=0$). What is the posterior probability that coin A was used at step 3, $P(z_3=A\\mid x_{1:3})$?","hints":["Run the forward recursion $\\alpha_t(z)\\propto P(x_t|z)\\sum_{z'}P(z|z')\\alpha_{t-1}(z')$."],"answer":"$5/77\\approx0.0649$","answer_type":"numeric","answer_value":0.064935,"solution":"Forward messages, unnormalised: $\\alpha_1(A)=0.9$, $\\alpha_1(B)=0$. $\\alpha_2(A)=0.1\\,(0.8\\cdot0.9)=0.072$, $\\alpha_2(B)=0.9\\,(0.2\\cdot0.9)=0.162$. $\\alpha_3(A)=0.1\\,(0.8\\cdot0.072+0.2\\cdot0.162)=0.1\\cdot0.09=0.009$, $\\alpha_3(B)=0.9\\,(0.2\\cdot0.072+0.8\\cdot0.162)=0.9\\cdot0.144=0.1296$. Posterior: $0.009/(0.009+0.1296)=0.009/0.1386=5/77\\approx0.0649$. Two tails in a row make coin B (mostly tails) much more likely, despite the stickiness. Trap: forgetting that the start state is known (so $\\alpha_1(B)=0$) or normalising at the wrong time.","category":"pul","kind":"calculation","difficulty":"medium","tags":["HMM","forward algorithm","filtering"],"origin":"in the style of COMP0086 2021, Q4(c)","status":"verified","entry":"Enter $P(z_3=A\\mid x_{1:3})$ as a probability, not a percentage."},{"id":"m-pul-mutual-information-binary","title":"Mutual information of two binary variables","prompt":"Two binary variables have the empirical joint distribution $d(0,0)=d(1,1)=0.4$ and $d(0,1)=d(1,0)=0.1$. Compute their mutual information in nats. (This would be the edge weight in a Chow-Liu tree.)","hints":["$\\mathrm{MI}=\\sum_{x,y}d(x,y)\\log\\frac{d(x,y)}{d(x)d(y)}$ and both marginals are $(0.5,0.5)$."],"answer":"$\\approx0.1927$ nats","answer_type":"numeric","answer_value":0.19274,"solution":"Both marginals are uniform, so every product term is $0.25$. Then $\\mathrm{MI}=2\\cdot0.4\\ln\\frac{0.4}{0.25}+2\\cdot0.1\\ln\\frac{0.1}{0.25}=0.8\\ln1.6+0.2\\ln0.4=0.3760-0.1833\\approx0.1927$ nats ($\\approx0.278$ bits). It is positive because the variables agree $80\\%$ of the time. Equivalently $\\mathrm{MI}=H(X)+H(Y)-H(X,Y)=2\\ln2-H(d)$. Trap: using the joint instead of the product of marginals in the denominator, or mixing bits and nats.","category":"pul","kind":"calculation","difficulty":"easy","tags":["mutual information","Chow-Liu","entropy"],"origin":"original","status":"verified","entry":"Enter the mutual information of the two variables, in nats (natural log)."},{"id":"m-pul-conjugate-regression-unknown-variance","title":"Conjugacy in Bayesian regression with unknown noise variance","prompt":"Linear regression $y_n=w^\\top x_n+\\varepsilon_n$, $\\varepsilon_n\\sim\\mathcal N(0,\\sigma^2)$. What is a conjugate prior in general, and what is the conjugate prior for $w$ when $\\sigma^2$ is known? If $\\sigma^2$ is also unknown, explain why independent priors $\\mathcal N(0,\\Lambda^{-1})$ on $w$ and inverse-gamma on $\\sigma^2$ are not conjugate, give the prior that is, and state the posterior parameter updates.","hints":["Look at how $\\sigma^2$ appears in the likelihood and whether the prior on $w$ shares it.","Take $w\\mid\\sigma^2\\sim\\mathcal N(\\mu,\\sigma^2\\Lambda^{-1})$ and $\\sigma^2\\sim\\mathrm{IG}(a,b)$."],"answer":"A prior is conjugate if the posterior is in the same family. Known $\\sigma^2$: Gaussian prior on $w$. Unknown: the prior on $w$ must scale with $\\sigma^2$, $w\\mid\\sigma^2\\sim\\mathcal N(\\mu,\\sigma^2\\Lambda^{-1})$, $\\sigma^2\\sim\\mathrm{IG}(a,b)$, giving $\\Lambda_N=\\Lambda+XX^\\top$, $\\mu_N=\\Lambda_N^{-1}(\\Lambda\\mu+Xy^\\top)$, $a_N=a+N/2$, $b_N=b+\\tfrac12(yy^\\top+\\mu^\\top\\Lambda\\mu-\\mu_N^\\top\\Lambda_N\\mu_N)$.","answer_type":"free-text","solution":"A prior is conjugate to a likelihood if the posterior lies in the same parametric family as the prior; for exponential-family likelihoods it adds sufficient statistics to the prior's hyperparameters. With known $\\sigma^2$ the likelihood is Gaussian in $w$, so a Gaussian prior is conjugate. When $\\sigma^2$ is unknown the likelihood contains $\\sigma^{-N}\\exp\\!\\big(-\\|y-X^\\top w\\|^2/(2\\sigma^2)\\big)$, where the quadratic form in $w$ is divided by $\\sigma^2$; an independent Gaussian prior on $w$ has no $\\sigma^2$ in its exponent, so the posterior does not factor into a Gaussian times an inverse-gamma. The fix is to scale the prior covariance with $\\sigma^2$: $w\\mid\\sigma^2\\sim\\mathcal N(\\mu,\\sigma^2\\Lambda^{-1})$, $\\sigma^2\\sim\\mathrm{IG}(a,b)$. Then the posterior is the same family with $\\Lambda_N=\\Lambda+XX^\\top$, $\\mu_N=\\Lambda_N^{-1}(\\Lambda\\mu+Xy^\\top)$, $a_N=a+\\frac N2$ and $b_N=b+\\frac12\\big(yy^\\top+\\mu^\\top\\Lambda\\mu-\\mu_N^\\top\\Lambda_N\\mu_N\\big)$, and the marginal posterior of $w$ is Student-t. Intuition: the shared $\\sigma^2$ makes noise level and prior uncertainty move together, so the Gaussian and inverse-gamma pieces combine. Trap: with independent priors you can still do MAP or Gibbs sampling, but not a closed-form conjugate update.","category":"pul","kind":"concept","difficulty":"medium","tags":["conjugate prior","Bayesian regression","inverse-gamma"],"origin":"in the style of COMP0086 2019, Q1","status":"self-marked"},{"id":"m-pul-pca-ppca-fa-differences","title":"PCA, probabilistic PCA and factor analysis","prompt":"Compare PCA, probabilistic PCA (PPCA) and factor analysis (FA) as latent variable models $x=Ay+\\varepsilon$, $y\\sim\\mathcal N(0,I)$. What does each assume about the noise, which of them is invariant to rescaling individual features, what is not identifiable in $A$, and when would you choose FA over PCA?","hints":["The noise covariance is $\\Psi$ (diagonal) for FA, $\\sigma^2I$ for PPCA, and the limit $\\sigma^2\\to0$ for PCA.","Consider $A\\to AR$ for an orthogonal $R$."],"answer":"FA has diagonal noise $\\Psi$ (feature-specific), PPCA isotropic noise $\\sigma^2I$ (ML solution is the PCA subspace with eigenvalues shifted by $\\sigma^2$), PCA is the $\\sigma^2\\to0$ limit. FA is invariant to feature rescaling (absorbed into $\\Psi$ and $A$); PCA is not. $A$ is identifiable only up to an orthogonal rotation $A\\to AR$ (and sign), so loadings need extra constraints to interpret. Choose FA when features have different noise levels or units.","answer_type":"free-text","solution":"All three give $x\\sim\\mathcal N(0,AA^\\top+\\Psi)$. FA allows diagonal $\\Psi$ so common variance is explained by latent factors and feature-specific noise is separated; PPCA fixes $\\Psi=\\sigma^2I$, with ML solution $A=U_K(\\Lambda_K-\\sigma^2I)^{1/2}R$ and $\\sigma^2$ the mean of the discarded eigenvalues; PCA is the zero-noise limit, where the latents are deterministic projections and only the span of the top $K$ eigenvectors matters. PCA and PPCA depend on the scale of each feature (a feature with large units dominates the principal components), while FA is covariant under rescaling since the scale is absorbed by the corresponding row of $A$ and entry of $\\Psi$. $A$ is identifiable only up to $A\\to AR$ with $R^\\top R=I$, because $AR(AR)^\\top=AA^\\top$; PCA fixes the rotation by ordering orthogonal eigenvectors, FA needs a rotation convention (varimax, lower-triangular). Choose FA when features differ in measurement noise or units and you want the shared structure (for example hidden factors driving observed variables), PCA/PPCA when you want a variance-ordered compression of comparably scaled features. Trap: ML-estimating FA by EM can drive entries of $\\Psi$ to zero (Heywood cases), and the number of latent factors is not identifiable by likelihood alone.","category":"pul","kind":"concept","difficulty":"medium","tags":["PCA","factor analysis","PPCA","identifiability"],"origin":"original","status":"self-marked"},{"id":"m-pul-gmm-collapse-restarts","title":"EM for a Gaussian mixture keeps misbehaving","prompt":"You fit a $K=5$ Gaussian mixture with full covariances to $2000$ points in $20$ dimensions using EM. Different random starts give different final likelihoods, and in one run the log-likelihood shoots up to a huge value while one component has all its responsibility on a handful of points. What is happening, and how do you make the fit robust and choose $K$?","hints":["Consider what happens to the likelihood when a Gaussian centred on a data point has covariance tending to zero.","Think of initialisation, regularisation and a model-selection score."],"answer":"The likelihood is unbounded: a component centred on a point with $\\Sigma_k\\to0$ gives infinite density, so EM can collapse onto few points; and EM only finds local optima. Fix: floor or regulariser on covariances (MAP with inverse-Wishart prior, or add $\\epsilon I$), restarts from k-means, tied/diagonal covariances; choose $K$ by held-out likelihood or BIC rather than training likelihood.","answer_type":"free-text","solution":"The mixture likelihood is unbounded: putting a component's mean on a data point and shrinking its covariance to zero sends that point's density to infinity, so maximum likelihood is ill-posed; EM can slide towards such degenerate solutions, and with $20$ dimensions and $2000$ points a full-covariance component with few points is near singular. Separately, EM only climbs to a local maximum of a multimodal likelihood, which explains the run-to-run differences. To fix: add a covariance floor or a conjugate inverse-Wishart prior (MAP-EM adds $\\epsilon I$ to each covariance estimate); restrict covariances (diagonal or tied) when data are scarce; initialise with k-means and take the best of several restarts by held-out or penalised likelihood; drop or reinitialise components whose responsibility mass $N_k$ is tiny. Choose $K$ with validation log-likelihood or BIC (training likelihood always rises with $K$), and check that components are stable across restarts. Optionally anneal (tempered EM) or use a Bayesian mixture with a Dirichlet prior, which shrinks unused components. Trap: reporting the highest training likelihood across restarts selects the degenerate solution.","category":"pul","kind":"scenario","difficulty":"medium","tags":["EM","Gaussian mixture","singularities","model selection","scenario"],"origin":"original","status":"self-marked"},{"id":"m-pul-kalman-missing-outliers","title":"Kalman filtering with dropouts and outliers","prompt":"You track an asset's latent trend and volatility-driven noise with a linear-Gaussian state-space model. In production about $5\\%$ of observations are missing and a further few percent are wild outliers. Your Kalman filter occasionally jumps badly. How do you handle missing data, how would you make the filter robust to outliers, and how do you learn the model parameters?","hints":["A missing observation carries no information: skip the update step.","Look at the innovation $y_t-C\\hat x_{t|t-1}$ and its predicted covariance $S_t$."],"answer":"Missing data: do only the predict step. Outliers: gate on the Mahalanobis distance of the innovation $\\nu_t^\\top S_t^{-1}\\nu_t$ (reject or inflate $R$), or use a Student-t observation model with a latent scale (EM/variational) so large residuals get low weight. Parameters: EM with Kalman smoother (RTS) for expected sufficient statistics, or maximise the innovations likelihood directly.","answer_type":"free-text","solution":"For a missing observation the posterior is just the prediction, $\\hat x_{t|t}=\\hat x_{t|t-1}$ and $P_{t|t}=P_{t|t-1}$, so skip the update and let uncertainty grow; the model remains exactly Gaussian. For outliers, compute the innovation $\\nu_t=y_t-C\\hat x_{t|t-1}$ with covariance $S_t=CP_{t|t-1}C^\\top+R$; if $\\nu_t^\\top S_t^{-1}\\nu_t$ exceeds a chi-square quantile, treat the point as an outlier (skip it or inflate $R_t$), or model the noise as Student-t, i.e. a Gaussian with an unknown latent precision scale per observation: in EM or variational inference each observation's effective noise is $R/\\lambda_t$ with $\\mathbb E[\\lambda_t]$ small for large residuals, which down-weights it smoothly and keeps the filter linear-Gaussian conditional on the scales. Parameters $(A,C,Q,R)$ can be learned by EM: the E-step runs the Kalman filter and Rauch-Tung-Striebel smoother to get $\\mathbb E[x_t],\\mathbb E[x_tx_t^\\top],\\mathbb E[x_tx_{t-1}^\\top]$, and the M-step has closed-form regressions; alternatively maximise the innovations log-likelihood $\\sum_t\\log\\mathcal N(\\nu_t;0,S_t)$ directly. Check calibration by looking at standardised innovations (should be white with unit variance). Trap: gating too aggressively during a genuine regime shift rejects real signal, so keep a count of consecutive rejections and re-initialise.","category":"pul","kind":"scenario","difficulty":"hard","tags":["Kalman filter","state-space","robust inference","EM","scenario"],"origin":"original","status":"self-marked"},{"id":"m-ai-iwae-bound","title":"Tightening the ELBO with importance weights","prompt":"A VAE has generative model $p_\\theta(x,z)$, encoder $f_\\phi(x)$ giving the parameters of $q(z;f_\\phi(x))$, and a reparametrisation $z_s=h(\\epsilon_s,f_\\phi(x))$, $\\epsilon_s\\sim\\mathcal N(0,1)$. (a) Write the standard ELBO as a sample average. (b) Define $\\mathcal F_S=\\mathbb E\\log\\frac1S\\sum_{s=1}^S\\frac{p_\\theta(x,z_s)}{q(z_s;f_\\phi(x))}$ with $z_s\\overset{iid}{\\sim}q$, and show $\\mathcal F_S\\le\\log p_\\theta(x)$. (c) Show $\\mathcal F_S\\le\\mathcal F_{S'}$ for $S<S'$. (d) Describe how to optimise $\\mathcal F_S$ and give the gradient esti
