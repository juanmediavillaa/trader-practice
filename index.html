 A smaller prior variance gives a larger $\\lambda$, i.e. stronger regularisation.","answer_type":"numeric","answer_value":2.0,"solution":"The negative log posterior is $\\frac1{2\\sigma^2}\\sum_i(y_i-w^\\top x_i)^2+\\frac1{2\\tau^2}\\|w\\|^2+\\text{const}$. Multiplying by $2\\sigma^2$ gives $\\sum_i(y_i-w^\\top x_i)^2+\\frac{\\sigma^2}{\\tau^2}\\|w\\|^2$, so $\\lambda=\\sigma^2/\\tau^2=4/2=2$. A tighter prior (small $\\tau^2$) says you believe the weights are near zero, so the penalty is larger.\n\nIntuition: the Gaussian log-likelihood is the squared error and the Gaussian log-prior is the L2 penalty, so ridge is MAP with a Gaussian prior; with a flat prior ($\\tau^2\\to\\infty$, $\\lambda\\to0$) you recover the MLE, i.e. least squares. Trap: noisy data (large $\\sigma^2$) also increases $\\lambda$. This is the key identity in the MAP-is-ridge question.","category":"core","kind":"basics","difficulty":"easy","tags":["MAP","ridge","Gaussian prior"],"origin":"original","status":"verified","leads_to":["m-core-map-ridge","m-core-l1-vs-l2"],"entry":"Enter $\\lambda=\\sigma^2/\\tau^2$ for $\\sigma^2=4$, $\\tau^2=2$ (work out the tighter-prior question too)."},{"id":"m-coref-sigmoid-value","title":"From a linear score to a probability","prompt":"A logistic regression model has weights $w=(1,2)$ and no bias. For an input $x=(2,0.5)$, compute the score $z=w^\\top x$ and the predicted probability of class 1, $p=\\sigma(z)=1/(1+e^{-z})$. Report $p$ to 4 decimal places.","hints":["$z=1\\cdot2+2\\cdot0.5$."],"answer":"$z=3$ and $p=\\sigma(3)\\approx0.9526$.","answer_type":"numeric","answer_value":0.9526,"solution":"$z=1\\cdot2+2\\cdot0.5=3$, so $p=1/(1+e^{-3})=1/(1+0.0498)\\approx0.9526$. The sigmoid squashes any real score into $(0,1)$; $z=0$ gives $p=0.5$, large positive $z$ gives $p\\to1$, large negative $z$ gives $p\\to0$. Equivalently $z=\\log\\frac{p}{1-p}$ is the log-odds, so logistic regression is linear in the log-odds.\n\nIntuition: a linear model produces a score, the sigmoid turns it into a probability, and the likelihood of the label then defines the loss. This is the first step of the log-loss and logistic-gradient questions.","category":"core","kind":"basics","difficulty":"easy","tags":["logistic regression","sigmoid"],"origin":"original","status":"verified","leads_to":["m-core-logistic-gradient","m-core-log-loss-value","m-core-calibration"],"entry":"Enter the predicted probability $p=\\sigma(z)$ of class 1, as a probability between 0 and 1 (work out $z$ too)."},{"id":"m-coref-log-loss-single","title":"Log loss of a single prediction","prompt":"A classifier outputs $p=0.8$ for the probability of the positive class. The cross-entropy (log loss) of one example is $-[y\\ln p+(1-y)\\ln(1-p)]$. Compute it (in nats, 4 decimal places) when the true label is $y=0$. How does that compare with the loss if $y=1$?","hints":["For $y=0$ only the second term survives."],"answer":"For $y=0$: $-\\ln(0.2)\\approx1.6094$. For $y=1$ it would be $-\\ln0.8\\approx0.2231$.","answer_type":"numeric","answer_value":1.6094,"solution":"With $y=0$ the loss is $-\\ln(1-p)=-\\ln0.2\\approx1.6094$. With $y=1$ it would be $-\\ln0.8\\approx0.2231$, about seven times smaller. The loss is the negative log of the probability the model gave to the true label, so confident wrong predictions are punished heavily (it grows without bound as the probability of the true label goes to $0$).\n\nReference value: a model guessing $0.5$ always gets $\\ln2\\approx0.693$, and for $K$ classes a uniform guess gives $\\ln K$. This is exactly the number to compare against in the multi-example log-loss question and in the 'loss stays flat at $\\ln K$' debugging scenario.","category":"core","kind":"basics","difficulty":"easy","tags":["log loss","cross-entropy"],"origin":"original","status":"verified","leads_to":["m-core-log-loss-value","m-core-kl-cross-entropy","m-core-loss-not-decreasing"],"entry":"Enter the log loss in nats (natural log) for true label $y=0$ (work out the $y=1$ comparison too)."},{"id":"m-coref-kl-small","title":"KL divergence between two simple distributions","prompt":"Let $p=(0.5,0.5)$ and $q=(0.25,0.75)$ be two distributions over two outcomes. Compute $\\mathrm{KL}(p\\|q)=\\sum_i p_i\\ln(p_i/q_i)$ in nats to 4 decimal places. Is $\\mathrm{KL}(q\\|p)$ the same number?","hints":["$\\ln(0.5/0.25)=\\ln2$ and $\\ln(0.5/0.75)=\\ln(2/3)$."],"answer":"$\\mathrm{KL}(p\\|q)=0.5\\ln2+0.5\\ln(2/3)\\approx0.1438$; KL is not symmetric, so $\\mathrm{KL}(q\\|p)\\approx0.1308$.","answer_type":"numeric","answer_value":0.1438,"solution":"$\\mathrm{KL}(p\\|q)=0.5\\ln\\frac{0.5}{0.25}+0.5\\ln\\frac{0.5}{0.75}=0.5(0.6931)+0.5(-0.4055)\\approx0.1438$. Reversing gives $0.25\\ln0.5+0.75\\ln1.5\\approx0.1308$, so KL is not symmetric (it is not a distance). It is always $\\ge0$ and equals $0$ only when $p=q$.\n\nLink to training: cross-entropy $H(p,q)=H(p)+\\mathrm{KL}(p\\|q)$. When $p$ is the fixed data distribution, $H(p)$ is a constant, so minimising cross-entropy (equivalently maximising likelihood) is exactly minimising $\\mathrm{KL}(p\\|q)$. This is the backbone of the KL-value and 'why we minimise cross-entropy' questions.","category":"core","kind":"basics","difficulty":"easy","tags":["KL divergence","cross-entropy","entropy"],"origin":"original","status":"verified","leads_to":["m-core-kl-value","m-core-kl-cross-entropy"],"entry":"Enter $\\mathrm{KL}(p\\|q)$ in nats (natural log), with $p=(0.5,0.5)$ first (work out $\\mathrm{KL}(q\\|p)$ too)."},{"id":"m-coref-logistic-gradient-step","title":"One gradient step for logistic regression","prompt":"For one example with features $x=(1,2)$ and label $y=0$, the model currently predicts $p=\\sigma(w^\\top x)=0.8$. For the log loss, $\\nabla_w=(p-y)\\,x$. (a) Compute the gradient. (b) Take one gradient descent step $w\\leftarrow w-\\eta\\nabla_w$ from $w_0=(0,0)$ with $\\eta=0.5$ using that gradient. What is the second component of the new $w$?","hints":["The gradient is $(0.8-0)\\cdot(1,2)$."],"answer":"$\\nabla_w=(0.8,1.6)$, so $w=(-0.4,-0.8)$ and the second component is $-0.8$.","answer_type":"numeric","answer_value":-0.8,"solution":"$\\nabla_w=(p-y)x=0.8\\cdot(1,2)=(0.8,1.6)$. The step is $w=(0,0)-0.5(0.8,1.6)=(-0.4,-0.8)$, so the second component is $-0.8$. The model over-predicted class 1 for a class-0 example, so the update pushes the weights in the direction that lowers the score $w^\\top x$ for this input.\n\nIntuition: the gradient is 'prediction error times the input', the same form as least squares, and over a dataset it is $X^\\top(p-y)$. Its sign always moves the score in the right direction. Used in the logistic-gradient derivation, in comparing SGD and momentum, and in the 'loss does not decrease' checklist, where you check learning rate and gradient scale.","category":"core","kind":"basics","difficulty":"easy","tags":["logistic regression","gradient descent"],"origin":"original","status":"verified","leads_to":["m-core-logistic-gradient","m-core-gd-variants","m-core-loss-not-decreasing"],"entry":"Enter the second component of the new $w$, negative if it is below zero (work out the gradient too; the solution covers it)."},{"id":"m-coref-precision-recall-f1","title":"Precision, recall and F1 from a confusion matrix","prompt":"A fraud classifier on 100 transactions gives: true positives 8, false positives 2, false negatives 4, true negatives 86. Compute precision $=\\frac{TP}{TP+FP}$, recall $=\\frac{TP}{TP+FN}$ and their harmonic mean, $F_1=\\frac{2PR}{P+R}$. Report $F_1$ to 4 decimal places. What is the accuracy, and why does it look better than F1?","hints":["Precision is $0.8$ and recall is $2/3$."],"answer":"Precision $0.8$, recall $0.6667$, $F_1\\approx0.7273$; accuracy is $94\\%$, inflated by the many easy true negatives.","answer_type":"numeric","answer_value":0.7273,"solution":"Precision $=8/10=0.8$ (of flagged cases, 80% are real), recall $=8/12\\approx0.6667$ (of real cases, two thirds are caught), so $F_1=2(0.8)(0.6667)/(1.4667)\\approx0.7273$. Accuracy is $(8+86)/100=94\\%$, which is high only because most examples are negatives that are easy to get right: with 12% positives, always predicting 'no fraud' already scores 88%.\n\nIntuition: when positives are rare, accuracy hides the failures you care about, so report precision, recall (and the precision-recall trade-off as you move the threshold). This leads into the imbalanced-metrics scenario and the base-rate (positive predictive value) calculation.","category":"core","kind":"basics","difficulty":"easy","tags":["precision","recall","F1","imbalance"],"origin":"original","status":"verified","leads_to":["m-core-imbalanced-metrics","m-core-ppv-base-rate","m-core-calibration"],"entry":"Enter $F_1$ as a decimal between 0 and 1 (work out precision, recall and accuracy too; the solution covers them)."},{"id":"m-coref-bayes-ppv","title":"Bayes' rule with a small test","prompt":"A test has sensitivity $P(\\text{positive}\\mid\\text{condition})=0.8$ and specificity $P(\\text{negative}\\mid\\text{no condition})=0.9$. The prevalence of the condition is $10\\%$. Out of 1,000 people, how many true positives and false positives do you expect? What is $P(\\text{condition}\\mid\\text{positive})$ to 4 decimal places?","hints":["100 people have the condition, 900 do not."],"answer":"80 true positives and 90 false positives, so the probability is $80/170\\approx0.4706$.","answer_type":"numeric","answer_value":0.4706,"solution":"Of 1,000 people, 100 have the condition and 900 do not. True positives: $0.8\\times100=80$. False positives: $(1-0.9)\\times900=90$. So $P(\\text{condition}\\mid\\text{positive})=80/(80+90)\\approx0.4706$. Even with a decent test, fewer than half of the positives are real because the healthy group is so much larger.\n\nBayes' rule: $P(C\\mid +)=\\frac{P(+\\mid C)P(C)}{P(+\\mid C)P(C)+P(+\\mid\\neg C)P(\\neg C)}$. Intuition: counting people is easier than manipulating probabilities. Trap: confusing sensitivity with precision (positive predictive value); the base rate matters. With a 1% prevalence this effect is far stronger, as in the screening question and the imbalanced fraud scenario.","category":"core","kind":"basics","difficulty":"easy","tags":["Bayes rule","base rate","precision"],"origin":"original","status":"verified","leads_to":["m-core-ppv-base-rate","m-core-imbalanced-metrics","m-core-calibration"],"entry":"Enter $P(\\text{condition}\\mid\\text{positive})$ as a probability, not a percentage (work out the expected counts too)."},{"id":"m-dlf-softmax-value","title":"Softmax of three logits","prompt":"A network outputs logits $z=(0,1,2)$ for three classes (or three candidate next tokens). The softmax is $p_i=e^{z_i}/\\sum_j e^{z_j}$. What probability does the largest logit get, to 4 decimal places? Do the three probabilities sum to 1?","hints":["$e^0=1$, $e^1\\approx2.718$, $e^2\\approx7.389$."],"answer":"$p_3=e^2/(1+e+e^2)\\approx0.6652$; the probabilities sum to 1 by construction.","answer_type":"numeric","answer_value":0.6652,"solution":"The denominator is $1+2.718+7.389=11.107$, so $p=(0.0900,0.2447,0.6652)$ and the top probability is $0.6652\\approx e^2/11.107$. Softmax exponentiates the logits (making them positive) and normalises, so the probabilities sum to 1. Adding the same constant to all logits changes nothing, because it cancels in the ratio, which is why implementations subtract $\\max_j z_j$ for numerical stability.\n\nIntuition: logits are unnormalised log-probabilities; a gap of 1 in logit multiplies the odds by $e$. This is the starting point for the cross-entropy gradient and the temperature questions.","category":"dl","kind":"basics","difficulty":"easy","tags":["softmax","logits"],"origin":"original","status":"verified","leads_to":["m-softmax-ce-gradient","m-decoding-temperature-calc","m-attention-scaling-sqrt-dk"],"entry":"Enter the probability the largest logit receives, as a number between 0 and 1 (work out the sum check too)."},{"id":"m-dlf-cross-entropy-token","title":"Cross-entropy loss on one token","prompt":"A language model predicts a next-token distribution $p=(0.7,0.2,0.1)$ over three tokens. The true next token is the second one (probability $0.2$). The cross-entropy loss with a one-hot target is $L=-\\ln p_{\\text{true}}$. Compute $L$ in nats to 4 decimal places. What loss would a uniform guess over the three tokens give?","hints":["Only the true token's probability matters."],"answer":"$L=-\\ln0.2\\approx1.6094$; a uniform guess gives $\\ln3\\approx1.0986$, so this prediction is worse than guessing.","answer_type":"numeric","answer_value":1.6094,"solution":"With a one-hot target $y$, $L=-\\sum_ky_k\\ln p_k=-\\ln p_{\\text{true}}=-\\ln0.2\\approx1.6094$. A uniform guess over $K=3$ tokens gives $\\ln3\\approx1.0986$, so the model, confidently wrong here, does worse than guessing. Averaging $L$ over tokens gives the training loss, and $\\exp$ of the average loss is the perplexity.\n\nIntuition: the loss is the surprise of the true token under the model, so pushing it down means raising the probability of what actually happened. Useful reference: a freshly initialised $K$-class classifier should start near $\\ln K$. This number feeds the gradient derivation, the evaluation questions and DPO-style log-probability losses.","category":"dl","kind":"basics","difficulty":"easy","tags":["cross-entropy","perplexity"],"origin":"original","status":"verified","leads_to":["m-softmax-ce-gradient","m-llm-eval-contamination-judge","m-dpo-derivation"],"entry":"Enter the cross-entropy loss $L$ in nats (natural log) for the true second token (work out the uniform-guess loss too)."},{"id":"m-dlf-softmax-ce-gradient-number","title":"The softmax cross-entropy gradient, numerically","prompt":"For softmax followed by cross-entropy with a one-hot target $y$, the gradient with respect to the logits is $\\partial L/\\partial z_j=p_j-y_j$. With $p=(0.7,0.2,0.1)$ and the true class being the second, compute $\\partial L/\\partial z_2$. What are the other two components, and what do the signs mean?","hints":["For the true class $y_2=1$; for the others $y_j=0$."],"answer":"$\\partial L/\\partial z_2=0.2-1=-0.8$; the others are $0.7$ and $0.1$. Gradient descent raises the true logit and lowers the others in proportion to their probability.","answer_type":"numeric","answer_value":-0.8,"solution":"$\\partial L/\\partial z_j=p_j-y_j$, so the gradient vector is $(0.7,\\,-0.8,\\,0.1)$. Its components sum to zero (because $\\sum p=\\sum y=1$), consistent with softmax being invariant to adding a constant to all logits. A gradient step $z\\leftarrow z-\\eta\\nabla$ increases the true logit (negative gradient entry) and decreases the others, the most for the token the model wrongly favoured.\n\nIntuition: the gradient is simply 'prediction minus target', the same neat form as logistic and linear regression. It is bounded in $[-1,1]$, so confident mistakes do not give exploding gradients here. This is the result you derive in full in the softmax cross-entropy question using the softmax Jacobian.","category":"dl","kind":"basics","difficulty":"easy","tags":["softmax","cross-entropy","gradient"],"origin":"original","status":"verified","leads_to":["m-softmax-ce-gradient","m-pretrain-loss-spike-adamw","m-dpo-derivation"],"entry":"Enter $\\partial L/\\partial z_2$, negative if it is below zero (work out the other two components too)."},{"id":"m-dlf-temperature-two-tokens","title":"What does temperature do?","prompt":"A model gives two candidate tokens logits $(1,0)$. Sampling at temperature $T$ uses $p_i\\propto e^{z_i/T}$. Find the probability of the first token for $T=1$ and for $T=2$. Report the value at $T=2$ to 4 decimal places, and say what happens as $T\\to0$ and $T\\to\\infty$.","hints":["For two outcomes, $p_1=\\sigma((z_1-z_2)/T)$."],"answer":"$T=1$: $\\sigma(1)\\approx0.7311$. $T=2$: $\\sigma(0.5)\\approx0.6225$. Low $T$ approaches greedy decoding, high $T$ approaches uniform.","answer_type":"numeric","answer_value":0.6225,"solution":"With two tokens, $p_1=\\frac{e^{z_1/T}}{e^{z_1/T}+e^{z_2/T}}=\\sigma\\!\\left(\\frac{z_1-z_2}{T}\\right)$. At $T=1$: $\\sigma(1)=0.7311$. At $T=2$: $\\sigma(0.5)=0.6225$, so dividing logits by a larger $T$ flattens the distribution. As $T\\to0$ the largest logit takes all the mass (greedy/argmax); as $T\\to\\infty$ all tokens become equally likely.\n\nIntuition: temperature rescales the gaps between logits; it changes how random the sampling is without changing the ranking. Trap: $T<1$ sharpens, $T>1$ flattens (not the reverse). This is the building block of the temperature calculation and links to the KL-regularised RLHF view, where $\\beta$ plays a temperature-like role.","category":"dl","kind":"basics","difficulty":"easy","tags":["temperature","sampling","softmax"],"origin":"original","status":"verified","leads_to":["m-decoding-temperature-calc","m-rlhf-reward-hacking","m-dpo-derivation"],"entry":"Enter the first token's probability at $T=2$ (work out $T=1$ and the limits too; the solution covers them)."},{"id":"m-dlf-layer-output-variance","title":"Variance of a linear layer's output","prompt":"A neuron computes $y=\\sum_{j=1}^{n}w_jx_j$ with $n=512$ inputs. The inputs are independent with mean 0 and variance $\\sigma_x^2=1$; the weights are independent of the inputs, with mean 0 and variance $\\sigma_w^2=0.01$. What is $\\mathrm{Var}(y)$? What value of $\\sigma_w^2$ would keep $\\mathrm{Var}(y)=1$?","hints":["The variance of a sum of independent terms is the sum of the variances, and $\\mathrm{Var}(w_jx_j)=\\sigma_w^2\\sigma_x^2$ for independent zero-mean factors."],"answer":"$\\mathrm{Var}(y)=n\\sigma_w^2\\sigma_x^2=512\\times0.01=5.12$; to get 1 you need $\\sigma_w^2=1/n=1/512$.","answer_type":"numeric","answer_value":5.12,"solution":"For independent zero-mean $w_j,x_j$: $\\mathrm{Var}(w_jx_j)=\\mathbb{E}[w_j^2]\\mathbb{E}[x_j^2]=\\sigma_w^2\\sigma_x^2$. Summing $n$ independent terms gives $\\mathrm{Var}(y)=n\\sigma_w^2\\sigma_x^2=512\\times0.01=5.12$. So the output variance is 5.12 times the input variance: stacking many such layers would blow the activations up geometrically. Setting $\\sigma_w^2=1/n$ gives $\\mathrm{Var}(y)=\\sigma_x^2$.\n\nIntuition: the width multiplies the variance, so the weight scale must shrink with width. This is the whole idea behind Xavier ($1/n_{in}$ style) and He ($2/n_{in}$, compensating for ReLU zeroing half the units) initialisation, and the same calculation underlies why attention logits need a $\\sqrt{d_k}$ scaling.","category":"dl","kind":"basics","difficulty":"easy","tags":["initialisation","variance"],"origin":"original","status":"verified","leads_to":["m-init-variance-xavier-he","m-attention-scaling-sqrt-dk","m-pretrain-loss-spike-adamw"],"entry":"Enter $\\mathrm{Var}(y)$ for $\\sigma_w^2=0.01$ (work out the variance-preserving $\\sigma_w^2$ too; the solution covers it)."},{"id":"m-dlf-dot-product-std","title":"How big is a dot product of random vectors?","prompt":"Let $q,k\\in\\mathbb{R}^{64}$ have independent components with mean 0 and variance 1. The dot product $q^\\top k=\\sum_{i=1}^{64}q_ik_i$. What is its standard deviation? After dividing by $\\sqrt{d_k}=\\sqrt{64}$, what is the standard deviation of the scaled logit?","hints":["Each term $q_ik_i$ has mean 0 and variance 1."],"answer":"$\\mathrm{Var}(q^\\top k)=64$, so the standard deviation is $8$; dividing by $8$ brings it back to $1$.","answer_type":"numeric","answer_value":8.0,"solution":"Each product $q_ik_i$ has mean 0 and variance $1\\cdot1=1$ and the 64 terms are independent, so $\\mathrm{Var}(q^\\top k)=64$ and the standard deviation is $\\sqrt{64}=8$. Dividing by $\\sqrt{d_k}=8$ gives variance $64/64=1$ and standard deviation 1, regardless of $d_k$.\n\nIntuition: without scaling, logits have a spread of order $\\sqrt{d_k}$, so for large head dimensions the softmax receives huge inputs, saturates into a nearly one-hot distribution, and its gradients vanish. Scaling keeps the logits at unit scale. This is the same variance-adds-up calculation as the layer-output question, and it is the heart of the attention-scaling derivation.","category":"dl","kind":"basics","difficulty":"easy","tags":["attention","variance","scaling"],"origin":"original","status":"verified","leads_to":["m-attention-scaling-sqrt-dk","m-init-variance-xavier-he","m-flash-attention-io"],"entry":"Enter the standard deviation of the unscaled dot product $q^\\top k$ (work out the scaled version too)."},{"id":"m-dlf-layernorm-numbers","title":"Layer normalisation of one vector","prompt":"Apply layer normalisation (no learned scale or shift, and ignore the small $\\epsilon$) to the single feature vector $x=(2,4,6,8)$: subtract the mean of its entries and divide by their standard deviation (use the population variance, dividing by 4). What is the first entry of the output, to 4 decimal places? Over which axis does LayerNorm compute its statistics, compared with BatchNorm?","hints":["Mean $=5$, deviations $(-3,-1,1,3)$."],"answer":"Variance $=5$, std $\\approx2.2361$, first entry $=-3/2.2361\\approx-1.3416$. LayerNorm normalises over the features of each example; BatchNorm normalises each feature over the batch.","answer_type":"numeric","answer_value":-1.3416,"solution":"The mean is 5, deviations are $(-3,-1,1,3)$, the variance is $(9+1+1+9)/4=5$ and the standard deviation is $\\sqrt5\\approx2.2361$. The output is $(-1.3416,-0.4472,0.4472,1.3416)$, with mean 0 and variance 1. LayerNorm computes these statistics across the feature dimension of each token independently, so it does not depend on batch size or on other sequences. BatchNorm instead normalises each feature across the batch (and positions), which is awkward with small batches, variable-length sequences and autoregressive inference.\n\nIntuition: LayerNorm rescales each token's activations to a stable scale, which helps keep training stable in deep transformers (RMSNorm just divides by the root mean square without centring). This is the contrast examined in the LayerNorm-versus-BatchNorm question.","category":"dl","kind":"basics","difficulty":"easy","tags":["LayerNorm","BatchNorm","normalisation"],"origin":"original","status":"verified","leads_to":["m-layernorm-vs-batchnorm","m-pretrain-loss-spike-adamw","m-init-variance-xavier-he"],"entry":"Enter the first entry of the layer-normalised output, negative if it is below zero (work out the LayerNorm versus BatchNorm axis question too)."},{"id":"m-dlf-kv-cache-small","title":"Counting KV-cache memory for a tiny model","prompt":"During generation a transformer stores, for every past token and every layer, one key vector and one value vector per key/value head. Suppose a tiny model has 4 layers, 2 key/value heads, head dimension 64, stored in 16-bit floats (2 bytes per number). How many megabytes ($1\\text{ MB}=10^6$ bytes) of KV cache does a sequence of 1,000 tokens need?","hints":["Per token: $2\\ (\\text{K and V})\\times\\text{layers}\\times\\text{KV heads}\\times\\text{head dim}\\times\\text{bytes}$."],"answer":"Per token $2\\times4\\times2\\times64\\times2=2048$ bytes, so 1,000 tokens need $2.048$ MB.","answer_type":"numeric","answer_value":2.048,"solution":"Per token the cache holds $2$ (keys and values) $\\times4$ layers $\\times2$ KV heads $\\times64$ dims $\\times2$ bytes $=2048$ bytes. For 1,000 tokens that is $2{,}048{,}000$ bytes $=2.048$ MB. The cache grows linearly in sequence length, layers, KV heads and head dimension, and linearly in batch size.\n\nIntuition: the cache avoids recomputing keys and values for old tokens, trading memory for compute. Grouped-query attention reduces the number of KV heads (here 2 rather than, say, 8 or 32 query heads), shrinking the cache by that ratio, which matters for long contexts and large batches. Attention being memory-bound rather than compute-bound is also the motivation for FlashAttention. This is the same arithmetic as in the grouped-query KV-cache question, with smaller numbers.","category":"dl","kind":"basics","difficulty":"easy","tags":["KV cache","memory","GQA"],"origin":"original","status":"verified","leads_to":["m-kv-cache-memory-gqa","m-flash-attention-io"],"entry":"Enter the KV cache size for 1,000 tokens, in megabytes (1 MB $=10^6$ bytes)."},{"id":"m-dlf-lora-count-small","title":"Parameters in one LoRA adapter","prompt":"A weight matrix $W\\in\\mathbb{R}^{512\\times512}$ is frozen. LoRA adds a low-rank update $\\Delta W=BA$ with $B\\in\\mathbb{R}^{512\\times r}$, $A\\in\\mathbb{R}^{r\\times512}$ and $r=4$. How many parameters are trainable in this adapter? How many does $W$ itself have, and what fraction is that?","hints":["Count the entries of $B$ and of $A$ separately."],"answer":"$512\\cdot4+4\\cdot512=4096$ trainable parameters, versus $262{,}144$ in $W$: about $1.6\\%$.","answer_type":"numeric","answer_value":4096.0,"solution":"$B$ has $512\\times4=2048$ entries and $A$ has $4\\times512=2048$, so the adapter has $2dr=4096$ trainable parameters. The frozen $W$ has $512^2=262{,}144$, so the adapter is about $1.6\\%$ of the size. In general a $d\\times d$ matrix has $2dr$ LoRA parameters versus $d^2$, a ratio of $2r/d$.\n\nIntuition: fine-tuning updates often have low intrinsic rank, so a product of two thin matrices can capture them cheaply; the optimiser state and gradients only need to be stored for the adapters. $B$ is initialised to zero (so $\\Delta W=0$ at the start), and after training $BA$ can be merged into $W$ so inference costs nothing extra. Multiply by the number of adapted matrices and layers for the full count in the LoRA parameter-count question.","category":"dl","kind":"basics","difficulty":"easy","tags":["LoRA","fine-tuning","parameter count"],"origin":"original","status":"verified","leads_to":["m-lora-parameter-count","m-lora-mechanics"],"entry":"Enter the number of trainable parameters in the rank-4 LoRA adapter (work out the parameters in $W$ and the fraction too)."},{"id":"m-dlf-training-flops","title":"Estimating training compute with $6ND$","prompt":"Training a dense transformer with $N$ parameters on $D$ tokens costs about $C\\approx6ND$ floating-point operations. For $N=10^9$ parameters and $D=20N=2\\times10^{10}$ tokens (the Chinchilla ratio of about 20 tokens per parameter), what is $C$ in units of $10^{18}$ FLOPs?","hints":["$6\\times10^9\\times2\\times10^{10}=1.2\\times10^{20}$."],"answer":"$C=6\\cdot10^9\\cdot2\\cdot10^{10}=1.2\\times10^{20}$ FLOPs, i.e. $120$ in units of $10^{18}$.","answer_type":"numeric","answer_value":120.0,"solution":"$C\\approx6ND=6\\times10^9\\times2\\times10^{10}=1.2\\times10^{20}$ FLOPs, which is $120\\times10^{18}$. The factor 6 comes from about $2ND$ for the forward pass and $4ND$ for the backward pass (two matrix multiplications per weight). With $D=20N$ we get $C=120N^2$, so doubling the model size at the compute-optimal ratio quadruples the compute.\n\nIntuition: compute grows with both model size and data, so a fixed budget forces a trade-off between a bigger model on fewer tokens and a smaller one on more. Inverting $C=120N^2$ for a given budget gives the compute-optimal model size, which is exactly the Chinchilla question. Trap: this ignores attention's quadratic term and inference cost, which matter for long contexts and serving.","category":"dl","kind":"basics","difficulty":"easy","tags":["scaling laws","compute","Chinchilla"],"origin":"original","status":"verified","leads_to":["m-chinchilla-compute-optimal","m-pretrain-loss-spike-adamw"],"entry":"Enter the training compute $C$ in units of $10^{18}$ FLOPs (e.g. 5 means $5\\times10^{18}$)."}];

mathcal N(0,t)"],["S_T=S_0\\exp\\!\\big((\\mu-\\tfrac12\\sigma^2)T+\\sigma W_T\\big)"]]}]},{"id":"opt","name":"Options","items":[{"t":"Payoffs at expiry","tab":{"h":["","Long","Short"],"r":[["Call","$(S_T-K)^+$","$-(S_T-K)^+$"],["Put","$(K-S_T)^+$","$-(K-S_T)^+$"]]},"f":[["\\text{profit}=\\text{payoff}-\\text{premium paid}"]]},{"t":"Put–call parity","f":[["C-P=S-Ke^{-rT}"]],"n":"European, no dividends; with dividend yield $q$, replace $S$ by $Se^{-qT}$."},{"t":"Black–Scholes","f":[["C=S\\,N(d_1)-Ke^{-rT}N(d_2)"],["P=Ke^{-rT}N(-d_2)-S\\,N(-d_1)"],["d_{1,2}=\\frac{\\ln(S/K)+(r\\pm\\frac12\\sigma^2)T}{\\sigma\\sqrt T}"]],"n":"$N$: standard normal CDF ($\\Phi$, see the normal table); $\\varphi(x)=\\frac1{\\sqrt{2\\pi}}e^{-x^2/2}$."},{"t":"Greeks","tab":{"h":["Greek","Definition","Black–Scholes (call)"],"r":[["Delta","$\\partial V/\\partial S$","$N(d_1)$"],["Gamma","$\\partial^2V/\\partial S^2$","$\\frac{\\varphi(d_1)}{S\\sigma\\sqrt T}$"],["Vega","$\\partial V/\\partial\\sigma$","$S\\varphi(d_1)\\sqrt T$"],["Theta","$\\partial V/\\partial t$",""],["Rho","$\\partial V/\\partial r$","$KTe^{-rT}N(d_2)$"]]}},{"t":"One-step binomial","f":[["q=\\frac{e^{r\\Delta t}-d}{u-d}"],["V=e^{-r\\Delta t}\\big[qV_u+(1-q)V_d\\big]"]],"n":"$q$: risk-neutral probability of the up move."}]},{"id":"mm","name":"Market making","items":[{"t":"Quotes","f":[["\\text{mid}=\\frac{\\text{bid}+\\text{ask}}2"],["\\text{spread}=\\text{ask}-\\text{bid}"]]},{"t":"Edge per trade","f":[["\\text{you buy at the bid: }V-\\text{bid}"],["\\text{you sell at the ask: }\\text{ask}-V"]],"n":"$V$: fair value."},{"t":"P&L","f":[["\\text{P\\&L}=\\text{cash}+\\text{position}\\times\\text{mark}"]]}]},{"id":"stats","name":"Statistics","items":[{"t":"Sample statistics","f":[["\\bar x=\\frac1n\\sum x_i"],["s^2=\\frac1{n-1}\\sum(x_i-\\bar x)^2"],["r=\\frac{\\sum(x_i-\\bar x)(y_i-\\bar y)}{\\sqrt{\\sum(x_i-\\bar x)^2\\,\\sum(y_i-\\bar y)^2}}"]]},{"t":"Least-squares line","f":[["\\hat\\beta=\\frac{\\mathrm{Cov}(x,y)}{\\mathrm{Var}(x)}"],["\\hat\\alpha=\\bar y-\\hat\\beta\\,\\bar x"]]},{"t":"Test statistics","f":[["\\sigma\\text{ known: }z=\\frac{\\bar x-\\mu_0}{\\sigma/\\sqrt n}"],["\\sigma\\text{ unknown: }t=\\frac{\\bar x-\\mu_0}{s/\\sqrt n}"]]},{"t":"Sharpe ratio","f":[["\\frac{\\mu-r_f}{\\sigma}"]]}]},{"id":"series","name":"Sequences & series","items":[{"t":"Arithmetic","f":[["a_n=a_1+(n-1)d"],["S_n=\\tfrac n2(a_1+a_n)"]]},{"t":"Geometric","f":[["a_n=a_1r^{n-1}"],["S_n=a_1\\frac{1-r^n}{1-r}"],["S_\\infty=\\frac{a_1}{1-r}\\ \\ (|r|<1)"]]},{"t":"Power sums","f":[["\\sum_{k=1}^nk=\\frac{n(n+1)}2"],["\\sum_{k=1}^nk^2=\\frac{n(n+1)(2n+1)}6"],["\\sum_{k=1}^nk^3=\\Big(\\frac{n(n+1)}2\\Big)^2"]]},{"t":"Other series","f":[["\\sum_{k\\ge0}\\frac{x^k}{k!}=e^x"],["\\sum_{k\\ge1}kx^{k-1}=\\frac1{(1-x)^2}\\ \\ (|x|<1)"],["H_n=\\sum_{k=1}^n\\frac1k\\approx\\ln n+0.5772"]]},{"t":"Linear recurrences","f":[["a_n=c_1a_{n-1}+c_2a_{n-2}:\\quad x^2=c_1x+c_2,\\quad a_n=Ax_1^n+Bx_2^n"]],"n":"For distinct roots $x_1,x_2$."}]},{"id":"algebra","name":"Algebra & approximations","items":[{"t":"Identities","f":[["(a\\pm b)^2=a^2\\pm2ab+b^2"],["a^2-b^2=(a-b)(a+b)"],["a^3\\pm b^3=(a\\pm b)(a^2\\mp ab+b^2)"]]},{"t":"Logs and exponents","f":[["\\log(ab)=\\log a+\\log b"],["\\log a^b=b\\log a"],["\\log_ba=\\frac{\\ln a}{\\ln b}"]]},{"t":"Small x","f":[["e^x\\approx1+x+\\tfrac{x^2}2"],["\\ln(1+x)\\approx x-\\tfrac{x^2}2"],["(1+x)^n\\approx1+nx"],["\\sqrt{1+x}\\approx1+\\tfrac x2"]]},{"t":"Growth","f":[["\\text{relative change}=\\frac{\\text{new}-\\text{old}}{\\text{old}}"],["(1+r)^n\\approx e^{nr}"],["\\Big(1+\\frac xn\\Big)^n\\to e^x"]]}]},{"id":"ineq","name":"Inequalities","items":[{"t":"Means","f":[["\\frac{a+b}2\\ge\\sqrt{ab}\\ge\\frac{2ab}{a+b}\\quad(a,b>0)"]]},{"t":"Jensen","f":[["f\\text{ convex}\\Rightarrow\\mathbb E[f(X)]\\ge f(\\mathbb E[X])"]]},{"t":"Tail bounds","f":[["\\text{Markov: }P(X\\ge a)\\le\\frac{\\mathbb E[X]}a\\ \\ (X\\ge0)"],["\\text{Chebyshev: }P(|X-\\mu|\\ge k\\sigma)\\le\\frac1{k^2}"]]},{"t":"Stirling","f":[["n!\\approx\\sqrt{2\\pi n}\\,\\Big(\\frac ne\\Big)^n"]]}]}]}};
var CS={kind:lsGet("tpd:cskind","ml")==="tr"?"tr":"ml",q:"",overKind:"",prev:null,qt:null};
function csFine(){return !!(window.matchMedia&&matchMedia("(pointer:fine)").matches);}
/* everything searchable about an item, lower-cased once */
function csHay(it){if(it._h)return it._h;var tab=it.tab?it.tab.h.concat.apply(it.tab.h,it.tab.r).join(" "):"";
  return it._h=[it.t,it.n||"",(it.f||[]).join(" "),tab,(it.plots||[]).map(function(p){return p.l+" "+(p.lg||[]).join(" ");}).join(" "),(it.d||[]).map(function(s){return s.join(" ");}).join(" ")].join(" ").toLowerCase();}
/* pre keeps the sketches' clip-path ids unique when the page and the overlay are both in the document */
function csItem(it,key,pre){var h='<div class="cs-it" data-csi="'+key+'"><h3 class="cs-t tex">'+esc(it.t)+'</h3>';
  if(it.tab)h+='<div class="cs-tabw"><table class="cs-tab tex">'+(it.tab.h.join("")?'<thead><tr>'+it.tab.h.map(function(c){return '<th>'+esc(c)+'</th>';}).join("")+'</tr></thead>':'')+
    '<tbody>'+it.tab.r.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join("")+'</tr>';}).join("")+'</tbody></table></div>';
  if(it.f)h+='<div class="cs-f tex">'+it.f.map(function(f){return '<div class="cs-fl">'+[].concat(f).map(function(p){return '<span class="cs-fp">$\\displaystyle '+esc(p)+'$</span>';}).join("")+'</div>';}).join("")+'</div>';
  if(it.plots)h+='<div class="cs-plots'+(it.plots.length===1?' one':'')+'">'+it.plots.map(function(p){return '<figure class="cs-plot">'+p.svg.replace(/csc(\d+)/g,pre+"$1")+
    '<figcaption class="tex">'+esc(p.l)+'</figcaption>'+(p.lg?'<div class="cs-lg tex">'+p.lg.map(function(l,k){return '<span class="cs-c'+k+'">'+esc(l)+'</span>';}).join("")+'</div>':'')+'</figure>';}).join("")+'</div>';
  if(it.n)h+='<p class="cs-n tex">'+esc(it.n)+'</p>';
  if(it.d)h+='<details class="cs-d"><summary>Derivation</summary><ol class="tex">'+it.d.map(function(s){return '<li>'+(s[0]?'$$'+esc(s[0])+'$$':'')+(s[1]?'<span class="cs-why">'+esc(s[1])+'</span>':'')+'</li>';}).join("")+'</ol></details>';
  return h+'</div>';}
function csRoot(k,pre){var S=CHEAT[k];
  if(!S||!S.topics)return '<div class="card"><p class="small muted">This cheat sheet hasn’t been built yet.</p></div>';
  return '<div class="cs-root" data-csroot="'+k+'"><div class="cs-bar"><b class="cs-title">'+(k==="ml"?"ML":"Trader")+' formula sheet</b><div class="cs-seg" role="group" aria-label="Which sheet">'+[["ml","ML"],["tr","Trader"]].map(function(o){return '<button type="button" data-cskind="'+o[0]+'" aria-pressed="'+(k===o[0])+'">'+o[1]+'</button>';}).join("")+'</div>'+
    '<input type="search" class="cs-q" placeholder="Search this sheet" aria-label="Search the cheat sheet" value="'+esc(CS.q)+'" autocomplete="off">'+(csFine()?'<span class="small muted cs-hint">Alt+C opens it over any page</span>':'')+
    '<div class="cs-chips">'+S.topics.map(function(t){return '<button type="button" class="cs-chip" data-csjump="'+esc(t.id)+'">'+esc(t.name)+'</button>';}).join("")+'</div></div>'+
    '<div class="cs-sheet">'+S.topics.map(function(t,ti){return '<section class="cs-topic" data-cst="'+esc(t.id)+'"><h2>'+esc(t.name)+'</h2>'+t.items.map(function(it,i){return csItem(it,ti+"."+i,pre);}).join("")+'</section>';}).join("")+'</div>'+
    '<p class="small muted cs-none" hidden>Nothing on this sheet matches. Try the other sheet or fewer words.</p></div>';}
/* search hides what doesn't match instead of re-rendering, so the maths isn't typeset again */
function csFilter(root){if(!root)return;var S=CHEAT[root.getAttribute("data-csroot")];if(!S||!S.topics)return;var ws=CS.q.trim().toLowerCase().split(/\s+/).filter(Boolean),any=false;
  var hit=function(s){return ws.every(function(w){return s.indexOf(w)>=0;});};
  S.topics.forEach(function(t,ti){var sec=root.querySelector('[data-cst="'+t.id+'"]');if(!sec)return;var tn=t.name.toLowerCase()+" ",n=0;
    t.items.forEach(function(it,i){var on=!ws.length||hit(tn+csHay(it)),e=sec.querySelector('[data-csi="'+ti+'.'+i+'"]');if(e)e.hidden=!on;if(on)n++;});
    sec.hidden=!n;var c=root.querySelector('[data-csjump="'+t.id+'"]');if(c)c.classList.toggle("off",!n);if(n)any=true;});
  var none=root.querySelector(".cs-none");if(none)none.hidden=any;}
function csJump(root,id){var sec=root.querySelector('[data-cst="'+id+'"]');if(!sec||sec.hidden)return;var bar=root.querySelector(".cs-bar"),sc=root.closest(".cs-pbody");
  var off=(bar?bar.offsetHeight+(parseFloat(getComputedStyle(bar).top)||0):0)+8;
  if(sc)sc.scrollTop+=sec.getBoundingClientRect().top-sc.getBoundingClientRect().top-off;else window.scrollBy(0,sec.getBoundingClientRect().top-off);}
function renderCheat(){el("p-cheat").innerHTML=csRoot(CS.kind,"csp");
  csFilter(el("p-cheat").querySelector(".cs-root"));}
/* the overlay: pulled up from a question (or with Alt+C) without leaving it; kept in the page so it reopens instantly where you left it */
function csOverRender(){var o=el("cs-over");if(!o)return;var b=o.querySelector(".cs-pbody"),hd=o.querySelector("[data-cshead]");CS.overKind=CS.kind;if(hd)hd.textContent=(CS.kind==="ml"?"ML":"Trader")+" formula sheet";b.innerHTML=csRoot(CS.kind,"cso");b.scrollTop=0;csFilter(b.querySelector(".cs-root"));}
function csOpen(k){if(k==="ml"||k==="tr"){CS.kind=k;lsSet("tpd:cskind",k);}
  if(CUR==="cheat"){renderCheat();return;}
  var o=el("cs-over");
  if(!o){o=document.createElement("div");o.id="cs-over";o.className="cs-over";o.hidden=true;
    o.innerHTML='<div class="cs-scrim" data-csclose="1"></div><div class="cs-panel" role="dialog" aria-modal="true" aria-label="Cheat sheet"><div class="cs-phead"><b data-cshead>Formula sheet</b>'+
      (csFine()?'<span class="small muted">Esc or Alt+C closes</span>':'')+'<button type="button" class="mini" data-csclose="1" aria-label="Close the cheat sheet">✕</button></div><div class="cs-pbody"></div></div>';
    document.body.appendChild(o);}
  if(CS.overKind!==CS.kind)csOverRender();
  if(o.hidden)CS.prev=document.activeElement;o.hidden=false;document.body.classList.add("cs-lock");
  if(csFine()){var q=o.querySelector(".cs-q");if(q)q.focus({preventScroll:true});}}
function csClose(){var o=el("cs-over");if(!o||o.hidden)return;o.hidden=true;document.body.classList.remove("cs-lock");
  var p=CS.prev;CS.prev=null;if(p&&p.focus&&document.contains(p))p.focus({preventScroll:true});}
document.addEventListener("click",function(ev){var t=ev.target&&ev.target.closest?ev.target.closest("[data-cskind],[data-csjump],[data-csopen],[data-csclose]"):null;if(!t)return;var d=t.dataset,root=t.closest(".cs-root");
  if(d.csopen){csOpen(d.csopen);return;}
  if(d.csclose){csClose();return;}
  if(d.cskind){if(root&&root.getAttribute("data-csroot")===d.cskind)return;CS.kind=d.cskind;lsSet("tpd:cskind",CS.kind);if(t.closest("#cs-over"))csOverRender();else renderCheat();return;}
  if(d.csjump&&root)csJump(root,d.csjump);});
document.addEventListener("input",function(ev){var t=ev.target;if(!t||!t.classList||!t.classList.contains("cs-q"))return;CS.q=t.value;var root=t.closest(".cs-root");
  clearTimeout(CS.qt);CS.qt=setTimeout(function(){csFilter(root);},120);});
/* capture phase, so Esc closes the overlay before any page handler sees it */
document.addEventListener("keydown",function(ev){var o=el("cs-over"),open=!!(o&&!o.hidden);
  if(open&&ev.key==="Escape"){ev.preventDefault();ev.stopPropagation();csClose();return;}
  if(!ev.altKey||ev.ctrlKey||ev.metaKey||ev.code!=="KeyC")return;ev.preventDefault();ev.stopPropagation();
  if(open){csClose();return;}if(SH.run)return;
  if(CUR==="cheat"){var q=document.querySelector("#p-cheat .cs-q");if(q)q.focus();return;}
  csOpen(CUR==="mlbank"?"ml":(CUR==="sbank"||CUR==="sharp")?"tr":"");},true);


/* ============ phones: wide formulas, and an on-screen keypad for timed rounds (phone number pads lack Enter, minus and slash) ============ */
var texScan0=texScan;
texScan=function(){texScan0();document.querySelectorAll(".sh-prompt,.sh-sol p,.sh-final,.sh-hint,.sh-fmt,.sh-lesson p,.sh-ex .tex p,.sh-traps li,.cs-n").forEach(function(e){
  if(!e.classList.contains("tex-wide")&&e.scrollWidth>e.clientWidth+1)e.classList.add("tex-wide");});};
var TOUCH=!!(window.matchMedia&&matchMedia("(pointer:coarse)").matches);
function kpPad(){var R=SH.run,b=function(k,lab,cls){return '<button type="button" class="kp-k'+(cls?' '+cls:'')+'" data-kp="'+k+'" aria-label="'+(k==="back"?"Delete":lab)+'">'+lab+'</button>';},
    row=function(ks,fn){return ks.map(function(k){return b(k,k);}).join("")+fn;};
  return '<div class="kp">'+row(["1","2","3"],b("back","⌫","kp-fn"))+row(["4","5","6"],b("-","−","kp-fn"))+row(["7","8","9"],b("/","/","kp-fn"))+
    b(".",".")+b("0","0")+(R.submit?b("ok","Submit","kp-go"):b("skip","Skip","kp-go"))+'</div>'+
    '<p class="small muted">'+(R.submit?'Submit after each answer'+(R.penalty?' · a wrong answer costs '+R.penalty+' point':'')+' · no skipping':'It moves on by itself when the answer is right')+'. Fractions as 3/8; decimals to at least 3 places.</p>'+
    '<button type="button" class="mini kp-end" data-kp="end">End round</button>';}
function kpPress(k){var i=el("sh-in"),R=SH.run;if(!i||!R)return;
  if(k==="end"){shFinish(true);return;}
  if(k==="skip"){shAnswer(false);return;}
  if(k==="ok"){if(i.value.trim())shAnswer(shRight(R.cur,i.value));return;}
  i.value=k==="back"?i.value.slice(0,-1):i.value+k;
  if(!R.submit&&shRight(R.cur,i.value))shAnswer(true);}
if(TOUCH){
  var shTrainView0=shTrainView;
  shTrainView=function(){var h=shTrainView0();if(!SH.run)return h;
    return h.replace('inputmode="decimal" autocomplete="off" aria-label="Answer">','inputmode="none" readonly autocomplete="off" aria-label="Answer">'+kpPad())
      .replace(/<p class="small muted">[^<]*\. Fractions as 3\/8; decimals to at least 3 places\.<\/p><\/div>$/,'</div>');};
  /* pointerdown, not click: it reacts on touch, and quick repeated taps aren't read as a double-tap */
  document.addEventListener("pointerdown",function(ev){var b=ev.target&&ev.target.closest?ev.target.closest("[data-kp]"):null;if(!b)return;ev.preventDefault();
    b.classList.add("on");setTimeout(function(){b.classList.remove("on");},90);kpPress(b.dataset.kp);});
  /* a tablet with a keyboard: the field is read-only (so no on-screen keyboard), so type into it here */
  document.addEventListener("keydown",function(ev){var t=ev.target;if(!SH.run||!t||t.id!=="sh-in"||!t.readOnly||ev.ctrlKey||ev.metaKey||ev.altKey)return;
    if(/^[0-9.\/-]$/.test(ev.key)){ev.preventDefault();kpPress(ev.key);}else if(ev.key==="Backspace"){ev.preventDefault();kpPress("back");}});
  /* opening a question shouldn't throw the keyboard up over it */
  var shOpened="",shNoKbd=function(){var a=document.activeElement;if(a&&a.id==="sh-qa"&&SH.open!==shOpened)a.blur();shOpened=SH.open;},renderSbank0=renderSbank,renderMlbank0=renderMlbank;
  renderSbank=function(){renderSbank0();shNoKbd();};
  renderMlbank=function(){renderMlbank0();shNoKbd();};}

/* ============ boot ============ */
applyTheme(currentTheme());load();go(lsGet("tp:tab","sharp"));
})();
