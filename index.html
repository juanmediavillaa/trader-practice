: instead of waiting for the full return as Monte Carlo does, it uses the current estimate of the next state's value, which is available immediately but biased because that estimate may be wrong. That gives low variance (one random reward) at the cost of some bias, the trade-off at the heart of the Monte Carlo vs TD comparison, and the same update with action values gives SARSA and Q-learning. Trap: using the old $V(s)$ rather than $V(s')$ inside the target.","category":"rl","kind":"basics","difficulty":"easy","tags":["TD learning","bootstrapping","TD error"],"origin":"original","status":"verified","leads_to":["m-rl-mc-vs-td","m-rl-sarsa-vs-qlearning"],"entry":"Enter the new value $V(s)$ after the update (work out the TD error $\\delta$ too; the solution covers it)."},{"id":"m-rl-f-sarsa-vs-q-target","title":"SARSA target versus Q-learning target","prompt":"You are in state $s'$ with $Q(s',a_1)=2$ and $Q(s',a_2)=6$. The previous step gave reward $r=1$, and $\\gamma=0.9$. The $\\epsilon$-greedy behaviour policy happens to choose the exploratory action $a'=a_1$ in $s'$. Compute the SARSA target and the Q-learning target, and report how much larger the Q-learning target is.","hints":["SARSA uses the action actually taken, $Q(s',a')$. Q-learning uses $\\max_aQ(s',a)$."],"answer":"SARSA target $=2.8$, Q-learning target $=6.4$; difference $3.6$.","answer_type":"numeric","answer_value":3.6,"solution":"SARSA target: $1+0.9\\times2=2.8$. Q-learning target: $1+0.9\\times\\max(2,6)=6.4$. The difference is $3.6$. SARSA is on-policy: its target contains the exploratory moves the agent really makes, so it learns the value of the $\\epsilon$-greedy policy, including the risk of random slips. Q-learning is off-policy: it always bootstraps from the best next action, so it learns the value of the greedy policy whatever the agent does. In the cliff-walking example SARSA learns the safer route away from the cliff while Q-learning learns the shorter risky one. Trap: thinking Q-learning ignores exploration when acting. It only ignores it in the target.","category":"rl","kind":"basics","difficulty":"easy","tags":["SARSA","Q-learning","on-policy","off-policy"],"origin":"original","status":"verified","leads_to":["m-rl-sarsa-vs-qlearning","m-rl-dqn-diverges"],"entry":"Enter how much larger the Q-learning target is than the SARSA target (work out each target too)."},{"id":"m-rl-f-max-difference","title":"The max of two vectors changes by no more than the vectors do","prompt":"Take $x=(1,5,2)$ and $y=(2,3,2)$. (a) Compute $|\\max_ix_i-\\max_iy_i|$ and $\\max_i|x_i-y_i|$. (b) Explain in a couple of lines why the first is always at most the second, for any vectors.","hints":["If $i^*$ is the index of the max of $x$, then $\\max x-\\max y\\le x_{i^*}-y_{i^*}$ because $\\max y\\ge y_{i^*}$."],"answer":"(a) Both equal $2$. (b) $|\\max x-\\max y|\\le\\max|x-y|$, because the max can move by at most as much as the largest single coordinate moves.","answer_type":"free-text","solution":"(a) $\\max x=5$ and $\\max y=3$, so the first quantity is $2$; coordinatewise differences are $1,2,0$, so the second is also $2$. (b) Let $i^*$ be the index where $x$ is largest. Then $\\max x-\\max y\\le x_{i^*}-y_{i^*}\\le\\max_i|x_i-y_i|$, since $\\max y\\ge y_{i^*}$. Swapping the roles of $x$ and $y$ gives the bound on the other side, so $|\\max x-\\max y|\\le\\max|x-y|$. This is the key inequality in the proof that the Bellman optimality operator is a $\\gamma$-contraction in sup norm: the $\\max_b$ over next actions cannot amplify differences between two Q tables, and the factor $\\gamma$ then shrinks them. Trap: believing a max is sensitive to many coordinates; it is only as sensitive as the single worst coordinate.","category":"rl","kind":"basics","difficulty":"easy","tags":["contraction","max inequality","sup norm"],"origin":"original","status":"self-marked","leads_to":["m-rl-bellman-contraction","m-rl-odd-bellman-operator"]},{"id":"m-rl-f-softmax-score","title":"Score function of a two-action softmax policy","prompt":"A policy has two actions with $\\pi(a_1)=\\sigma(\\theta)=\\frac{1}{1+e^{-\\theta}}$ and $\\pi(a_2)=1-\\sigma(\\theta)$. Show that $\\frac{d}{d\\theta}\\log\\pi(a_1)=1-\\pi(a_1)$ and evaluate it at $\\theta=1$ (3 decimal places is fine).","hints":["$\\log\\sigma(\\theta)=-\\log(1+e^{-\\theta})$, and $\\sigma'(\\theta)=\\sigma(1-\\sigma)$."],"answer":"$1-\\sigma(1)\\approx0.269$","answer_type":"numeric","answer_value":0.2689414,"solution":"Using $\\sigma'=\\sigma(1-\\sigma)$, $\\frac{d}{d\\theta}\\log\\sigma(\\theta)=\\frac{\\sigma'}{\\sigma}=1-\\sigma(\\theta)$. At $\\theta=1$, $\\sigma(1)=0.7311$, so the score is $0.2689$. Similarly $\\frac{d}{d\\theta}\\log\\pi(a_2)=-\\sigma(\\theta)$. The derivative of $\\log\\pi$ is the score function, and REINFORCE moves $\\theta$ by $\\alpha\\,R\\,\\nabla\\log\\pi(A)$: the update is small when the action chosen was already very likely (here $1-\\pi(a_1)\\to0$) and large when it was unlikely. The quadratic-softmax policy gradient question is the same calculation for a different parameterisation of $\\pi$. Trap: differentiating $\\pi$ rather than $\\log\\pi$, which loses the $1/\\pi$ factor.","category":"rl","kind":"basics","difficulty":"easy","tags":["policy gradient","score function","sigmoid"],"origin":"original","status":"verified","leads_to":["m-rl-quadratic-softmax-pg","m-rl-policy-gradient-baseline"],"entry":"Enter $\\frac{d}{d\\theta}\\log\\pi(a_1)$ evaluated at $\\theta=1$."},{"id":"m-rl-f-score-zero-mean","title":"Why the expected score is zero (and so baselines are free)","prompt":"For a discrete policy $\\pi_\\theta(a)$, show that $\\mathbb E_{a\\sim\\pi_\\theta}[\\nabla_\\theta\\log\\pi_\\theta(a)]=0$. Then say in one sentence what this implies for subtracting a constant baseline $b$ from the reward in the update $\\nabla\\log\\pi_\\theta(a)\\,(R-b)$.","hints":["Use $\\nabla\\log\\pi=\\nabla\\pi/\\pi$, then swap $\\nabla$ with the sum over actions."],"answer":"$\\sum_a\\pi\\nabla\\log\\pi=\\sum_a\\nabla\\pi=\\nabla1=0$, so subtracting a baseline that does not depend on $a$ does not change the expected update (no bias), though it can reduce variance.","answer_type":"free-text","solution":"$\\mathbb E[\\nabla\\log\\pi_\\theta(a)]=\\sum_a\\pi_\\theta(a)\\frac{\\nabla\\pi_\\theta(a)}{\\pi_\\theta(a)}=\\sum_a\\nabla\\pi_\\theta(a)=\\nabla\\sum_a\\pi_\\theta(a)=\\nabla1=0$. Therefore for any $b$ that does not depend on the action, $\\mathbb E[\\nabla\\log\\pi_\\theta(a)\\,b]=b\\cdot0=0$: subtracting the baseline leaves the expected gradient $\\nabla J$ unchanged, so the estimator stays unbiased. A good baseline (such as an estimate of the average reward or of $v(s)$) can reduce variance, because it stops all-positive rewards from pushing up every sampled action. This is exactly the step needed in the derivation that a baseline is unbiased. Trap: letting the baseline depend on the action $a$; then it no longer factors out of the expectation and does introduce bias.","category":"rl","kind":"basics","difficulty":"easy","tags":["policy gradient","baseline","score function"],"origin":"original","status":"self-marked","leads_to":["m-rl-policy-gradient-baseline","m-rl-gaussian-policy-entropy"]},{"id":"m-rl-f-gaussian-reinforce","title":"One REINFORCE step for a Gaussian mean","prompt":"A policy is $\\pi(A)=\\mathcal N(A\\mid\\mu,\\sigma^2)$ with $\\mu=1$, $\\sigma=2$. You sample $A=3$ and observe return $G=4$. The score for the mean is $\\partial_\\mu\\log\\pi(A)=\\frac{A-\\mu}{\\sigma^2}$. With step size $\\alpha=0.1$, what is the new $\\mu$ after the REINFORCE update $\\mu\\leftarrow\\mu+\\alpha G\\,\\partial_\\mu\\log\\pi(A)$?","hints":["First compute the score: $(3-1)/4$. Then multiply by $\\alpha G=0.4$."],"answer":"$1.2$","answer_type":"numeric","answer_value":1.2,"solution":"The score is $(3-1)/2^2=0.5$, so $\\mu\\leftarrow1+0.1\\times4\\times0.5=1.2$. The mean moves towards the sampled action because the return was positive, and it would move away if $G$ were negative. Differentiating $\\log\\mathcal N=-\\log\\sigma-\\frac{(A-\\mu)^2}{2\\sigma^2}+\\text{const}$ with respect to $\\sigma$ gives $\\frac{(A-\\mu)^2-\\sigma^2}{\\sigma^3}$, which says that the width grows when the sampled action was further than one standard deviation from the mean. That is the ingredient for the entropy part of the Gaussian policy gradient question. Trap: forgetting that the step is scaled by the raw return $G$, so large unnormalised returns cause huge updates.","category":"rl","kind":"basics","difficulty":"easy","tags":["policy gradient","Gaussian policy","REINFORCE"],"origin":"original","status":"verified","leads_to":["m-rl-gaussian-policy-entropy","m-rl-quadratic-softmax-pg"],"entry":"Enter the new value of $\\mu$ after the REINFORCE update."},{"id":"m-ir-f-precision-recall-f1","title":"Precision, recall and F1 from counts","prompt":"A search system returns 5 documents, 2 of which are relevant. The collection contains 4 relevant documents in total. Compute precision, recall and then $F_1=\\frac{2PR}{P+R}$. Report $F_1$ (3 decimal places).","hints":["Precision divides by what you returned; recall divides by what exists."],"answer":"$P=0.4$, $R=0.5$, $F_1=0.444$","answer_type":"numeric","answer_value":0.44444,"solution":"Precision is relevant retrieved over retrieved: $2/5=0.4$. Recall is relevant retrieved over all relevant: $2/4=0.5$. The F1 score is their harmonic mean, $\\frac{2(0.4)(0.5)}{0.9}=0.444$; the harmonic mean is dragged towards the smaller of the two, so you cannot score well by being excellent at only one. These are set-based measures, with no notion of rank, and every ranked measure in the evaluation question is a refinement of them. Trap: dividing recall by the number retrieved instead of by the total number of relevant documents.","category":"ir","kind":"basics","difficulty":"easy","tags":["precision","recall","F1"],"origin":"original","status":"verified","leads_to":["m-ir-eval-measures"],"entry":"Enter $F_1$ (work out precision and recall too; the solution covers them)."},{"id":"m-ir-f-average-precision","title":"Average precision for a short ranking","prompt":"A ranking of 4 documents has relevance $[+,-,+,-]$. The collection has 3 relevant documents in total, so one is never retrieved. Average precision is the mean, over all relevant documents, of the precision at the rank where each is retrieved (and $0$ for a relevant document that is not retrieved). Compute AP.","hints":["The relevant documents are at ranks 1 and 3: precisions $1/1$ and $2/3$. Divide the sum by 3."],"answer":"$\\frac{1+2/3}{3}=0.556$","answer_type":"numeric","answer_value":0.55556,"solution":"At rank 1 the precision is $1/1=1$, at rank 3 it is $2/3$; the missing third relevant document contributes $0$. So $\\text{AP}=(1+0.667+0)/3=0.556$. AP rewards putting relevant documents early (their precision values are high) and also penalises missing relevant documents (they still count in the denominator). MAP is just AP averaged over queries. This is the part of the precision, recall, P@5 and AP evaluation question that students most often slip on. Trap: dividing by the number of relevant documents retrieved (2) instead of the total number of relevant documents (3).","category":"ir","kind":"basics","difficulty":"easy","tags":["average precision","ranking evaluation"],"origin":"original","status":"verified","leads_to":["m-ir-eval-measures","m-ir-significance-testing-scenario"],"entry":"Enter the average precision (AP) of the ranking, counting the never-retrieved relevant document as 0."},{"id":"m-ir-f-dcg","title":"Computing DCG with graded relevance","prompt":"A ranking has graded relevance $[3,0,2]$ at ranks 1, 2, 3. Using $\\text{DCG@}k=\\sum_{i=1}^k\\frac{\\text{rel}_i}{\\log_2(i+1)}$, compute DCG@3. (Recall $\\log_2 2=1$, $\\log_2 3=1.585$, $\\log_2 4=2$.)","hints":["The discount at rank 1 is $\\log_22=1$, at rank 3 it is $\\log_24=2$."],"answer":"$3+0+2/2=4$","answer_type":"numeric","answer_value":4.0,"solution":"$\\text{DCG@3}=\\frac{3}{1}+\\frac{0}{1.585}+\\frac{2}{2}=3+0+1=4$. Each document contributes its relevance grade divided by a discount that grows slowly with rank, so a grade-3 document at rank 1 counts fully while the same document at rank 3 would count only half. DCG therefore rewards both high grades and good ordering. On its own it is not comparable across queries, because the maximum achievable value differs, which is why the next question normalises it. Trap: using $\\log_2 i$, which gives a division by zero at rank 1 (the $+1$ is there for that reason).","category":"ir","kind":"basics","difficulty":"easy","tags":["DCG","graded relevance"],"origin":"original","status":"verified","leads_to":["m-ir-ndcg-calc"],"entry":"Enter DCG@3 for graded relevance $[3,0,2]$ (not normalised)."},{"id":"m-ir-f-ndcg","title":"Normalising DCG against the ideal ranking","prompt":"A system returns three documents with graded relevance $[2,3,1]$ in that order. (a) What is the ideal ordering of the same three documents? (b) Compute nDCG@3 $=\\text{DCG@3}/\\text{IDCG@3}$ using discounts $1,\\ 0.631,\\ 0.5$ for ranks 1, 2, 3 (these are $1/\\log_2(i+1)$).","hints":["Ideal is sorted in decreasing relevance: $[3,2,1]$. Compute both sums with the same discounts."],"answer":"DCG $=2+3(0.631)+1(0.5)=4.393$; IDCG $=3+2(0.631)+0.5=4.762$; nDCG $\\approx0.923$.","answer_type":"numeric","answer_value":0.9225,"solution":"DCG of the returned order: $2(1)+3(0.631)+1(0.5)=4.393$. The ideal order is $[3,2,1]$, with IDCG $=3(1)+2(0.631)+1(0.5)=4.762$. So nDCG@3 $=4.393/4.762\\approx0.923$. Dividing by the ideal value puts the score in $[0,1]$ so that queries with different numbers of relevant documents can be averaged, and the only loss here comes from swapping the top two documents. This is the same two-step recipe (DCG, then ideal DCG) that the nDCG@5 calculation uses. Trap: computing the ideal ordering from the whole collection when the question restricts it to the returned documents (check which definition is asked for).","category":"ir","kind":"basics","difficulty":"easy","tags":["nDCG","ranking evaluation"],"origin":"original","status":"verified","leads_to":["m-ir-ndcg-calc","m-ir-eval-measures"],"entry":"Enter nDCG@3 as a number between 0 and 1 (work out the ideal ordering too; the solution covers it)."},{"id":"m-ir-f-heaps-ratio","title":"Heaps' law as a ratio","prompt":"Heaps' law says the vocabulary size is $V=kN^\\beta$ for a collection of $N$ tokens. A collection of $N_1=1$ million tokens has $V_1=10{,}000$ distinct terms. With $\\beta=0.5$, how many distinct terms do you expect at $N_2=100$ million tokens? (Hint: you do not need $k$.)","hints":["Divide the two equations: $V_2/V_1=(N_2/N_1)^\\beta$."],"answer":"$10{,}000\\times100^{0.5}=100{,}000$","answer_type":"numeric","answer_value":100000.0,"solution":"The unknown constant $k$ cancels in the ratio: $V_2=V_1(N_2/N_1)^\\beta=10{,}000\\times100^{0.5}=10{,}000\\times10=100{,}000$. So a 100-fold larger collection has only a 10-fold larger vocabulary: vocabulary grows sub-linearly but never stops growing. That is the practical point of Heaps' law for index design (the dictionary keeps growing, so it must be compressed and dynamic) and it is exactly the calculation in the Heaps' law question, with different numbers. Trap: assuming vocabulary scales linearly with tokens, or forgetting that the answer is very sensitive to $\\beta$ (try $0.6$: you get about $16$ times rather than $10$).","category":"ir","kind":"basics","difficulty":"easy","tags":["Heaps' law","vocabulary growth"],"origin":"original","status":"verified","leads_to":["m-ir-heaps-law"],"entry":"Enter the expected number of distinct terms at 100 million tokens."},{"id":"m-ir-f-unigram-sequence","title":"Probability of a word sequence under a unigram model","prompt":"A unigram language model has $p(\\text{text})=0.1$ and $p(\\text{mining})=0.05$. Words are drawn independently. (a) What is the probability of the sequence \"text mining\"? (b) Of \"mining text\"? (c) Would a bigram model necessarily give the same two probabilities? Give (a) as your numeric answer.","hints":["Independence means the sequence probability is the product of the word probabilities."],"answer":"(a) $0.005$; (b) also $0.005$; (c) no, a bigram model conditions on the previous word, so order matters.","answer_type":"numeric","answer_value":0.005,"solution":"Under a unigram model $p(w_1w_2)=p(w_1)p(w_2)=0.1\\times0.05=0.005$ and multiplication is commutative, so \"mining text\" has exactly the same probability: a unigram model is a bag of words and ignores order. A bigram model uses $p(w_1)\\,p(w_2\\mid w_1)$, so $p(\\text{mining}\\mid\\text{text})$ and $p(\\text{text}\\mid\\text{mining})$ can differ greatly and \"text mining\" can be much likelier than \"mining text\". For retrieval, the query likelihood model scores a document by the product of its (smoothed) word probabilities for the query terms, which is the structure of the smoothing question. Trap: adding the probabilities instead of multiplying them.","category":"ir","kind":"basics","difficulty":"easy","tags":["language model","unigram","independence"],"origin":"original","status":"verified","leads_to":["m-ir-unigram-lm-smoothing"],"entry":"Enter the probability of the sequence \"text mining\" (work out parts (b) and (c) too; the solution covers them)."},{"id":"m-ir-f-jm-smoothing","title":"Jelinek-Mercer smoothing of one word probability","prompt":"A document has $|d|=50$ words and contains the word \"graph\" 3 times, so the maximum-likelihood estimate is $p_{ML}(\\text{graph}\\mid d)=0.06$. The collection model has $p(\\text{graph}\\mid C)=0.01$. With Jelinek-Mercer smoothing, $p(w\\mid d)=(1-\\lambda)p_{ML}(w\\mid d)+\\lambda\\,p(w\\mid C)$, and $\\lambda=0.5$, what is the smoothed $p(\\text{graph}\\mid d)$? What would the unsmoothed estimate be for a query word that never appears in $d$?","hints":["Take half the document estimate and half the collection estimate."],"answer":"$0.5(0.06)+0.5(0.01)=0.035$. The unsmoothed estimate for an unseen word is $0$.","answer_type":"numeric","answer_value":0.035,"solution":"$p(\\text{graph}\\mid d)=0.5\\times0.06+0.5\\times0.01=0.03+0.005=0.035$. Smoothing is needed because the maximum-likelihood estimate gives probability $0$ to any word absent from the document; in query likelihood the query probability is a product, so a single missing term would make the whole score $0$ regardless of how well the other terms match. Mixing in the collection model gives every word a small non-zero probability, and as a side effect it acts like an IDF weighting. Dirichlet smoothing, in the next questions, is the same idea with a weight that depends on the document length. Trap: forgetting that the two weights must sum to $1$.","category":"ir","kind":"basics","difficulty":"easy","tags":["smoothing","Jelinek-Mercer","query likelihood"],"origin":"original","status":"verified","leads_to":["m-ir-unigram-lm-smoothing","m-ir-dirichlet-smoothing-derivation"],"entry":"Enter the smoothed $p(\\text{graph}\\mid d)$ with $\\lambda=0.5$ (work out the unseen-word case too; the solution covers it)."},{"id":"m-ir-f-beta-pseudocounts","title":"A prior acts like pseudo-counts (the coin version)","prompt":"A coin has unknown heads probability $\\theta$ with prior $\\text{Beta}(2,2)$. You see 3 heads and 1 tail. (a) What is the posterior? (b) What is its mean? (c) How would you describe the effect of the prior in terms of imaginary flips?","hints":["Add heads to the first parameter and tails to the second. The mean of $\\text{Beta}(a,b)$ is $a/(a+b)$."],"answer":"(a) $\\text{Beta}(5,3)$. (b) $5/8=0.625$. (c) The prior adds 2 imaginary heads and 2 imaginary tails.","answer_type":"numeric","answer_value":0.625,"solution":"Beta is conjugate to the Bernoulli/binomial likelihood, so the posterior is $\\text{Beta}(2+3,\\,2+1)=\\text{Beta}(5,3)$, with mean $5/8=0.625$. Compare with the maximum-likelihood estimate $3/4=0.75$: the prior pulls the estimate towards $0.5$ as if we had also seen 2 extra heads and 2 extra tails. The multinomial analogue of this is the Dirichlet prior, whose parameters $\\alpha_w$ are pseudo-counts of each word, and the posterior mean $\\frac{c_w+\\alpha_w}{\\sum c+\\sum\\alpha}$ is exactly the form of Dirichlet-prior smoothing in the retrieval derivation. Trap: using the mode, $(a-1)/(a+b-2)$, which gives $0.667$ and is a different estimator.","category":"ir","kind":"basics","difficulty":"easy","tags":["Beta distribution","conjugacy","pseudo-counts"],"origin":"original","status":"verified","leads_to":["m-ir-dirichlet-smoothing-derivation","m-ir-unigram-lm-smoothing"],"entry":"Enter the posterior mean of $\\theta$ (work out the posterior and the imaginary-flips description too; the solution covers them)."},{"id":"m-ir-f-dirichlet-smoothing","title":"Dirichlet smoothing of one word probability","prompt":"A document with $|d|=40$ words contains the word \"kernel\" twice. The collection model has $p(\\text{kernel}\\mid C)=0.01$. With Dirichlet smoothing $p(w\\mid d)=\\frac{c(w,d)+\\mu p(w\\mid C)}{|d|+\\mu}$ and $\\mu=100$, compute $p(\\text{kernel}\\mid d)$. (Then write it as $\\frac{|d|}{|d|+\\mu}p_{ML}+\\frac{\\mu}{|d|+\\mu}p(w\\mid C)$ to see the weights.)","hints":["The numerator is $2+100\\times0.01=3$ and the denominator is $140$."],"answer":"$3/140\\approx0.0214$; weights $40/140=0.286$ on the document and $100/140=0.714$ on the collection.","answer_type":"numeric","answer_value":0.0214286,"solution":"Numerator $2+100(0.01)=3$, denominator $40+100=140$, giving $0.0214$. As an interpolation, the weight on the document's own estimate $2/40=0.05$ is $40/140=0.286$ and the weight on $p(w\\mid C)=0.01$ is $0.714$, and $0.286(0.05)+0.714(0.01)=0.0214$. Unlike Jelinek-Mercer, the collection weight $\\mu/(|d|+\\mu)$ falls as the document gets longer: a long document has more evidence of its own and needs less help. That is the key point of the Dirichlet derivation, where the same expression appears as a posterior mean with pseudo-counts $\\mu p(w\\mid C)$. Trap: treating $\\mu$ as a probability between $0$ and $1$ rather than a pseudo-count (a number of words).","category":"ir","kind":"basics","difficulty":"easy","tags":["smoothing","Dirichlet prior","query likelihood"],"origin":"original","status":"verified","leads_to":["m-ir-dirichlet-smoothing-derivation","m-ir-unigram-lm-smoothing"],"entry":"Enter the Dirichlet-smoothed $p(\\text{kernel}\\mid d)$ with $\\mu=100$ (work out the weights too; the solution covers them)."},{"id":"m-ir-f-bm25-tf-factor","title":"BM25 term-frequency factor with length normalisation","prompt":"The term-frequency factor of BM25 is $\\frac{f(k_1+1)}{f+k_1\\big(1-b+b\\frac{|d|}{\\text{avgdl}}\\big)}$. For a term with $f=3$ occurrences in a document of length $|d|=60$ when $\\text{avgdl}=100$, $k_1=1.2$ and $b=0.75$, compute the factor. Is the document favoured or penalised for its length?","hints":["The length normaliser is $1-0.75+0.75\\times0.6$. The factor is bounded above by $k_1+1=2.2$."],"answer":"Normaliser $0.7$; factor $=\\frac{3\\times2.2}{3+1.2\\times0.7}=1.719$. A short document is favoured (the factor is higher than for an average-length one).","answer_type":"numeric","answer_value":1.71875,"solution":"Length normaliser: $1-0.75+0.75\\times0.6=0.7$. Denominator: $3+1.2\\times0.7=3.84$. Factor: $\\frac{3\\times2.2}{3.84}=1.719$. For an average-length document the normaliser would be $1$, giving $6.6/4.2=1.571$, so the shorter document scores more: a given count of a term is more surprising in a short document. The factor saturates at $k_1+1=2.2$ as $f\\to\\infty$, so repeated occurrences have diminishing returns, and $b$ controls how strongly length matters ($b=0$ ignores length, $b=1$ fully normalises). Multiply by the IDF to obtain the full BM25 term score used in the BM25 calculation. Trap: dividing $|d|$ by the wrong quantity; it is relative to the average document length.","category":"ir","kind":"basics","difficulty":"easy","tags":["BM25","term frequency saturation","length normalisation"],"origin":"original","status":"verified","leads_to":["m-ir-bm25-score-calc"],"entry":"Enter the BM25 term-frequency factor (work out whether the document is favoured or penalised too; the solution covers it)."},{"id":"m-ir-f-plsa-mixture","title":"The pLSA word probability as a topic mixture","prompt":"In pLSA, $p(w\\mid d)=\\sum_zp(w\\mid z)\\,p(z\\mid d)$. A document has topic mixture $p(z_1\\mid d)=0.7$, $p(z_2\\mid d)=0.3$. The word \"gradient\" has $p(\\text{gradient}\\mid z_1)=0.1$ and $p(\\text{gradient}\\mid z_2)=0.02$. What is $p(\\text{gradient}\\mid d)$?","hints":["Weight each topic's word probability by how much of the document belongs to that topic, then add."],"answer":"$0.7(0.1)+0.3(0.02)=0.076$","answer_type":"numeric","answer_value":0.076,"solution":"$p(\\text{gradient}\\mid d)=0.7\\times0.1+0.3\\times0.02=0.07+0.006=0.076$. The idea is that each document is a mixture of topics, and each topic is a distribution over words; to generate a word, pick a topic with probability $p(z\\mid d)$ and then a word from that topic. Unlike LSA, which factorises the count matrix with an SVD whose entries can be negative, every quantity here is a probability. The mixture weights $p(z\\mid d)$ are free parameters for each training document in pLSA (so they grow with the corpus and a new document has none), while LDA puts a Dirichlet prior on them, which is the distinction asked in the LSA/pLSA/LDA question. Trap: thinking the topic probabilities must be summed without weights.","category":"ir","kind":"basics","difficulty":"easy","tags":["pLSA","topic model","mixture"],"origin":"original","status":"verified","leads_to":["m-ir-lsa-plsa-lda"],"entry":"Enter $p(\\text{gradient}\\mid d)$ as a probability."},{"id":"m-ir-f-neg-sampling-loss","title":"Skip-gram negative-sampling loss for one pair","prompt":"For a centre word with vector $v$, a true context word has score $u_c^\\top v=2$ and one sampled negative word has score $u_n^\\top v=1$. The negative-sampling loss is $-\\log\\sigma(u_c^\\top v)-\\log\\sigma(-u_n^\\top v)$, with $\\sigma(z)=1/(1+e^{-z})$. Compute it (natural logs).","hints":["$-\\log\\sigma(2)=\\log(1+e^{-2})$ and $-\\log\\sigma(-1)=\\log(1+e^{1})$."],"answer":"$0.1269+1.3133\\approx1.440$","answer_type":"numeric","answer_value":1.4402,"solution":"The positive term is $-\\log\\sigma(2)=\\log(1+e^{-2})=0.127$: small, because the true pair already has a high score. The negative term is $-\\log\\sigma(-1)=\\log(1+e)=1.313$: large, because the sampled negative word still scores positively and should be pushed to a negative score. Minimising the sum raises scores for observed pairs and lowers them for random pairs. This replaces the full softmax over the vocabulary, whose normaliser costs $O(|V|)$ per update, with $k+1$ cheap binary logistic terms; that is the negative-sampling answer. Trap: using $\\sigma(u_n^\\top v)$ rather than $\\sigma(-u_n^\\top v)$ for the negative term.","category":"ir","kind":"basics","difficulty":"easy","tags":["word2vec","negative sampling","logistic loss"],"origin":"original","status":"verified","leads_to":["m-ir-negative-sampling-analogies"],"entry":"Enter the total negative-sampling loss for one true context word and one negative, in nats (natural log)."},{"id":"m-ir-f-analogy-cosine","title":"Word analogies as vector arithmetic with cosine similarity","prompt":"Toy 2-D embeddings: king $=(3,1)$, man $=(2,0)$, woman $=(2,2)$, queen $=(2,3)$. Compute $q=\\text{king}-\\text{man}+\\text{woman}$ and then the cosine similarity between $q$ and queen.","hints":["$\\cos(a,b)=\\frac{a\\cdot b}{\\|a\\|\\|b\\|}$. First find $q$ componentwise."],"answer":"$q=(3,3)$; $\\cos=\\frac{15}{\\sqrt{18}\\sqrt{13}}\\approx0.981$","answer_type":"numeric","answer_value":0.9806,"solution":"$q=(3,1)-(2,0)+(2,2)=(3,3)$. Then $q\\cdot\\text{queen}=6+9=15$, $\\|q\\|=\\sqrt{18}=4.243$, $\\|\\text{queen}\\|=\\sqrt{13}=3.606$, so the cosine is $15/15.30=0.981$: queen is very close to the predicted point. The analogy test is exactly this: form $b-a+c$, then return the nearest word by cosine similarity (excluding the three query words) and check whether it is the expected one. It works to the extent that a consistent relation, like gender, corresponds to a roughly constant offset vector between word embeddings. Trap: forgetting to exclude the query words, since the nearest vector to the result is often one of them.","category":"ir","kind":"basics","difficulty":"easy","tags":["word embeddings","analogies","cosine similarity"],"origin":"original","status":"verified","leads_to":["m-ir-negative-sampling-analogies"],"entry":"Enter the cosine similarity between $q=\\text{king}-\\text{man}+\\text{woman}$ and queen (work out $q$ too; the solution covers it)."},{"id":"m-ir-f-gd-step","title":"One gradient-descent step for 1-D least squares","prompt":"Data: $(x,y)=(1,2)$ and $(2,4)$. The loss is $L(w,b)=\\frac1{2n}\\sum_i(y_i-wx_i-b)^2$ with $n=2$. Start at $w=0$, $b=0$ and take one gradient-descent step with $\\eta=0.1$. Using $\\partial_wL=-\\frac1n\\sum_ir_ix_i$ with residuals $r_i=y_i-wx_i-b$, what is the new $w$?","hints":["At the start the residuals are just $y_i$: $(2,4)$."],"answer":"$\\partial_wL=-5$, so $w=0+0.1\\times5=0.5$","answer_type":"numeric","answer_value":0.5,"solution":"Residuals at $(0,0)$ are $r=(2,4)$. Then $\\partial_wL=-\\frac12(2\\cdot1+4\\cdot2)=-5$ and the update is $w\\leftarrow0-0.1\\times(-5)=0.5$ (the same step gives $\\partial_bL=-3$ and $b=0.3$). The gradient is the average of residual times input, so the weight moves to reduce the residuals most where inputs are large. The data lie exactly on $y=2x$, so the optimum is $w=2$, $b=0$; one step has moved a quarter of the way in $w$. This is the mechanical calculation behind the gradient descent derivation. Trap: forgetting the minus sign in the gradient and moving uphill.","category":"ir","kind":"basics","difficulty":"easy","tags":["gradient descent","least squares"],"origin":"original","status":"verified","leads_to":["m-ir-least-squares-gd"],"entry":"Enter the new value of $w$ after the one gradient-descent step (not $b$)."},{"id":"m-ir-f-gd-multiplier","title":"Why the step size can make gradient descent diverge","prompt":"Consider the 1-D loss $L(w)=\\frac h2w^2$ with curvature $h=4$ and gradient descent $w_{t+1}=w_t-\\eta L'(w_t)$ with $\\eta=0.6$. (a) Show that $w_{t+1}=(1-\\eta h)w_t$ and compute the multiplier. (b) Does the iteration converge? (c) For what range of $\\eta$ does it converge? Report (a) as your numeric answer.","hints":["$L'(w)=hw$."],"answer":"(a) $1-0.6\\times4=-1.4$. (b) No: $|-1.4|>1$, so it oscillates and grows. (c) $0<\\eta<2/h=0.5$.","answer_type":"numeric","answer_value":-1.4,"solution":"Since $L'(w)=hw$, $w_{t+1}=w_t-\\eta hw_t=(1-\\eta h)w_t$, and the multiplier is $1-2.4=-1.4$. Its magnitude exceeds $1$, so the iterate flips sign and grows by $40\\%$ every step: divergence. The iteration converges iff $|1-\\eta h|<1$, i.e. $0<\\eta<2/h=0.5$. For a multi-dimensional quadratic the same argument applies along each eigenvector of the Hessian, and the largest eigenvalue $\\lambda_{\\max}$ sets the limit $\\eta<2/\\lambda_{\\max}$ quoted in the least-squares derivation. Trap: believing a large step just converges faster; past $2/h$ it overshoots the minimum by more than it started away from it.","category":"ir","kind":"basics","difficulty":"easy","tags":["gradient descent","step size","convergence"],"origin":"original","status":"verified","leads_to":["m-ir-least-squares-gd"],"entry":"Enter the multiplier $1-\\eta h$ in part (a), negative if it is below zero (work out parts (b) and (c) too)."},{"id":"m-ir-f-paired-t","title":"A paired t statistic on per-query differences","prompt":"For 5 queries the AP difference (new minus old ranker) is $d=(0.10,-0.05,0.05,0.00,0.10)$. The mean is $0.04$ and the sample standard deviation is $0.0652$. Compute the paired t statistic $t=\\frac{\\bar d}{s/\\sqrt n}$ and say whether you should be confident the new ranker is better.","hints":["$s/\\sqrt5=0.0652/2.236$. With 4 degrees of freedom, the two-sided 5% critical value is about 2.78."],"answer":"$t\\approx1.37$, below the critical value $2.78$, so the evidence is weak.","answer_type":"numeric","answer_value":1.372,"solution":"The standard error is $0.0652/\\sqrt5=0.0292$, so $t=0.04/0.0292\\approx1.37$. With $n-1=4$ degrees of freedom the two-sided 5% critical value is about $2.78$, so we cannot reject 'no difference': an average gain of $0.04$ is small relative to how much it varies from query to query. The test is paired because the same queries are evaluated under both systems, and the unit of analysis is the query, not the document. This is the first step of the 'is the new ranker really better' scenario; there you would also consider Wilcoxon or a bootstrap, and the number of queries and variants tried. Trap: comparing the two mean AP values without looking at the per-query spread.","category":"ir","kind":"basics","difficulty":"easy","tags":["significance testing","paired t-test","evaluation"],"origin":"original","status":"verified","leads_to":["m-ir-significance-testing-scenario"],"entry":"Enter the paired t statistic (work out the confidence question too; the solution covers it)."},{"id":"m-slt-f-empirical-risk","title":"Empirical risk as an average of losses","prompt":"A regressor $f$ makes predictions with residuals $f(x_i)-y_i$ equal to $(1,-2,0,1)$ on four training points. With the squared loss $\\ell(f(x),y)=(f(x)-y)^2$, what is the empirical risk $\\hat{\\mathcal E}(f)=\\frac1n\\sum_i\\ell(f(x_i),y_i)$?","hints":["Square each residual, add, divide by $n=4$."],"answer":"$(1+4+0+1)/4=1.5$","answer_type":"numeric","answer_value":1.5,"solution":"$\\hat{\\mathcal E}(f)=\\frac14(1+4+0+1)=1.5$. The empirical risk is the average loss on the training sample, the quantity ERM minimises. The true (expected) risk $\\mathcal E(f)=\\mathbb E[\\ell(f(x),y)]$ is the same average over the whole data distribution, which we cannot compute. Statistical learning theory is the study of the gap between the two: how far can the training average be from the true average, and for which functions $f$ simultaneously? Everything in the harder questions (Markov, Hoeffding, Rademacher bounds) is a way of controlling that gap. Trap: forgetting to square the residuals, or dividing by $n-1$.","category":"slt","kind":"basics","difficulty":"easy","tags":["empirical risk","expected risk","ERM"],"origin":"original","status":"verified","leads_to":["m-slt-mistakes-markov","m-slt-rademacher-uniform"],"entry":"Enter the empirical risk under squared loss, averaged over the four training points."},{"id":"m-slt-f-markov","title":"Markov's inequality","prompt":"A non-negative random variable $Z$ (think: the excess risk of a learned predictor) has $\\mathbb E Z=0.02$. Use Markov's inequality, $\\mathbb P(Z\\ge a)\\le\\mathbb EZ/a$, to bound $\\mathbb P(Z\\ge0.1)$.","hints":["Plug in $a=0.1$."],"answer":"$0.02/0.1=0.2$","answer_type":"numeric","answer_value":0.2,"solution":"$\\mathbb P(Z\\ge0.1)\\le0.02/0.1=0.2$. Markov needs only non-negativity and the mean, so it applies to almost anything, but it is weak: the tail bound decays only like $1/a$. To turn an in-expectation guarantee $\\mathbb E Z\\le\\varepsilon\\delta$ into 'with probability $1-\\delta$, $Z\\le\\varepsilon$' you apply Markov with $a=\\varepsilon$, which is exactly the step in the expectation-to-high-probability question and is why the required sample size depends polynomially on $1/\\delta$. Trap: applying it to a variable that can be negative, where it is not valid.","category":"slt","kind":"basics","difficulty":"easy","tags":["Markov inequality","tail bounds"],"origin":"original","status":"verified","leads_to":["m-slt-mistakes-markov"],"entry":"Enter Markov's upper bound on $\\mathbb P(Z\\ge0.1)$, as a probability between 0 and 1."},{"id":"m-slt-f-hoeffding","title":"Evaluating a Hoeffding bound","prompt":"Let $\\hat p$ be the average of $n=200$ independent $\\{0,1\\}$ variables with mean $p$. Hoeffding's inequality says $\\mathbb P(\\hat p-p\\ge t)\\le e^{-2nt^2}$. Evaluate the bound for $t=0.05$.","hints":["$2nt^2=2\\times200\\times0.0025$."],"answer":"$e^{-1}\\approx0.368$","answer_type":"numeric","answer_value":0.36788,"solution":"$2nt^2=2\\cdot200\\cdot0.0025=1$, so the bound is $e^{-1}\\approx0.368$. Compared with Markov, the tail now decays exponentially in $nt^2$: to get the probability below $\\delta$ you need $n\\ge\\frac{\\log(1/\\delta)}{2t^2}$, only logarithmic in $1/\\delta$. That is the contrast drawn in the mistakes/Markov question. The mistake count $M$ of a fixed classifier on $n$ i.i.d. points is $n$ times such an average, with $p$ the error probability. Trap: Hoeffding is one-sided as written; a two-sided deviation $|\\hat p-p|\\ge t$ gets a factor $2$.","category":"slt","kind":"basics","difficulty":"easy","tags":["Hoeffding inequality","concentration"],"origin":"original","status":"verified","leads_to":["m-slt-mistakes-markov","m-slt-rademacher-uniform"],"entry":"Enter the Hoeffding upper bound $e^{-2nt^2}$ for $n=200$, $t=0.05$, as a probability bound between 0 and 1."},{"id":"m-slt-f-bounded-difference","title":"How much can one sample change an average?","prompt":"Let $\\hat{\\mathbb E}g=\\frac1n\\sum_{i=1}^ng(z_i)$ with $g\\in[0,1]$ and $n=50$. If you replace one sample $z_k$ by a different $z_k'$, by how much can $\\hat{\\mathbb E}g$ change at most? (This is the 'bounded difference' constant $c$ used in McDiarmid's inequality.)","hints":["Only one term in the sum changes, and each term lies in $[0,1]$."],"answer":"$1/50=0.02$","answer_type":"numeric","answer_value":0.02,"solution":"Only the $k$-th term changes, from $g(z_k)$ to $g(z_k')$, a difference of at most $1$, then divided by $n$: so the average moves by at most $1/n=0.02$. The same is true for $\\sup_g(\\mathbb Eg-\\hat{\\mathbb E}g)$, since a supremum of functions each with bounded difference $1/n$ also has bounded difference $1/n$. McDiarmid's inequality then says that this supremum is within about $\\sqrt{\\log(1/\\delta)/(2n)}$ of its mean with probability $1-\\delta$. This is the first ingredient in the proof of the Rademacher generalisation bound. Trap: forgetting the $1/n$ and concluding that one sample can change the average by $1$.","category":"slt","kind":"basics","difficulty":"easy","tags":["McDiarmid","bounded differences"],"origin":"original","status":"verified","leads_to":["m-slt-rademacher-uniform"],"entry":"Enter the largest possible change in $\\hat{\\mathbb E}g$ when one sample is replaced."},{"id":"m-slt-f-rademacher-second-moment","title":"Rademacher variables: mean and second moment of a random sign sum","prompt":"Let $\\sigma_1,\\sigma_2$ be independent Rademacher variables ($\\pm1$ with probability $\\frac12$ each) and $x=(3,4)$. Compute (a) $\\mathbb E[\\sigma_1x_1+\\sigma_2x_2]$ and (b) $\\mathbb E\\big[(\\sigma_1x_1+\\sigma_2x_2)^2\\big]$. Report (b).","hints":["Expand the square. $\\sigma_j^2=1$ and $\\mathbb E[\\sigma_1\\sigma_2]=0$."],"answer":"(a) $0$. (b) $x_1^2+x_2^2=\\|x\\|^2=25$.","answer_type":"numeric","answer_value":25.0,"solution":"(a) Each $\\sigma_j$ has mean $0$, so the mean is $0$. (b) $\\mathbb E[(\\sigma_1x_1+\\sigma_2x_2)^2]=x_1^2+x_2^2+2x_1x_2\\mathbb E[\\sigma_1\\sigma_2]=9+16=25=\\|x\\|^2$. So the random sum $\\sum_j\\sigma_jx_j$ has mean $0$ and standard deviation $\\|x\\|$, and it is 'sub-Gaussian' at that scale. This is what gives the $\\|x\\|$ factor in the Massart finite-class lemma: for a vector $x\\in S$, the sign-sum fluctuates by roughly $\\|x\\|$, and the maximum over $m$ such vectors adds a $\\sqrt{2\\log m}$ factor. Trap: thinking the sum of random signs is of order $\\sum|x_j|$ rather than $\\sqrt{\\sum x_j^2}$.","category":"slt","kind":"basics","difficulty":"easy","tags":["Rademacher variables","Massart"],"origin":"original","status":"verified","leads_to":["m-slt-massart-finite","m-slt-max-subgaussian"],"entry":"Enter part (b), $\\mathbb E\\big[(\\sigma_1x_1+\\sigma_2x_2)^2\\big]$ (work out part (a) too; the solution covers it)."},{"id":"m-slt-f-rademacher-enumeration","title":"Empirical Rademacher complexity of a tiny class by enumeration","prompt":"A sample has $n=2$ points. The class $\\mathcal H=\\{h_1,h_2\\}$ has output vectors $(h_1(x_1),h_1(x_2))=(1,1)$ and $(h_2(x_1),h_2(x_2))=(1,-1)$. The empirical Rademacher complexity is $\\hat{\\mathfrak R}_S(\\mathcal H)=\\mathbb E_\\sigma\\max_h\\frac1n\\sum_i\\sigma_ih(x_i)$. Enumerate the four sign vectors $\\sigma$ and compute it.","hints":["For each $\\sigma\\in\\{\\pm1\\}^2$ compute $\\frac12\\sigma\\cdot h$ for both $h$, take the larger, then average over the four $\\sigma$."],"answer":"$\\frac14(1+1+0+0)=0.5$","answer_type":"numeric","answer_value":0.5,"solution":"For $\\sigma=(1,1)$: $h_1$ gives $1$, $h_2$ gives $0$, max $=1$. For $\\sigma=(1,-1)$: $h_1$ gives $0$, $h_2$ gives $1$, max $=1$. For $\\sigma=(-1,1)$: $h_1$ gives $0$, $h_2$ gives $-1$, max $=0$. For $\\sigma=(-1,-1)$: $h_1$ gives $-1$, $h_2$ gives $0$, max $=0$. The average is $\\frac14(1+1+0+0)=0.5$. Rademacher complexity asks: how well can the class correlate with pure random noise on this very sample? A richer class can match more sign patterns and has a larger value; a single function would have value $0$. This is the object that appears in the generalisation bound and that Massart's lemma controls for finite classes. Trap: taking the max outside the expectation (the max is inside, for each fixed $\\sigma$).","category":"slt","kind":"basics","difficulty":"easy","tags":["Rademacher complexity","empirical complexity"],"origin":"original","status":"verified","leads_to":["m-slt-massart-finite","m-slt-rademacher-uniform"],"entry":"Enter the empirical Rademacher complexity $\\hat{\\mathfrak R}_S(\\mathcal H)$, including the $1/n$ factor."},{"id":"m-slt-f-max-bound-value","title":"Evaluating the expected-maximum bound","prompt":"For $m=100$ centred random variables taking values in $[a,b]=[-1,1]$, the bound is $\\mathbb E\\max_iX_i\\le\\frac{b-a}{2}\\sqrt{2\\log m}$. Evaluate it (natural log, 3 decimal places). How would it change for $m=10{,}000$?","hints":["$\\frac{b-a}{2}=1$ and $\\log100=4.605$."],"answer":"$\\sqrt{2\\ln100}\\approx3.035$. For $m=10^4$: $\\sqrt{2\\ln10^4}=4.29$, only about $41\\%$ larger.","answer_type":"numeric","answer_value":3.0348,"solution":"$\\frac{b-a}{2}=1$ and $\\sqrt{2\\ln100}=\\sqrt{9.21}=3.035$. For $m=10{,}000$ it is $\\sqrt{2\\times9.21}=4.29$. Multiplying the number of variables by $100$ raises the bound by only a factor $\\sqrt2$, because the dependence is on $\\sqrt{\\log m}$. That is why finite classes with exponentially many functions (a few hundred bits' worth) still generalise well: a union over $|\\mathcal H|$ functions costs $\\sqrt{\\log|\\mathcal H|/n}$, not $|\\mathcal H|$. This is the target of the derivation question. Trap: reading the bound as growing with $m$ itself; it grows with $\\log m$ under the square root.","category":"slt","kind":"basics","difficulty":"easy","tags":["maximal inequality","finite class"],"origin":"original","status":"verified","leads_to":["m-slt-max-subgaussian","m-slt-massart-finite"],"entry":"Enter the bound on $\\mathbb E\\max_iX_i$ for $m=100$, $[a,b]=[-1,1]$ (natural log; work out $m=10{,}000$ too)."},{"id":"m-slt-f-chernoff-optimise","title":"Choosing the free parameter $\\lambda$ in the maximal inequality","prompt":"The derivation of the maximal inequality produces the bound $g(\\lambda)=\\frac{\\log m}{\\lambda}+\\frac{\\lambda r^2}{2}$ for any $\\lambda>0$. With $\\log m=8$ and $r=2$, find the minimising $\\lambda$ and the minimum value of $g$. Report the minimum value.","hints":["Set $g'(\\lambda)=-\\frac{\\log m}{\\lambda^2}+\\frac{r^2}{2}=0$."],"answer":"$\\lambda^*=\\sqrt{2\\log m}/r=2$ and $g(\\lambda^*)=r\\sqrt{2\\log m}=8$.","answer_type":"numeric","answer_value":8.0,"solution":"Setting $g'=0$ gives $\\lambda^{*2}=2\\log m/r^2$, so $\\lambda^*=\\sqrt{16}/2=2$. Then $g=\\frac82+\\frac{2\\cdot4}{2}=4+4=8=r\\sqrt{2\\log m}$. At the optimum the two terms are equal (the usual signature of balancing a decreasing and an increasing term, or AM-GM). The first term $\\log m/\\lambda$ is the price of the union over $m$ variables, and the second is the price of Hoeffding's lemma, which grows with $\\lambda$; the free parameter $\\lambda$ is introduced by the exponential (Chernoff) trick and then tuned at the end. This is exactly how the free parameter is chosen in the max-of-bounded-variables derivation and in Massart's lemma. Trap: forgetting that the optimal $\\lambda$ depends on $m$ and $r$, so it must be chosen after both are known.","category":"slt","kind":"basics","difficulty":"easy","tags":["Chernoff trick","optimisation of a bound"],"origin":"original","status":"verified","leads_to":["m-slt-max-subgaussian","m-slt-massart-finite"],"entry":"Enter the minimum value of $g(\\lambda)$ (work out the minimising $\\lambda$ too; the solution covers it)."},{"id":"m-slt-f-bayes-error","title":"Bayes classifier and Bayes error at a point","prompt":"At a point $x$ the probability of the positive class is $\\eta(x)=\\rho(y=1\\mid x)=0.3$. (a) What does the Bayes classifier predict? (b) What is the probability of a mistake at $x$ for that prediction? Report (b).","hints":["Predict the more likely label. The mistake probability is the probability of the other label."],"answer":"(a) Predict $-1$ (since $\\eta<\\tfrac12$). (b) $\\min(\\eta,1-\\eta)=0.3$.","answer_type":"numeric","answer_value":0.3,"solution":"The Bayes rule is $c^*(x)=1$ if $\\eta(x)>\\frac12$ and $-1$ otherwise, so here it predicts $-1$, which is wrong when $y=1$, with probability $\\eta=0.3$. No classifier can do better at this point: $0.3$ is irreducible noise. The conditional risk of any prediction $c$ is $\\rho(y\\ne c\\mid x)$, which equals $1-\\eta$ if $c=1$ and $\\eta$ if $c=-1$; minimising pointwise gives the Bayes rule. All surrogate-loss and comparison arguments compare a learned rule with this benchmark. Trap: thinking the Bayes error is zero when the labels are noisy.","category":"slt","kind":"basics","difficulty":"easy","tags":["Bayes classifier","conditional risk"],"origin":"original","status":"verified","leads_to":["m-slt-surrogate-minimisers","m-slt-comparison-ls"],"entry":"Enter part (b), the probability of a mistake at $x$ for the Bayes prediction (work out part (a) too)."},{"id":"m-slt-f-ls-minimiser","title":"Pointwise minimiser of the squared loss for $\\pm1$ labels","prompt":"At a point $x$ with $\\eta=\\rho(y=1\\mid x)=0.8$, the expected squared loss of a prediction $f$ is $\\eta(f-1)^2+(1-\\eta)(f+1)^2$. Differentiate, find the minimising $f^*$, and check it equals $\\mathbb E[y\\mid x]=2\\eta-1$.","hints":["The derivative is $2\\eta(f-1)+2(1-\\eta)(f+1)$."],"answer":"$f^*=2\\eta-1=0.6$","answer_type":"numeric","answer_value":0.6,"solution":"Setting the derivative to zero, $\\eta(f-1)+(1-\\eta)(f+1)=0$, so $f-\\eta+(1-\\eta)=0$, hence $f^*=2\\eta-1=0.6$, which is $\\mathbb E[y\\mid x]=\\eta(+1)+(1-\\eta)(-1)$. The minimiser of the squared loss is always the conditional mean. Its sign agrees with the Bayes rule ($f^*>0\\iff\\eta>\\frac12$), so least-squares classification is Fisher consistent. And $|f^*|=|2\\eta-1|$ measures how confident the classifier is, which is the quantity that shows up in the comparison inequality. Trap: forgetting that labels are $\\pm1$ rather than $0/1$; with $0/1$ labels the minimiser would be $\\eta$.","category":"slt","kind":"basics","difficulty":"easy","tags":["least squares","Fisher consistency","surrogate loss"],"origin":"original","status":"verified","leads_to":["m-slt-surrogate-minimisers","m-slt-comparison-ls"],"entry":"Enter the minimising prediction $f^*$ at $\\eta=0.8$ for the squared loss."},{"id":"m-slt-f-logistic-minimiser","title":"Logistic and exponential minimisers are log-odds","prompt":"At a point with $\\eta=0.8$, the logistic loss minimiser is $f^*=\\log\\frac{\\eta}{1-\\eta}$ and the exponential loss minimiser is $\\frac12\\log\\frac{\\eta}{1-\\eta}$. Compute the logistic $f^*$ (natural log). Check that both have the same sign as the Bayes rule.","hints":["$\\eta/(1-\\eta)=4$."],"answer":"$\\ln4\\approx1.386$ (the exponential one is $\\ln 2\\approx0.693$); both positive, matching $\\eta>\\tfrac12$.","answer_type":"numeric","answer_value":1.3863,"solution":"$\\log(0.8/0.2)=\\ln4=1.386$, and the exponential loss gives half of it, $0.693$. Both are positive because $\\eta>\\frac12$, so thresholding at zero ($d=\\text{sign}$) recovers the Bayes classifier, and the surrogate is Fisher consistent. To derive these, minimise $\\eta\\,\\ell(f,1)+(1-\\eta)\\ell(f,-1)$ over $f$ pointwise: for the logistic loss $-\\frac{\\eta}{1+e^f}+\\frac{(1-\\eta)e^f}{1+e^f}=0$ gives $e^f=\\eta/(1-\\eta)$. Logistic regression's outputs are log-odds precisely because of this. Trap: forgetting the factor $\\frac12$ for the exponential loss, because its two terms are $e^{-f}$ and $e^{f}$.","category":"slt","kind":"basics","difficulty":"easy","tags":["logistic loss","exponential loss","Fisher consistency"],"origin":"original","status":"verified","leads_to":["m-slt-surrogate-minimisers"],"entry":"Enter the logistic-loss minimiser $f^*=\\log\\frac{\\eta}{1-\\eta}$ at $\\eta=0.8$ (natural log)."},{"id":"m-slt-f-excess-risk-wrong-sign","title":"Excess misclassification risk when the sign is wrong","prompt":"At a point with $\\eta=0.7$, a classifier predicts $-1$ (the wrong sign). Compute the conditional probability of a mistake for this prediction and for the Bayes prediction, and so the excess conditional risk. Check it equals $|f^*|=|2\\eta-1|$.","hints":["Predicting $-1$ is wrong when $y=1$, which has probability $0.7$."],"answer":"$0.7-0.3=0.4=|2\\eta-1|$","answer_type":"numeric","answer_value":0.4,"solution":"Predicting $-1$ errs with probability $\\eta=0.7$; the Bayes prediction $+1$ errs with probability $0.3$; the excess is $0.4=|2\\eta-1|=|f^*(x)|$. In general, for a fixed guess $c\\in\\{\\pm1\\}$, $\\rho(y\\ne c\\mid x)=\\frac{1-cf^*(x)}{2}$, so the loss of a wrong sign over the Bayes sign is $|f^*(x)|$, and zero where the signs agree. Integrating gives $R(\\text{sign}f)-R(\\text{sign}f^*)=\\int_{\\{\\text{sign}f\\neq\\text{sign}f^*\\}}|f^*|\\,d\\rho_X$, Step 1 of the comparison inequality. Trap: assuming a wrong sign costs a fixed amount; it costs more when the labels are more predictable (larger $|f^*|$).","category":"slt","kind":"basics","difficulty":"easy","tags":["excess risk","comparison inequality"],"origin":"original","status":"verified","leads_to":["m-slt-comparison-ls"],"entry":"Enter the excess conditional risk of the wrong-sign prediction over the Bayes prediction, as a probability difference (work out both mistake probabilities too)."},{"id":"m-slt-f-jensen-l1-l2","title":"Jensen / Cauchy-Schwarz: $\\mathbb E|Z|\\le\\sqrt{\\mathbb EZ^2}$","prompt":"A random variable $Z$ takes the values $1$ and $3$ with probability $\\frac12$ each. Compute $\\mathbb E|Z|$ and $\\sqrt{\\mathbb EZ^2}$ and report the gap $\\sqrt{\\mathbb EZ^2}-\\mathbb E|Z|$.","hints":["$\\mathbb EZ^2=\\frac12(1+9)=5$."],"answer":"$\\sqrt5-2\\approx0.236$","answer_type":"numeric","answer_value":0.23607,"solution":"$\\mathbb E|Z|=2$ and $\\sqrt{\\mathbb EZ^2}=\\sqrt5=2.236$, so the gap is $0.236\\ge0$. In general $(\\mathbb E|Z|)^2\\le\\mathbb EZ^2$ because the variance of $|Z|$ is non-negative (equivalently Jensen for the convex square, or Cauchy-Schwarz against the constant $1$). This is how Step 2 of the comparison inequality converts an $L^1$ distance $\\int|f-f^*|d\\rho_X$ into the $L^2$ distance $\\sqrt{\\mathbb E(f-f^*)^2}$, which is then identified with the excess squared-loss risk $\\sqrt{\\mathcal E(f)-\\mathcal E(f^*)}$. It needs $\\rho_X$ to be a probability measure. Trap: applying it the wrong way round; the $L^2$ norm is the larger.","category":"slt","kind":"basics","difficulty":"easy","tags":["Jensen","Cauchy-Schwarz","comparison inequality"],"origin":"original","status":"verified","leads_to":["m-slt-comparison-ls"],"entry":"Enter the gap $\\sqrt{\\mathbb EZ^2}-\\mathbb E|Z|$ (work out the two terms too; the solution covers them)."},{"id":"m-slt-f-hessian-lipschitz","title":"Smoothness constant of least squares from the Hessian","prompt":"Let $F(w)=\\frac1n\\sum_i(\\langle w,x_i\\rangle-y_i)^2$ with $n=2$, $x_1=(1,0)$, $x_2=(0,2)$. (a) Show the Hessian is $\\frac2nX^\\top X$ and compute it. (b) What is $L=\\|\\nabla^2F\\|_{op}$ and what is the step-size bound $2/L$ for gradient descent?","hints":["$X^\\top X=\\sum_ix_ix_i^\\top=\\text{diag}(1,4)$."],"answer":"Hessian $=\\text{diag}(1,4)$, $L=4$, step size $<2/L=0.5$.","answer_type":"numeric","answer_value":0.5,"solution":"The gradient is $\\frac2nX^\\top(Xw-y)$, so the Hessian is the constant matrix $\\frac2nX^\\top X=\\text{diag}(1,4)$ here, with largest eigenvalue $L=4$. Gradient descent with constant step $\\gamma$ converges for $\\gamma<2/L=0.5$: along the steepest direction each step multiplies the error by $1-\\gamma L$, which must lie in $(-1,1)$. A larger step overshoots the valley and diverges. Adding a ridge term $\\lambda\\|w\\|^2$ adds $2\\lambda I$ to the Hessian, which is how the $+2\\lambda$ in the step-size question arises. Trap: forgetting the factor $2$ coming from differentiating the square, which would double the allowed step size and make it unsafe.","category":"slt","kind":"basics","difficulty":"easy","tags":["gradient descent","Hessian","Lipschitz gradient"],"origin":"original","status":"verified","leads_to":["m-slt-gd-step-size","m-slt-gd-dual"],"entry":"Enter the step-size bound $2/L$ (work out the Hessian and $L$ too; the solution covers them)."},{"id":"m-slt-f-ridge-tradeoff","title":"Minimising an approximation-plus-stability bound","prompt":"A regularisation bound has the form $g(\\lambda)=A\\lambda+B/\\lambda$ with $A=1$ and $B=0.04$. Find the $\\lambda$ that minimises it, and the minimum value.","hints":["Set $g'(\\lambda)=A-B/\\lambda^2=0$."],"answer":"$\\lambda^*=\\sqrt{B/A}=0.2$, $g(\\lambda^*)=2\\sqrt{AB}=0.4$","answer_type":"numeric","answer_value":0.2,"solution":"$g'(\\lambda)=A-B/\\lambda^2=0$ gives $\\lambda^*=\\sqrt{B/A}=\\sqrt{0.04}=0.2$, and $g(\\lambda^*)=0.2+0.2=0.4=2\\sqrt{AB}$. The first term is the bias or approximation cost of shrinking towards zero (larger $\\lambda$ is worse), and the second is the variance or stability cost of an unstable fit (smaller $\\lambda$ is worse): the optimum balances them, so both terms are equal at the minimum. In the stability question $A=\\|w^*\\|^2$ and $B=2L^2\\kappa^2/n$, so $\\lambda^*\\propto n^{-1/2}$ and the rate is $n^{-1/2}$. Trap: ignoring the second derivative; the function is convex on $\\lambda>0$, so the stationary point is the minimum.","category":"slt","kind":"basics","difficulty":"easy","tags":["regularisation","bias-variance","stability"],"origin":"original","status":"verified","leads_to":["m-slt-ridge-lambda-star"],"entry":"Enter the minimising $\\lambda$ (work out the minimum value of $g$ too; the solution covers it)."},{"id":"m-slt-f-gd-filter","title":"Which directions has gradient descent fitted after $t$ steps?","prompt":"Gradient descent on least squares from $w_0=0$ fits the component of the solution along an eigen-direction with curvature $s$ by the fraction $1-(1-\\gamma s)^t$. Take $t=10$ and compare a high-curvature direction with $\\gamma s=0.5$ with a low-curvature direction with $\\gamma s=0.01$. Report the fraction for the low-curvature direction.","hints":["$1-0.99^{10}$. For the first, $1-0.5^{10}$."],"answer":"High-curvature: $1-0.5^{10}\\approx0.999$. Low-curvature: $1-0.99^{10}\\approx0.096$.","answer_type":"numeric","answer_value":0.0956,"solution":"The high-curvature direction is essentially fitted ($0.999$) after 10 steps, while the low-curvature one is only about $9.6\\%$ fitted. Gradient descent therefore fits directions in order of eigenvalue, large first. Low-eigenvalue directions are mostly noise in the data, so stopping early leaves them unfitted, which acts like ridge regularisation (ridge uses the smooth filter $s/(s+\\lambda)$, and the two are matched by $\\lambda\\approx1/(\\gamma t)$). Running too long fits the noisy directions, which is why the validation loss turns up after iteration 40 in the early-stopping scenario. Trap: thinking all directions are fitted at the same speed.","category":"slt","kind":"basics","difficulty":"easy","tags":["early stopping","gradient descent","implicit regularisation"],"origin":"original","status":"verified","leads_to":["m-slt-early-stopping-scenario","m-slt-gd-dual"],"entry":"Enter the fitted fraction after $t=10$ steps for the low-curvature direction, $\\gamma s=0.01$ (work out the high-curvature one too)."},{"id":"m-slt-f-dual-representation","title":"Checking the dual representation $w=X^\\top c$","prompt":"Let $X=\\begin{pmatrix}1&0\\\\0&2\\end{pmatrix}$ (rows $x_1=(1,0)$, $x_2=(0,2)$), $K=XX^\\top$ and $c=(2,1)^\\top$. Compute $w=X^\\top c$, then verify that $\\langle w,x_2\\rangle=(Kc)_2$ and report this value.","hints":["$w=2x_1+1x_2$. Also $K=\\text{diag}(1,4)$."],"answer":"$w=(2,2)$, $\\langle w,x_2\\rangle=4=(Kc)_2$","answer_type":"numeric","answer_value":4.0,"solution":"$w=X^\\top c=2(1,0)+1(0,2)=(2,2)$. Then $\\langle w,x_2\\rangle=0+4=4$, and $Kc=(1\\cdot2,\\;4\\cdot1)=(2,4)$, whose second entry is $4$: indeed $Xw=XX^\\top c=Kc$. This identity is the key step of the dual representation: if the iterate is a combination of the data points, $w_t=X^\\top c_t$, then all predictions $Xw_t=Kc_t$ depend only on the Gram matrix $K$, and the gradient step $w_{t+1}=w_t-\\frac\\gamma nX^\\top\\bar\\ell(Xw_t)$ is again of the form $X^\\top c_{t+1}$. Replacing $K$ by a kernel matrix gives gradient descent (and early stopping) in an RKHS. Trap: mixing up the roles of $X^\\top c$ (a vector in feature space) and $Xw$ (a vector of predictions on the data).","category":"slt","kind":"basics","difficulty":"easy","tags":["dual representation","kernel","gradient descent"],"origin":"original","status":"verified","leads_to":["m-slt-gd-dual","m-slt-early-stopping-scenario"],"entry":"Enter the common value $\\langle w,x_2\\rangle=(Kc)_2$ (work out $w$ too; the solution covers it)."},{"id":"m-optf-gradient-value","title":"Computing a gradient at a point","prompt":"Let $f(x,y)=x^2+xy+2y^2$. The gradient is the vector of partial derivatives, $\\nabla f=(\\partial f/\\partial x,\\ \\partial f/\\partial y)$. Compute $\\nabla f$ at the point $(1,1)$, and report the squared length $\\|\\nabla f(1,1)\\|^2$.","hints":["Differentiate with respect to $x$ treating $y$ as a constant, then the other way round."],"answer":"$\\nabla f=(2x+y,\\ x+4y)$, so $\\nabla f(1,1)=(3,5)$ and $\\|\\nabla f\\|^2=34$.","answer_type":"numeric","answer_value":34.0,"solution":"$\\partial f/\\partial x=2x+y$ and $\\partial f/\\partial y=x+4y$. At $(1,1)$ this is $(3,5)$, and $\\|\\nabla f\\|^2=9+25=34$. The gradient points in the direction of steepest increase of $f$, and its length is the rate of increase in that direction.\n\nIntuition: every optimiser in this course (steepest descent, Newton, BFGS, Gauss-Newton) starts from this vector, so getting partial derivatives right is the first skill. It is used directly in the steepest-descent, Newton and BFGS exam questions. Trap: forgetting that $xy$ contributes to both partial derivatives.","category":"opt","kind":"basics","difficulty":"easy","tags":["gradient","partial derivatives"],"origin":"original","status":"verified","leads_to":["m-opt-saddle-steepest-descent","m-opt-nlls-exponential","m-opt-bfgs-convex"],"entry":"Enter the squared length $\\|\\nabla f(1,1)\\|^2$ (work out the gradient vector too; the solution covers it)."},{"id":"m-optf-hessian-convex","title":"Hessian and convexity of a quadratic","prompt":"For $f(x,y)=x^2+xy+2y^2$ write down the Hessian matrix of second derivatives. A twice-differentiable function is convex when its Hessian is positive semidefinite everywhere, i.e. all eigenvalues are $\\ge0$. What is the smallest eigenvalue of the Hessian here, to 4 decimal places? Is $f$ convex?","hints":["The Hessian is $\\begin{pmatrix}f_{xx}&f_{xy}\\\\f_{yx}&f_{yy}\\end{pmatrix}$.","For a $2\\times2$ matrix, eigenvalues solve $\\lambda^2-\\mathrm{tr}\\,\\lambda+\\det=0$."],"answer":"$H=\\begin{pmatrix}2&1\\\\1&4\\end{pmatrix}$, eigenvalues $3\\pm\\sqrt2$, smallest $\\approx1.5858>0$, so $f$ is (strictly) convex.","answer_type":"numeric","answer_value":1.5858,"solution":"$f_{xx}=2$, $f_{xy}=f_{yx}=1$, $f_{yy}=4$, so $H=\\begin{pmatrix}2&1\\\\1&4\\end{pmatrix}$. Trace $=6$ and determinant $=7$, so $\\lambda^2-6\\lambda+7=0$ and $\\lambda=3\\pm\\sqrt2$, smallest $\\approx1.5858$. Both eigenvalues are positive, so $H$ is positive definite, $f$ is strictly convex, and any stationary point is the unique global minimiser.\n\nIntuition: the Hessian is the curvature, and positive definite means the bowl curves upwards in every direction. Trap: checking only the diagonal entries; you need eigenvalues (or leading minors). Used in the BFGS question (show strict convexity) and in the nonlinear least squares question.","category":"opt","kind":"basics","difficulty":"easy","tags":["Hessian","convexity","eigenvalues"],"origin":"original","status":"verified","leads_to":["m-opt-bfgs-convex","m-opt-nlls-exponential","m-opt-saddle-steepest-descent"],"entry":"Enter the smallest eigenvalue of the Hessian (work out the Hessian and the convexity question too)."},{"id":"m-optf-classify-stationary","title":"Finding and classifying a stationary point","prompt":"Let $f(x,y)=x^2-y^2+2x$. Find the stationary point (where $\\nabla f=0$) and use the Hessian to say whether it is a minimum, a maximum or a saddle point. Does $f$ have a global minimum?","hints":["Set both partial derivatives to zero.","Look at the signs of the Hessian eigenvalues."],"answer":"Stationary point $(-1,0)$; Hessian $\\mathrm{diag}(2,-2)$ is indefinite, so it is a saddle, and $f$ has no global minimum (it is unbounded below along $y$).","answer_type":"free-text","solution":"$\\nabla f=(2x+2,\\,-2y)=0$ gives the single stationary point $(-1,0)$. The Hessian is $\\mathrm{diag}(2,-2)$: one positive and one negative eigenvalue, i.e. indefinite, so it is a saddle point (curving up along $x$, down along $y$). Since $f(-1,y)=-1-y^2\\to-\\infty$, there is no global minimum.\n\nRule: all eigenvalues positive gives a local minimum, all negative a maximum, mixed signs a saddle, and a zero eigenvalue is inconclusive. Intuition: a saddle is a stationary point that is not an optimum. This is the first half of the saddle-point steepest-descent question, where you must classify the stationary point before running the iteration.","category":"opt","kind":"basics","difficulty":"easy","tags":["stationary points","saddle point","Hessian"],"origin":"original","status":"self-marked","leads_to":["m-opt-saddle-steepest-descent"]},{"id":"m-optf-gd-one-step-saddle","title":"One steepest-descent step on a saddle","prompt":"Take $f(x,y)=2x^2-3y^2$ and one steepest-descent step $\\mathbf{x}_{1}=\\mathbf{x}_0-\\gamma\\nabla f(\\mathbf{x}_0)$ with step size $\\gamma=1/6$ from $\\mathbf{x}_0=(1,1)$. What is the $y$-coordinate of $\\mathbf{x}_1$?","hints":["$\\nabla f=(4x,\\,-6y)$."],"answer":"$\\nabla f(1,1)=(4,-6)$, so $\\mathbf{x}_1=(1-4/6,\\ 1+1)=(1/3,\\ 2)$ and the $y$-coordinate is $2$.","answer_type":"numeric","answer_value":2.0,"solution":"$\\nabla f=(4x,-6y)$, which at $(1,1)$ is $(4,-6)$. Then $x_1=1-\\tfrac16\\cdot4=\\tfrac13$ and $y_1=1-\\tfrac16\\cdot(-6)=2$. The $x$-coordinate moves towards $0$ but the $y$-coordinate moves away from $0$ (it doubles).\n\nIntuition: descent along $-\\nabla f$ decreases $f$ locally, but on the $-3y^2$ direction $f$ keeps decreasing as $|y|$ grows, so the iterates run away: the origin is a saddle, which steepest descent does not converge to unless started exactly on the $x$-axis. In general the coordinate updates are $x_{k+1}=(1-4\\gamma)x_k$ and $y_{k+1}=(1+6\\gamma)y_k$, which is exactly the iterate-formula part of the saddle exam question.","category":"opt","kind":"basics","difficulty":"easy","tags":["steepest descent","saddle point"],"origin":"original","status":"verified","leads_to":["m-opt-saddle-steepest-descent"],"entry":"Enter the $y$-coordinate of $\\mathbf{x}_1$ after the one steepest-descent step."},{"id":"m-optf-gd-step-size-limit","title":"How big can the step size be?","prompt":"Run fixed-step gradient descent $x_{k+1}=x_k-\\gamma f'(x_k)$ on the one-dimensional function $f(x)=2x^2$. Write $x_{k+1}$ as a multiple of $x_k$. The iterates converge to the minimiser $0$ from every start exactly when $|1-4\\gamma|<1$. What is the supremum of step sizes $\\gamma>0$ for which this holds?","hints":["$f'(x)=4x$."],"answer":"$x_{k+1}=(1-4\\gamma)x_k$, which converges iff $0<\\gamma<1/2$, so the supremum is $0.5$.","answer_type":"numeric","answer_value":0.5,"solution":"$f'(x)=4x$, so $x_{k+1}=x_k-4\\gamma x_k=(1-4\\gamma)x_k$ and $x_k=(1-4\\gamma)^kx_0$. This tends to $0$ iff $|1-4\\gamma|<1$, i.e. $0<\\gamma<1/2$ (so the supremum is $0.5$). At $\\gamma=1/4$ it converges in one step, between $1/4$ and $1/2$ it oscillates in sign, and above $1/2$ it diverges.\n\nRule of thumb: for a quadratic with curvature $L$ (largest Hessian eigenvalue), fixed-step descent needs $\\gamma<2/L$. Intuition: too big a step overshoots the minimum by more than it started away. This is why steepest descent in the saddle question depends on the chosen $\\gamma=1/6$, and why line searches (Wolfe) exist.","category":"opt","kind":"basics","difficulty":"easy","tags":["step size","convergence","steepest descent"],"origin":"original","status":"verified","leads_to":["m-opt-saddle-steepest-descent","m-opt-wolfe-conditions","m-opt-lbfgs-scenario"],"entry":"Enter the supremum of step sizes $\\gamma$ for which gradient descent converges on $f(x)=2x^2$."},{"id":"m-optf-armijo-check","title":"Checking the sufficient-decrease (Armijo) condition","prompt":"Let $f(x)=x^2$ at $x_k=1$ with descent direction $p_k=-2$ (so $f'(x_k)p_k=-4$). The sufficient-decrease condition is $f(x_k+\\alpha p_k)\\le f(x_k)+c_1\\alpha f'(x_k)p_k$ with $c_1=0.1$. Test it for $\\alpha=1$ and $\\alpha=0.5$. What does the result tell you about choosing a step length?","hints":["Compute $x_k+\\alpha p_k$ for each $\\alpha$, then both sides of the inequality."],"answer":"$\\alpha=1$: $f(-1)=1>0.6$, fails; $\\alpha=0.5$: $f(0)=0\\le0.8$, holds. Steps that are too long can be rejected, so backtrack.","answer_type":"free-text","solution":"Right-hand side at $\\alpha=1$: $1+0.1\\cdot1\\cdot(-4)=0.6$. The new point is $x=-1$ with $f=1$, and $1>0.6$, so the condition fails: the step overshot the minimum and gained nothing. At $\\alpha=0.5$ the right-hand side is $1-0.2=0.8$, the new point is $x=0$ with $f=0\\le0.8$, so it holds.\n\nIntuition: Armijo asks for a decrease at least a fraction $c_1$ of what the linear model promises. It stops steps that are too long, but on its own accepts tiny steps, which is why the Wolfe curvature condition is added. Backtracking (halve $\\alpha$ until Armijo holds) is how a Newton step like the Rosenbrock one is safeguarded, and the full Wolfe conditions are the next question's topic.","category":"opt","kind":"basics","difficulty":"easy","tags":["line search","Armijo","Wolfe"],"origin":"original","status":"self-marked","leads_to":["m-opt-wolfe-conditions","m-opt-newton-step-rosenbrock","m-opt-lbfgs-scenario"]},{"id":"m-optf-newton-step-quadratic","title":"A Newton step on a quadratic","prompt":"Let $f(x,y)=x^2+xy+2y^2-3x$. Take one Newton step $\\mathbf{x}_1=\\mathbf{x}_0-[\\nabla^2f(\\mathbf{x}_0)]^{-1}\\nabla f(\\mathbf{x}_0)$ from $\\mathbf{x}_0=(0,0)$. What is the $x$-coordinate of $\\mathbf{x}_1$, to 4 decimal places? Is $\\mathbf{x}_1$ the minimiser of $f$?","hints":["$\\nabla f(0,0)=(-3,0)$ and $\\nabla^2f=\\begin{pmatrix}2&1\\\\1&4\\end{pmatrix}$.","The inverse of $\\begin{pmatrix}a&b\\\\c&d\\end{pmatrix}$ is $\\frac1{ad-bc}\\begin{pmatrix}d&-b\\\\-c&a\\end{pmatrix}$."],"answer":"$\\mathbf{x}_1=(12/7,\\,-3/7)$, so the $x$-coordinate is $\\approx1.7143$; yes, it is the exact minimiser because $f$ is quadratic.","answer_type":"numeric","answer_value":1.7143,"solution":"$\\det H=7$, so $H^{-1}=\\frac17\\begin{pmatrix}4&-1\\\\-1&2\\end{pmatrix}$. The Newton step is $-H^{-1}g=\\frac17\\begin{pmatrix}4&-1\\\\-1&2\\end{pmatrix}\\begin{pmatrix}3\\\\0\\end{pmatrix}=\\left(\\tfrac{12}{7},-\\tfrac37\\right)$, so $x_1\\approx1.7143$. Check: $\\nabla f(x_1)=(2x+y-3,\\ x+4y)=(0,0)$.\n\nIntuition: Newton minimises the local quadratic model exactly, so on a quadratic one step is enough, whatever the start. On non-quadratic functions such as the Rosenbrock valley the model is only local, so the full step can overshoot (the Rosenbrock question). Trap: solve $Hp=-g$ rather than computing $H^{-1}$ explicitly in practice.","category":"opt","kind":"basics","difficulty":"easy","tags":["Newton","Hessian","quadratic"],"origin":"original","status":"verified","leads_to":["m-opt-newton-step-rosenbrock","m-opt-bfgs-convex","m-opt-lbfgs-scenario"],"entry":"Enter the $x$-coordinate of $\\mathbf{x}_1$ after the one Newton step (work out the minimiser question too)."},{"id":"m-optf-gauss-newton-step","title":"One Gauss-Newton step with two residuals","prompt":"Minimise $f(x)=\\tfrac12\\|r(x)\\|^2$ over a scalar $x$, where $r(x)=(e^{x}-2,\\ x-1)$. The Jacobian $J$ is the column of derivatives $r'(x)$. The Gauss-Newton step solves $J^\\top J\\,p=-J^\\top r$. Compute $p$ at $x=0$.","hints":["At $x=0$: $r=(-1,-1)$ and $J=(1,1)^\\top$."],"answer":"$J^\\top J=2$, $J^\\top r=-2$, so $p=1$.","answer_type":"numeric","answer_value":1.0,"solution":"At $x=0$: $r=(1-2,\\ 0-1)=(-1,-1)$ and $J=(e^0,1)^\\top=(1,1)^\\top$. Then $J^\\top J=2$ and $J^\\top r=-2$, so $2p=2$ and $p=1$. The gradient of $f$ is $\\nabla f=J^\\top r$, and Gauss-Newton uses $J^\\top J$ in place of the full Hessian $J^\\top J+\\sum_i r_i\\nabla^2r_i$, dropping the second term.\n\nIntuition: linearise the residuals, $r(x+p)\\approx r+Jp$, and solve the resulting linear least squares problem for $p$. Trap: do not forget the minus sign on $J^\\top r$. This is the building block in the exponential-residual question and the Gauss-Newton derivation.","category":"opt","kind":"basics","difficulty":"easy","tags":["Gauss-Newton","least squares","Jacobian"],"origin":"original","status":"verified","leads_to":["m-opt-gauss-newton","m-opt-nlls-exponential"],"entry":"Enter the Gauss-Newton step $p$ at $x=0$, with sign (negative if it moves $x$ down)."},{"id":"m-optf-bfgs-secant-1d","title":"The secant equation in one dimension","prompt":"BFGS builds an approximation $H_{k+1}$ to the inverse Hessian that satisfies the secant equation $H_{k+1}y_k=s_k$, with $s_k=x_{k+1}-x_k$ and $y_k=\\nabla f_{k+1}-\\nabla f_k$. In one dimension, suppose $f'$ changes from $1$ to $2$ when $x$ moves from $0$ to $0.5$. What is $H_{k+1}$ (a single number)? Why does BFGS need $y_k^\\top s_k>0$?","hints":["Here $s_k=0.5$ and $y_k=1$.","In 1D the secant equation is just a division."],"answer":"$s_k=0.5$, $y_k=1$, so $H_{k+1}=s_k/y_k=0.5$ (a finite-difference estimate of $1/f''$). Positive curvature $y_k^\\top s_k>0$ keeps $H_{k+1}$ positive definite.","answer_type":"numeric","answer_value":0.5,"solution":"Here $s_k=0.5-0=0.5$ and $y_k=2-1=1$, so $H_{k+1}=s_k/y_k=0.5$. This is the inverse of the finite-difference curvature $y/s=2$, i.e. the secant estimate of $1/f''$. In higher dimensions the secant equation does not determine $H_{k+1}$ uniquely, and BFGS picks the symmetric positive definite matrix closest to $H_k$.\n\nThe condition $y_k^\\top s_k>0$ (positive curvature along the step) is what guarantees that BFGS keeps $H_{k+1}$ positive definite and hence that $-H_{k+1}\\nabla f$ is a descent direction. The Wolfe curvature condition enforces it. Trap: on a non-convex function an unsafeguarded step can give $y^\\top s\\le0$. This leads straight into the BFGS update question.","category":"opt","kind":"basics","difficulty":"easy","tags":["BFGS","secant equation","quasi-Newton"],"origin":"original","status":"verified","leads_to":["m-opt-bfgs-convex","m-opt-wolfe-conditions","m-opt-lbfgs-scenario"],"entry":"Enter the one-dimensional inverse-Hessian approximation $H_{k+1}$ (work out the curvature-condition question too)."},{"id":"m-optf-kkt-lagrangian-1d","title":"A Lagrange multiplier in one dimension","prompt":"Minimise $f(x)=x^2$ subject to $x\\ge1$, written as $g(x)=1-x\\le0$. Form the Lagrangian $L(x,\\mu)=x^2+\\mu(1-x)$ with $\\mu\\ge0$. Use stationarity and the fact that the constraint is active to find the optimal multiplier $\\mu^*$.","hints":["The unconstrained minimiser $x=0$ violates $x\\ge1$, so the constraint is active: $x^*=1$.","Stationarity: $\\partial L/\\partial x=0$."],"answer":"$2x-\\mu=0$ and $x^*=1$ give $\\mu^*=2$ (which is $\\ge0$, as required).","answer_type":"numeric","answer_value":2.0,"solution":"Stationarity: $\\partial L/\\partial x=2x-\\mu=0$. The unconstrained minimiser $x=0$ violates $x\\ge1$, so complementary slackness $\\mu(1-x)=0$ with $\\mu>0$ forces the constraint to be active, $x^*=1$, giving $\\mu^*=2x^*=2\\ge0$.\n\nDual view: $d(\\mu)=\\min_xL=\\mu-\\mu^2/4$ (minimised at $x=\\mu/2$), which is maximised at $\\mu=2$ with value $1=f(x^*)$, so there is no duality gap. Intuition: $\\mu^*$ is the price of the constraint: tightening to $x\\ge1+\\epsilon$ raises the optimum by about $2\\epsilon$. The four KKT conditions (stationarity, primal feasibility, $\\mu\\ge0$, complementary slackness) are the machinery behind the half-space projection and minimum-norm questions.","category":"opt","kind":"basics","difficulty":"easy","tags":["KKT","Lagrangian","duality"],"origin":"original","status":"verified","leads_to":["m-opt-kkt-multiplier","m-opt-duality-slater","m-opt-min-norm-dual"],"entry":"Enter the optimal multiplier $\\mu^*$ for the constraint $1-x\\le0$."},{"id":"m-coref-train-val-test","title":"Train, validation and test: who is for what?","prompt":"You have 1,000 labelled examples. You want to choose a regularisation strength $\\lambda$ from five candidates and then report how well the final model will do on new data. (a) Which data do you use to fit the weights, to choose $\\lambda$, and to report the final number? (b) In 5-fold cross-validation on all 1,000 examples, how many examples are used to train in each fold, and how many to validate? (c) Why is it wrong to pick $\\lambda$ using the test set?","hints":["Each example is held out exactly once in $k$-fold CV."],"answer":"Train fits weights, validation (or CV) picks $\\lambda$, test is touched once for the final report. 5-fold: train on 800, validate on 200 per fold. Choosing $\\lambda$ on the test set makes the test score optimistically biased.","answer_type":"free-text","solution":"(a) Fit the weights on the training set, choose $\\lambda$ (any hyperparameter) on a validation set, and report the final number on a test set that was never used for any decision. (b) In 5-fold CV each fold holds out $1000/5=200$ examples and trains on the other $800$; every example is validated exactly once, and the five scores are averaged. (c) If you select $\\lambda$ because it scores best on the test set, the test score has been tuned on and is optimistically biased: it no longer estimates performance on genuinely new data.\n\nIntuition: every decision made while looking at a dataset uses up some of its honesty, so the final report needs data that was never looked at. This is the foundation for the cross-validation, leakage and overfitting-diagnosis questions.","category":"core","kind":"basics","difficulty":"easy","tags":["train/validation/test","cross-validation"],"origin":"original","status":"self-marked","leads_to":["m-core-cross-validation","m-core-overfitting-diagnosis","m-core-p-greater-n"]},{"id":"m-coref-bias-variance-numbers","title":"Bias, variance and MSE with four numbers","prompt":"The true value at some input is $f(x)=3$. You train the same model on four different random training sets and its prediction at $x$ comes out as $2,\\ 4,\\ 4,\\ 6$. Compute the bias$^2$, the variance of the prediction (divide by 4), and the mean squared error $\\mathbb{E}[(\\hat f(x)-3)^2]$ of the predictions. Report the MSE.","hints":["The mean prediction is $4$.","MSE $=$ bias$^2$ $+$ variance (there is no noise in this toy example)."],"answer":"Mean $=4$, bias$^2=1$, variance $=2$, MSE $=3$ (directly: $(1+1+1+9)/4=3$).","answer_type":"numeric","answer_value":3.0,"solution":"The mean prediction is $4$, so bias $=4-3=1$ and bias$^2=1$. The variance around the mean is $((-2)^2+0+0+2^2)/4=2$. Then MSE $=$ bias$^2+$ variance $=1+2=3$, and the direct calculation $((2-3)^2+(4-3)^2+(4-3)^2+(6-3)^2)/4=(1+1+1+9)/4=3$ agrees.\n\nIntuition: error splits into a systematic part (the average model is off target: bias) and an unstable part (the model changes from training set to training set: variance). With real data there is also irreducible noise $\\sigma^2$. Flexible models trade lower bias for higher variance. This is the numerical version of the full decomposition you derive in the bias-variance question.","category":"core","kind":"basics","difficulty":"easy","tags":["bias-variance","MSE"],"origin":"original","status":"verified","leads_to":["m-core-bias-variance","m-core-overfitting-diagnosis","m-core-p-greater-n"],"entry":"Enter the mean squared error $\\mathbb{E}[(\\hat f(x)-3)^2]$ (work out bias$^2$ and variance too; the solution covers them)."},{"id":"m-coref-ridge-lasso-1d","title":"Ridge versus lasso on a single weight","prompt":"Consider one weight and the loss $\\tfrac12(w-a)^2+\\text{penalty}$ with $a=0.8$. (a) With the ridge penalty $\\tfrac{\\lambda}{2}w^2$ and $\\lambda=1$, the minimiser is $w=a/(1+\\lambda)$. What is it? (b) With the lasso penalty $\\lambda|w|$ and $\\lambda=1$, the minimiser is the soft-threshold $\\mathrm{sign}(a)\\max(|a|-\\lambda,0)$. What is it? (c) What does this say about how L1 and L2 treat small coefficients?","hints":["Plug in the numbers: $0.8/2$ and $\\max(0.8-1,0)$."],"answer":"Ridge gives $0.4$ (shrunk but nonzero); lasso gives exactly $0$. L2 shrinks everything proportionally; L1 sets small coefficients exactly to zero (sparsity).","answer_type":"free-text","solution":"(a) Ridge: $w=0.8/(1+1)=0.4$. (b) Lasso: $|a|-\\lambda=0.8-1<0$, so the soft-threshold gives exactly $w=0$. (c) Ridge multiplies the unpenalised estimate by $1/(1+\\lambda)$, so it shrinks every weight but never reaches zero. Lasso subtracts $\\lambda$ from the magnitude and clips at zero, so weights smaller than $\\lambda$ become exactly zero: L1 performs variable selection and gives sparse models.\n\nGeometric intuition: the L1 ball has corners on the axes where the loss contours tend to touch it, whereas the L2 ball is round. This one-dimensional picture is the core of the L1-versus-L2 question and explains why lasso is used when $p\\gg n$.","category":"core","kind":"basics","difficulty":"easy","tags":["ridge","lasso","regularisation"],"origin":"original","status":"self-marked","leads_to":["m-core-l1-vs-l2","m-core-map-ridge","m-core-p-greater-n"]},{"id":"m-coref-map-lambda","title":"Prior variance and the ridge parameter","prompt":"Model $y=w^\\top x+\\varepsilon$ with noise $\\varepsilon\\sim\\mathcal{N}(0,\\sigma^2)$ and prior $w\\sim\\mathcal{N}(0,\\tau^2I)$. Maximising the posterior is equivalent to minimising $\\sum_i(y_i-w^\\top x_i)^2+\\lambda\\|w\\|^2$. Using $\\lambda=\\sigma^2/\\tau^2$, find $\\lambda$ when $\\sigma^2=4$ and $\\tau^2=2$. Does a tighter prior (smaller $\\tau^2$) mean more or less regularisation?","hints":["Multiply the negative log posterior by $2\\sigma^2$."],"answer":"$\\lambda=\\sigma^2/\\tau^2=4/2=2$.
