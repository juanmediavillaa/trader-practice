r case.","The best reply to a pattern $abc$ is (opposite of $b$), $a$, $b$."],"answer":"THH, winning with probability $7/8$; no pattern is best, the relation is non-transitive.","answer_type":"free-text","solution":"A strong answer covers: (1) player 2 picks THH, which wins with probability $7/8$, because HHH only beats it if the first three flips are HHH (probability $1/8$); any earlier tail sets up THH before HHH. (2) General rule: against $abc$, reply with $\\bar b\\,a\\,b$, where $\\bar b$ is the opposite of the middle letter; that prepends a letter so that the opponent's pattern is usually 'cut off'. For example HHT is answered by THH, and THH is answered by TTH. (3) Penney's game is non-transitive: HHH loses to THH, THH loses to TTH, TTH loses to HTT, HTT loses to HHT, and so on, so there is no best pattern and whoever chooses second has the edge, with winning chances from $2/3$ up to $7/8$. (4) Related fact: expected waiting times differ (HHH takes $14$ flips, THH takes $8$), but waiting time alone does not decide who wins the race. (5) Trader lesson: the second mover in a game with observable commitments can exploit it, and a transitive-looking ranking (average time) can hide a cycle in head-to-head outcomes.","category":"probability","difficulty":"hard","tags":["coins","patterns","penney","explain"],"origin":"adapted from a classic (Zhou, green book)","status":"self-marked"},{"id":"t-ev-max-two-dice","title":"Expected larger of two dice","prompt":"You roll two fair six-sided dice and are paid the larger of the two faces (in USD). What is the expected payout?","hints":["Find $P(\\text{max} \\le k)$ first, or count outcomes for each maximum."],"answer":"$161/36 \\approx 4.47$","answer_type":"numeric","answer_value":4.472222222222222,"solution":"The maximum equals $k$ in $2k-1$ of the $36$ ordered outcomes, so $E = \\sum_{k=1}^6 k(2k-1)/36 = (1+6+15+28+45+66)/36 = 161/36 \\approx 4.47$. Sanity check: it must exceed the single-die mean $3.5$ and sit well below $6$.","category":"expected-value","difficulty":"easy","tags":["dice","order-statistics"],"origin":"original","status":"verified"},{"id":"t-ev-min-two-dice","title":"Expected smaller of two dice","prompt":"You roll two fair six-sided dice and are paid the smaller of the two faces (in USD). What is the expected payout?","hints":["The max and the min together add up to the sum of the two dice."],"answer":"$91/36 \\approx 2.53$","answer_type":"numeric","answer_value":2.5277777777777777,"solution":"By symmetry $E[\\min] + E[\\max] = E[a+b] = 7$, and $E[\\max] = 161/36$, so $E[\\min] = 7 - 161/36 = 91/36 \\approx 2.53$. Fair value about $2.5$, so a quote of 2.4 at 2.6 would be reasonable.","category":"expected-value","difficulty":"easy","tags":["dice","order-statistics","symmetry"],"origin":"original","status":"verified"},{"id":"t-ev-linearity-independence","title":"Does linearity need independence?","prompt":"A colleague says: \\\"You can only add expectations, $E[X+Y] = E[X]+E[Y]$, when $X$ and $Y$ are independent.\\\" Is that right? Give a short example with a dependent pair, and say when independence does matter for expectations.","hints":["Take $Y = X$ or $Y = 7 - X$ for a die roll $X$."],"answer":"No: $E[X+Y]=E[X]+E[Y]$ always holds. Independence matters for $E[XY]=E[X]E[Y]$ and for variances adding.","answer_type":"free-text","solution":"A strong answer covers: (1) linearity holds for any random variables with finite means, with no independence needed, because the expectation is a (weighted) sum or integral. (2) Example: let $X$ be a die roll and $Y = 7 - X$. They are perfectly dependent, yet $E[X+Y] = 7 = 3.5 + 3.5$. Likewise $Y = X$ gives $E[2X] = 2E[X]$. (3) Independence is needed for $E[XY] = E[X]E[Y]$ (here $E[XY] = E[7X - X^2] = 24.5 - 91/6 \\ne 12.25$) and for $\\mathrm{Var}(X+Y) = \\mathrm{Var}(X) + \\mathrm{Var}(Y)$ (the covariance term otherwise). (4) Why it matters for a trader: it lets you price sums of dependent legs, such as the number of matches in a shuffled deck, by adding one-line indicator expectations.","category":"expected-value","difficulty":"easy","tags":["linearity","concepts"],"origin":"original","status":"self-marked"},{"id":"t-ev-rolls-until-five-or-six","title":"Rolls until a five or a six","prompt":"You roll a fair die repeatedly until it shows a $5$ or a $6$ for the first time. On average, how many rolls does this take, counting the final roll?","hints":["Each roll is a success with probability $1/3$ regardless of history."],"answer":"$3$","answer_type":"numeric","answer_value":3.0,"solution":"The number of rolls is geometric with success probability $p = 2/6 = 1/3$, so the mean is $1/p = 3$. Equivalently $E = 1 + \\tfrac{2}{3}E$, giving $E = 3$.","category":"expected-value","difficulty":"easy","tags":["dice","geometric","waiting-time"],"origin":"original","status":"verified"},{"id":"t-ev-matching-adjacent-flips","title":"Matching neighbours in ten coin flips","prompt":"You flip a fair coin $10$ times in a row. Count the adjacent pairs of flips (positions $1$-$2$, $2$-$3$, and so on) that show the same face. What is the expected count?","hints":["Write the count as a sum of indicators, one per adjacent pair. Do you need independence between pairs?"],"answer":"$4.5$","answer_type":"numeric","answer_value":4.5,"solution":"There are $9$ adjacent pairs, and each matches with probability $1/2$ (the second flip equals the first with probability $1/2$). By linearity the expected count is $9 \\times 1/2 = 4.5$. The indicators are not all independent in the joint sense, but linearity does not care.","category":"expected-value","difficulty":"easy","tags":["coins","indicators","linearity"],"origin":"original","status":"verified"},{"id":"t-ev-first-ace-position","title":"Position of the first ace","prompt":"A standard $52$-card deck is shuffled and dealt face up one card at a time. On average, which position (counting from $1$) does the first ace appear at?","hints":["The four aces split the other $48$ cards into $5$ gaps. By symmetry, how long is the first gap on average?"],"answer":"$53/5 = 10.6$","answer_type":"numeric","answer_value":10.6,"solution":"Each of the $48$ non-aces lies before all four aces with probability $1/5$ (the non-ace and the four aces are equally likely to be in any relative order). So the expected number of non-aces before the first ace is $48/5 = 9.6$, and the first ace sits at position $9.6 + 1 = 10.6$.","category":"expected-value","difficulty":"medium","tags":["cards","indicators","symmetry"],"origin":"adapted from a classic (Zhou, green book; Mosteller)","status":"verified"},{"id":"t-ev-max-three-dice","title":"Expected maximum of three dice","prompt":"You roll three fair dice and are paid the highest face showing in USD. What is the expected payout?","hints":["Use $E[M] = \\sum_{k=1}^{6} P(M \\ge k)$.","$P(M \\le k) = (k/6)^3$."],"answer":"$119/24 \\approx 4.96$","answer_type":"numeric","answer_value":4.958333333333333,"solution":"$E[M] = \\sum_{k=0}^{5} P(M > k) = \\sum_{k=0}^{5} \\bigl(1 - (k/6)^3\\bigr) = 6 - (0+1+8+27+64+125)/216 = 6 - 225/216 = 1071/216 = 119/24 \\approx 4.96$. For a market maker: fair value 4.96, so something like 4.8 at 5.1 is sensible.","category":"expected-value","difficulty":"medium","tags":["dice","order-statistics","market-making"],"origin":"original","status":"verified"},{"id":"t-ev-flips-to-hh","title":"Flips until two heads in a row","prompt":"You flip a fair coin until you see two heads in a row (HH). What is the expected number of flips?","hints":["Set up states: no progress, and one head just seen."],"answer":"$6$","answer_type":"numeric","answer_value":6.0,"solution":"Let $E_0$ be the expected flips from scratch and $E_1$ the expected flips after one head. Then $E_0 = 1 + \\tfrac12 E_1 + \\tfrac12 E_0$ and $E_1 = 1 + \\tfrac12 \\cdot 0 + \\tfrac12 E_0$. Substituting, $E_0 = 2 + E_1$ and $E_1 = 1 + E_0/2$, so $E_0 = 3 + E_0/2$ and $E_0 = 6$. Compare HT, which needs only $4$: HH can restart from nothing after a tail that follows a head.","category":"expected-value","difficulty":"medium","tags":["coins","markov-chain","waiting-time"],"origin":"adapted from a classic (Zhou, green book)","status":"verified"},{"id":"t-ev-distinct-faces-six-dice","title":"Distinct faces among six dice","prompt":"You roll six fair dice at once. What is the expected number of different face values that appear?","hints":["Define an indicator for each face value: does that value appear at least once?"],"answer":"$6\\bigl(1 - (5/6)^6\\bigr) \\approx 3.99$","answer_type":"numeric","answer_value":3.9906121399176953,"solution":"For a given value $v$, the probability that it never appears is $(5/6)^6$, so it appears with probability $1-(5/6)^6 = 31031/46656$. Summing the six indicators gives $6 \\times 31031/46656 = 31031/7776 \\approx 3.99$. Counting distinct values directly would be a mess; indicators make it one line.","category":"expected-value","difficulty":"medium","tags":["dice","indicators","linearity"],"origin":"original","status":"verified"},{"id":"t-ev-coupon-collector-die","title":"Rolls to see every face","prompt":"How many times, on average, must you roll a fair die before every one of the six faces has appeared at least once?","hints":["Once you hold $k$ distinct faces, how long to wait for a new one?"],"answer":"$14.7$","answer_type":"numeric","answer_value":14.7,"solution":"With $k$ faces already seen, a new face appears with probability $(6-k)/6$, so the wait is $6/(6-k)$. Total $= 6(1/6 + 1/5 + 1/4 + 1/3 + 1/2 + 1) = 6H_6 = 14.7$. This is the coupon collector, about $n \\ln n + 0.577n$ in general, and the last face alone costs $6$ rolls.","category":"expected-value","difficulty":"medium","tags":["dice","coupon-collector","waiting-time"],"origin":"adapted from a classic (Zhou, green book)","status":"verified"},{"id":"t-ev-roll-until-six-total","title":"Total of all rolls until a six","prompt":"You roll a fair die repeatedly until a $6$ appears, and add up every roll including the final $6$. The total is your payout in USD. What is the expected payout?","hints":["First find the expected number of rolls. Does the number of rolls change what each roll averages?","Or set up $S = \\tfrac16 \\cdot 6 + \\sum_{k=1}^{5} \\tfrac16 (k + S)$."],"answer":"$21$","answer_type":"numeric","answer_value":21.0,"solution":"The expected number of rolls is $6$. Wald's identity says the expected sum of a random number of iid terms (when the stopping rule depends only on the past) is $E[N]E[X]$. But careful: the last roll is always a $6$, so it is not an average roll. Using the recursion directly: $S = \\tfrac16 \\cdot 6 + \\tfrac16\\sum_{k=1}^5 (k+S) = 1 + 2.5 + \\tfrac56 S$, so $S/6 = 3.5$ and $S = 21$. This equals $6 \\times 3.5$, matching Wald, since $N$ is a stopping time.","category":"expected-value","difficulty":"medium","tags":["dice","wald","recursion"],"origin":"original","status":"verified"},{"id":"t-ev-rolls-until-repeat","title":"Rolls until the same face twice in a row","prompt":"You roll a fair die until two consecutive rolls show the same number. What is the expected number of rolls, counting both of the matching rolls?","hints":["After the first roll, each new roll matches the previous one with probability $1/6$."],"answer":"$7$","answer_type":"numeric","answer_value":7.0,"solution":"After the first roll, every subsequent roll matches the one before it with probability $1/6$, whatever the face was, so the further wait is geometric with mean $6$. Add the first roll: $1 + 6 = 7$. Compare with waiting for a specific pair such as two sixes in a row, which takes $42$.","category":"expected-value","difficulty":"medium","tags":["dice","geometric","waiting-time"],"origin":"original","status":"verified"},{"id":"t-ev-flips-to-hth","title":"Flips until HTH","prompt":"You flip a fair coin until the three-flip pattern H, T, H appears (consecutive, in that order). What is the expected number of flips?","hints":["Build the chain on the longest matched prefix: nothing, H, HT. Remember that the final H of a completed HTH can start the next pattern."],"answer":"$10$","answer_type":"numeric","answer_value":10.0,"solution":"States: $E_0$ (no progress), $E_H$, $E_{HT}$. Then $E_0 = 1 + \\tfrac12 E_H + \\tfrac12 E_0$; $E_H = 1 + \\tfrac12 E_H + \\tfrac12 E_{HT}$ (a head keeps you at H); $E_{HT} = 1 + \\tfrac12 \\cdot 0 + \\tfrac12 E_0$ (a tail resets). Solving: $E_0 = 2 + E_H$, $E_H = 2 + E_{HT}$, $E_{HT} = 1 + E_0/2$, so $E_0 = 5 + E_0/2$ and $E_0 = 10$. Shortcut: for a coin, expected wait is $\\sum 2^k$ over every length $k$ where the pattern's prefix equals its suffix: $8 + 2 = 10$ (HTH overlaps itself at length $1$ and $3$). HHT, with no overlap, takes only $8$.","category":"expected-value","difficulty":"hard","tags":["coins","markov-chain","pattern","waiting-time"],"origin":"adapted from a classic (Zhou, green book)","status":"verified"},{"id":"t-ev-rolls-to-two-sixes","title":"Rolls until two sixes in a row","prompt":"You roll a fair die until a $6$ is immediately followed by another $6$. What is the expected number of rolls?","hints":["Use two states: the last roll was not a six, and the last roll was a six.","Alternatively think of the coin-pattern overlap rule with a base of $6$."],"answer":"$42$","answer_type":"numeric","answer_value":42.0,"solution":"Let $E_0$ be the expected rolls from scratch and $E_1$ from just after a six. $E_0 = 1 + \\tfrac16 E_1 + \\tfrac56 E_0$, so $E_0 = 6 + E_1$. $E_1 = 1 + \\tfrac16 \\cdot 0 + \\tfrac56 E_0$. Then $E_0 = 6 + 1 + \\tfrac56 E_0$, so $E_0/6 = 7$ and $E_0 = 42$. Overlap rule: $6^2 + 6^1 = 42$.","category":"expected-value","difficulty":"hard","tags":["dice","markov-chain","pattern","waiting-time"],"origin":"original","status":"verified"},{"id":"t-ev-records-in-permutation","title":"Running highs in a shuffled list","prompt":"Ten distinct prices are revealed one at a time in a uniformly random order. Call a price a \\\"record\\\" if it is higher than all prices revealed before it (the first price counts as a record). What is the expected number of records?","hints":["Look at position $i$: what is the probability that the largest of the first $i$ prices sits in position $i$?"],"answer":"$H_{10} = 7381/2520 \\approx 2.93$","answer_type":"numeric","answer_value":2.9289682539682538,"solution":"The $i$th price is a record exactly when the maximum of the first $i$ prices is in position $i$, which has probability $1/i$ by symmetry. By linearity the expected count is $\\sum_{i=1}^{10} 1/i = H_{10} = 7381/2520 \\approx 2.93$. The indicators are in fact independent, but we do not need that. Growth is only logarithmic: about $\\ln n + 0.58$.","category":"expected-value","difficulty":"hard","tags":["permutations","indicators","harmonic","linearity"],"origin":"adapted from a classic (Zhou, green book)","status":"verified"},{"id":"t-ev-reroll-once-free","title":"Roll a die with one free re-roll","prompt":"You roll a fair die and are paid its face in USD. After seeing the first roll you may, if you wish, roll again once for free; you then must take the second roll. With the best strategy, what is the expected payout?","hints":["A re-roll is worth $3.5$ on average. When is that better than the face you hold?"],"answer":"$4.25$","answer_type":"numeric","answer_value":4.25,"solution":"A re-roll is worth $3.5$, so keep a first roll of $4$, $5$ or $6$ and re-roll $1$, $2$ or $3$. Value $= \\tfrac16(4+5+6) + \\tfrac36 \\times 3.5 = 2.5 + 1.75 = 4.25$. Compare the no-decision value of $3.5$: the option to re-roll is worth $0.75$.","category":"expected-value","difficulty":"easy","tags":["dice","optimal-stopping","reroll"],"origin":"adapted from a classic (Zhou, green book)","status":"verified"},{"id":"t-ev-which-bet-gap","title":"Which of two bets is better","prompt":"Bet A: with probability $0.4$ you win USD 25, otherwise you lose USD 10. Bet B: with probability $0.7$ you win USD 8, otherwise you lose USD 12. You can take only one. By how many USD does the expected value of the better bet exceed that of the other?","hints":["Compute $E = p \\cdot \\text{win} - (1-p) \\cdot \\text{loss}$ for each."],"answer":"$2$ (A is better: $+4$ versus $+2$)","answer_type":"numeric","answer_value":2.0,"solution":"$E[A] = 0.4 \\times 25 - 0.6 \\times 10 = 10 - 6 = 4$. $E[B] = 0.7 \\times 8 - 0.3 \\times 12 = 5.6 - 3.6 = 2$. A is better by $2$ USD. A has the lower win rate but the fatter payout; a risk-neutral trader just compares expectations, though A also has the higher variance.","category":"expected-value","difficulty":"easy","tags":["bets","comparison"],"origin":"original","status":"verified"},{"id":"t-ev-square-of-die-price","title":"Fair price of a game paying the square of a die","prompt":"A game pays you, in USD, the square of the face of a fair die rolled once. What is the fair price to play?","hints":["Do not square the average. Average the squares."],"answer":"$91/6 \\approx 15.17$","answer_type":"numeric","answer_value":15.166666666666666,"solution":"$E[X^2] = (1+4+9+16+25+36)/6 = 91/6 \\approx 15.17$. Note that $(E[X])^2 = 12.25$ is lower: the gap $91/6 - 12.25 = 35/12$ is exactly the variance of a die. A convex payoff is always worth more than the payoff at the mean (Jensen), the same idea as why options are worth more than their intrinsic value.","category":"expected-value","difficulty":"easy","tags":["dice","fair-price","jensen"],"origin":"original","status":"verified"},{"id":"t-ev-ticket-seven-or-eleven","title":"Fair price of a seven-or-eleven ticket","prompt":"A ticket pays USD 30 if two fair dice sum to $7$ or $11$, and nothing otherwise. What is its fair price in USD?","hints":["Six outcomes make $7$ and two make $11$."],"answer":"$20/3 \\approx 6.67$","answer_type":"numeric","answer_value":6.666666666666667,"solution":"There are $6 + 2 = 8$ favourable ordered outcomes out of $36$, so the probability is $2/9$ and the fair price is $30 \\times 2/9 = 20/3 \\approx 6.67$ USD. You would quote perhaps 6.5 at 6.9 and then adjust to flow.","category":"expected-value","difficulty":"easy","tags":["dice","fair-price"],"origin":"original","status":"verified"},{"id":"t-ev-roll-again-principle","title":"How to decide whether to roll again","prompt":"You are offered a repeated game: roll a die, then choose to take the face value (in USD) or roll again, up to a fixed maximum number of rolls, with the last roll forced. Describe a general method for finding the best strategy and its value, and use it to explain why the threshold for stopping gets higher as more rolls remain.","hints":["Start from the end of the game and work backwards."],"answer":"Backward induction: stop if the face beats the value of continuing; the continuation value rises with each extra roll available.","answer_type":"free-text","solution":"A strong answer covers: (1) Backward induction. With one roll left the value is $V_1 = 3.5$. (2) With $n$ rolls left, after seeing a face $f$ you stop if $f > V_{n-1}$ (the value of the game with $n-1$ rolls left), otherwise continue, giving $V_n = E[\\max(X, V_{n-1})]$. (3) Numbers: $V_1 = 3.5$, $V_2 = 4.25$ (stop on $4$+), $V_3 = 14/3 \\approx 4.67$ (stop on $5$+), $V_4 = 89/18 \\approx 4.94$ (stop on $5$+). (4) The values $V_n$ increase with $n$ because more options never hurt, so the stopping threshold (equal to the continuation value) rises. (5) The decision is made on the current state only, ignoring what has already been rolled (sunk). (6) Mention that a risk-neutral EV maximiser uses this directly, while a trader should check whether the payoffs are large relative to bankroll.","category":"expected-value","difficulty":"easy","tags":["optimal-stopping","backward-induction","concepts"],"origin":"original","status":"self-marked"},{"id":"t-ev-three-rolls-stopping","title":"Roll a die up to three times","prompt":"You roll a fair die and are paid the face in USD if you choose to stop. After each of the first two rolls you may stop and take that face, or roll again; the third roll, if reached, must be taken. With optimal play, what is the expected payout?","hints":["Work backwards. The value of the last two rolls together is $4.25$."],"answer":"$14/3 \\approx 4.67$","answer_type":"numeric","answer_value":4.666666666666667,"solution":"With two rolls left the value is $4.25$. So on the first roll, keep a $5$ or $6$ (worth more than $4.25$) and otherwise continue: $V_3 = \\tfrac16(5+6) + \\tfrac46 \\times 4.25 = 11/6 + 17/6 = 28/6 = 14/3 \\approx 4.67$.","category":"expected-value","difficulty":"medium","tags":["dice","optimal-stopping","backward-induction"],"origin":"adapted from a classic (Zhou, green book)","status":"verified"},{"id":"t-ev-two-dice-reroll-each","title":"Two dice, each with a free re-roll","prompt":"You roll two fair dice and are paid the sum in USD. Having seen both, you may choose to re-roll either die, both, or neither, once each, and must keep the new faces. What is the expected payout with the best strategy?","hints":["Does the decision about one die depend on the other?"],"answer":"$8.5$","answer_type":"numeric","answer_value":8.5,"solution":"The payout is a sum, so by linearity the best strategy treats each die separately: re-roll a die showing $1$, $2$ or $3$ (since a re-roll is worth $3.5$). Each die is worth $4.25$, so the total is $2 \\times 4.25 = 8.5$ (versus $7$ with no re-roll). Fair value $8.5$.","category":"expected-value","difficulty":"medium","tags":["dice","reroll","linearity"],"origin":"original","status":"verified"},{"id":"t-ev-capped-st-petersburg","title":"A capped doubling game","prompt":"A fair coin is flipped until the first head. If the first head is on flip $k$, you are paid $2^k$ USD, but the casino caps every payout at USD 1,024. What is the fair price to play?","hints":["For $k \\le 10$ each term contributes $2^k \\cdot 2^{-k} = 1$. What happens for $k > 10$?"],"answer":"$11$ USD","answer_type":"numeric","answer_value":11.0,"solution":"The first ten terms ($k = 1$ to $10$) each add $2^k \\cdot 2^{-k} = 1$, giving $10$. For $k > 10$ the payout is $1024$, and the probability that the first head comes after flip $10$ is $2^{-10}$, adding $1024 \\times 2^{-10} = 1$. Total $11$ USD. The uncapped game has infinite EV, yet nobody would pay much: each doubling of the cap adds only $1$ USD of value.","category":"expected-value","difficulty":"medium","tags":["st-petersburg","fair-price","series"],"origin":"adapted from a classic (St Petersburg paradox)","status":"verified"},{"id":"t-ev-uniform-three-draws","title":"Redraw a random number up to three times","prompt":"A computer draws a number uniformly from $[0, 1]$ and shows it to you. You may accept it (and are paid that many USD) or ask for a fresh draw. You may ask for at most two redraws, and after the last one you must accept. With optimal play, what is the expected payout?","hints":["With one draw left the value is $1/2$. For a threshold $t$, $E[\\max(U,t)] = (1+t^2)/2$."],"answer":"$89/128 \\approx 0.695$","answer_type":"numeric","answer_value":0.6953125,"solution":"Work backwards. With one draw left the value is $V_1 = 1/2$. With two draws left, accept anything above $1/2$: $V_2 = E[\\max(U, 1/2)] = (1 + 1/4)/2 = 5/8$. With three draws left, accept anything above $5/8$: $V_3 = (1 + 25/64)/2 = 89/128 \\approx 0.695$. The thresholds are $5/8$ on the first draw and $1/2$ on the second.","category":"expected-value","difficulty":"medium","tags":["uniform","optimal-stopping","backward-induction"],"origin":"original","status":"verified"},{"id":"t-ev-bank-or-roll-threshold","title":"Bank it or roll again: the break-even total","prompt":"You are building a running total in USD. On each turn you may bank the total, or roll a fair die: on a $1$ you lose everything (total becomes $0$), otherwise you add the face ($2$ to $6$) to the total. At what whole-number total are you exactly indifferent between banking and rolling once more (then banking)?","hints":["Compare the total $T$ with the expected total after one more roll."],"answer":"$20$","answer_type":"numeric","answer_value":20.0,"solution":"Rolling once gives $\\tfrac16 \\cdot 0 + \\tfrac16\\sum_{k=2}^{6}(T+k) = (5T + 20)/6$. Set this equal to $T$: $5T + 20 = 6T$, so $T = 20$. Below $20$ rolling beats banking, above $20$ banking wins. This is the logic of the dice game Pig, where the standard \\\"hold at 20\\\" rule comes from.","category":"expected-value","difficulty":"medium","tags":["dice","optimal-stopping","risk"],"origin":"adapted from a classic (the dice game Pig)","status":"verified"},{"id":"t-ev-card-keep-higher","title":"Draw two cards and keep the higher","prompt":"A card's value is its rank for ace (as $1$) to $10$, and $10$ for each jack, queen and king. You draw two cards without replacement from a standard $52$-card deck and are paid the higher value in USD. What is the expected payout, to two decimal places?","hints":["The mean of one card is $85/13 \\approx 6.54$. Does keeping the higher of two raise it by a lot?"],"answer":"$1845/221 \\approx 8.35$","answer_type":"numeric","answer_value":8.34841628959276,"solution":"Use $E[\\max] = \\sum_{m=1}^{10} P(\\max \\ge m)$. The max is below $m$ only if both cards are below $m$; for $m \\le 10$ there are $4(m-1)$ such cards, so $P(\\max \\ge m) = 1 - \\binom{4(m-1)}{2}/\\binom{52}{2}$ (and the $m=1$ term is $1$). Summing over $m = 1..10$ gives $1845/221 \\approx 8.35$, a gain of about $1.8$ over a single draw.","category":"expected-value","difficulty":"medium","tags":["cards","order-statistics","market-making"],"origin":"original","status":"verified"},{"id":"t-ev-higher-lower-thirteen","title":"Higher or lower with thirteen cards","prompt":"Thirteen cards numbered $1$ to $13$ are shuffled. You are shown the top card, then bet USD 1 on whether the next card is higher or lower than it (you choose the side after seeing the first card). A correct call wins USD 1, a wrong one loses USD 1. With best play, what is your expected profit in USD?","hints":["If the first card is $v$, there are $13 - v$ higher and $v - 1$ lower cards among the remaining $12$."],"answer":"$7/13 \\approx 0.54$","answer_type":"numeric","answer_value":0.5384615384615384,"solution":"For first card $v$, you pick the larger side: $m = \\max(13 - v, v - 1)$ cards out of $12$. Over $v = 1..13$ the values of $m$ are $12, 11, 10, 9, 8, 7, 6, 7, 8, 9, 10, 11, 12$, summing to $120$. The average win probability is $120/(13 \\times 12) = 10/13$, so the edge per USD 1 is $2 \\times 10/13 - 1 = 7/13 \\approx 0.54$ USD.","category":"expected-value","difficulty":"medium","tags":["cards","betting","decision"],"origin":"adapted from a classic (higher-or-lower card game)","status":"verified"},{"id":"t-ev-reroll-unlimited-cost","title":"Unlimited re-rolls at a fee","prompt":"You roll a fair die and are paid the face in USD if you stop. After any roll you may pay a fee of USD 0.50 to roll again, as many times as you like. With optimal play, what is the expected net payout (face minus total fees) before the first roll?","hints":["Let $V$ be the value of the game before a roll. After seeing face $f$ you keep $f$ or pay for another go, worth $V - 0.5$.","Guess a stopping threshold, then solve for $V$ and check that it is self-consistent."],"answer":"$4.5$","answer_type":"numeric","answer_value":4.5,"solution":"We need $V = E[\\max(X, V - 0.5)]$. Try stopping on $5$ or $6$ and re-rolling on $1$ to $4$: $V = \\tfrac16(5+6) + \\tfrac46(V - 0.5)$, so $V/3 = 11/6 - 1/3 = 3/2$ and $V = 4.5$. Check: a re-roll is worth $V - 0.5 = 4$, so a $4$ is a tie, $5$ and $6$ are kept, and $1$ to $3$ are re-rolled. Consistent. Intuition: the fee turns the threshold into the value of the game less the fee, a fixed point.","category":"expected-value","difficulty":"hard","tags":["dice","optimal-stopping","fixed-point"],"origin":"original","status":"verified"},{"id":"t-ev-rolls-to-reach-hundred","title":"Rolls to reach a total of 100","prompt":"You roll a fair die repeatedly, keeping a running total, until the total is at least $100$. Roughly how many rolls does this take on average? Give your answer to the nearest whole number.","hints":["Each roll adds $3.5$ on average. By how much does the final total overshoot $100$, typically?"],"answer":"$\\approx 29$","answer_type":"numeric","answer_value":29.0,"solution":"The rolls needed is a stopping time, so Wald gives $E[\\text{final total}] = 3.5 \\times E[N]$. The final total overshoots $100$ by about $1$ to $2$ on average (the final total lies in $100..105$), roughly $101.7$. Then $E[N] \\approx 101.7/3.5 \\approx 29.05$, so about $29$. A crude $100/3.5 \\approx 28.6$ rounds to the same integer. The exact recursion gives $29.05$.","category":"expected-value","difficulty":"hard","tags":["dice","wald","renewal","estimation"],"origin":"adapted from a classic (reported Optiver-style question)","status":"verified"},{"id":"t-ev-winners-curse-bid","title":"Bidding for a box worth more to you","prompt":"A sealed box contains a prize worth $V$ USD, with $V$ uniform on $[0, 100]$. The seller knows $V$ and will accept any bid of at least $V$. To you the prize is worth $1.5V$. You bid $b$ before seeing $V$. What bid maximises your expected profit, and what is the profit? Give the optimal bid in USD.","hints":["If your bid wins, what is $E[V \\mid V \\le b]$?"],"answer":"$0$: any positive bid has negative expected profit","answer_type":"numeric","answer_value":0.0,"solution":"If you bid $b$ you win only when $V \\le b$, and then $V$ is uniform on $[0, b]$ with mean $b/2$. The prize is worth $1.5 \\times b/2 = 0.75b$ to you but costs $b$. Profit is $\\int_0^b (1.5v - b)\\,dv/100 = -b^2/400 < 0$ for every $b > 0$. So the best bid is $0$ (do not trade). The winner's curse: winning tells you the value is low. The same logic applies to a market maker whose quote gets hit: conditional on the fill, fair value moves against you.","category":"expected-value","difficulty":"hard","tags":["adverse-selection","winners-curse","auction"],"origin":"adapted from a classic (Akerlof 'acquire a company' problem)","status":"verified"},{"id":"t-games-kelly-even-money-60","title":"Kelly fraction on a 60% even-money bet","prompt":"A coin lands heads $60\\%$ of the time. You may bet any fraction of your bankroll on heads at even money (win your stake or lose it), repeatedly. What fraction of your bankroll should you stake each time to maximise long-run growth (the Kelly fraction)?","hints":["For even money the Kelly fraction is your edge: $p - q$."],"answer":"$20\\%$","answer_type":"numeric","answer_value":0.2,"solution":"Maximise $g(f) = 0.6\\ln(1+f) + 0.4\\ln(1-f)$. Setting $g'(f) = 0.6/(1+f) - 0.4/(1-f) = 0$ gives $0.6(1-f) = 0.4(1+f)$, so $f = 0.2$. In general, for even money $f^* = p - q = 2p - 1$. Bet $20\\%$ of the bankroll each time.","category":"games","difficulty":"easy","tags":["kelly","bet-sizing"],"origin":"adapted from a classic (Kelly criterion)","status":"verified"},{"id":"t-games-kelly-two-to-one","title":"Kelly fraction on a two-to-one bet","prompt":"A bet pays $2$ to $1$ (you win twice your stake if it wins and lose the stake if it loses) and wins with probability $0.4$. What Kelly fraction of the bankroll should you stake?","hints":["Kelly is $f^* = (bp - q)/b$ for net odds $b$."],"answer":"$10\\%$","answer_type":"numeric","answer_value":0.1,"solution":"$f^* = (bp - q)/b = (2 \\times 0.4 - 0.6)/2 = 0.2/2 = 0.1$. The edge per USD staked is $0.2$ but the odds are long, so the sensible stake is only $10\\%$ of the bankroll. Roughly, Kelly is edge divided by odds.","category":"games","difficulty":"easy","tags":["kelly","bet-sizing"],"origin":"adapted from a classic (Kelly criterion)","status":"verified"},{"id":"t-games-kelly-three-to-one","title":"Kelly fraction with long odds","prompt":"A bet pays $3$ to $1$ and wins with probability $0.3$. What fraction of your bankroll should you stake to maximise long-run growth? Give a fraction.","hints":["Net odds $b = 3$, $p = 0.3$, $q = 0.7$."],"answer":"$1/15 \\approx 6.7\\%$","answer_type":"numeric","answer_value":0.06666666666666667,"solution":"$f^* = (bp - q)/b = (0.9 - 0.7)/3 = 0.2/3 = 1/15 \\approx 6.7\\%$. The expected profit per USD staked is $0.3 \\times 3 - 0.7 = 0.2$, a $20\\%$ edge, yet the Kelly stake is small because you lose most of the time. If the result had been negative (say, win probability $0.2$), the answer would be to not bet.","category":"games","difficulty":"easy","tags":["kelly","bet-sizing"],"origin":"adapted from a classic (Kelly criterion)","status":"verified"},{"id":"t-games-roulette-house-edge","title":"Expected loss on roulette","prompt":"A European roulette wheel has $37$ pockets ($0$ to $36$). A single-number bet pays $35$ to $1$ (you win $35$ times the stake plus keep the stake if it hits; you lose the stake otherwise). In USD, what is the expected loss on a total of USD 1,000 staked in single-number bets? Give the answer to two decimal places.","hints":["Expected profit per USD 1 staked is $\\tfrac{1}{37}(35) - \\tfrac{36}{37}(1)$."],"answer":"$1000/37 \\approx 27.03$ USD","answer_type":"numeric","answer_value":27.027027027027028,"solution":"Per USD 1 staked, expected profit is $\\tfrac{35}{37} - \\tfrac{36}{37} = -\\tfrac{1}{37} \\approx -2.7\\%$. This is the house edge. On USD 1,000 staked the expected loss is $1000/37 \\approx 27.03$ USD, whatever the mix of bets. Note this is expected loss on money staked (turnover), not on a bankroll.","category":"games","difficulty":"easy","tags":["house-edge","roulette"],"origin":"original","status":"verified"},{"id":"t-games-variance-hundred-bets","title":"Variance of a hundred even-money bets","prompt":"You make $100$ independent bets of USD 1 each at even money (win USD 1 or lose USD 1). Each wins with probability $0.6$. What is the variance of your total net profit, in USD squared?","hints":["Find the variance of one bet, then use independence."],"answer":"$96$","answer_type":"numeric","answer_value":96.0,"solution":"One bet has outcome $\\pm 1$: $E[X] = 0.2$, $E[X^2] = 1$, so $\\mathrm{Var}(X) = 1 - 0.04 = 0.96$. Independence gives $100 \\times 0.96 = 96$, so the standard deviation is about $9.8$ USD against an expected profit of $20$ USD. The edge becomes clear after enough bets: the mean grows like $n$, the standard deviation like $\\sqrt{n}$.","category":"games","difficulty":"easy","tags":["variance","bets"],"origin":"original","status":"verified"},{"id":"t-games-martingale-doubling-ev","title":"Doubling after every loss","prompt":"You bet on a fair coin at even money, starting with USD 1 and doubling the stake after every loss, until you win once (then you stop). Your bankroll is USD 1,023, so if you lose ten times in a row you cannot make the eleventh bet and you stop having lost everything. What is your expected total profit in USD?","hints":["If the first win comes on bet $k$, your profit is $2^{k-1} - (2^{k-1} - 1) = 1$ USD."],"answer":"$0$","answer_type":"numeric","answer_value":0.0,"solution":"With probability $1 - 2^{-10} = 1023/1024$ you win USD 1 in the end; with probability $1/1024$ you lose USD 1,023. Expected profit $= 1023/1024 - 1023/1024 = 0$. The strategy turns a fair game into a high-probability small win and a rare catastrophic loss, with unchanged expectation. With any negative edge, the expectation would be negative.","category":"games","difficulty":"medium","tags":["martingale","doubling","ruin"],"origin":"adapted from a classic (martingale betting)","status":"verified"},{"id":"t-games-ruin-probability-edge","title":"Chance of going bust with a small edge","prompt":"You bet USD 1 at a time, even money, each bet winning with probability $0.55$, independently. You start with USD 10 and keep playing forever (no upper target) unless you hit USD 0. Approximately, what is the probability that you are eventually ruined? Give a decimal to three places.","hints":["For an infinite horizon the ruin probability from $k$ is $(q/p)^k$."],"answer":"$(9/11)^{10} \\approx 0.134$","answer_type":"numeric","answer_value":0.13443,"solution":"For a random walk with up-probability $p$ and down-probability $q < p$, the probability of ever hitting $0$ from $k$ is $(q/p)^k$. Here $q/p = 0.45/0.55 = 9/11$, so ruin probability $= (9/11)^{10} \\approx 0.134$. Even with a $10\\%$ edge per bet, a thin bankroll of ten units goes bust about one time in seven; the lesson is that sizing, not just edge, decides survival.","category":"games","difficulty":"medium","tags":["ruin","random-walk"],"origin":"adapted from a classic (gambler's ruin)","status":"verified"},{"id":"t-games-growth-rate-at-kelly","title":"Growth rate at the Kelly stake","prompt":"Bets are at even money and win with probability $0.55$. You stake the Kelly fraction of your bankroll every time. What is the expected log-growth of your bankroll per bet, as a decimal, to four decimal places?","hints":["The Kelly fraction is $0.1$. Growth is $p\\ln(1+f) + q\\ln(1-f)$."],"answer":"$0.0050$","answer_type":"numeric","answer_value":0.0050084,"solution":"Kelly is $f^* = p - q = 0.1$. Growth per bet is $0.55\\ln 1.1 + 0.45\\ln 0.9 = 0.55 \\times 0.09531 - 0.45 \\times 0.10536 \\approx 0.0050$. That is about $0.5\\%$ per bet, so roughly $100$ bets to grow bankroll by a factor of $e^{0.5} \\approx 1.65$. The small number is the point: real edges compound slowly, and a rough rule is growth $\\approx (p-q)^2/2 = 0.005$.","category":"games","difficulty":"medium","tags":["kelly","log-growth"],"origin":"original","status":"verified"},{"id":"t-games-kelly-uneven-payoffs","title":"Kelly when you can lose only part of the stake","prompt":"Each round, with probability $1/2$ the amount you commit doubles, and with probability $1/2$ you lose only $40\\%$ of the amount committed. You choose each round the fraction $f$ of your bankroll to commit ($0 \\le f \\le 1$). Which $f$ maximises the long-run growth rate?","hints":["Wealth multiplies by $1 + f$ on a win and by $1 - 0.4f$ on a loss. Maximise $\\tfrac12\\ln(1+f) + \\tfrac12\\ln(1-0.4f)$."],"answer":"$0.75$","answer_type":"numeric","answer_value":0.75,"solution":"Differentiate: $\\tfrac{1}{2(1+f)} - \\tfrac{0.2}{1-0.4f} = 0$, so $0.5(1 - 0.4f) = 0.2(1+f)$, giving $0.5 - 0.2f = 0.2 + 0.2f$ and $f = 0.75$. General rule: $f^* = p/a - q/b$ where $a$ is the fraction lost on a loss and $b$ the fraction gained on a win: $0.5/0.4 - 0.5/1 = 0.75$. A smaller possible loss allows a bigger stake.","category":"games","difficulty":"medium","tags":["kelly","bet-sizing"],"origin":"original","status":"verified"},{"id":"t-games-bold-play-sixteen","title":"Reaching 16 from 10 on fair bets","prompt":"You have USD 10 and want USD 16. You may play a fair even-money game (a fair coin, win or lose your stake) as many times as you like, choosing any whole-dollar stake up to your bankroll each time, stopping when you hit USD 16 or USD 0. Using the bold strategy (stake as much as you can without overshooting 16), what is your probability of reaching USD 16?","hints":["Bold means stake $\\min(x, 16 - x)$ when you hold $x$. Is there a quick argument that does not depend on strategy?"],"answer":"$5/8 = 0.625$","answer_type":"numeric","answer_value":0.625,"solution":"Your bankroll in a fair game is a martingale, so $E[\\text{final}] = 10$. The final value is $16$ with probability $P$ and $0$ otherwise, so $16P = 10$ and $P = 5/8 = 0.625$. This holds for every strategy (all stake choices), so bold play is no better or worse in a fair game. Only in an unfair game does bold play become optimal.","category":"games","difficulty":"medium","tags":["martingale","gamblers-ruin","target"],"origin":"adapted from a classic (Zhou, green book; bold play)","status":"verified"},{"id":"t-games-choose-between-two-bets","title":"Higher edge or lower risk?","prompt":"You can run exactly one of two repeatable bets with independent outcomes. Bet A has expected profit USD 5 and standard deviation USD 10 per play. Bet B has expected profit USD 8 and standard deviation USD 40 per play. Which would you choose and why, and what would change your mind? Discuss both a risk-neutral and a bankroll-constrained view.","hints":["Compare edge per unit of risk, and think about what happens over $n$ plays."],"answer":"B has the higher EV, but A has the better edge per unit of risk; with limited capital A is usually preferable.","answer_type":"free-text","solution":"A strong answer covers: (1) risk-neutral: B maximises EV ($8 > 5$ USD). (2) Edge per unit of risk (Sharpe-like ratio): A gives $5/10 = 0.5$, B gives $8/40 = 0.2$. Over $n$ plays the mean grows like $n$ and the standard deviation like $\\sqrt{n}$, so the ratio of A to B improves with time: to be $2$ standard deviations ahead A needs $(2 \\times 10/5)^2 = 16$ plays, B needs $(2 \\times 40/8)^2 = 100$. (3) Capital and ruin: B's swings are four times larger, so with a given bankroll the risk of ruin is much higher; the Kelly size for A (approximately $\\mu/\\sigma^2 = 0.05$) is far larger than for B ($0.005$), so a Kelly bettor can lever A harder and may grow capital faster than with B. (4) What would change the answer: ample capital and a short horizon (take B), a limit on the number of repeat plays, ability to scale A, correlation with the rest of the book, and whether the quoted standard deviations are reliable. (5) Conclusion: a sensible desk picks A (or scaled-up A) unless risk capital is effectively unlimited.","category":"games","difficulty":"medium","tags":["risk","sizing","sharpe","discussion"],"origin":"original","status":"self-marked"},{"id":"t-games-kelly-intuition-fractional","title":"Why traders size below full Kelly","prompt":"Explain what the Kelly criterion maximises, why full Kelly is a rough ride, and why many traders use half Kelly or less in practice. Include what happens if you overbet and what happens if your estimate of your edge is wrong.","hints":["Think of expected log wealth, drawdowns, and estimation error."],"answer":"Kelly maximises expected log wealth (long-run geometric growth); full Kelly has deep drawdowns and is fragile to edge errors, so fractional Kelly trades a little growth for much less risk.","answer_type":"free-text","solution":"A strong answer covers: (1) Kelly maximises the expected log of wealth, equivalently the long-run geometric growth rate, and also beats any other strategy in the long run with probability $1$. (2) Betting everything on a positive-EV bet maximises EV but gives a high chance of ruin; EV alone is not the objective for repeated bets. (3) Full Kelly has big drawdowns; for a $55\\%$ even-money bet a drop of $50\\%$ of the bankroll is likely at some point. (4) Overbetting: growth falls on both sides of Kelly; at about twice Kelly the growth rate is zero, and beyond that it is negative even though each bet has a positive edge. (5) Underbetting is much less costly: half Kelly gives about $75\\%$ of the growth rate with far smaller variance. (6) Estimation risk: the edge is estimated and often overestimated (winner's curse, overfitting), and overbetting is penalised more than underbetting, so shade down. (7) Practical reasons: bets are not independent or continuously divisible, and there are margin limits and risk constraints. A good answer ends with a concrete number such as \\\"half Kelly\\\".","category":"games","difficulty":"medium","tags":["kelly","discussion","risk"],"origin":"original","status":"self-marked"},{"id":"t-games-zero-growth-bet-fraction","title":"Overbetting until growth turns negative","prompt":"Even-money bets win with probability $0.55$. You stake a fixed fraction $f$ of your bankroll each time. Kelly is $f = 0.10$. For what $f$ (roughly, three decimal places) does the long-run growth rate fall to zero, so that any larger fraction loses money in the long run despite the positive edge?","hints":["Growth is $g(f) = 0.55\\ln(1+f) + 0.45\\ln(1-f)$. Expand for small $f$: $g(f) \\approx (p-q)f - f^2/2$."],"answer":"$\\approx 0.199$ (about twice Kelly)","answer_type":"numeric","answer_value":0.19867,"solution":"For small $f$, $g(f) \\approx (p-q)f - f^2/2 = 0.1f - 0.5f^2$ (using $\\ln(1\\pm f) \\approx \\pm f - f^2/2$ and $p+q = 1$), which is zero at $f = 0.2$ (twice Kelly). More exactly, solving $0.55\\ln(1+f) + 0.45\\ln(1-f) = 0$ numerically gives $f \\approx 0.1987$. Growth is a parabola-like curve with its maximum at Kelly and zero growth near $2 \\times$ Kelly. So at double Kelly you take the same variance as aggressive betting but gain nothing in the long run.","category":"games","difficulty":"hard","tags":["kelly","overbetting","log-growth"],"origin":"original","status":"verified"},{"id":"t-games-spins-until-loss-equals-sd","title":"How long until luck stops hiding the house edge","prompt":"On a European roulette wheel ($37$ pockets) you bet USD 1 on a single number each spin ($35$ to $1$). After how many spins does your expected loss equal one standard deviation of your net result? Give a whole number.","hints":["For $n$ independent spins the mean loss is $n\\mu$ and the standard deviation is $\\sigma\\sqrt{n}$. Set them equal."],"answer":"$46{,}656$ spins","answer_type":"numeric","answer_value":46656.0,"solution":"One spin: mean $\\mu = -1/37$, $E[X^2] = (35^2 + 36)/37 = 1261/37$, so $\\sigma^2 = 1261/37 - 1/1369 = 46656/1369 \\approx 34.08$ ($\\sigma \\approx 5.84$). Expected loss after $n$ spins is $n/37$; one standard deviation is $5.84\\sqrt{n}$. Setting them equal, $\\sqrt{n} = \\sigma/|\\mu| = 5.84 \\times 37 = 216$, so $n = \\sigma^2/\\mu^2 = 46{,}656 = 6^6$ spins. For a single player a bet is dominated by luck for tens of thousands of spins; the house, with huge turnover, sees only the edge. The same effect governs how long a trader needs to tell skill from luck.","category":"games","difficulty":"hard","tags":["house-edge","variance","law-of-large-numbers"],"origin":"original","status":"verified"},{"id":"t-games-all-in-median-wealth","title":"Positive expectation, shrinking typical wealth","prompt":"A fair coin is flipped each round. On heads your wealth is multiplied by $1.5$, on tails by $0.6$. You put your entire wealth in every round, starting with USD 100, for $100$ rounds. Your expected final wealth is $100 \\times 1.05^{100} \\approx 13{,}150$ USD. What is the median final wealth, in USD, to two decimal places?","hints":["With $h$ heads, wealth is $100 \\times 1.5^h \\times 0.6^{100-h}$. What is the median number of heads?"],"answer":"$100 \\times 0.9^{50} \\approx 0.52$ USD","answer_type":"numeric","answer_value":0.5153775,"solution":"Wealth increases with the number of heads, so the median wealth occurs at the median number of heads, which is $50$ (cumulative probability just under $0.5$ at $49$ heads, just over at $50$). That gives $100 \\times (1.5 \\times 0.6)^{50} = 100 \\times 0.9^{50} \\approx 0.52$ USD. The per-round expected multiplier is $1.05 > 1$, but the typical multiplier is the geometric mean $\\sqrt{0.9} \\approx 0.95 < 1$. The mean is carried by astronomically rare outcomes. This is why long-run growth means maximising expected log wealth, and why staking fully on each round (no sizing) is ruinous despite a positive edge.","category":"games","difficulty":"hard","tags":["log-growth","median","ruin","geometric-mean"],"origin":"original","status":"verified"},{"id":"t-mm-two-dice-opening","title":"Opening market on two dice","prompt":"The interviewer rolls two fair dice out of your sight and asks you to make a two-sided market on their sum: a bid you will buy at and an offer you will sell at, each for one lot that pays the sum in USD. Nobody has traded yet. What fair value do you start from, how wide do you make the market, and why?","hints":["Fair value first, width second.","The standard deviation of one die is about $1.71$."],"answer":"Fair value $7$, spread of a few points, for example $6$ at $8$ or $5$ at $9$, justified by the standard deviation $\\approx 2.4$.","answer_type":"free-text","solution":"A strong answer covers: (1) fair value is $E[D_1+D_2]=7$, so the market should be centred on $7$ and not skewed, since nothing has traded and there is no information. (2) Uncertainty: each die has variance $35/12$, so the sum has standard deviation $\\sqrt{35/6}\\approx 2.4$. (3) Width is tied to that uncertainty and to how much you fear a better-informed counterparty: with no reason to think the other side knows the dice, a market such as $6$ at $8$ (half-width $1$, well inside one standard deviation) or $5$ at $9$ is defensible, depending on how much you fear a better-informed counterparty, and you can say you would tighten it as the counterparty shows they are uninformed. (4) You must be willing to trade both sides at your prices, so quote only what you are happy to be filled on. (5) Say out loud that you will re-centre and re-widen after every fill, because a fill is information.","category":"market-making","difficulty":"easy","tags":["dice","fair-value","width"],"origin":"original","status":"self-marked"},{"id":"t-mm-three-dice-after-six","title":"Three dice after one is revealed","prompt":"A contract pays the sum of three fair dice in USD. Before any reveal your fair value is $10.5$. The interviewer now shows you the first die: a $6$. What is your new fair value?","hints":["Only the two unseen dice are still random."],"answer":"$13$","answer_type":"numeric","answer_value":13.0,"solution":"The revealed die is now certain, and each of the other two still averages $3.5$. Fair value is $6+3.5+3.5=13$. A sensible market is about $12$ at $14$: the centre has moved by $2.5$, and the width can shrink because only two dice remain uncertain (standard deviation $\\approx 2.4$ rather than $\\approx 3$).","category":"market-making","difficulty":"easy","tags":["dice","updating"],"origin":"original","status":"verified"},{"id":"t-mm-card-face-value","title":"Fair value of one card","prompt":"A contract pays the value of one card drawn from a fresh 52-card deck, in USD. An ace counts as $1$, cards from $2$ to $10$ count at face value, and jacks, queens and kings count as $10$. What is the fair value?","hints":["Average over the $13$ ranks, since each rank is equally likely."],"answer":"$85/13\\approx 6.54$","answer_type":"numeric","answer_value":6.538461538461538,"solution":"Ranks $1$ to $9$ sum to $45$, and the four ten-valued ranks (10, J, Q, K) add $40$, giving $85$ over $13$ ranks, so $85/13\\approx 6.54$. Quote around the fair value, for example $5$ at $8$: the card has a standard deviation near $3$, so a spread of a few points is not unreasonable for a single draw.","category":"market-making","difficulty":"easy","tags":["cards","fair-value"],"origin":"original","status":"verified"},{"id":"t-mm-next-card-red","title":"Next card red after a partial deal","prompt":"Ten cards from a shuffled deck have been turned over: $7$ red and $3$ black. A contract pays $100$ USD if the next card is red and nothing otherwise. What is the fair price?","hints":["Count the red cards left in the remaining deck."],"answer":"About $45.24$ USD ($100\\times 19/42$)","answer_type":"numeric","answer_value":45.23809523809524,"solution":"There are $26-7=19$ red cards among the $42$ cards left, so the probability is $19/42$ and the fair price is $100\\times 19/42\\approx 45.24$. The trader's point: the seen cards tilt the deck towards black, so a market centred on $50$ would be giving away edge to anyone counting.","category":"market-making","difficulty":"easy","tags":["cards","counting","updating"],"origin":"original","status":"verified"},{"id":"t-mm-max-three-dice","title":"Market on the maximum of three dice","prompt":"A contract pays the largest of three fair dice, in USD. What is its fair value?","hints":["Use $P(\\max\\le k)=(k/6)^3$.","$E[X]=\\sum_{k\\ge 1}P(X\\ge k)$ for a positive integer variable."],"answer":"$1071/216\\approx 4.958$","answer_type":"numeric","answer_value":4.958333333333333,"solution":"$P(\\max\\ge k)=1-((k-1)/6)^3$, so $E=\\sum_{k=1}^6\\bigl(1-((k-1)/6)^3\\bigr)=6-\\tfrac{0^3+1^3+2^3+3^3+4^3+5^3}{216}=6-\\tfrac{225}{216}=\\tfrac{1071}{216}\\approx 4.96$. The distribution is skewed towards high values (a single die averages $3.5$), so quoting around $7$ would be a classic error. A market such as $4.5$ at $5.5$ would be sensible.","category":"market-making","difficulty":"medium","tags":["dice","order-statistics","fair-value"],"origin":"original","status":"verified"},{"id":"t-mm-lifted-twice","title":"Lifted twice in a row","prompt":"You are making a market on a quantity you believe is worth about $100$, and you show $98$ at $102$. A counterparty buys at $102$, you re-quote the same $98$ at $102$, and they buy at $102$ again. What should you do before the next quote, and why?","hints":["Ask what a buyer who keeps lifting you might know."],"answer":"Treat the fills as evidence the value is higher: raise fair value, skew or widen, and explain it. Do not keep re-quoting the same market.","answer_type":"free-text","solution":"A strong answer covers: (1) Two consecutive buys are evidence, not noise: if the counterparty is informed, the true value is probably above $100$, so your fair value should move up (for example to $101$ or $102$) even though you cannot be sure. (2) You are now short two lots, so inventory also argues for raising both bid and offer, i.e. skewing your market up, for example $100$ at $104$, which makes selling more of what you are short expensive and buying it back cheaper. (3) Adverse selection: quoting the same market after one-sided fills is the textbook red flag because it assumes the fills told you nothing. (4) Width: widen the offer side more than the bid side if you suspect information, and tighten again if the counterparty starts to sell. (5) Say it aloud: your prior was $100$, the fills moved it, and you can explain by how much and why.","category":"market-making","difficulty":"medium","tags":["adverse-selection","updating","inventory"],"origin":"original","status":"self-marked"},{"id":"t-mm-peeker-conditional-value","title":"Value of the sum given a peeker lifts you","prompt":"A contract pays the sum of two fair dice in USD. A counterparty has seen the first die. They buy from you only if that die shows $5$ or $6$, and sell to you only if it shows $1$ or $2$ (otherwise they pass). If they lift your offer, what is the conditional fair value of the contract?","hints":["Condition on the first die being $5$ or $6$; the second die is unaffected."],"answer":"$9$","answer_type":"numeric","answer_value":9.0,"solution":"Given that the first die is $5$ or $6$ it averages $5.5$, and the second die still averages $3.5$, so the conditional value is $5.5+3.5=9$. Your unconditional fair value is $7$, so an offer of $8$ loses $1$ on average every time this player buys. Lesson: always value the contract conditional on being filled, not unconditionally.","category":"market-making","difficulty":"medium","tags":["dice","adverse-selection","conditional"],"origin":"original","status":"verified"},{"id":"t-mm-informed-fraction-breakeven","title":"How much informed flow can your spread survive?","prompt":"You quote $6$ at $8$ on the sum of two dice (fair value $7$). Some of your counterparties are uninformed and trade at random; the others have seen the first die and, as before, buy only on a $5$ or $6$ (where the contract is worth $9$ to them) and sell only on a $1$ or $2$ (worth $5$). Explain how you decide whether your spread is wide enough, and find the fraction of informed flow at which you break even.","hints":["Compute your edge per fill separately against each type of trader.","Against an uninformed buyer at $8$ you win $8-7=1$ on average."],"answer":"Break-even when half the flow is informed: edge $=(1-q)\\cdot 1+q\\cdot(-1)=0$ gives $q=1/2$.","answer_type":"free-text","solution":"A strong answer covers: (1) Your edge on a fill depends on who you traded with. Against an uninformed buyer at $8$ you gain $8-7=1$; against an informed buyer, who only buys when the contract is worth $9$, you lose $9-8=1$. (2) With informed share $q$ the expected edge per fill is $(1-q)(1)+q(-1)=1-2q$, so you break even at $q=1/2$ and lose money beyond it. The same holds on the bid side by symmetry. (3) The general rule: half-spread must be at least the expected loss to the informed times their share, over the uninformed share. Here widening the market to $5$ at $9$ means an informed buyer (who values it at $9$) gives you zero edge instead of costing you $1$, while you still earn $2$ from every uninformed fill, so it is profitable at any informed share. (4) Practical point: you cannot see who is informed, so you infer it from behaviour (one-sided, persistent, large) and widen or move the market when it appears.","category":"market-making","difficulty":"medium","tags":["adverse-selection","dice","edge"],"origin":"original","status":"self-marked"},{"id":"t-mm-sum-five-cards","title":"Market on five cards with three shown","prompt":"A contract pays the total value of five cards from a fresh deck, in USD (ace $=1$, cards $2$ to $10$ at face value, J/Q/K $=10$). Three cards have been dealt face up: a king, a seven and a two. The other two are face down and drawn from the remaining $49$ cards. Make a market: give your fair value, say how wide you would go, and explain what drives the width.","hints":["The three shown cards are worth $19$.","The mean of the remaining $49$ cards is not exactly $85/13$."],"answer":"Fair value about $32.1$; for example $29.5$ at $34.5$ based on a standard deviation of about $4.4$ on the two hidden cards.","answer_type":"free-text","solution":"A strong answer covers: (1) The shown cards total $19$. The full deck sums to $4\\times 85=340$, so the remaining $49$ cards sum to $340-19=321$ and average $321/49\\approx 6.55$. Fair value is $19+2\\times 6.55\\approx 32.1$. The remaining deck is slightly richer than a fresh one ($6.55$ against $6.54$) because the shown cards were worth less than average, so use the actual remaining deck. (2) Uncertainty comes only from the two unseen cards: each has a standard deviation near $3.1$, and the pair (drawn without replacement) has about $4.4$. (3) Width: about one standard deviation either side if you fear information, for example $29.5$ at $34.5$, tighter if the counterparty looks uninformed. The bid-offer should never be tighter than your genuine uncertainty. (4) After any fill, re-centre: a buyer at $34.5$ should make you consider whether they have seen the face-down cards. (5) Mention that revealing a fourth card changes both centre and width.","category":"market-making","difficulty":"medium","tags":["cards","fair-value","width"],"origin":"original","status":"self-marked"},{"id":"t-mm-zero-width","title":"Why not quote zero width at fair value?","prompt":"On the sum of two dice you know the fair value is exactly $7$. A friend says: 'Then just quote $7$ at $7$ and you can never lose.' Explain what is wrong with this, using the ideas of edge, adverse selection and your trader's job.","hints":["What do you earn per trade, and who is most likely to trade with you?"],"answer":"Zero width earns zero edge on uninformed flow and still loses against informed flow, so you collect no compensation for risk.","answer_type":"free-text","solution":"A strong answer covers: (1) At $7$ at $7$ your expected profit against someone with no information is exactly $0$ per trade; you take variance (standard deviation $\\approx 2.4$ per lot) for no reward. (2) Anyone who knows more than you will only trade when they have an edge, so with a zero spread your expected profit against them is negative on every fill. (3) The spread is the price you charge for taking risk and for being picked off; it must cover the expected loss to informed traders and still leave something from the uninformed. (4) Fair value alone is not a market: real quotes are fair value plus or minus a half-spread chosen from uncertainty and the share of informed flow. (5) Also mention that you should be willing to trade both sides and update quotes after each fill, which a flat $7$ at $7$ does not allow.","category":"market-making","difficulty":"easy","tags":["edge","adverse-selection","width"],"origin":"original","status":"self-marked"},{"id":"t-mm-higher-of-two-cards","title":"Keep the higher of two cards","prompt":"Two cards are drawn without replacement from a fresh deck, valued as before (ace $=1$, cards $2$ to $10$ at face value, J/Q/K $=10$). A contract pays the higher of the two values in USD (ties pay that value). What is its fair value?","hints":["Enumerate all $\\binom{52}{2}$ pairs by value, or use $\\max=\\tfrac12(a+b+|a-b|)$."],"answer":"$1845/221\\approx 8.35$","answer_type":"numeric","answer_value":8.34841628959276,"solution":"With $\\max=\\tfrac12(a+b+|a-b|)$ and $E[a+b]=2\\times 85/13$, you still need $E|a-b|$. Counting over all $1326$ pairs gives an expected maximum of $1845/221\\approx 8.35$. The trader's takeaway: this is well above the single-card value of $6.54$ because ten-valued cards are $4/13$ of the deck, and any pair with one of them pays at least $10$, so the probability that at least one of the two is worth $10$ is about $0.52$. A market such as $7.5$ at $9.5$ would be reasonable.","category":"market-making","difficulty":"hard","tags":["cards","order-statistics","fair-value"],"origin":"adapted from a classic (Zhou, green book)","status":"verified"},{"id":"t-mm-red-cards-squared","title":"Market on the square of the red count","prompt":"Four cards are drawn from a fresh 52-card deck. A contract pays $N^2$ USD, where $N$ is the number of red cards drawn. What is its fair value?","hints":["$E[N^2]=\\mathrm{Var}(N)+E[N]^2$.","$N$ is hypergeometric; the variance has a finite-population correction."],"answer":"$4.941\\ldots$ (exactly $84/17$)","answer_type":"numeric","answer_value":4.9411764705882355,"solution":"$E[N]=4\\times\\tfrac12=2$. For a hypergeometric count, $\\mathrm{Var}(N)=4\\cdot\\tfrac12\\cdot\\tfrac12\\cdot\\tfrac{52-4}{52-1}=\\tfrac{48}{51}\\approx 0.941$. So $E[N^2]=0.941+4\\approx 4.94$, exactly $84/17$. A tempting wrong answer is $E[N]^2=4$, which ignores the convexity: payoffs on $N^2$ gain from variance, so a trader who quotes around $4$ is selling cheap. Quote about $4.5$ at $5.5$ and note that the variance term makes the contract worth more than the square of the mean.","category":"market-making","difficulty":"hard","tags":["cards","variance","fair-value"],"origin":"original","status":"verified"},{"id":"t-mm-long-three-skew","title":"Long three lots: how do you re-quote?","prompt":"You have been making a market on the sum of two dice and showing $6$ at $8$ (fair value $7$). Three different counterparties have sold to you at $6$, so you are long three lots and no information has been revealed about the dice. How do you change your quotes, and why? Do you also change your fair value?","hints":["Separate what you believe the dice are worth from how much you want to hold."],"answer":"Keep fair value at $7$ (if the sellers look uninformed), but skew the whole market down so you are keener to sell and less keen to buy more, for example $5.5$ at $7.5$.","answer_type":"free-text","solution":"A strong answer covers: (1) Inventory skew is not a view on the dice. If the sellers have no reason to know more than you, fair value stays at $7$, but your position is long, so you want to sell: lower your offer (for example to $7.5$) so that it is easier to get out, and lower your bid (for example to $5.5$) so that it is harder for people to sell you a fourth lot. (2) The offer stays above fair value, so every unwind still earns edge. (3) Size matters: skew more as the position grows, and skew less if you are comfortable with the risk. (4) The caveat: three sales in a row could mean someone knows the sum is low. If the sellers look informed (persistent, one-sided, large), also move fair value down, which is adverse-selection updating and is separate from the inventory skew. (5) Say both reasons aloud so the interviewer can see you distinguish them.","category":"market-making","difficulty":"easy","tags":["inventory","skew","dice"],"origin":"original","status":"self-marked"},{"id":"t-mm-edge-per-fill","title":"Average edge per fill with some informed flow","prompt":"You make a market on a quantity whose fair value is $50$, quoting $48$ at $52$. Of the trades you receive, $80\\%$ come from uninformed traders (their trades are unrelated to the true value) and $20\\%$ from informed traders. On an informed fill, the true value on average sits $2$ beyond the price you traded at, against you. What is your expected profit per fill, in USD?","hints":["On an uninformed fill your edge is the half-spread, $2$."],"answer":"$1.2$ USD","answer_type":"numeric","answer_value":1.2,"solution":"Uninformed fills earn the half-spread $2$ on average; informed fills lose $2$. So $0.8\\times 2+0.2\\times(-2)=1.2$ USD per fill. The break-even informed share solves $2(1-q)=2q$, so $q=1/2$. A market maker would watch that share: as it rises towards break-even, the spread must widen or the size must shrink.","category":"market-making","difficulty":"easy","tags":["edge","adverse-selection"],"origin":"original","status":"verified"},{"id":"t-mm-three-player-dice","title":"Three players, one die each","prompt":"Three players each roll one fair die and keep it hidden. A contract pays the sum of all three dice in USD. You can see only your own die: a $5$. You are asked to quote a market, and then another player, B, buys from you at your offer. Walk through your fair value before and after the trade, and how you would re-quote.","hints":["Your own die is known; the other two are not.","What might B's willingness to buy tell you about B's die?"],"answer":"Fair value $12$ before. B buying hints at a high die, so move fair value up (for example towards $12.5$ to $13.5$) and re-quote higher and probably wider on the offer side.","answer_type":"free-text","solution":"A strong answer covers: (1) Initial fair value is $5+3.5+3.5=12$, with a market such as $11$ at $13$; the only uncertainty comes from two unseen dice, so a standard deviation of about $2.4$. (2) B's purchase is evidence: B would be more willing to buy when their own die is high. If we assume B buys only when it is above average, B's die averages about $5$ or more, which moves your fair value up by about $1$ to $1.5$ (for example to $13$). (3) You do not know B's rule exactly, so you move by an amount that depends on how strongly you think B responds to their information; this is a judgement and you state it. (4) Re-quote higher and, if you are unsure, a little wider, for example $12.5$ at $14.5$. (5) You are also short one lot now, which is a second, separate reason to skew the market up. (6) If B then sells to you at a higher price later, treat that as strong evidence of a very low third die and revisit.","category":"market-making","difficulty":"easy","tags":["partial-information","updating","dice"],"origin":"original","status":"self-marked"},{"id":"t-mm-bayes-one-buy","title":"Fair value after one buy","prompt":"A contract is worth either $110$ or $90$ USD, each with probability $1/2$. Counterparties are of two kinds: $30\\%$ are informed, who know the true value and buy if it is $110$ and sell if it is $90$; $70\\%$ are uninformed, who buy or sell with equal probability. A counterparty buys one lot from you. What is your updated fair value?","hints":["Compute $P(\\text{buy}\\mid 110)$ and $P(\\text{buy}\\mid 90)$."],"answer":"$103$","answer_type":"numeric","answer_value":103.0,"solution":"$P(\\text{buy}\\mid 110)=0.3+0.7\\times0.5=0.65$ and $P(\\text{buy}\\mid 90)=0.7\\times0.5=0.35$. With equal priors the posterior probability of $110$ is $0.65/(0.65+0.35)=0.65$. Fair value is $0.65\\times110+0.35\\times90=103$. The trader's point: one buy moves your estimate by $3$, which is large compared with a typical half-spread, so you must re-quote after each fill.","category":"market-making","difficulty":"medium","tags":["adverse-selection","bayes","updating"],"origin":"original","status":"verified"},{"id":"t-mm-peeker-loss","title":"Expected loss to a die-peeker","prompt":"You quote $6$ at $8$ on the sum of two fair dice. A counterparty has seen die A (but not die B) and uses it as follows: they buy one lot from you at $8$ if their expected value of the sum, given A, exceeds $8$; they sell one lot to you at $6$ if it is below $6$; otherwise they do nothing. A is uniform on $1$ to $6$. What is your expected profit from this counterparty per round (counting rounds with no trade as zero), in USD? Give a negative number if you lose.","hints":["Their expected value of the sum given A is $A+3.5$.","List the values of A where they trade and your loss in each."],"answer":"$-2/3$ USD per round","answer_type":"numeric","answer_value":-0.6666666666666666,"solution":"They buy when $A+3.5>8$, so $A=5,6$, where the sum averages $8.5$ and $9.5$: you lose $0.5$ and $1.5$. They sell when $A+3.5<6$, so $A=1,2$ (sum averages $4.5$, $5.5$): you lose $1.5$ and $0.5$. The four losses total $4$, spread over $6$ equally likely values of A, giving $-4/6=-2/3$. You can never make money against someone who always has the information: this is why the spread must be funded by uninformed flow.","category":"market-making","difficulty":"medium","tags":["adverse-selection","dice","edge"],"origin":"original","status":"verified"},{"id":"t-mm-announcement","title":"Quoting just before a known announcement","prompt":"You are making a market in a stock. A scheduled earnings announcement arrives in two minutes and could move the price by several percent either way. Describe what you do with your quote size and width before, at and after the announcement, and why.","hints":["Think about who has an edge in the seconds around a release."],"answer":"Widen and cut size beforehand (you cannot know the direction; fast traders will pick you off), possibly step out entirely for the first moments after, then re-centre on the new price and tighten once volatility settles.","answer_type":"free-text","solution":"A strong answer covers: (1) Uncertainty about the value jumps at the release, so the width, which is tied to uncertainty, must widen: your price could be wrong by several percent in an instant. (2) Adverse selection is at its peak: anyone who reads or reacts to the number faster than you will trade at your stale price, so reduce size, widen, or pull quotes just before and at the release. (3) Do not take a directional view; a market maker's profit comes from spread, not from predicting the number. (4) After the release re-centre on the new market price, quote wide at first, and tighten as volatility and the informed flow fade. (5) Position: reduce inventory beforehand so the event does not leave you with a large unhedged position. (6) Being absent entirely is acceptable if you cannot quote safely; a bad quote costs more than a missed trade.","category":"market-making","difficulty":"medium","tags":["width","volatility","adverse-selection"],"origin":"original","status":"self-marked"},{"id":"t-mm-position-limit","title":"At your position limit","prompt":"You are making a market on a number whose fair value you estimate at $60$, with a market of $58$ at $62$. You have bought up to your risk limit of $+5$ lots and may not hold more. The interviewer says: 'Keep making me a two-sided market.' What do you quote and why?","hints":["Can you afford to be bought from again on your bid?"],"answer":"A bid you do not want to be hit on (far from fair value or none), and an offer at or even slightly below fair value to get out of inventory.","answer_type":"free-text","solution":"A strong answer covers: (1) At the limit, another buy would breach it, so the bid must be pulled back far enough that you are not hit, for example $55$ (or quote no bid), while the offer is the useful side. (2) The offer can move in towards or even below fair value, for example $60.5$ or $60$, since reducing inventory has its own value and risk is worth paying to cut. (3) State the cost: you accept less edge, or even a small loss, to get back inside the limit. (4) Keep communicating: say the quote is skewed because of the limit, not because of a view on the number. (5) Once inventory falls, bring the bid back into line and rebuild a symmetric market. Refusing to quote at all (freezing) is the worst answer.","category":"market-making","difficulty":"medium","tags":["inventory","limits","skew"],"origin":"original","status":"self-marked"},{"id":"t-mm-two-counterparties","title":"Same market, different counterparties","prompt":"You make a market on a quantity and two traders deal with you. One is a retail trader who trades at random. The other is a specialist who often has better information. You cannot tell who is who. What practical tools do you have to protect yourself without losing the retail flow?","hints":["You can change width, size and the speed at which you update."],"answer":"Set the spread so that retail earnings cover the specialist losses, limit size, watch for one-sided and repeated behaviour, and update after fills.","answer_type":"free-text","solution":"A strong answer covers: (1) You cannot price-discriminate, so a single spread has to cover the expected loss to the specialist from the earnings on retail flow; that is the break-even logic: with informed share $q$, edge per fill is about $(1-q)h - q\\ell$, where $h$ is the half-spread and $\\ell$ the average loss to informed traders. (2) Size: quote small size at tight prices and larger size only at wider prices, since informed traders want size. (3) Behaviour as a signal: persistent, one-sided, large or well-timed trades suggest information; respond by moving fair value and widening, not by repeating the same quote. (4) Speed of update: after a fill, re-quote promptly so a second informed fill cannot hit stale prices. (5) Accept that you will lose to the specialist some of the time; the aim is positive expected profit overall, not never losing a trade.","category":"market-making","difficulty":"medium","tags":["adverse-selection","informed-flow","size"],"origin":"original","status":"self-marked"},{"id":"t-mm-box-auction","title":"Bidding for the coin box","prompt":"A box pays 1 USD for every head in $200$ fair coin flips (known to be fair), so its expected value is $100$ USD. You are in a sealed-bid auction against one other bidder who may have seen the flips, and the highest bid wins the box. How should you think about what you bid, and what does winning the auction tell you?","hints":["Condition on winning: what does it say about the other bidder's view?"],"answer":"Bid clearly below $100$: winning suggests the other, possibly informed, bidder valued the box less, so the conditional value of the box is below $100$.","answer_type":"free-text","solution":"A strong answer covers: (1) Unconditionally the box is worth $100$ (mean of a $\\text{Binomial}(200,\\tfrac12)$, standard deviation about $7$). (2) You win only if the other bidder bids less than you. If they are informed, they bid high when the count is high and low when it is low, so you tend to win when the count is low. The conditional value given a win is therefore below $100$: the winner's curse. (3) So shade the bid below $100$, by more the more likely the other bidder is informed and the more their bid responds to the true count. (4) A concrete case: if the other bidder knows the count $H$ and bids just below it, you win whenever you bid above $H$, so you only ever win boxes worth less than your bid, and your expected profit is negative for any bid. With an uninformed rival you can bid closer to $100$, so the bid depends on the chance that the rival is informed. (5) The same logic is adverse selection in a market: always value the contract conditional on the trade happening.","category":"market-making","difficulty":"medium","tags":["adverse-selection","winners-curse","auction"],"origin":"adapted from a classic (Jane Street, Probability & Markets)","status":"self-marked"},{"id":"t-mm-winners-curse-bid","title":"A bid on an asset worth more to you","prompt":"A seller values an asset at $V$ USD, with $V$ uniform on $[0,100]$, and accepts any bid at least equal to $V$. To you the asset is worth $1.5V$. You must name a bid $b=60$ before knowing $V$. What is your expected profit, in USD, from bidding $60$?","hints":["The seller accepts only when $V\\le 60$. What is your expected value of the asset given that?"],"answer":"$-9$ USD","answer_type":"numeric","answer_value":-9.0,"solution":"Conditional on acceptance, $V$ is uniform on $[0,60]$ and averages $30$, so the asset is worth $1.5\\times30=45$ to you on average, less than the bid of $60$. You trade with probability $0.6$, so expected profit is $0.6\\times(45-60)=-9$. The same happens for any positive bid: acceptance is bad news, so the best bid is $0$. This is the classic winner's curse, adapted from a well-known 'buy a company' puzzle, and the core of adverse selection.","category":"market-making","difficulty":"hard","tags":["adverse-selection","winners-curse","conditional"],"origin":"adapted from a classic (Samuelson and Bazerman)","status":"verified"},{"id":"t-mm-three-buys-one-sell","title":"Fair value after a run of fills","prompt":"A contract is worth $110$ or $90$ USD, each with probability $1/2$ before any trades. Each independent counterparty has the same behaviour: if the value is $110$ they buy with probability $0.65$ and sell with probability $0.35$; if it is $90$ they buy with probability $0.35$ and sell with probability $0.65$. You see three buys and one sell, in some order. What is your fair value now?","hints":["The order does not matter given independence.","Use odds: each buy multiplies the odds of $110$ by $0.65/0.35$."],"answer":"About $105.5$ USD (exactly $105.5045$)","answer_type":"numeric","answer_value":105.504587,"solution":"Posterior odds of $110$ against $90$ are $(0.65/0.35)^3\\times(0.35/0.65)=(13/7)^2=169/49$. So $P(110)=169/218\\approx 0.775$, and fair value is $90+20\\times0.775\\approx 105.5$. Net, two more buys than sells moved fair value up by $5.5$ from the prior $100$, which is well beyond a typical half-spread: a trader who leaves the quote unchanged after a run of one-sided fills is giving away edge.","category":"market-making","difficulty":"hard","tags":["bayes","updating","fills"],"origin":"original","status":"verified"},{"id":"t-mm-round-trip-pnl","title":"Marking a partly unwound position","prompt":"On the sum of two dice (fair value $7$) you buy two lots at $6$ and later sell one lot at $8$. What is your expected profit on these trades, measured against fair value, in USD, and what position do you have left?","hints":["Each trade earns its distance from fair value; the position left is what carries risk."],"answer":"$3$ USD of edge; you remain long one lot.","answer_type":"numeric","answer_value":3.0,"solution":"Each lot bought at $6$ is worth $7$ on average, so the two lots give $2\\times1=2$; the lot sold at $8$ earns $8-7=1$. Total expected profit is $3$ USD. You are net long one lot, which still carries dice risk (standard deviation about $2.4$), so skew your market slightly down to sell it: the edge is not locked in until the position is closed.","category":"market-making","difficulty":"easy","tags":["inventory","edge","dice"],"origin":"original","status":"verified"},{"id":"t-est-uk-petrol-stations","title":"Petrol stations in the UK","prompt":"Estimate the number of petrol stations in the UK. Give a central estimate (and, in your head, an interval you are about $90\\%$ sure of).","hints":["Count fill-ups per day, then divide by what one station can serve."],"answer":"About $8{,}000$","answer_type":"estimate","answer_value":8000.0,"tol_factor":3.0,"solution":"Decompose by demand. Roughly $35$ million cars, each filling up about once every $10$ days, gives $3.5$ million fill-ups a day. A typical station serves about $400$ to $500$ customers a day, so $3.5\\text{m}/450\\approx 8{,}000$. A defensible interval
