mates for $\\theta$ and $\\phi$.","hints":["For (b) apply Jensen's inequality to the concave $\\log$ and note $\\mathbb E_q[p(x,z)/q(z)]=p(x)$.","For (c) write the average of $S'$ terms as an expectation, over a uniformly random size-$S$ subset, of the average of that subset."],"answer":"(b) $\\mathcal F_S\\le\\log\\mathbb E[\\frac1S\\sum_sw_s]=\\log p(x)$. (c) $\\log\\frac1{S'}\\sum_{s'}w_{s'}=\\log\\mathbb E_I[\\frac1S\\sum_{i\\in I}w_i]\\ge\\mathbb E_I\\log\\frac1S\\sum_{i\\in I}w_i$, and taking expectations gives $\\mathcal F_{S'}\\ge\\mathcal F_S$. (d) $\\nabla\\mathcal F_S\\approx\\sum_s\\tilde w_s\\nabla\\log w_s$ with normalised weights $\\tilde w_s=w_s/\\sum_jw_j$, backpropagating through $z_s=h(\\epsilon_s,f_\\phi)$.","answer_type":"free-text","solution":"(a) With $w_s=p_\\theta(x,z_s)/q(z_s;f_\\phi(x))$, the ELBO is $\\mathcal F_1=\\mathbb E\\log w=\\frac1S\\sum_s\\log w_s$ on average. (b) Let $\\bar w=\\frac1S\\sum_sw_s$. By Jensen, $\\mathbb E\\log\\bar w\\le\\log\\mathbb E\\bar w=\\log\\mathbb E_q[p_\\theta(x,z)/q(z)]=\\log\\int p_\\theta(x,z)\\,dz=\\log p_\\theta(x)$. (c) Pick $I$ uniformly among size-$S$ subsets of $\\{1..S'\\}$. Then $\\frac1{S'}\\sum_{s'}w_{s'}=\\mathbb E_I\\big[\\frac1S\\sum_{i\\in I}w_i\\big]$, so by Jensen $\\log\\frac1{S'}\\sum_{s'}w_{s'}\\ge\\mathbb E_I\\log\\frac1S\\sum_{i\\in I}w_i$. Taking the expectation over the i.i.d. samples, the right side becomes $\\mathcal F_S$ (any subset of $S$ draws is i.i.d. from $q$), so $\\mathcal F_{S'}\\ge\\mathcal F_S$, and $\\mathcal F_S\\to\\log p(x)$ as $S\\to\\infty$. (d) Estimate $\\mathcal F_S$ by one set of $S$ reparametrised samples. Gradients: $\\nabla_\\theta\\mathcal F_S\\approx\\sum_s\\tilde w_s\\nabla_\\theta\\log p_\\theta(x,z_s)$ and $\\nabla_\\phi\\mathcal F_S\\approx\\sum_s\\tilde w_s\\nabla_\\phi\\log w_s(\\epsilon_s,\\phi)$ with $\\tilde w_s=w_s/\\sum_jw_j$, differentiating through $z_s=h(\\epsilon_s,f_\\phi(x))$ by backpropagation. The normalised weights make this an importance-weighted version of the standard VAE gradient (equal to it when $S=1$). Trap: a tighter bound is not always better for the encoder, since the signal-to-noise ratio of the $\\phi$ gradient shrinks as $S$ grows.","category":"ai","kind":"exam","difficulty":"hard","tags":["VAE","importance weighted bound","Jensen","reparametrisation"],"origin":"in the style of COMP0085 2019, Q6","status":"self-marked"},{"id":"m-ai-bethe-free-energy-bp","title":"Bethe free energy and loopy belief propagation","prompt":"For a pairwise MRF $P(x)\\propto\\prod_{(ij)\\in\\mathcal E}f(x_i,x_j)$: (a) define the Bethe free energy; (b) state the two approximations made when the exact variational free energy is replaced by it; (c) when is it exact; (d) if loopy BP converges, can you conclude the Bethe approximation is exact; (e) how is $\\prod_ib(x_i)\\prod_{(ij)}\\frac{b(x_i,x_j)}{b(x_i)b(x_j)}$ related to the true joint; (f) what more can be said if the beliefs are used on a spanning subtree?","hints":["The Bethe entropy is $\\sum_{(ij)}H(b_{ij})-\\sum_i(d_i-1)H(b_i)$ with $d_i$ the degree of node $i$.","Fixed points of BP correspond to stationary points of the Bethe free energy under local consistency constraints."],"answer":"$F_{\\rm Bethe}=-\\sum_{(ij)}\\sum b_{ij}\\log f_{ij}-\\sum_{(ij)}H(b_{ij})+\\sum_i(d_i-1)H(b_i)$ subject to local marginalisation constraints. Approximations: Bethe entropy (exact only on trees) and local instead of global consistency of marginals. Exact on trees. BP convergence on a loopy graph gives only a stationary point, not exactness; the product form is a reparametrisation that equals $P$ only on trees. On a tree, BP beliefs are the exact marginals.","answer_type":"free-text","solution":"(a) With beliefs $b_i,b_{ij}$: $F_{\\rm Bethe}(b)=-\\sum_{(ij)}\\sum_{x_i,x_j}b_{ij}\\log f_{ij}-\\Big[\\sum_{(ij)}H(b_{ij})-\\sum_i(d_i-1)H(b_i)\\Big]$, with $d_i$ the number of neighbours of $i$, minimised subject to normalisation and $\\sum_{x_j}b_{ij}(x_i,x_j)=b_i(x_i)$. (b) (i) The true entropy of the joint is replaced by the Bethe entropy built only from pairwise and singleton entropies; (ii) the set of globally realisable marginals (marginal polytope) is replaced by the larger set of locally consistent pseudo-marginals, so $b$ need not be the marginals of any joint distribution. (c) Both approximations are exact when the graph is a tree (or forest), since then the joint factorises as $\\prod_ip_i\\prod_{(ij)}\\frac{p_{ij}}{p_ip_j}$ and BP computes the exact marginals in two sweeps. (d) No. Fixed points of loopy BP are stationary points of $F_{\\rm Bethe}$, but on a graph with cycles this need not be the global minimum and the Bethe entropy itself is only an approximation; BP also may not converge. (e) The product $\\prod_ib_i\\prod_{(ij)}\\frac{b_{ij}}{b_ib_j}$ is a reparametrisation of the joint implied by the beliefs; it is exactly $P$ only for trees, otherwise it is generally unnormalised and its marginals need not equal $b$. (f) For a spanning tree $\\mathcal E_T$, the distribution $P_T\\propto\\prod_{\\mathcal E_T}f$ has BP beliefs equal to exact marginals; at a loopy BP fixed point the beliefs are also the exact marginals of the tree-structured reparametrisation $\\prod_ib_i\\prod_{\\mathcal E_T}\\frac{b_{ij}}{b_ib_j}$ for every spanning tree, a statement used to bound the error of BP. Trap: converged marginals from loopy BP are often good but are not guaranteed to be correct, and can be overconfident.","category":"ai","kind":"exam","difficulty":"hard","tags":["belief propagation","Bethe free energy","variational inference","MRF"],"origin":"in the style of COMP0085 2018 and 2019, Q4/Q5","status":"self-marked"},{"id":"m-ai-mh-detailed-balance","title":"Detailed balance of Metropolis-Hastings","prompt":"(a) Show that the Metropolis-Hastings algorithm with proposal $q(x'\\mid x)$ and acceptance probability $\\alpha(x\\to x')=\\min\\!\\big(1,\\frac{\\pi(x')q(x\\mid x')}{\\pi(x)q(x'\\mid x)}\\big)$ satisfies detailed balance with respect to $\\pi$. (b) Suppose that on rejection, instead of repeating the old sample, you keep proposing from $q(\\cdot\\mid x)$ until a proposal is accepted. Show that this breaks detailed balance for $\\pi$ and say what the chain converges to. (c) Explain why uncorrected states are still needed when the proposal is symmetric.","hints":["Detailed balance means $\\pi(x)T(x\\to x')=\\pi(x')T(x'\\to x)$ for $x\\ne x'$.","Under the redraw scheme the transition probability is $q(x'|x)\\alpha(x\\to x')/Z(x)$ where $Z(x)$ is the total acceptance probability from $x$."],"answer":"(a) $\\pi(x)q(x'|x)\\alpha(x\\to x')=\\min(\\pi(x)q(x'|x),\\pi(x')q(x|x'))$, symmetric in $x,x'$. (b) With redraw, $T(x\\to x')=q(x'|x)\\alpha(x\\to x')/Z(x)$, so $\\pi(x)T(x\\to x')=\\pi(x')T(x'\\to x)$ only if $Z(x)=Z(x')$. The chain instead has stationary distribution $\\propto\\pi(x)Z(x)$: it over-samples states where proposals are easily accepted. (c) Repeated states carry the rejection probability mass that makes $\\pi$ invariant.","answer_type":"free-text","solution":"(a) For $x'\\ne x$, $T(x\\to x')=q(x'|x)\\alpha(x\\to x')$, and $\\pi(x)q(x'|x)\\min\\!\\big(1,\\frac{\\pi(x')q(x|x')}{\\pi(x)q(x'|x)}\\big)=\\min\\big(\\pi(x)q(x'|x),\\pi(x')q(x|x')\\big)$, which is symmetric in $x\\leftrightarrow x'$; hence $\\pi(x)T(x\\to x')=\\pi(x')T(x'\\to x)$. For $x'=x$ the condition is trivial, and rejection mass is assigned to the self-transition, so $T$ is a proper kernel. Detailed balance implies $\\pi$ is invariant. (b) Redrawing until acceptance gives $\\tilde T(x\\to x')=q(x'|x)\\alpha(x\\to x')/Z(x)$ with $Z(x)=\\sum_yq(y|x)\\alpha(x\\to y)$ (or the integral). Then $\\pi(x)\\tilde T(x\\to x')=\\min(\\pi(x)q(x'|x),\\pi(x')q(x|x'))/Z(x)$, whereas $\\pi(x')\\tilde T(x'\\to x)$ has $Z(x')$ in the denominator. These agree only if $Z(x)=Z(x')$, so $\\pi$ is not invariant. In fact $\\tilde\\pi(x)\\propto\\pi(x)Z(x)$ satisfies detailed balance for $\\tilde T$, so the chain over-samples regions where moves are easily accepted (flat or low-curvature regions) and under-samples regions where proposals are usually rejected, exactly the places that need more samples. (c) Repeating the current state when a proposal is rejected is not wasteful: those repeats give each state the correct amount of time, in proportion to how hard it is to leave. Trap: discarding repeated samples (thinning by uniqueness) biases the estimate in the same way.","category":"ai","kind":"exam","difficulty":"medium","tags":["MCMC","Metropolis-Hastings","detailed balance"],"origin":"in the style of COMP0085 2017, Q6","status":"self-marked"},{"id":"m-ai-hmc-justification","title":"Why Hamiltonian Monte Carlo works","prompt":"(a) For a Markov chain sampler targeting $p^*(x)$, say which of the following is essential, sufficient or merely desirable: ergodicity; detailed balance with respect to $p^*$; low integrated autocorrelation time. (b) For HMC, justify each step: draw $v\\sim\\mathcal N(0,I)$; run leapfrog dynamics for the Hamiltonian $H(x,v)=-\\log p^*(x)+\\tfrac12\\|v\\|^2$ to get $(x^*,v^*)$; accept with probability $\\min\\!\\big(1,\\frac{p^*(x^*)\\mathcal N(v^*;0,I)}{p^*(x)\\mathcal N(v;0,I)}\\big)$; on rejection keep $x$. (c) Why is the momentum refresh often replaced by $v'=\\alpha v+\\sqrt{1-\\alpha^2}\\,\\epsilon$ with $\\epsilon\\sim\\mathcal N(0,I)$?","hints":["The target of the augmented chain is $p^*(x)\\mathcal N(v;0,I)\\propto e^{-H}$.","What properties of leapfrog make the acceptance ratio a simple energy difference?"],"answer":"(a) Invariance of $p^*$ and ergodicity are essential; detailed balance is sufficient (not necessary); low autocorrelation is desirable. (b) Momentum draws are a Gibbs step on the augmented target; leapfrog is reversible and volume-preserving, so the proposal is symmetric with unit Jacobian and the acceptance probability reduces to $\\min(1,e^{-\\Delta H})$, correcting discretisation error. (c) Partial refresh keeps the momentum direction, suppressing random-walk behaviour, while leaving $\\mathcal N(0,I)$ invariant.","answer_type":"free-text","solution":"(a) Essential: $p^*$ must be invariant and the chain ergodic (otherwise it cannot reach all of the support, whatever the proofs). Detailed balance is sufficient for invariance but not necessary (many good samplers, such as systematic-scan Gibbs, lack it). Low integrated autocorrelation time is only desirable: it determines efficiency, not correctness. (b) Introducing $v\\sim\\mathcal N(0,I)$ gives the augmented target $p^*(x)\\mathcal N(v;0,I)\\propto e^{-H(x,v)}$, whose $x$-marginal is $p^*$. Resampling $v$ is a Gibbs step, valid and independent of $x$; it lets the chain change energy level. Exact Hamiltonian dynamics conserve $H$, are volume preserving (Liouville) and reversible (flip $v$), so they give long, informed moves with acceptance one. Leapfrog preserves volume and reversibility exactly but conserves $H$ only approximately; the Metropolis step with probability $\\min(1,e^{-\\Delta H})$ corrects this error, and because the proposal is deterministic, reversible and has unit Jacobian the acceptance ratio is simply the ratio of augmented densities, yielding detailed balance. On rejection $x$ is repeated, as in any Metropolis chain; discarding $v$ is fine since it is resampled. (c) Partial momentum refresh leaves $\\mathcal N(0,I)$ invariant but retains $v$'s direction between iterations, so successive trajectories continue in the same direction and the chain avoids random-walk diffusion, reducing autocorrelation. Trap: after a rejection the momentum must be negated for the persistent scheme to remain correct, and the step size and trajectory length still need tuning.","category":"ai","kind":"exam","difficulty":"hard","tags":["HMC","MCMC","leapfrog","detailed balance"],"origin":"in the style of COMP0085 2018, Q5","status":"self-marked"},{"id":"m-ai-particle-filter-weight-variance","title":"Variance of particle filter importance weights","prompt":"In a state-space model, take $z_1^{(i)}\\sim P(z_1\\mid x_1)$ exactly and propagate $z_2^{(i)}\\sim P(z_2\\mid z_1^{(i)})$; weight by $w^{(i)}\\propto P(x_2\\mid z_2^{(i)})$. (a) What is the marginal distribution of the $z_2^{(i)}$? (b) What is $\\mathbb E[w]$ for the unnormalised weight $P(x_2\\mid z_2)$? (c) Find the variance of the normalised weights $\\tilde w=P(x_2\\mid z_2)/P(x_2\\mid x_1)$ and show it equals $\\frac{P(x_2,x_2\\mid x_1)}{P(x_2\\mid x_1)^2}-1$, where $P(x_2,x_2\\mid x_1)$ is the probability that two conditionally i.i.d. outputs at step $2$ both equal $x_2$. (d) What does this say about when the filter degrades?","hints":["$\\mathbb E[P(x_2\\mid z_2)^2]$ is the probability of two i.i.d. copies of $x_2$ given $z_2$, averaged over $z_2\\sim P(z_2\\mid x_1)$.","$\\mathrm{Var}(\\tilde w)=\\mathbb E[\\tilde w^2]-1$ because $\\mathbb E[\\tilde w]=1$."],"answer":"(a) $z_2\\sim P(z_2\\mid x_1)$ (the one-step predictive). (b) $\\mathbb E[P(x_2|z_2)]=P(x_2|x_1)$. (c) $\\mathrm{Var}(\\tilde w)=\\frac{\\mathbb E[P(x_2|z_2)^2]}{P(x_2|x_1)^2}-1=\\frac{P(x_2,x_2|x_1)}{P(x_2|x_1)^2}-1$. (d) The variance grows when $x_2$ is a surprising observation (low $P(x_2|x_1)$ relative to its peaked likelihood), where few particles carry most of the weight.","answer_type":"free-text","solution":"(a) Because $z_1\\sim P(z_1|x_1)$ and $z_2\\sim P(z_2|z_1)$, the pair is a draw from $P(z_1,z_2|x_1)$, so the marginal of $z_2$ is the predictive $P(z_2|x_1)=\\int P(z_2|z_1)P(z_1|x_1)dz_1$. (b) The expected unnormalised weight is $\\mathbb E[P(x_2|z_2)]=\\int P(x_2|z_2)P(z_2|x_1)dz_2=P(x_2|x_1)$, which is therefore also the expected normaliser. (c) With $\\tilde w=P(x_2|z_2)/P(x_2|x_1)$ we have $\\mathbb E\\tilde w=1$, so $\\mathrm{Var}(\\tilde w)=\\mathbb E\\tilde w^2-1=\\frac{\\int P(x_2|z_2)^2P(z_2|x_1)dz_2}{P(x_2|x_1)^2}-1$. The numerator is the probability that a single chain, conditionally i.i.d. given $z_2$, emits two copies of $x_2$: $P_1$, whereas $P(x_2|x_1)^2$ is the probability that two independent chains both emit $x_2$: $P_2$. So the variance is $P_1/P_2-1$. (d) By Jensen $P_1\\ge P_2$, with the gap large when the likelihood $P(x_2|z_2)$ is sharply peaked compared with the predictive, i.e. when the new observation is informative or surprising: then a few particles near the likelihood peak get most of the weight (weight degeneracy). Trap: low weight variance is not a sign of a good filter when the predictive barely overlaps the likelihood; use resampling, better proposals (the optimal proposal conditions on $x_2$), and monitor the effective sample size $1/\\sum\\tilde w_i^2$.","category":"ai","kind":"derivation","difficulty":"hard","tags":["particle filter","importance sampling","weight degeneracy"],"origin":"in the style of COMP0085 2019, Q3","status":"self-marked"},{"id":"m-ai-ard-gibbs-vb","title":"Bayesian sparse regression: ARD Gibbs sampler and variational Bayes","prompt":"Let $y\\sim\\mathcal N(Xw,\\sigma^2I)$ with $\\sigma^2$ known and priors $w_i\\mid s_i\\sim\\mathcal N(0,s_i^{-1})$, $s_i\\sim\\mathrm{Gamma}(a,b)$ (rate $b$) independently. (a) Give the posterior of $w$ for fixed $S=\\mathrm{diag}(s_i)$ and its relation to ridge regression. (b) Derive the Gibbs updates for $w$ and $s_i$. (c) Derive the factorised variational updates $q(w)q(S)$. (d) What is the effective prior on $w_i$ after marginalising $s_i$, and why does it favour sparse solutions?","hints":["The posterior over $w$ is Gaussian with precision $\\sigma^{-2}X^\\top X+S$.","The Gamma prior is conjugate to the Gaussian precision: $p(s_i\\mid w_i)\\propto s_i^{a-1/2}e^{-s_i(b+w_i^2/2)}$."],"answer":"(a) $w\\mid y,S\\sim\\mathcal N(\\mu,\\Sigma)$, $\\Sigma=(\\sigma^{-2}X^\\top X+S)^{-1}$, $\\mu=\\sigma^{-2}\\Sigma X^\\top y$ (ridge with per-weight penalty $\\sigma^2s_i$). (b) Gibbs: sample $w\\sim\\mathcal N(\\mu,\\Sigma)$ and $s_i\\sim\\mathrm{Gamma}(a+\\frac12,\\,b+\\frac12w_i^2)$. (c) VB: $q(w)=\\mathcal N(\\mu,\\Sigma)$ with $S\\to\\mathbb E[S]$, $q(s_i)=\\mathrm{Gamma}(a+\\frac12,b+\\frac12(\\mu_i^2+\\Sigma_{ii}))$. (d) Student-t prior: heavy tails and a sharp peak at zero.","answer_type":"free-text","solution":"(a) Completing the square in $\\log p(y|w)+\\log p(w|S)$ gives $w\\mid y,S\\sim\\mathcal N(\\mu,\\Sigma)$ with $\\Sigma=(\\sigma^{-2}X^\\top X+S)^{-1}$ and $\\mu=\\sigma^{-2}\\Sigma X^\\top y$, equal to the ridge solution $(X^\\top X+\\sigma^2S)^{-1}X^\\top y$ with a separate penalty $\\sigma^2s_i$ per weight; $s_i\\to0$ recovers maximum likelihood. (b) Gibbs sampling alternates $w\\sim\\mathcal N(\\mu(S),\\Sigma(S))$ and, since $p(s_i|w_i)\\propto s_i^{a-1}e^{-bs_i}s_i^{1/2}e^{-s_iw_i^2/2}$, $s_i\\mid w_i\\sim\\mathrm{Gamma}\\big(a+\\tfrac12,\\,b+\\tfrac12w_i^2\\big)$. (c) For the factorised $q(w)q(S)$ the optimal factors are $\\log q(w)=\\mathbb E_{q(S)}[\\log p(y,w,S)]+\\text{const}$, giving $q(w)=\\mathcal N(\\mu,\\Sigma)$ with $S$ replaced by $\\mathbb E[S]=\\mathrm{diag}\\big(\\frac{a+1/2}{b+\\frac12(\\mu_i^2+\\Sigma_{ii})}\\big)$, and $q(s_i)=\\mathrm{Gamma}\\big(a+\\tfrac12,\\,b+\\tfrac12\\mathbb E[w_i^2]\\big)$ with $\\mathbb E[w_i^2]=\\mu_i^2+\\Sigma_{ii}$. Iterate to convergence (each step increases the free energy). (d) Integrating out $s_i$ gives a Student-t prior on $w_i$, sharply peaked at zero with heavy tails: small weights are pulled to exactly (near) zero by large inferred precision $s_i$ while large weights escape shrinkage, unlike the fixed Gaussian prior (ridge) which shrinks all weights uniformly. This is automatic relevance determination (ARD). Trap: VB underestimates posterior uncertainty because it ignores the correlation between $w$ and $S$.","category":"ai","kind":"derivation","difficulty":"medium","tags":["Bayesian regression","ARD","Gibbs sampling","variational Bayes"],"origin":"in the style of COMP0085 2018, Q2","status":"self-marked"},{"id":"m-ai-laplace-variance","title":"Laplace approximation of a Gamma posterior","prompt":"The posterior over a Poisson rate $\\theta>0$ is proportional to $\\theta^{20}e^{-2\\theta}$ (a Gamma density with shape $21$ and rate $2$). What is the variance of its Laplace (Gaussian) approximation at the posterior mode?","hints":["Find the mode of $\\log p(\\theta)=20\\log\\theta-2\\theta$, then take the inverse of the negative second derivative there."],"answer":"$5$ (the exact posterior variance is $21/4=5.25$)","answer_type":"numeric","answer_value":5.0,"solution":"With $\\log p=20\\log\\theta-2\\theta$ the mode is $\\theta^*=20/2=10$. The negative second derivative is $20/\\theta^2=20/100=0.2$, so the Laplace approximation is $\\mathcal N(10,\\,1/0.2)=\\mathcal N(10,5)$ and its variance is $5$. In general the variance is $(a-1)/b^2$. The exact posterior has mean $21/2=10.5$ and variance $21/4=5.25$; the Laplace approximation matches the mode and local curvature but misses the skew. Trap: using the mean instead of the mode, or forgetting that Laplace depends on the parametrisation (in $\\log\\theta$ it would differ).","category":"ai","kind":"calculation","difficulty":"easy","tags":["Laplace approximation","Gamma","Poisson"],"origin":"original","status":"verified","entry":"Enter the variance of the Laplace (Gaussian) approximation at the mode, not the exact Gamma variance."},{"id":"m-ai-iwae-vs-elbo-estimate","title":"Importance-weighted estimate versus the ELBO estimate","prompt":"For a data point $x$ you draw two samples $z_1,z_2$ from an encoder and obtain importance weights $w_s=p(x,z_s)/q(z_s\\mid x)$ equal to $0.2$ and $0.6$. Compare the one-sample-average ELBO estimate $\\frac12\\sum_s\\log w_s$ with the $S=2$ importance-weighted estimate $\\log\\frac12\\sum_sw_s$: by how much (in nats) is the second larger?","hints":["Compute the arithmetic mean of the weights first; the second estimate is its logarithm."],"answer":"$\\ln(0.4)-\\tfrac12\\ln(0.12)\\approx0.1438$ nats","answer_type":"numeric","answer_value":0.14384,"solution":"The ELBO-style estimate is $\\frac12(\\ln0.2+\\ln0.6)=\\frac12\\ln0.12=-1.0601$. The importance-weighted estimate is $\\ln\\frac{0.2+0.6}{2}=\\ln0.4=-0.9163$. The difference is $\\ln0.4-\\frac12\\ln0.12=\\ln\\frac{0.4}{\\sqrt{0.12}}\\approx0.1438$ nats, positive by Jensen (log of the arithmetic mean is at least the arithmetic mean of the logs, i.e. $\\log$ of AM is at least $\\log$ of GM). The gap grows when the weights are more spread out. Trap: this single-draw comparison is only illustrative; the theorem is about expectations over the draws.","category":"ai","kind":"calculation","difficulty":"easy","tags":["IWAE","Jensen","VAE"],"origin":"original","status":"verified","entry":"Enter the amount, in nats, by which the importance-weighted estimate exceeds the averaged-ELBO estimate."},{"id":"m-ai-ep-vs-vb-kl-direction","title":"Expectation propagation versus variational Bayes","prompt":"Contrast variational Bayes (mean-field) with expectation propagation as approximations of a posterior $p(z)$: which KL divergence does each (locally) minimise, what behaviour results for a bimodal or correlated posterior, how does EP update a site, and when would you prefer each? Mention the role of $\\alpha$-divergences.","hints":["Moment matching versus mode seeking.","The EP step minimises $\\mathrm{KL}(\\tilde p\\,\\|\\,q^{\\rm new})$ where $\\tilde p\\propto q^{\\setminus i}\\,t_i$ is the tilted distribution."],"answer":"VB minimises $\\mathrm{KL}(q\\|p)$: mode-seeking, underestimates variance, lower-bounds the evidence. EP minimises $\\mathrm{KL}(\\tilde p\\|q)$ locally (cavity $\\times$ exact factor, then moment matching): mass-covering, can overestimate spread, no guaranteed bound or convergence. $\\alpha$-divergences interpolate: $\\alpha\\to0$ gives $\\mathrm{KL}(q\\|p)$, $\\alpha=1$ gives $\\mathrm{KL}(p\\|q)$.","answer_type":"free-text","solution":"Mean-field VB minimises $\\mathrm{KL}(q\\|p)$ over a factorised $q$; since this penalises $q$ having mass where $p$ is small, $q$ locks on to one mode and underestimates the variance (and for correlated Gaussians the marginal variances are too small); it gives a lower bound on $\\log p(X)$ and a monotone coordinate ascent. EP approximates each factor $t_i$ by a site $\\tilde t_i$ in an exponential family: remove it to get the cavity $q^{\\setminus i}\\propto q/\\tilde t_i$, form the tilted distribution $q^{\\setminus i}t_i$, find the member $q^{\\rm new}$ minimising $\\mathrm{KL}(q^{\\setminus i}t_i\\,\\|\\,q^{\\rm new})$, which for exponential families just matches moments, and set $\\tilde t_i\\propto q^{\\rm new}/q^{\\setminus i}$. Moment matching is mass covering, so EP is typically accurate for means and well calibrated for unimodal posteriors (for example GP classification) but may spread over several modes, can fail to converge, can give negative variances for sites, and gives no bound. The $\\alpha$-divergence family $D_\\alpha(p\\|q)$ interpolates: $\\alpha\\to0$ is $\\mathrm{KL}(q\\|p)$ (VB), $\\alpha=1$ is $\\mathrm{KL}(p\\|q)$ (EP), and intermediate values trade mode seeking against mass covering. Prefer VB when you need a bound, stochastic optimisation and scale (VAEs); EP when calibrated uncertainty for local, factor-by-factor approximations matters (GP classification, TrueSkill-like models). Trap: neither is guaranteed to recover the true posterior covariance.","category":"ai","kind":"concept","difficulty":"medium","tags":["expectation propagation","variational Bayes","KL divergence","alpha-divergence"],"origin":"original","status":"self-marked"},{"id":"m-ai-linear-vae-ppca","title":"The recognition model and why a linear VAE finds PPCA","prompt":"(a) What is the recognition model of a VAE and how does it relate to the usual variational posterior? (b) Contrast the objectives of a linear autoencoder and a linear VAE with factored Gaussian latents. (c) Explain why the linear VAE converges to probabilistic PCA, and why, despite the factorised posterior, the solution is not an approximation of the PPCA posterior.","hints":["The PPCA posterior covariance is $\\sigma^2(W^\\top W+\\sigma^2I)^{-1}$, independent of $x$.","There is a rotational freedom $W\\to WR$ in PPCA."],"answer":"The recognition (encoder) network maps $x$ to the parameters of $q(z|x)$, amortising inference. The linear AE minimises squared reconstruction error (PCA subspace); the linear VAE minimises the negative ELBO = reconstruction + $\\mathrm{KL}(q\\|p)$. The optimum is PPCA with weights whose columns can be chosen orthogonal, making the exact posterior covariance diagonal, so the factorised Gaussian is exact.","answer_type":"free-text","solution":"(a) The recognition model is a network $f_\\phi(x)$ returning the parameters (mean and diagonal variance) of $q_\\phi(z|x)$. It replaces the per-datapoint variational parameters of classical VB by a shared function (amortised inference), so its output is the variational posterior for that $x$; the price is an amortisation gap if $f_\\phi$ cannot represent the optimal parameters. (b) A linear AE minimises $\\sum_n\\|x_n-WVx_n\\|^2$ and recovers the PCA subspace (up to an invertible mixing). The linear VAE minimises the negative ELBO $\\sum_n\\big[\\mathbb E_q\\frac{\\|x_n-Wz\\|^2}{2\\sigma^2}+\\mathrm{KL}(q(z|x_n)\\|\\mathcal N(0,I))\\big]$, which adds a penalty that makes the latent coordinates informative in decreasing order and prevents the arbitrary rescaling the AE allows. (c) The generative model $z\\sim\\mathcal N(0,I)$, $x\\sim\\mathcal N(Wz,\\sigma^2I)$ is PPCA, and the ELBO equals the log-likelihood minus $\\mathrm{KL}(q\\|p(z|x))$. The exact PPCA posterior is Gaussian with covariance $\\sigma^2(W^\\top W+\\sigma^2I)^{-1}$, which is the same for all $x$ and diagonal whenever the columns of $W$ are orthogonal. Because PPCA is invariant to $W\\to WR$, the optimiser can pick a basis in which the columns are orthogonal; then the exact posterior is already factorised, so the diagonal-covariance linear encoder can match it with zero KL gap and the ELBO equals the log-likelihood. The solution is not an approximation (though the optimiser is free to choose any rotation). Trap: with a nonlinear decoder the posterior is no longer exactly factorised, so the gap reappears.","category":"ai","kind":"concept","difficulty":"hard","tags":["VAE","PPCA","amortised inference","recognition model"],"origin":"in the style of COMP0085 2018, Q6","status":"self-marked"},{"id":"m-ai-vae-posterior-collapse","title":"VAE with blurry samples and a collapsed latent","prompt":"You train a VAE on images. Samples look blurry, the KL term in the ELBO is near zero for most latent dimensions, and the decoder seems to ignore $z$. What is happening, what do you check, and how would you fix it?","hints":["Think about a powerful decoder that can model the data without latents, and about the KL-versus-reconstruction trade-off.","Consider the amortisation gap and the choice of observation model."],"answer":"Posterior collapse: the encoder outputs the prior for those dimensions, KL $\\approx0$, and a strong decoder (or weak likelihood) does the work. Check per-dimension KL (active units), reconstruction versus KL, decoder capacity. Fixes: KL annealing or free bits, weaker or less autoregressive decoder, a better likelihood (not a fixed-variance Gaussian), IWAE/tighter bound, richer posterior or more encoder capacity.","answer_type":"free-text","solution":"This is the classic posterior collapse: for many latent dimensions the optimiser finds $q(z|x)\\approx p(z)$, which makes the KL cost zero and ignores $z$; this happens when the decoder is powerful enough to fit the data without the latent or when early in training the KL penalty outweighs the reconstruction gain. Blurriness comes from the Gaussian likelihood with a fixed variance, which treats pixel errors as independent and averages over plausible reconstructions. First diagnose: log the KL per latent dimension (active units have KL clearly above zero), the reconstruction term and KL separately, and the held-out ELBO; compare the encoder variance with $1$; check the amortisation gap by optimising $q$ per datapoint for a few steps. Remedies: anneal the KL weight from $0$ to $1$ (or use free bits), reduce decoder capacity or autoregressive context, use a learned or heavier-tailed observation model (for example discretised logistic or a learned variance), use a tighter bound (IWAE with $S>1$), give the encoder more capacity or a flow-based posterior, or use a $\\beta<1$ for more reconstruction (at the cost of a worse generative model). Trap: judging by sample quality alone; a high ELBO with unused latents can still be a poor representation.","category":"ai","kind":"scenario","difficulty":"medium","tags":["VAE","posterior collapse","KL annealing","scenario"],"origin":"original","status":"self-marked"},{"id":"m-ai-gp-scaling-inducing-points","title":"Scaling Gaussian process regression to a large dataset","prompt":"You have a GP regression model that works well on $2000$ points but you now have $200{,}000$ points and exact inference no longer runs. Which parts of exact GP inference are expensive, what are your options, and what are the trade-offs and the failure modes of the sparse (inducing-point) variational approach?","hints":["Exact inference needs the Cholesky factor of the $N\\times N$ kernel matrix.","Introduce $M\\ll N$ inducing values $u$ and a variational distribution $q(u)=\\mathcal N(m,S)$."],"answer":"Exact GP costs $O(N^3)$ time and $O(N^2)$ memory (Cholesky of $K$). Options: sparse variational GP with $M$ inducing points (cost $O(NM^2+M^3)$, minibatch-able, ELBO bound), structured kernels (KISS-GP, Kronecker), local or ensemble GPs, random features. Check inducing-point placement, $M$ sensitivity, ELBO stability and calibrated uncertainty.","answer_type":"free-text","solution":"The cost of exact GP regression is the factorisation of the $N\\times N$ matrix $K+\\sigma^2I$: $O(N^3)$ time and $O(N^2)$ memory, which is hopeless at $N=2\\times10^5$. Options: (i) sparse variational GPs (Titsias, Hensman): introduce $M\\ll N$ inducing points $Z$ with values $u$ and $q(u)=\\mathcal N(m,S)$; the ELBO is $\\sum_n\\mathbb E_{q(f_n)}[\\log p(y_n|f_n)]-\\mathrm{KL}[q(u)\\|p(u)]$ with $q(f_n)$ Gaussian in closed form, costing $O(M^3)$ plus $O(M^2)$ per data point, and it decomposes over data, so minibatch stochastic gradients scale to millions; the bound tightens as $M$ grows. (ii) Exploit structure: grid inputs with Kronecker or Toeplitz kernels, KISS-GP, or conjugate-gradient solves with stochastic trace estimators. (iii) Divide and conquer: local experts or product/Bayesian committee machines. (iv) Random Fourier features turn the problem into Bayesian linear regression with $O(NM^2)$ cost. Failure modes of sparse variational GPs: too few or badly placed inducing points underfit and give overconfident predictions away from them; hyperparameters (lengthscale, noise) can be biased (the variational bound tends to prefer larger noise); optimisation of $Z$ is non-convex; high-dimensional inputs need many inducing points. Check by increasing $M$ until the ELBO and test log-likelihood stop improving and comparing against exact GP on a subset. Trap: reporting RMSE only hides miscalibrated predictive variances.","category":"ai","kind":"scenario","difficulty":"medium","tags":["Gaussian process","sparse GP","inducing points","scalability","scenario"],"origin":"in the style of COMP0085 2019, Q2","status":"self-marked"},{"id":"m-bdl-tf-round","title":"True/false round: Bayesian deep learning claims","prompt":"Say whether each statement is true or false, and justify any that are false.\n\n(a) A Laplace approximation fitted at a single MAP estimate can capture multiple modes of the posterior over network weights, which is why it is preferred to variational Bayes with a Gaussian family.\n\n(b) A classifier fitted by maximum likelihood has $\\theta^\\star$ and predictive $p(y\\mid x,\\theta^\\star)$. Replacing it with a Laplace-approximated posterior $\\mathcal N(\\theta^\\star,\\Sigma)$ and integrating over it (with the exact sigmoid integral) changes the predictive uncertainty but never changes the decision boundary.\n\n(c) With a Gaussian approximate posterior over the weights of a network with Gaussian likelihood, the posterior predictive distribution of the (non-linear) network is exactly Gaussian.\n\n(d) Self-normalised importance sampling with weights $w \\propto p(x)/q(x)$ is biased for any finite number of samples.\n\n(e) Bayesian deep learning gives its largest accuracy gains over standard deep learning when the dataset is enormous.","hints":["For (b) think about where the $0.5$ decision boundary sits when the posterior is symmetric in the logit.","For (d) the estimator is a ratio of two random quantities."],"answer":"(a) False. (b) True for binary classification with a symmetric posterior over the logit. (c) False. (d) True. (e) False.","answer_type":"free-text","solution":"(a) False. Laplace is a local Gaussian at one mode. A Gaussian variational family is also unimodal (and mode-seeking), so neither captures several modes; ensembles or MCMC do. (b) True for the binary case: the logit is approximately Gaussian with mean $f_{\\theta^\\star}(x)$, symmetric about its mean, so the probability crosses $0.5$ exactly where the mean logit crosses $0$. The predictions are moved towards $0.5$ (less confident) but the decision does not flip. In the multi-class case the argmax can change. (c) False. The network is non-linear in $\\theta$, so pushing a Gaussian through it is not Gaussian; only the linearised network gives a Gaussian predictive. Pushing samples through a non-linear net gives something closer to a mixture of Gaussians. (d) True. It is a ratio $\\sum_s w_s f(x_s)/\\sum_s w_s$ and the expectation of a ratio is not the ratio of expectations, though it is consistent as $S\\to\\infty$. (e) False. With huge data the likelihood dominates the prior and the posterior concentrates, so the point estimate is nearly as good; Bayesian methods pay off in small data, out-of-distribution inputs and calibration. Trap: justifying a false answer with a vague statement; give the specific reason.","category":"bdl","kind":"exam","difficulty":"medium","tags":["Laplace","variational inference","importance sampling","uncertainty"],"origin":"in the style of COMP0171 exams 2023-2025, Q1 (true/false)","status":"self-marked"},{"id":"m-bdl-langevin-imh","title":"Langevin proposals, SGLD and independent Metropolis-Hastings","prompt":"You want to sample from $\\pi(x)=\\gamma(x)/Z$ where you can evaluate $\\gamma$ but not $Z$.\n\n(a) Write down the Langevin (MALA) proposal $q(x'\\mid x)$ with step size $\\epsilon$, given $\\nabla_x\\log\\pi(x)$, and the Metropolis-Hastings acceptance ratio.\n\n(b) For a Bayesian neural network with $N$ data points, stochastic gradient Langevin dynamics (SGLD) uses a minibatch gradient and no accept/reject step. Why drop the MH step, and is the result a valid sampler? Under what conditions?\n\n(c) Independent Metropolis-Hastings proposes $x'\\sim q(x')$ regardless of the current state. Give the acceptance ratio, say which $q$ makes it equal to $1$, and explain why that is not useful in practice.\n\n(d) Name one setting where you would prefer random-walk MH and one where you would prefer independent MH.","hints":["The MALA proposal is not symmetric, so the proposal densities appear in the ratio.","Write the independent MH ratio in terms of importance weights $w(x)=\\gamma(x)/q(x)$."],"answer":"MALA: $q(x'|x)=\\mathcal N(x+\\tfrac{\\epsilon^2}{2}\\nabla\\log\\pi(x),\\epsilon^2 I)$; SGLD is exact only as $\\epsilon_t\\to0$; IMH ratio is $w(x')/w(x)$.","answer_type":"free-text","solution":"(a) $q(x'\\mid x)=\\mathcal N\\big(x'\\mid x+\\tfrac{\\epsilon^2}{2}\\nabla\\log\\pi(x),\\ \\epsilon^2 I\\big)$ and $\\alpha=\\min\\Big(1,\\frac{\\gamma(x')\\,q(x\\mid x')}{\\gamma(x)\\,q(x'\\mid x)}\\Big)$; $Z$ cancels and, because $q$ is asymmetric, the proposal terms stay. (b) The MH step needs the full-data likelihood at both points, which costs $O(N)$ per step and defeats the use of minibatches. SGLD instead takes $\\theta_{t+1}=\\theta_t+\\tfrac{\\epsilon_t}{2}\\big(\\nabla\\log p(\\theta_t)+\\tfrac NM\\sum_{i\\in B}\\nabla\\log p(y_i\\mid\\theta_t)\\big)+\\eta_t$, $\\eta_t\\sim\\mathcal N(0,\\epsilon_t)$. It is only asymptotically exact: with $\\sum\\epsilon_t=\\infty$, $\\sum\\epsilon_t^2<\\infty$ the discretisation error and the gradient noise vanish relative to the injected noise, so the iterates converge to the posterior; with fixed $\\epsilon$ it is biased. (c) $\\alpha=\\min(1,w(x')/w(x))$ with $w=\\gamma/q$. Setting $q=\\pi$ gives $\\alpha=1$ but then you could already sample from $\\pi$. A heavy-tailed or too-narrow $q$ makes $w$ unbounded and the chain gets stuck at high-weight states. (d) Random walk when you know little about the target and it is unimodal and local; independent when you have a good global approximation (e.g. a Laplace or variational fit, with heavier tails) and want to jump between modes.","category":"bdl","kind":"exam","difficulty":"medium","tags":["MCMC","Langevin","SGLD","Metropolis-Hastings"],"origin":"in the style of COMP0171 2024 Q2(d) and 2025 Q3","status":"self-marked"},{"id":"m-bdl-grad-estimators","title":"Reparameterised vs score-function gradient estimators","prompt":"For each case, write an unbiased $S$-sample Monte Carlo estimator of $\\frac{d}{d\\theta}\\mathbb E_{p(x\\mid\\theta)}[f(x,\\theta)]$ and briefly justify your choice.\n\n(a) $f(x,\\theta)=x\\theta^2$ and $p(x\\mid\\theta)=\\mathcal N(x\\mid 2\\theta,1)$.\n\n(b) $f(x)=x^2$ and $p(x\\mid\\theta)$ is a Poisson distribution with mean $\\theta$.\n\n(c) $x\\in\\{1,2,3\\}$ takes the value $k$ with probability $\\theta_k$ (a categorical distribution), and $f(x,\\theta)$ is known. Would you use the estimator in (b)? If not, what would you do?","hints":["Write $x=2\\theta+\\epsilon$ in (a) and differentiate through $f$.","The score function is $\\nabla_\\theta\\log p(x\\mid\\theta)$; for the Poisson it is $x/\\theta-1$."],"answer":"(a) $\\frac1S\\sum_s(6\\theta^2+2\\theta\\epsilon_s)$ with $\\epsilon_s\\sim\\mathcal N(0,1)$ (reparameterised). (b) $\\frac1S\\sum_s x_s^2(x_s/\\theta-1)$ (score function). (c) Sum exactly over the three values.","answer_type":"free-text","solution":"(a) $x$ is reparameterisable: $x=2\\theta+\\epsilon$, $\\epsilon\\sim\\mathcal N(0,1)$, so the objective is $\\mathbb E_\\epsilon[(2\\theta+\\epsilon)\\theta^2]$ and the pathwise derivative is $\\partial_\\theta[(2\\theta+\\epsilon)\\theta^2]=6\\theta^2+2\\theta\\epsilon$. Estimator: $\\frac1S\\sum_s(6\\theta^2+2\\theta\\epsilon_s)$ (true value $6\\theta^2$). It has low variance and uses the differentiability of $f$. (b) The Poisson is discrete, so there is no differentiable transform of noise; use the score-function (REINFORCE) estimator $\\nabla_\\theta\\mathbb E[f]=\\mathbb E[f(x)\\nabla_\\theta\\log p(x\\mid\\theta)]$, giving $\\frac1S\\sum_s x_s^2\\,(x_s/\\theta-1)$ with $x_s\\sim\\text{Poisson}(\\theta)$ (true value $1+2\\theta$). It is unbiased but high variance; a baseline (control variate) helps. (c) With only three outcomes the expectation is $\\sum_k\\theta_kf(k,\\theta)$, which can be computed exactly and differentiated: $\\partial_{\\theta_k}=f(k,\\theta)+\\sum_j\\theta_j\\partial_{\\theta_k}f(j,\\theta)$ (taking account of the simplex constraint via a softmax parameterisation). Exact enumeration has no variance, so Monte Carlo is wasteful. Trap: using reparameterisation for a discrete variable, or forgetting the explicit $\\theta$-dependence of $f$.","category":"bdl","kind":"exam","difficulty":"medium","tags":["reparameterisation","score function","REINFORCE","gradient estimators"],"origin":"in the style of COMP0171 2024 sample exam, Q4","status":"self-marked"},{"id":"m-bdl-bayesian-vae-decoder","title":"ELBO for a VAE with a Bayesian decoder","prompt":"Consider a VAE with encoder $q_\\phi(z\\mid x)$, decoder $p_\\theta(x\\mid z)$ and prior $p(z)$. Now put a prior $p(\\theta)$ on the decoder weights and use a Gaussian variational posterior $q_\\lambda(\\theta)$.\n\n(a) Write the joint distribution of data $x_{1:N}$, latents $z_{1:N}$ and $\\theta$.\n\n(b) Derive an ELBO on $\\log p(x_{1:N})$ that can be optimised over $\\lambda$ and $\\phi$.\n\n(c) Give a minibatch gradient estimator for a batch of $M$ points.\n\n(d) What is the main benefit relative to standard VAE training, and what would you do about the encoder weights?","hints":["Use $q(\\theta,z_{1:N})=q_\\lambda(\\theta)\\prod_iq_\\phi(z_i\\mid x_i)$ and Jensen's inequality.","The KL on $\\theta$ is paid once, not per data point."],"answer":"$\\text{ELBO}=\\mathbb E_{q_\\lambda(\\theta)}\\big[\\sum_i\\mathbb E_{q_\\phi(z_i|x_i)}[\\log p_\\theta(x_i|z_i)]-\\mathrm{KL}(q_\\phi(z_i|x_i)\\|p(z_i))\\big]-\\mathrm{KL}(q_\\lambda(\\theta)\\|p(\\theta))$.","answer_type":"free-text","solution":"(a) $p(x_{1:N},z_{1:N},\\theta)=p(\\theta)\\prod_i p(z_i)\\,p_\\theta(x_i\\mid z_i)$. (b) $\\log p(x_{1:N})=\\log\\int p(\\theta)\\prod_i\\int p_\\theta(x_i\\mid z_i)p(z_i)\\,dz_i\\,d\\theta$. Multiply and divide by $q_\\lambda(\\theta)\\prod_iq_\\phi(z_i\\mid x_i)$ and apply Jensen: $\\log p(x_{1:N})\\ge\\mathbb E_{q_\\lambda(\\theta)}\\Big[\\sum_i\\big(\\mathbb E_{q_\\phi(z_i|x_i)}[\\log p_\\theta(x_i\\mid z_i)]-\\mathrm{KL}(q_\\phi(z_i\\mid x_i)\\|p(z_i))\\big)\\Big]-\\mathrm{KL}(q_\\lambda(\\theta)\\|p(\\theta))$. So it is the usual per-point VAE ELBO averaged over decoder weights, minus one global KL. (c) Sample $\\theta^{(s)}=\\mu_\\lambda+\\sigma_\\lambda\\odot\\epsilon$ and $z_m=\\mu_\\phi(x_m)+\\sigma_\\phi(x_m)\\odot\\eta_m$; estimate $\\nabla_{\\lambda,\\phi}\\big[\\frac NM\\sum_{m}\\big(\\log p_{\\theta^{(s)}}(x_m\\mid z_m)-\\mathrm{KL}_m\\big)-\\mathrm{KL}(q_\\lambda\\|p(\\theta))\\big]$ by backpropagating through the reparameterisation. The $N/M$ factor keeps the data term unbiased relative to the single KL. (d) Benefit: model (epistemic) uncertainty in the decoder, and regularisation, which matters with little data; the cost is roughly doubling the parameters and extra gradient variance. The encoder is only an inference device for $z$: its parameters $\\phi$ are variational parameters that are optimised, not given a posterior, so no further Bayesian treatment is needed. Trap: multiplying the weight KL by $N$ or forgetting $N/M$.","category":"bdl","kind":"exam","difficulty":"hard","tags":["VAE","ELBO","variational inference","Bayesian neural network"],"origin":"in the style of COMP0171 2025 sample exam, Q4","status":"self-marked"},{"id":"m-bdl-laplace-vs-vi-vs-mcmc","title":"Laplace, variational inference and MCMC for network weights","prompt":"Compare the Laplace approximation, mean-field variational inference and MCMC for the posterior over the weights of a neural network. Cover what each approximates, what it costs, what it gets wrong, and which you would pick for a large network in production.","hints":["Think about locality, mode-seeking behaviour and the number of forward passes at test time."],"answer":"Laplace: Gaussian at the MAP using the Hessian (post hoc, cheap, local). VI: optimise $q$ to minimise $\\mathrm{KL}(q\\|p)$ (mode-seeking, under-estimates variance). MCMC: asymptotically exact, expensive.","answer_type":"free-text","solution":"Laplace: train to a MAP estimate, then fit $\\mathcal N(\\theta_{\\text{MAP}},H^{-1})$ where $H$ is the Hessian of the negative log posterior; in practice use a generalised Gauss-Newton or Kronecker-factored approximation, often on the last layer only. It is cheap and post hoc, but local (one mode), and the plain Hessian can be indefinite. Variational inference maximises the ELBO, equivalently minimises $\\mathrm{KL}(q\\|p)$; it is trained with the reparameterisation trick and scales with minibatches, but mean-field Gaussians are mode-seeking and under-estimate posterior variance, and training is harder than ordinary SGD. MCMC (HMC, SGLD) is asymptotically exact and can represent multimodality, but is slow to mix in millions of dimensions and needs many weight samples to store and evaluate at test time. Ensembles are a pragmatic fourth option that explores several modes. For a large production network I would use a last-layer or linearised Laplace, or a small deep ensemble, since both reuse a standard trained network. Trap: saying VI captures multiple modes just because it is flexible; a unimodal family cannot.","category":"bdl","kind":"concept","difficulty":"medium","tags":["Laplace","variational inference","MCMC","trade-offs"],"origin":"original","status":"self-marked"},{"id":"m-bdl-map-not-bayesian-ensembles","title":"Why MAP is not Bayesian, and ensembles as approximate Bayes","prompt":"(a) MAP estimation has a prior. Why is it still said not to be Bayesian?\n\n(b) A deep ensemble trains $K$ networks from different random initialisations. In what sense is it approximate Bayesian inference, how do you compute its predictive distribution, and what are its limits?","hints":["Contrast a point estimate with an integral over $\\theta$.","Think of the ensemble members as samples from an approximate posterior."],"answer":"MAP returns a single point; the Bayesian predictive integrates over $\\theta$. Ensemble: $p(y|x)\\approx\\frac1K\\sum_kp(y|x,\\theta_k)$.","answer_type":"free-text","solution":"(a) MAP maximises $\\log p(\\mathcal D\\mid\\theta)+\\log p(\\theta)$ and reports one parameter value, throwing away posterior mass and curvature. The Bayesian answer is the posterior $p(\\theta\\mid\\mathcal D)$ and a predictive $p(y\\mid x,\\mathcal D)=\\int p(y\\mid x,\\theta)p(\\theta\\mid\\mathcal D)\\,d\\theta$. The prior is only used as a regulariser (Gaussian prior with Gaussian likelihood gives squared error plus an $\\ell_2$ penalty with $\\lambda=\\alpha/\\beta$), and MAP is not invariant to reparameterisation. (b) Each member is a local mode of the loss, so the ensemble is like a set of samples from a multimodal approximate posterior $q(\\theta)=\\frac1K\\sum_k\\delta_{\\theta_k}$. The predictive is the Monte Carlo average $p(y\\mid x)\\approx\\frac1K\\sum_kp(y\\mid x,\\theta_k)$; for classification average the class probabilities, for regression a mixture with mean $\\frac1K\\sum\\mu_k$ and variance $\\frac1K\\sum(\\sigma_k^2+\\mu_k^2)-\\bar\\mu^2$. Disagreement between members measures epistemic uncertainty. Limits: $K$ is small, members need not be posterior samples (no guarantee about weights), and it costs $K$ times the training and inference. Trap: treating the members as independent samples of the true posterior; they are only samples from the optimiser's distribution over modes.","category":"bdl","kind":"concept","difficulty":"medium","tags":["MAP","deep ensembles","epistemic uncertainty","posterior predictive"],"origin":"original","status":"self-marked"},{"id":"m-bdl-linearised-predictive","title":"Derive the linearised Laplace predictive distribution","prompt":"A network has model $y\\mid x\\sim\\mathcal N(f_\\theta(x),\\beta^{-1})$ and approximate posterior $q(\\theta)=\\mathcal N(\\mu,\\Sigma)$. Derive the predictive $p(y'\\mid x')\\approx\\mathcal N\\big(f_\\mu(x'),\\ \\beta^{-1}+g^\\top\\Sigma g\\big)$ with $g=\\nabla_\\theta f_\\theta(x')|_{\\theta=\\mu}$. State the assumptions and say whether it works for a variational Gaussian posterior.","hints":["Taylor expand $f_\\theta(x')$ around $\\mu$ to first order.","A linear function of a Gaussian is Gaussian; then convolve with the noise."],"answer":"With $f_\\theta(x')\\approx f_\\mu(x')+g^\\top(\\theta-\\mu)$ the predictive is Gaussian with mean $f_\\mu(x')$ and variance $\\beta^{-1}+g^\\top\\Sigma g$.","answer_type":"free-text","solution":"The predictive is $p(y'\\mid x')=\\int\\mathcal N(y'\\mid f_\\theta(x'),\\beta^{-1})\\,q(\\theta)\\,d\\theta$. Linearise: $f_\\theta(x')\\approx f_\\mu(x')+g^\\top(\\theta-\\mu)$. Then $f_\\theta(x')$ is a linear function of a Gaussian, so it is Gaussian with mean $f_\\mu(x')$ and variance $g^\\top\\Sigma g$. Writing $y'=f_\\theta(x')+\\varepsilon$ with $\\varepsilon\\sim\\mathcal N(0,\\beta^{-1})$ independent, the sum of independent Gaussians is Gaussian with the means added and the variances added: $y'\\sim\\mathcal N(f_\\mu(x'),\\beta^{-1}+g^\\top\\Sigma g)$. The approximation is good when the posterior is narrow enough that the network is nearly linear over its support (large data, small $\\Sigma$, locally smooth network). It fails with wide posteriors or strong curvature, for example near ReLU kinks or far from the data. For the Gaussian from variational Bayes the same algebra applies, but the linearisation point $\\mu$ is then not a mode, so the linear model is a poorer fit; it is most natural with Laplace, where the mean is the MAP. The two terms are aleatoric ($\\beta^{-1}$) and epistemic ($g^\\top\\Sigma g$). Trap: forgetting that the Gaussian assumes a fixed noise precision.","category":"bdl","kind":"derivation","difficulty":"medium","tags":["linearised Laplace","predictive distribution","Taylor expansion"],"origin":"in the style of COMP0171 2023 sample exam, Q5","status":"self-marked"},{"id":"m-bdl-bayes-linreg-posterior","title":"Posterior for Bayesian linear regression, and its MAP link","prompt":"Take $y_i=w^\\top\\phi(x_i)+\\varepsilon_i$ with $\\varepsilon_i\\sim\\mathcal N(0,\\beta^{-1})$ and prior $w\\sim\\mathcal N(0,\\alpha^{-1}I)$. Derive the posterior $p(w\\mid\\mathcal D)$ by completing the square, give its mean and covariance, and show that the posterior mean equals the ridge solution with $\\lambda=\\alpha/\\beta$. Then give the predictive variance at a new input.","hints":["Write the log posterior as a quadratic in $w$ and match to $-\\tfrac12(w-m)^\\top S^{-1}(w-m)$."],"answer":"$p(w|\\mathcal D)=\\mathcal N(m,S)$ with $S^{-1}=\\alpha I+\\beta\\Phi^\\top\\Phi$, $m=\\beta S\\Phi^\\top y$; the mean is ridge with $\\lambda=\\alpha/\\beta$.","answer_type":"free-text","solution":"The log posterior is $\\log p(w\\mid\\mathcal D)=-\\tfrac\\beta2\\|y-\\Phi w\\|^2-\\tfrac\\alpha2\\|w\\|^2+\\text{const}$. Expanding, the quadratic term in $w$ is $-\\tfrac12 w^\\top(\\alpha I+\\beta\\Phi^\\top\\Phi)w$ and the linear term is $\\beta\\,w^\\top\\Phi^\\top y$. Matching to $-\\tfrac12(w-m)^\\top S^{-1}(w-m)$ gives $S^{-1}=\\alpha I+\\beta\\Phi^\\top\\Phi$ and $m=\\beta S\\Phi^\\top y=(\\Phi^\\top\\Phi+\\tfrac\\alpha\\beta I)^{-1}\\Phi^\\top y$. That is exactly the ridge estimator with $\\lambda=\\alpha/\\beta$. For Gaussians the posterior mean is the mode, so MAP equals the posterior mean; the Bayesian extra is the covariance $S$. Predictive at $x_*$: $p(y_*\\mid x_*)=\\mathcal N\\big(m^\\top\\phi_*,\\ \\beta^{-1}+\\phi_*^\\top S\\phi_*\\big)$, where $\\beta^{-1}$ is noise and $\\phi_*^\\top S\\phi_*$ shrinks with more data in that direction of feature space. Intuition: ridge regression is Bayesian linear regression with the uncertainty thrown away. Trap: confusing $\\alpha$ (prior precision) with prior variance, which inverts $\\lambda$.","category":"bdl","kind":"derivation","difficulty":"medium","tags":["Bayesian linear regression","conjugacy","ridge","MAP"],"origin":"original","status":"self-marked"},{"id":"m-bdl-linearised-variance-calc","title":"Linearised predictive variance for a small network","prompt":"A regression network has noise precision $\\beta=4$. At a test input the gradient of the output with respect to the two weights is $g=(1,2)^\\top$ and the Laplace posterior covariance is $\\Sigma=\\begin{pmatrix}0.5&0.1\\\\0.1&0.25\\end{pmatrix}$. What is the predictive variance $\\beta^{-1}+g^\\top\\Sigma g$?","hints":["Compute $g^\\top\\Sigma g$ including the cross-term $2\\,g_1g_2\\Sigma_{12}$."],"answer":"2.15","answer_type":"numeric","answer_value":2.15,"solution":"$g^\\top\\Sigma g=0.5\\cdot1+2\\cdot(1)(2)(0.1)+0.25\\cdot4=0.5+0.4+1=1.9$. The aleatoric part is $\\beta^{-1}=0.25$. Total predictive variance $=0.25+1.9=2.15$. The epistemic part dominates (1.9 of 2.15), which would signal an input far from the training data. Trap: dropping the off-diagonal covariance term, which gives $1.75$.","category":"bdl","kind":"calculation","difficulty":"easy","tags":["linearised Laplace","predictive variance"],"origin":"original","status":"verified","entry":"Enter the predictive variance $\\beta^{-1}+g^\\top\\Sigma g$ at the test input."},{"id":"m-bdl-mh-acceptance-calc","title":"Metropolis-Hastings acceptance probability","prompt":"The target is $\\pi(x)\\propto\\exp\\!\\big(-(x-1)^2/8\\big)$. A random-walk Metropolis-Hastings chain with symmetric Gaussian proposals is at $x=1$ and proposes $x'=4$. What is the acceptance probability?","hints":["The normalising constant and the symmetric proposal both cancel."],"answer":"0.3247","answer_type":"numeric","answer_value":0.32465246735834974,"solution":"For a symmetric proposal $q(x'\\mid x)=q(x\\mid x')$, the acceptance probability is $\\min(1,\\pi(x')/\\pi(x))$ and the unknown normaliser $Z$ cancels. Here $\\pi(x')/\\pi(x)=\\exp\\big(-[(4-1)^2-(1-1)^2]/8\\big)=\\exp(-9/8)=\\exp(-1.125)\\approx0.3247$. The proposal moves 1.5 standard deviations away from the centre so it is accepted about a third of the time. Intuition: uphill moves are always accepted, downhill moves with probability equal to the density ratio. Trap: using $(x'-x)^2$ rather than the difference of the squared deviations from the mean.","category":"bdl","kind":"calculation","difficulty":"easy","tags":["Metropolis-Hastings","acceptance ratio"],"origin":"original","status":"verified","entry":"Enter the Metropolis-Hastings acceptance probability for the move from $x=1$ to $x'=4$, as a probability between 0 and 1."},{"id":"m-bdl-uncertainty-self-driving","title":"Scenario: aleatoric vs epistemic uncertainty in a perception model","prompt":"You have trained a street-scene segmentation model on daytime and night-time footage from UK city centres, and it will be deployed on a car. (a) What failure modes do you expect, and which would you attribute to aleatoric and which to epistemic uncertainty? (b) How would you estimate each kind of uncertainty in practice, and what would you do with it in the product?","hints":["Aleatoric is irreducible noise in the data; epistemic comes from the model not knowing."],"answer":"Aleatoric: heavy fog or glare where the label is ambiguous. Epistemic: unseen conditions such as snow or a rural road. Estimate with a heteroscedastic output head and an ensemble or Laplace.","answer_type":"free-text","solution":"Expected failures: distribution shift (rural roads, snow, left versus right-hand traffic, unseen vehicle types), sensor issues, rare objects. Aleatoric (irreducible) examples: heavy fog, glare, or a blurred pedestrian where even a human could not tell the label; collecting more data does not fix it. Epistemic examples: conditions absent from the training set, such as snow or an unusual animal; more data in that region would fix it. Estimation: aleatoric by a heteroscedastic head that predicts $\\sigma^2(x)$ (or a softmax distribution), epistemic by disagreement between ensemble members, MC dropout, or a (last-layer) Laplace term $g^\\top\\Sigma g$; total predictive variance is the sum. Use in the product: high epistemic uncertainty should trigger a fallback (slow down, hand over to the driver) and be logged to prioritise data collection and active learning; high aleatoric uncertainty means act conservatively but retraining will not help. Trap: reading the softmax probability of a single network as epistemic uncertainty; it is typically over-confident out of distribution.","category":"bdl","kind":"scenario","difficulty":"medium","tags":["aleatoric","epistemic","distribution shift","ensembles"],"origin":"in the style of COMP0171 2024 sample exam, Q2(b)","status":"self-marked"},{"id":"m-bdl-calibration-check","title":"Scenario: accurate but poorly calibrated classifier","prompt":"Your binary classifier is 92% accurate on a held-out set but in a bin where it says \"95% confident\", only 78% of the predictions are correct. A colleague says this high accuracy proves the model fits well. How do you diagnose and fix the problem, and how does a Bayesian approach help?","hints":["Distinguish accuracy from calibration; think of reliability diagrams and the expected calibration error."],"answer":"The model is over-confident. Check a reliability diagram and ECE or negative log-likelihood, then use temperature scaling, ensembles or a Laplace predictive.","answer_type":"free-text","solution":"Accuracy only checks the arg max, while calibration checks that predicted probabilities match frequencies. Diagnose with a reliability diagram (bin by confidence, plot accuracy per bin) and the expected calibration error $\\sum_b\\frac{|B_b|}{n}|\\text{acc}(B_b)-\\text{conf}(B_b)|$, plus proper scoring rules (negative log-likelihood, Brier). Here the model is over-confident (95% claimed vs 78% observed), typical for deep nets trained to near-zero training loss. Fixes: temperature scaling fitted on a held-out set (one parameter, does not change accuracy); label smoothing; a deep ensemble or a Laplace/variational predictive which averages over parameters and pulls predictions towards $0.5$ where the posterior is uncertain. Bayesian marginalisation helps because the predictive is $\\int p(y\\mid x,\\theta)p(\\theta\\mid\\mathcal D)\\,d\\theta$, so uncertainty over weights lowers confidence away from the data. Also check shift: calibration on the validation set may not transfer. Trap: the reverse case in the exam, a model with 60% confidence but 90% accuracy is under-confident, which is also miscalibration, not a sign of a good fit.","category":"bdl","kind":"scenario","difficulty":"medium","tags":["calibration","ECE","temperature scaling","uncertainty"],"origin":"in the style of COMP0171 2023 sample exam, Q1(f)","status":"self-marked"},{"id":"m-rl-bandit-greedy-ucb","title":"Greedy vs UCB on a three-armed bandit","prompt":"A bandit has three arms $a_1,a_2,a_3$ with rewards in $\\{-1,0,+1\\}$. The data so far is: $t=1$: $a_1$, reward $+1$; $t=2$: $a_2$, reward $0$; $t=3$: $a_3$, reward $0$; $t=4$: $a_1$, reward $-1$. Action values are sample averages. Break ties uniformly at random. UCB selects $A_t=\\arg\\max_a\\big[Q_t(a)+c\\sqrt{\\ln t/N_t(a)}\\big]$.\n\n(a) Give the greedy policy $\\pi_5$ over the three arms.\n\n(b) Give the UCB policy at $t=5$ with $c=1$. Show the three indices.\n\n(c) Suppose every arm has non-zero probability of producing each of $-1,0,+1$. Is the greedy policy guaranteed to be optimal asymptotically? Explain.","hints":["$\\ln 5\\approx1.609$.","For (c) ask whether the greedy algorithm can lock onto a bad arm after a few unlucky samples."],"answer":"(a) $(1/3,1/3,1/3)$. (b) indices $0.897$, $1.269$, $1.269$, so $\\pi_5=(0,1/2,1/2)$. (c) No.","answer_type":"free-text","solution":"(a) Averages are $Q(a_1)=(1-1)/2=0$, $Q(a_2)=0$, $Q(a_3)=0$, all tied, so the greedy policy is uniform: $\\pi_5=(1/3,1/3,1/3)$. (b) With $\\ln5=1.609$: $a_1$ has $N=2$ and index $0+\\sqrt{1.609/2}=0.897$; $a_2$ has $N=1$ and index $\\sqrt{1.609}=1.269$; $a_3$ is the same, $1.269$. So $a_2$ and $a_3$ tie for the maximum: $\\pi_5=(0,\\tfrac12,\\tfrac12)$. UCB prefers the less-sampled arms because the bonus is larger when $N$ is small. (c) No. Pure greedy has a positive probability of locking on to a sub-optimal arm: e.g. the best arm returns $-1$ on its first pull (possible, since every outcome has non-zero probability) while another arm returns $+1$; the greedy rule never pulls the first arm again, so the estimate is never corrected. Hence it has linear expected regret in general. UCB (or $\\epsilon$-greedy with decaying $\\epsilon$, or Thompson sampling) keeps exploring and obtains logarithmic regret. Trap: saying greedy is fine because the estimates are consistent; they are consistent only for arms that keep being sampled.","category":"rl","kind":"exam","difficulty":"medium","tags":["bandits","UCB","greedy","exploration"],"origin":"in the style of COMP0089/COMP0086 2025 sample exam, Q1A","status":"self-marked"},{"id":"m-rl-quadratic-softmax-pg","title":"Policy gradient with a quadratic policy parameterisation","prompt":"A two-action policy is parameterised by $\\pi(a_i)=p_i^2/\\sum_jp_j^2$, with $p=(0.6,0.3)$. You take the plain policy-gradient (REINFORCE, no baseline) step $p\\leftarrow p+\\alpha R\\,\\nabla_p\\log\\pi(A)$ with $\\alpha=0.2$ after choosing $A=a_2$ and observing $R=+1$.\n\n(a) Compute $\\nabla_p\\log\\pi(a_2)$ and the new preferences.\n\n(b) If the preferences were half as large, $p=(0.3,0.15)$, what happens to the size of the update with the same $\\alpha$? Why?\n\n(c) Why does the canonical algorithm sample actions from the current policy $\\pi$? Name one case where you might sample from a different distribution.","hints":["$\\log\\pi(a_2)=2\\log p_2-\\log(p_1^2+p_2^2)$.","Compare $\\nabla\\log\\pi$ at the two scales: it is homogeneous of degree $-1$."],"answer":"(a) $\\nabla\\log\\pi(a_2)=(-2.667,\\,5.333)$, new $p=(0.0667,\\,1.367)$. (b) The update doubles, because the gradient scales as $1/p$. (c) On-policy sampling makes the update an unbiased estimate of $\\nabla J$.","answer_type":"free-text","solution":"(a) With $S=p_1^2+p_2^2=0.45$: $\\partial_{p_1}\\log\\pi(a_2)=-2p_1/S=-2.667$ and $\\partial_{p_2}\\log\\pi(a_2)=2/p_2-2p_2/S=6.667-1.333=5.333$. The update is $p_1=0.6+0.2(-2.667)=0.0667$ and $p_2=0.3+0.2(5.333)=1.367$. The probability of $a_2$ moves from $0.2$ to about $0.997$: a very large step. (b) $\\nabla\\log\\pi$ scales as $1/p$, so halving the preferences doubles the gradient to $(-5.33,10.67)$, giving $p=(-0.767,2.283)$. The preferences are overshooting because the step size is not scale-invariant; the policy depends only on $p^2$, so the sign of $p_1$ is irrelevant, but the step is huge in policy space. This is why policy-gradient methods are sensitive to learning rate and why natural gradients or normalised step sizes are used. (c) If $A\\sim\\pi$, then $\\mathbb E[R\\nabla\\log\\pi(A)]=\\nabla J(\\theta)$, so the update is an unbiased estimate of the gradient of the expected return, and actions with high probability (those that matter most for the objective) are updated most often. Sampling from a different distribution $\\mu$ requires importance weights $\\pi/\\mu$, which add variance, but it can pay off when a rare but high-return action is never sampled by the current policy (a forced-exploration or safe-exploration setting). Trap: forgetting that the reward is not centred; with $R>0$ all sampled actions get pushed up, which a baseline would fix.","category":"rl","kind":"exam","difficulty":"hard","tags":["policy gradient","REINFORCE","step size","on-policy"],"origin":"in the style of COMP0086 2024-25 exam, Q2","status":"self-marked"},{"id":"m-rl-odd-bellman-operator","title":"A different Bellman operator: max outside the expectation","prompt":"Consider the operator $(Tq)(s,a)=r(s,a)+\\gamma\\max_b\\mathbb E_{S'\\sim p(\\cdot\\mid s,a)}[q(S',b)]$ on a finite MDP (the maximum is outside the expectation, so $b$ cannot depend on $S'$).\n\n(a) Does repeated synchronous application of $T$ converge, and to a unique fixed point?\n\n(b) Is the fixed point equal to $q^*$? Use this MDP: from $s_0$, any action gives reward $0$ and moves to $s_1$ or $s_2$ with probability $\\tfrac12$ each. In $s_1$ the two actions give rewards $(1,0)$, in $s_2$ they give $(0,1)$, and both episodes then terminate. Take $\\gamma=0.9$ and compute $q^*(s_0,\\cdot)$ and the fixed-point value of $T$ at $s_0$.\n\n(c) Does the answer change in a deterministic environment?","hints":["Show $|\\max_b x_b-\\max_b y_b|\\le\\max_b|x_b-y_b|$ and the expectation preserves the bound.","At the fixed point $q(s_1,\\cdot)=(1,0)$ and $q(s_2,\\cdot)=(0,1)$ because the episodes terminate."],"answer":"(a) Yes: $T$ is a $\\gamma$-contraction in $\\|\\cdot\\|_\\infty$. (b) No: $q^*(s_0)=0.9$ but the fixed point is $0.45$. (c) In a deterministic environment the expectation is trivial, so it equals $q^*$.","answer_type":"free-text","solution":"(a) For two tables $q,q'$: $|(Tq)(s,a)-(Tq')(s,a)|=\\gamma\\,|\\max_b\\mathbb E[q(S',b)]-\\max_b\\mathbb E[q'(S',b)]|\\le\\gamma\\max_b\\mathbb E|q(S',b)-q'(S',b)|\\le\\gamma\\|q-q'\\|_\\infty$. So $T$ is a $\\gamma$-contraction in sup norm and, by the Banach fixed point theorem, has a unique fixed point to which the iteration converges geometrically. (b) It is not the Bellman optimality operator, which has the maximum inside: $\\mathbb E[\\max_bq(S',b)]$. In the example, $q^*(s_1,\\cdot)=(1,0)$, $q^*(s_2,\\cdot)=(0,1)$, so $q^*(s_0,a)=0.9\\cdot\\tfrac12(1+1)=0.9$. For $T$: the fixed point in $s_1,s_2$ is the same (terminal), but at $s_0$ we get $0.9\\max_b\\tfrac12(q(s_1,b)+q(s_2,b))=0.9\\cdot\\tfrac12=0.45$, because the same action index $b$ must be chosen in both successor states and each action is only good in one of them. The operator therefore evaluates a policy that cannot observe the next state; its fixed point is below $q^*$. The greedy policy from it need not be optimal. (c) If transitions are deterministic there is one successor state, so $\\max_b\\mathbb E[q]=\\mathbb E[\\max_bq]$ and $T$ coincides with the Bellman optimality operator: the same unique fixed point $q^*$. Trap: assuming any $\\max$ operator is the optimality operator; where the max sits relative to the expectation matters.","category":"rl","kind":"exam","difficulty":"hard","tags":["Bellman operator","contraction","fixed point","dynamic programming"],"origin":"in the style of COMP0089 2024 exam, Q2(f), and COMP0086 2024-25, Q4","status":"self-marked"},{"id":"m-rl-gaussian-policy-entropy","title":"Gaussian policy gradient: mean update and entropy","prompt":"A one-step problem has policy $\\pi(A)=\\mathcal N(A\\mid\\mu,\\sigma^2)$ with parameters $(\\mu,\\sigma)$. You sample $A$, observe a return $G$ and the episode ends.\n\n(a) Write the REINFORCE update without a baseline for $\\mu$ and for $\\sigma$, with step size $\\alpha$.\n\n(b) For $G>0$, for which values of $A$ does the update increase the entropy of the policy? What changes if $G<0$?\n\n(c) Give an intuition for what this implies about exploration with a Gaussian policy.","hints":["$\\log\\pi=-\\log\\sigma-\\frac{(A-\\mu)^2}{2\\sigma^2}+\\text{const}$.","The entropy of a Gaussian is $\\log\\sigma+\\text{const}$."],"answer":"$\\mu'=\\mu+\\alpha G\\frac{A-\\mu}{\\sigma^2}$, $\\sigma'=\\sigma+\\alpha G\\frac{(A-\\mu)^2-\\sigma^2}{\\sigma^3}$. For $G>0$ entropy rises iff $|A-\\mu|>\\sigma$; for $G<0$ iff $|A-\\mu|<\\sigma$.","answer_type":"free-text","solution":"(a) $\\nabla_\\mu\\log\\pi=(A-\\mu)/\\sigma^2$ and $\\nabla_\\sigma\\log\\pi=-1/\\sigma+(A-\\mu)^2/\\sigma^3=\\big((A-\\mu)^2-\\sigma^2\\big)/\\sigma^3$. So $\\mu'=\\mu+\\alpha G\\,\\frac{A-\\mu}{\\sigma^2}$ and $\\sigma'=\\sigma+\\alpha G\\,\\frac{(A-\\mu)^2-\\sigma^2}{\\sigma^3}$. The mean moves towards a sampled action when the return is positive and away when negative. (b) The entropy of a univariate Gaussian is $\\tfrac12\\log(2\\pi e\\sigma^2)$, increasing in $\\sigma$. For $G>0$, $\\sigma'>\\sigma$ iff $(A-\\mu)^2>\\sigma^2$, i.e. $|A-\\mu|>\\sigma$: a positive return from an action that was in the tails widens the policy, while a positive return from an action near the mean makes it narrower. For $G<0$ the inequality flips: entropy increases iff $|A-\\mu|<\\sigma$ (a bad action near the mean widens the distribution). (c) A Gaussian policy sharpens when it keeps getting reward for typical actions, and this is the mechanism by which exploration collapses, so an entropy bonus or a baseline (to make signs informative) is commonly added. Trap: mixing up the sign of the entropy condition for negative returns, and forgetting that the update scale depends on $G$ itself, so un-normalised returns produce huge steps.","category":"rl","kind":"exam","difficulty":"medium","tags":["policy gradient","Gaussian policy","entropy","score function"],"origin":"in the style of COMP0089 2024 exam, Q4(c)","status":"self-marked"},{"id":"m-rl-sarsa-vs-qlearning","title":"SARSA vs Q-learning: on-policy vs off-policy","prompt":"Write the SARSA and Q-learning updates, say what each converges to under $\\epsilon$-greedy behaviour, and explain which you would use in a cliff-walking task where falling off the cliff is very costly. How does Expected SARSA relate to the two?","hints":["Look at which action is used in the bootstrap target."],"answer":"SARSA uses $Q(S',A')$ (the behaviour action); Q-learning uses $\\max_aQ(S',a)$. SARSA learns the value of the $\\epsilon$-greedy policy, Q-learning the optimal values.","answer_type":"free-text","solution":"SARSA: $Q(S,A)\\leftarrow Q(S,A)+\\alpha\\big[R+\\gamma Q(S',A')-Q(S,A)\\big]$ with $A'$ the action actually taken. Q-learning: $Q(S,A)\\leftarrow Q(S,A)+\\alpha\\big[R+\\gamma\\max_aQ(S',a)-Q(S,A)\\big]$. SARSA is on-policy and converges to $q_\\pi$ of the $\\epsilon$-greedy policy (and to $q^*$ if $\\epsilon\\to0$ appropriately, with GLIE); Q-learning is off-policy and converges to $q^*$ for any behaviour policy that visits all state-action pairs infinitely often (with suitable step sizes). On cliff walking the exploratory policy occasionally steps off the cliff, so SARSA learns the longer safe path; Q-learning learns the optimal path along the edge, and its online performance is worse during training while $\\epsilon>0$. If the deployed policy is greedy, Q-learning's policy is the better one; if exploration remains in deployment or mistakes are costly, SARSA's. Expected SARSA replaces the sampled $Q(S',A')$ by $\\sum_a\\pi(a\\mid S')Q(S',a)$: lower variance than SARSA, and with a greedy target policy it is exactly Q-learning, so it unifies both. Trap: saying Q-learning is always better; it optimises for a policy that is not the one being executed.","category":"rl","kind":"concept","difficulty":"medium","tags":["SARSA","Q-learning","off-policy","Expected SARSA"],"origin":"original","status":"self-marked"},{"id":"m-rl-mc-vs-td","title":"Monte Carlo vs TD: bias and variance","prompt":"Compare Monte Carlo returns, TD(0) and $n$-step/TD($\\lambda$) as targets for value estimation. Cover bias, variance, whether they need complete episodes, what each converges to on a fixed batch of data, and how $\\lambda$ trades them off.","hints":["TD bootstraps from an estimate; MC uses the whole sampled return."],"answer":"MC is unbiased but high variance and needs episodes; TD(0) is biased by bootstrapping but lower variance and online; batch TD(0) gives the certainty-equivalent MDP solution, MC the least-squares fit to returns.","answer_type":"free-text","solution":"MC uses $G_t=\\sum_k\\gamma^kR_{t+k+1}$: unbiased for $v_\\pi$ but with variance that grows with the length of the episode, and it needs episodes to finish. TD(0) uses $R_{t+1}+\\gamma V(S_{t+1})$: it is biased while $V$ is wrong, but has much lower variance (one random reward and one transition), learns online and works in continuing tasks; it exploits the Markov property. On a fixed batch, MC converges to the values that minimise squared error on the observed returns, whereas batch TD(0) converges to the values of the maximum-likelihood Markov model (the certainty-equivalent estimate), which usually generalises better when the process is Markov. The $\\lambda$-return $G^\\lambda_t=R_{t+1}+\\gamma\\big[(1-\\lambda)V(S_{t+1})+\\lambda G^\\lambda_{t+1}\\big]$ interpolates: $\\lambda=0$ is TD(0), $\\lambda=1$ is MC; intermediate $\\lambda$ usually performs best. Eligibility traces implement it online in the backward view. Trap: saying TD is 'better' without noting the dependence on the Markov assumption and function approximation, where bootstrapping can diverge.","category":"rl","kind":"concept","difficulty":"medium","tags":["Monte Carlo","TD learning","bias-variance","TD(lambda)"],"origin":"original","status":"self-marked"},{"id":"m-rl-policy-gradient-baseline","title":"Derive the policy gradient and show a baseline is unbiased","prompt":"For a one-step problem with policy $\\pi_\\theta(a\\mid s)$ and objective $J(\\theta)=\\mathbb E_{a\\sim\\pi_\\theta}[r(s,a)]$, derive $\\nabla_\\theta J$ using the log-derivative trick. Then show that subtracting a baseline $b(s)$ that does not depend on the action leaves the gradient unbiased, and say why it helps. Mention how the result extends to full trajectories.","hints":["Use $\\nabla\\pi=\\pi\\nabla\\log\\pi$.","For the baseline use $\\sum_a\\nabla\\pi(a\\mid s)=\\nabla1=0$."],"answer":"$\\nabla J=\\mathbb E[r\\nabla\\log\\pi]$; subtracting $b(s)$ adds $b(s)\\sum_a\\nabla\\pi(a|s)=0$, so it is unbiased but reduces variance.","answer_type":"free-text","solution":"$\\nabla_\\theta J=\\nabla_\\theta\\sum_a\\pi_\\theta(a\\mid s)r(s,a)=\\sum_a r(s,a)\\nabla_\\theta\\pi_\\theta(a\\mid s)=\\sum_a\\pi_\\theta(a\\mid s)\\,r(s,a)\\nabla_\\theta\\log\\pi_\\theta(a\\mid s)=\\mathbb E_{a\\sim\\pi}\\big[r(s,a)\\nabla_\\theta\\log\\pi_\\theta(a\\mid s)\\big]$. This can be estimated by sampling actions from the policy, with no need to differentiate the reward or the dynamics. Baseline: $\\mathbb E[b(s)\\nabla\\log\\pi(a\\mid s)]=b(s)\\sum_a\\nabla\\pi(a\\mid s)=b(s)\\nabla\\sum_a\\pi(a\\mid s)=b(s)\\nabla1=0$, so $\\mathbb E[(r-b)\\nabla\\log\\pi]=\\nabla J$. The estimator stays unbiased but its variance can be much smaller if $b(s)\\approx v_\\pi(s)$ (so that the advantage is centred); with all rewards positive, a plain REINFORCE update pushes up every sampled action. For trajectories, the policy gradient theorem gives $\\nabla J=\\mathbb E_\\pi\\big[\\sum_t\\nabla\\log\\pi(A_t\\mid S_t)\\,(G_t-b(S_t))\\big]$ using reward-to-go, and actor-critic replaces $G_t-b$ by a learned advantage or TD error. Trap: letting the baseline depend on the action $a$; that breaks unbiasedness unless corrected.","category":"rl","kind":"derivation","difficulty":"medium","tags":["policy gradient","baseline","log-derivative trick","variance reduction"],"origin":"original","status":"self-marked"},{"id":"m-rl-bellman-contraction","title":"Prove the Bellman optimality operator is a contraction","prompt":"Show that the Bellman optimality operator $(Tq)(s,a)=r(s,a)+\\gamma\\sum_{s'}p(s'\\mid s,a)\\max_{b}q(s',b)$ is a $\\gamma$-contraction in the sup norm, and explain what that implies for value iteration and for Q-learning.","hints":["First prove $|\\max_bx_b-\\max_by_b|\\le\\max_b|x_b-y_b|$."],"answer":"$\\|Tq-Tq'\\|_\\infty\\le\\gamma\\|q-q'\\|_\\infty$, so $T$ has a unique fixed point $q^*$ and value iteration converges geometrically.","answer_type":"free-text","solution":"Lemma: $\\max_bx_b\\le\\max_by_b+\\max_b|x_b-y_b|$ and symmetrically, so $|\\max_bx_b-\\max_by_b|\\le\\max_b|x_b-y_b|$. Then, for any $(s,a)$: $|(Tq)(s,a)-(Tq')(s,a)|=\\gamma\\big|\\sum_{s'}p(s'\\mid s,a)\\big(\\max_bq(s',b)-\\max_bq'(s',b)\\big)\\big|\\le\\gamma\\sum_{s'}p(s'\\mid s,a)\\max_b|q(s',b)-q'(s',b)|\\le\\gamma\\|q-q'\\|_\\infty$. Taking the maximum over $(s,a)$ gives $\\|Tq-Tq'\\|_\\infty\\le\\gamma\\|q-q'\\|_\\infty$. By the Banach fixed point theorem, $T$ has a unique fixed point, $q^*$, and $\\|T^kq-q^*\\|_\\infty\\le\\gamma^k\\|q-q^*\\|_\\infty$: value iteration converges at a geometric rate for $\\gamma<1$ from any initialisation. Q-learning is a stochastic-approximation version of the same fixed-point iteration: with every state-action pair visited infinitely often and Robbins-Monro step sizes ($\\sum\\alpha=\\infty$, $\\sum\\alpha^2<\\infty$) the noise averages out and it converges to $q^*$. Intuition: each application shrinks distances by $\\gamma$ because the future is discounted. Trap: the contraction needs $\\gamma<1$, and it holds in the sup norm, not necessarily in other norms.","category":"rl","kind":"derivation","difficulty":"medium","tags":["contraction","Bellman optimality","value iteration","Q-learning"],"origin":"original","status":"self-marked"},{"id":"m-rl-thompson-prob-calc","title":"Thompson sampling selection probability","prompt":"A two-armed Bernoulli bandit uses Thompson sampling with uniform $\\text{Beta}(1,1)$ priors. Arm 1 has been pulled 5 times with 2 successes and 3 failures; arm 2 has never been pulled. What is the probability that Thompson sampling selects arm 1 on the next step?","hints":["The posterior for arm 1 is $\\text{Beta}(3,4)$ and for arm 2 is uniform. Compute $P(\\theta_1>\\theta_2)$."],"answer":"3/7","answer_type":"numeric","answer_value":0.42857142857142855,"solution":"The posterior of arm 1 is $\\text{Beta}(1+2,1+3)=\\text{Beta}(3,4)$ and arm 2 remains $\\text{Beta}(1,1)=\\text{Uniform}(0,1)$. Thompson sampling draws $\\theta_1,\\theta_2$ and picks the larger. Since $P(\\theta_2<x)=x$, $P(\\theta_1>\\theta_2)=\\mathbb E[\\theta_1]=\\frac{3}{3+4}=\\frac37\\approx0.4286$. Intuition: arm 1 looks a bit below average, but the unexplored arm is optimistic enough that arm 1 is still chosen about 43% of the time. Trap: choosing deterministically by posterior mean ($0.43<0.5$ would always choose arm 2).","category":"rl","kind":"calculation","difficulty":"easy","tags":["Thompson sampling","Beta prior","bandits"],"origin":"in the style of COMP0089 2024 exam, Q1(b)","status":"verified","entry":"Enter the probability that Thompson sampling picks arm 1 next, as a probability between 0 and 1."},{"id":"m-rl-unreliable-corridor-value","title":"Value of a policy in a corridor with an unreliable action","prompt":"A corridor has three cells in a row, S, M and G, in that order. The only action considered is RIGHT, which moves the agent one cell to the right with probability $0.5$ and leaves it where it is with probability $0.5$. Entering G gives reward $+4$ and ends the episode; all other rewards are $0$. With $\\gamma=0.9$, what is $v(S)$ under the policy that always picks RIGHT?","hints":["Write $v(M)=0.5\\cdot4+0.5\\gamma v(M)$ first, then $v(S)=0.5\\gamma v(M)+0.5\\gamma v(S)$."],"answer":"2.975","answer_type":"numeric","answer_value":2.975206611570248,"solution":"Let $v_M=v(M)$. From M, with probability $0.5$ we reach G and receive $4$; otherwise we stay: $v_M=0.5\\cdot4+0.5\\gamma v_M$, so $v_M=\\frac{2}{1-0.45}=3.636$. From S: $v_S=0.5\\gamma v_M+0.5\\gamma v_S$, so $v_S=\\frac{0.45\\,v_M}{1-0.45}=\\frac{0.45\\times3.636}{0.55}=2.975$. Intuition: each of the two cells costs an expected $2$ steps and each step discounts by $0.9$, so the reward is worth about $4\\gamma^{\\text{(random steps)}}$. Trap: dropping the self-loop term and computing $4\\gamma^2/2^2$.","category":"rl","kind":"calculation","difficulty":"medium","tags":["value function","Bellman equation","stochastic transitions"],"origin":"in the style of COMP0089 2024 exam, Q2(b)","status":"verified","entry":"Enter $v(S)$, the discounted value of the start cell under the always-RIGHT policy."},{"id":"m-rl-dqn-diverges","title":"Scenario: deep Q-learning that diverges","prompt":"You are training a DQN on a new environment. The loss keeps growing, Q-values reach $10^6$ and the policy is worse than random. What is happening in theory, and what would you check and change?","hints":["Think of the 'deadly triad' and what the target network and the replay buffer address."],"answer":"The deadly triad (function approximation, bootstrapping, off-policy data) can diverge. Add target networks, replay, reward clipping or Huber loss, lower learning rate, double Q-learning and check for bugs.","answer_type":"free-text","solution":"In theory, combining function approximation, bootstrapping and off-policy updates (the deadly triad) can make the semi-gradient Q-learning update unstable, because the target moves with the weights and the update is not the gradient of any fixed objective. Overestimation from the max operator also compounds. Checklist: (1) bugs first: the discount, terminal-state masking, reward scale, and whether the target is detached; (2) use a target network updated slowly (or Polyak averaging) to stabilise targets; (3) experience replay with enough decorrelated data and a sufficiently large buffer;
