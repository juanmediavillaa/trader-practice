 and a mislabelled point can dominate later rounds. The sum $\\frac1n\\sum_ie^{-y_if}$ is also exactly the normaliser that AdaBoost's weights track, which is how the derivation in the AdaBoost question works. It is also the reason the noisy-label scenario favours a random forest. Trap: thinking the exponential loss is bounded like the 0-1 loss.","category":"sl","kind":"basics","difficulty":"easy","tags":["exponential loss","surrogate loss","AdaBoost","margin"],"origin":"original","status":"self-marked","leads_to":["m-sl-adaboost-exp-loss","m-sl-boosting-vs-bagging-noise","m-sl-adaboost-weight-update"]},{"id":"m-sl-f-adaboost-alpha-10","title":"Weighted error and the AdaBoost coefficient","prompt":"AdaBoost is running on four points with current weights $D=(0.4,0.3,0.2,0.1)$. A weak classifier $h$ gets points 1 and 2 right and misclassifies points 3 and 4. Compute its weighted error $\\epsilon$ and its coefficient $\\alpha=\\tfrac12\\ln\\frac{1-\\epsilon}{\\epsilon}$.","hints":["$\\epsilon$ is the total weight of the misclassified points, not the fraction of them."],"answer":"$\\epsilon=0.3$ and $\\alpha=\\tfrac12\\ln(7/3)\\approx0.4236$.","answer_type":"numeric","answer_value":0.4236,"solution":"The misclassified points carry weight $0.2+0.1=0.3$, so $\\epsilon=0.3$ (note the unweighted error rate would be $0.5$, which is misleading). Then $\\alpha=\\tfrac12\\ln\\frac{0.7}{0.3}=\\tfrac12\\ln2.333\\approx0.4236$. $\\alpha$ is positive whenever $\\epsilon<\\tfrac12$, grows as $\\epsilon$ shrinks, and is $0$ at $\\epsilon=\\tfrac12$, so a coin-flip classifier gets no vote. In the 'one round by hand' question this $\\alpha$ feeds the update $D_i\\leftarrow D_ie^{\\mp\\alpha}/Z$, and in the derivation question you show that this $\\alpha$ minimises the exponential loss along the chosen direction $h_{t+1}$. Trap: using the plain error rate rather than the weighted one.","category":"sl","kind":"basics","difficulty":"easy","tags":["AdaBoost","weighted error","alpha"],"origin":"original","status":"verified","leads_to":["m-sl-adaboost-weight-update","m-sl-adaboost-exp-loss"],"entry":"Enter the coefficient $\\alpha=\\tfrac12\\ln\\frac{1-\\epsilon}{\\epsilon}$ (work out $\\epsilon$ too; the solution covers it)."},{"id":"m-sl-f-stump-xor-11","title":"Can a decision stump beat a coin flip on XOR?","prompt":"Four points in the plane with uniform weights $1/4$: $(0,0)\\mapsto-1$, $(1,1)\\mapsto-1$, $(0,1)\\mapsto+1$, $(1,0)\\mapsto+1$. A decision stump thresholds one coordinate and may output either sign on each side, e.g. 'predict $+1$ if $x_1>0.5$ else $-1$'. What is the smallest weighted error any stump can achieve here? Does this satisfy the weak-learning condition (error strictly below $1/2$)?","hints":["Try the stump on $x_1$ and count the two mistakes; then try its negation and the stumps on $x_2$."],"answer":"$0.5$; no, the weak-learning condition fails.","answer_type":"numeric","answer_value":0.5,"solution":"Take the stump 'predict $+1$ if $x_1>0.5$'. It is right on $(0,0)$ and $(1,0)$ and wrong on $(1,1)$ and $(0,1)$, so its error is $2/4=0.5$. Flipping its sign gives the same $0.5$, and the same holds for stumps on $x_2$ and for constant classifiers, so the minimum is exactly $0.5$ and the weak-learning condition (strictly below $1/2$) fails. The labels are XOR of the two coordinates, so no single coordinate carries any information. This is the starting point of the stumps-and-weak-universality question: you ask whether, for every weighting $D$, some stump beats $1/2$, and the uniform XOR case is the counterexample for a class of axis-aligned stumps (AdaBoost cannot even start on it). Trap: concluding that boosting stumps can never solve XOR; with non-uniform weights the stumps do get below $1/2$ and then the combination works.","category":"sl","kind":"basics","difficulty":"easy","tags":["decision stumps","weak learner","XOR","AdaBoost"],"origin":"original","status":"verified","leads_to":["m-sl-stumps-xor-weak-universal","m-sl-adaboost-exp-loss"],"entry":"Enter the smallest weighted error any stump can achieve (work out the weak-learning question too; the solution covers it)."},{"id":"m-sl-f-halving-mistakes-12","title":"Halving algorithm: counting mistakes","prompt":"In the online mistake-bound model the target is some hypothesis in a finite class $\\mathcal H$ with $|\\mathcal H|=64$, and the learner sees points one at a time. The halving algorithm predicts by majority vote of the hypotheses still consistent with all past labels, and then discards the inconsistent ones. (a) Why does each mistake at least halve the number of surviving hypotheses? (b) What is the maximum number of mistakes it can make here?","hints":["If the majority vote is wrong, at least half of the survivors voted wrongly.","The target is never discarded, so at least one hypothesis always survives."],"answer":"(a) A wrong majority means at least half the survivors were wrong and are removed. (b) At most $\\log_2 64=6$ mistakes.","answer_type":"numeric","answer_value":6.0,"solution":"(a) When the halving algorithm errs, the majority of the surviving hypotheses predicted the wrong label, so at least half of them are inconsistent with the true label and are removed. (b) After $m$ mistakes at most $64/2^m$ hypotheses survive, and the target always survives, so $64/2^m\\ge1$, giving $m\\le\\log_2|\\mathcal H|=6$. The weak point is that it only learns on mistakes: on correct trials the version space can barely shrink. That is the passive-versus-aggressive distinction in the exam question, where an aggressive variant also updates on every trial and you compare the resulting bounds. Halving is also a hard-vote version of Hedge's weighted vote: Hedge down-weights instead of deleting, which is what lets fixed share cope with a target that changes. Trap: using $\\log_2|\\mathcal H|-1$ or counting the final correct trials as mistakes.","category":"sl","kind":"basics","difficulty":"easy","tags":["halving","mistake bound","online learning"],"origin":"original","status":"verified","leads_to":["m-sl-passive-aggressive-online","m-sl-fixed-share-drift","m-sl-ogd-regret"],"entry":"Enter the maximum number of mistakes the halving algorithm can make here (part (a) is explanation; the solution covers it)."},{"id":"m-pul-f-bayes-rule-01","title":"Bayes' rule with a prior, a likelihood and a normaliser","prompt":"A disease affects $1\\%$ of people. A test is positive for $90\\%$ of the sick and for $5\\%$ of the healthy. A random person tests positive. Compute $P(\\text{sick}\\mid +)$.","hints":["Posterior $\\propto$ prior $\\times$ likelihood. Compute the two unnormalised terms, then divide by their sum."],"answer":"$\\approx0.154$","answer_type":"numeric","answer_value":0.153846,"solution":"Unnormalised posterior weights are sick: $0.01\\times0.9=0.009$ and healthy: $0.99\\times0.05=0.0495$. Their sum $0.0585$ is the evidence $P(+)$, so $P(\\text{sick}\\mid+)=0.009/0.0585\\approx0.154$. The prior is small, so even a good test leaves the posterior low. This 'multiply prior by likelihood, then normalise' pattern is the engine behind everything in this course: conjugate priors are the cases where the product has the same form as the prior, filtering in an HMM is repeated application of this step, and the unknown-upper-limit question is the same recipe with a continuous parameter. Trap: reporting the test sensitivity $0.9$ as if it were the posterior.","category":"pul","kind":"basics","difficulty":"easy","tags":["Bayes rule","posterior","evidence"],"origin":"original","status":"verified","leads_to":["m-pul-sticky-coin-hmm-posterior","m-pul-uniform-pareto-conjugate","m-pul-conjugate-regression-unknown-variance"],"entry":"Enter $P(\\text{sick}\\mid +)$ as a probability between 0 and 1, not a percentage."},{"id":"m-pul-f-beta-bernoulli-02","title":"A conjugate update: Beta prior, Bernoulli data","prompt":"A coin has unknown heads probability $\\theta$ with prior $\\theta\\sim\\mathrm{Beta}(2,2)$, whose density is proportional to $\\theta^{a-1}(1-\\theta)^{b-1}$ with $a=b=2$. You observe $3$ heads and $1$ tail. Write the posterior and compute its mean.","hints":["Likelihood $\\propto\\theta^{3}(1-\\theta)^{1}$. Multiply by the prior and read off the new exponents."],"answer":"Posterior $\\mathrm{Beta}(5,3)$, mean $5/8=0.625$.","answer_type":"numeric","answer_value":0.625,"solution":"Posterior $\\propto\\theta^{3}(1-\\theta)^{1}\\cdot\\theta^{1}(1-\\theta)^{1}=\\theta^{4}(1-\\theta)^{2}$, which is $\\mathrm{Beta}(5,3)$ with mean $5/(5+3)=0.625$. The prior is conjugate because the product of prior and likelihood is again of the prior's form: the parameters just add counts ($a\\to a+\\#\\text{heads}$, $b\\to b+\\#\\text{tails}$), so $a,b$ act as pseudo-counts. Conjugacy is the definition you need in the conjugate-prior questions, both for a regression weight vector with known noise variance and for the Pareto prior on a uniform upper limit, where the likelihood has the form $\\theta^{-n}$ and a prior of power-law form multiplies into another power law. Trap: forgetting that the exponents are $a-1$ and $b-1$, not $a$ and $b$.","category":"pul","kind":"basics","difficulty":"easy","tags":["conjugate prior","Beta","Bernoulli"],"origin":"original","status":"verified","leads_to":["m-pul-uniform-pareto-conjugate","m-pul-conjugate-regression-unknown-variance"],"entry":"Enter the posterior mean of $\\theta$ (work out the posterior distribution too; the solution covers it)."},{"id":"m-pul-f-uniform-likelihood-03","title":"The likelihood of a uniform upper limit","prompt":"A device outputs $t\\sim\\mathrm{Uniform}(0,\\theta)$, with density $1/\\theta$ on $[0,\\theta]$ and $0$ elsewhere. You observe $t=(0.3,\\,1.2,\\,0.7)$. (a) What is the likelihood $L(\\theta)$ for $\\theta<1.2$? (b) For $\\theta\\ge1.2$, how does it depend on $\\theta$, and what is the maximum-likelihood estimate? (c) Compute $L(2.4)/L(1.2)$.","hints":["Each observation contributes a factor $\\frac1\\theta\\mathbf 1[t_i\\le\\theta]$."],"answer":"$L=0$ below $1.2$; $L=\\theta^{-3}$ above; MLE $=1.2$; ratio $=0.125$.","answer_type":"numeric","answer_value":0.125,"solution":"The likelihood is $L(\\theta)=\\prod_i\\frac1\\theta\\mathbf 1[t_i\\le\\theta]=\\theta^{-n}\\,\\mathbf 1[\\theta\\ge\\max_it_i]$. For $\\theta<1.2$ it is $0$ because the point $1.2$ would be impossible; for $\\theta\\ge1.2$ it is $\\theta^{-3}$, which decreases, so the maximum is at the boundary, $\\hat\\theta=\\max_it_i=1.2$. The ratio is $(1.2/2.4)^3=0.125$. Notice that the data enter only through $n$ and the maximum, and that the likelihood is a power law in $\\theta$. That is why a Pareto prior ($\\propto\\theta^{-(\\alpha+1)}$ on $\\theta\\ge\\theta_0$) is conjugate in the uniform-upper-limit question: the posterior is again Pareto with $n$ added to the shape and the scale replaced by $\\max(\\theta_0,\\max_it_i)$. Trap: treating the likelihood as peaked at some interior value, or forgetting the indicator.","category":"pul","kind":"basics","difficulty":"easy","tags":["likelihood","uniform","MLE","Pareto"],"origin":"original","status":"verified","leads_to":["m-pul-uniform-pareto-conjugate"],"entry":"Enter the ratio $L(2.4)/L(1.2)$ (work out parts (a) and (b) too; the solution covers them)."},{"id":"m-pul-f-hmm-filter-04","title":"One filtering step in a hidden Markov model","prompt":"Two coins A and B have $P(\\text{heads})=0.9$ and $0.1$. At step 1 you know the coin is A. At each later step the chain keeps the same coin with probability $0.8$ and switches with probability $0.2$. At step 2 you see tails. Compute $P(\\text{coin}_2=A\\mid \\text{tails at step 2})$.","hints":["Predict first: $P(\\text{coin}_2=A)=0.8$, $P(\\text{coin}_2=B)=0.2$. Then apply Bayes' rule with the tails likelihoods."],"answer":"$0.08/0.26\\approx0.308$","answer_type":"numeric","answer_value":0.307692,"solution":"Filtering has two stages. Predict: push the old belief through the transition matrix, giving $(0.8,0.2)$ for (A,B). Update: multiply by the likelihood of the observation and normalise. Tails has likelihood $0.1$ under A and $0.9$ under B, so the unnormalised values are $0.08$ and $0.18$ and $P(A\\mid\\text{tails})=0.08/0.26\\approx0.308$. A single tails is strong enough evidence to overturn the sticky prior. This predict/update loop is the whole forward algorithm and is what the sticky two-coin question asks you to run for more steps; the Kalman filter is the same loop with Gaussians, and a missing observation simply means you skip the update step. Trap: updating with the observation but forgetting to apply the transition first.","category":"pul","kind":"basics","difficulty":"easy","tags":["HMM","filtering","forward algorithm"],"origin":"original","status":"verified","leads_to":["m-pul-sticky-coin-hmm-posterior","m-pul-kalman-missing-outliers"],"entry":"Enter $P(\\text{coin}_2=A\\mid \\text{tails at step 2})$ as a probability between 0 and 1."},{"id":"m-pul-f-mutual-information-05","title":"Mutual information of two perfectly correlated bits","prompt":"Mutual information is $I(X;Y)=\\sum_{x,y}d(x,y)\\ln\\frac{d(x,y)}{d(x)d(y)}$. Two binary variables have $d(0,0)=d(1,1)=0.5$ and $d(0,1)=d(1,0)=0$. Compute $I(X;Y)$ in nats. What would it be if instead all four cells had probability $0.25$?","hints":["Both marginals are $(0.5,0.5)$. Terms with $d(x,y)=0$ contribute $0$."],"answer":"$\\ln2\\approx0.693$ nats; $0$ in the independent case.","answer_type":"numeric","answer_value":0.693147,"solution":"Each nonzero cell has $d(x,y)=0.5$ and $d(x)d(y)=0.25$, so each contributes $0.5\\ln2$ and the total is $\\ln2\\approx0.693$ nats: knowing $X$ tells you the full one bit about $Y$. If all cells are $0.25$ the joint equals the product of marginals, every log is $\\ln1=0$ and $I=0$. $I(X;Y)=\\mathrm{KL}\\big(d(x,y)\\,\\|\\,d(x)d(y)\\big)\\ge0$ measures how far the pair is from independence. In the Chow-Liu question you show that the maximum-likelihood tree maximises the sum of $I(x_i;x_j)$ over its edges, so these numbers are the edge weights of a maximum-weight spanning tree, and the 'mutual information of two binary variables' calculation is this same formula with noisier counts. Trap: using $\\log_2$ when nats are asked, or including $0\\ln0$ terms as if they were undefined.","category":"pul","kind":"basics","difficulty":"easy","tags":["mutual information","KL divergence","Chow-Liu"],"origin":"original","status":"verified","leads_to":["m-pul-mutual-information-binary","m-pul-chow-liu-trees"],"entry":"Enter $I(X;Y)$ in nats for the first distribution, with mass only on the diagonal (work out the independent case too)."},{"id":"m-pul-f-free-energy-gap-06","title":"The free energy lower-bounds the log likelihood","prompt":"For one observation $x$ a latent variable $z\\in\\{1,2\\}$ has $P(x,z=1)=0.1$ and $P(x,z=2)=0.4$. Take $q(z)=(0.5,0.5)$ and the free energy $F=\\sum_zq(z)\\big[\\ln P(x,z)-\\ln q(z)\\big]$. Compute $\\ln P(x)$, $F$ and the gap $\\ln P(x)-F$. What is the gap in terms of $q$ and the posterior $P(z\\mid x)$?","hints":["$P(x)=\\sum_zP(x,z)$ and $P(z\\mid x)=P(x,z)/P(x)=(0.2,0.8)$."],"answer":"$\\ln P(x)=-0.693$, $F=-0.916$, gap $=0.223=\\mathrm{KL}(q\\,\\|\\,P(z\\mid x))$.","answer_type":"numeric","answer_value":0.2231,"solution":"The evidence is $P(x)=0.5$, so $\\ln P(x)=-0.693$. The free energy is $0.5\\ln\\frac{0.1}{0.5}+0.5\\ln\\frac{0.4}{0.5}=-0.805-0.112=-0.916$, so the gap is $0.223$. Writing $P(x,z)=P(x)P(z\\mid x)$ gives $F=\\ln P(x)-\\mathrm{KL}(q\\,\\|\\,P(z\\mid x))$, and indeed $\\mathrm{KL}\\big((0.5,0.5)\\|(0.2,0.8)\\big)=0.5\\ln2.5+0.5\\ln0.625=0.223$. Hence $F\\le\\ln P(x)$ always, with equality iff $q$ equals the posterior. That is exactly the E-step: set $q=P(z\\mid x,\\theta)$ to close the gap, then the M-step raises $F$ in $\\theta$. This identity is the starting point of the tempered-EM and EM-gradient questions. Trap: thinking the E-step changes $\\theta$; it only changes $q$.","category":"pul","kind":"basics","difficulty":"easy","tags":["EM","free energy","KL divergence","ELBO"],"origin":"original","status":"verified","leads_to":["m-pul-tempered-em","m-pul-em-gradient-direction"],"entry":"Enter the gap $\\ln P(x)-F$, in nats (work out $\\ln P(x)$ and $F$ too; the solution covers it)."},{"id":"m-pul-f-e-step-gmm-07","title":"E-step: responsibilities in a two-component mixture","prompt":"A one-dimensional mixture has two equally weighted components $\\mathcal N(0,1)$ and $\\mathcal N(3,1)$. For the data point $x=2$, compute the responsibility $r_1=P(z=1\\mid x)$ of the first component.","hints":["The shared constants $1/\\sqrt{2\\pi}$ and the equal weights cancel. Compare $e^{-(x-\\mu_k)^2/2}$ for the two components."],"answer":"$r_1=\\dfrac{1}{1+e^{1.5}}\\approx0.182$","answer_type":"numeric","answer_value":0.18243,"solution":"The unnormalised responsibilities are $e^{-(2-0)^2/2}=e^{-2}$ and $e^{-(2-3)^2/2}=e^{-0.5}$. So $r_1=e^{-2}/(e^{-2}+e^{-0.5})=1/(1+e^{1.5})\\approx0.182$ and $r_2\\approx0.818$: the point is closer to the second mean, so it is mostly assigned there. A responsibility is just the posterior over the latent label, which is Bayes' rule again: $r_k\\propto\\pi_k\\,\\mathcal N(x\\mid\\mu_k,\\sigma_k^2)$. These soft assignments are what the M-step uses as weights, which is the next basic question, and they are the quantities that become degenerate when a component collapses onto a single point in the 'EM keeps misbehaving' scenario. Trap: forgetting the mixing weights $\\pi_k$ when they are unequal.","category":"pul","kind":"basics","difficulty":"easy","tags":["EM","Gaussian mixture","responsibilities"],"origin":"original","status":"verified","leads_to":["m-pul-gmm-collapse-restarts","m-pul-mixture-linear-experts-mstep","m-pul-tempered-em"],"entry":"Enter the responsibility $r_1=P(z=1\\mid x)$ of the first component at $x=2$, as a probability between 0 and 1."},{"id":"m-pul-f-m-step-weighted-mean-08","title":"M-step: a responsibility-weighted mean","prompt":"Three points $x=(0,3,6)$ have responsibilities $r=(0.4,0.2,0.2)$ for component $k$. The M-step update for the mean of a Gaussian component is $\\mu_k=\\sum_nr_nx_n/\\sum_nr_n$. Compute $\\mu_k$, and say what the update becomes if all $r_n=1$.","hints":["Do not forget to divide by $\\sum_nr_n$, which is here less than $1$ (it is the 'effective number of points')."],"answer":"$\\mu_k=1.8/0.8=2.25$; with all $r_n=1$ it is the ordinary sample mean.","answer_type":"numeric","answer_value":2.25,"solution":"The numerator is $0.4\\cdot0+0.2\\cdot3+0.2\\cdot6=1.8$ and the denominator is $0.8$, so $\\mu_k=2.25$. With all $r_n=1$ it reduces to the sample mean. The weighted mean comes from maximising $\\sum_nr_n\\ln\\mathcal N(x_n\\mid\\mu,\\sigma^2)$: setting the derivative to zero gives $\\sum_nr_n(x_n-\\mu)=0$, so it is weighted maximum likelihood with the responsibilities fixed from the E-step. In the mixture-of-linear-experts question the same idea gives weighted least squares for each expert, with weights $r_{nk}$, and the gating parameters need a separate update. Trap: normalising by $N$ instead of by $\\sum_nr_n$.","category":"pul","kind":"basics","difficulty":"easy","tags":["EM","M-step","weighted maximum likelihood"],"origin":"original","status":"verified","leads_to":["m-pul-mixture-linear-experts-mstep","m-pul-gmm-collapse-restarts","m-pul-em-gradient-direction"],"entry":"Enter the updated mean $\\mu_k$ (work out the all-$r_n=1$ case too; the solution covers it)."},{"id":"m-pul-f-fa-posterior-09","title":"Factor analysis posterior in one dimension","prompt":"Factor analysis: $y\\sim\\mathcal N(0,1)$ and $x\\mid y\\sim\\mathcal N(Ay,\\Psi)$. In the scalar case with $A=2$ and $\\Psi=1$: (a) what is $\\mathrm{Var}(x)$? (b) The posterior $y\\mid x$ is Gaussian with mean $\\beta x$ where $\\beta=A(A^2+\\Psi)^{-1}$ and variance $\\Sigma=1-\\beta A$. Compute $\\beta$ and $\\Sigma$.","hints":["The marginal covariance of $x$ is $AA^\\top+\\Psi$, here a single number."],"answer":"$\\mathrm{Var}(x)=5$, $\\beta=0.4$ and posterior variance $\\Sigma=0.2$.","answer_type":"numeric","answer_value":0.2,"solution":"The marginal is $x\\sim\\mathcal N(0,AA^\\top+\\Psi)$, so $\\mathrm{Var}(x)=4+1=5$. Then $\\beta=2/5=0.4$, the posterior mean is $0.4\\,x$, and $\\Sigma=1-\\beta A=1-0.8=0.2$, smaller than the prior variance $1$ because observing $x$ is informative. Equivalently $\\Sigma=\\Psi/(A^2+\\Psi)$, which also gives $0.2$. The posterior covariance does not depend on $x$, only the mean does, and the averaged second moment $\\Sigma+\\beta xx^\\top\\beta^\\top$ is exactly the quantity that the factor-analysis identity question shows averages to the identity at a fixed point. It also shows the difference between PCA, PPCA and FA: FA lets $\\Psi$ be a general diagonal matrix, PPCA forces $\\Psi=\\sigma^2I$, and PCA is the $\\sigma^2\\to0$ limit. Trap: writing the posterior variance as $1/A^2$ and ignoring noise.","category":"pul","kind":"basics","difficulty":"easy","tags":["factor analysis","PPCA","Gaussian conditioning"],"origin":"original","status":"verified","leads_to":["m-pul-fa-latent-covariance-identity","m-pul-pca-ppca-fa-differences"],"entry":"Enter the posterior variance $\\Sigma$ of $y\\mid x$ (work out $\\mathrm{Var}(x)$ and $\\beta$ too; the solution covers it)."},{"id":"m-pul-f-linear-model-gp-10","title":"A Bayesian linear model is a GP with kernel $\\phi(t)^\\top\\phi(t')$","prompt":"Let $f(t)=\\beta^\\top\\phi(t)$ with $\\beta\\sim\\mathcal N(0,s^2I)$ and $\\phi(t)=\\big(\\cos\\frac{2\\pi t}{p},\\,\\sin\\frac{2\\pi t}{p}\\big)^\\top$. Show that $\\mathrm{Cov}\\big(f(t),f(t')\\big)=s^2\\phi(t)^\\top\\phi(t')$, simplify it, and evaluate it for $s^2=4$, $p=12$, $t=5$, $t'=3$.","hints":["$\\mathrm{Cov}(\\beta^\\top a,\\beta^\\top b)=a^\\top\\mathrm{Cov}(\\beta)\\,b$.","$\\cos a\\cos b+\\sin a\\sin b=\\cos(a-b)$."],"answer":"$s^2\\cos\\!\\big(2\\pi(t-t')/p\\big)$, which equals $4\\cos(\\pi/3)=2$.","answer_type":"numeric","answer_value":2.0,"solution":"Since $\\mathbb E[\\beta]=0$, $\\mathrm{Cov}(f(t),f(t'))=\\mathbb E[\\phi(t)^\\top\\beta\\beta^\\top\\phi(t')]=\\phi(t)^\\top\\,s^2I\\,\\phi(t')=s^2\\phi(t)^\\top\\phi(t')$. With the given features this is $s^2(\\cos a\\cos b+\\sin a\\sin b)=s^2\\cos\\frac{2\\pi(t-t')}{p}$. At $t-t'=2$, $p=12$ the angle is $\\pi/3$ and the value is $4\\cdot0.5=2$. The result depends only on $t-t'$ and repeats with period $p$, so the function values at times a full period apart are perfectly correlated. This is how the periodic kernel questions work: a Gaussian prior over weights of a finite feature map gives a GP kernel $\\phi(t)^\\top\\Sigma\\phi(t')$, which is automatically valid because it is an inner product of features. Trap: forgetting the prior variance $s^2$.","category":"pul","kind":"basics","difficulty":"easy","tags":["Gaussian process","kernel","Bayesian linear model","periodic"],"origin":"original","status":"verified","leads_to":["m-pul-periodic-gp-kernels","m-pul-conjugate-regression-unknown-variance"],"entry":"Enter the numerical value of $\\mathrm{Cov}\\big(f(5),f(3)\\big)$ for $s^2=4$, $p=12$."},{"id":"m-pul-f-is-variance-11","title":"Importance sampling: the variance of one weighted sample","prompt":"We want $\\mathbb E_p[f]$ for $x\\in\\{0,1\\}$, $p=(0.8,0.2)$ and $f(x)=x$. We sample from $q=(0.5,0.5)$ and use the single-sample estimate $W=f(x)\\,p(x)/q(x)$. Compute $\\mathbb E_q[W]$ and $\\mathrm{Var}_q[W]$. What proposal would give zero variance?","hints":["$W=0$ when $x=0$ and $W=1\\cdot0.2/0.5=0.4$ when $x=1$, each with probability $\\tfrac12$.","Variance $=\\mathbb E[W^2]-\\mathbb E[W]^2$."],"answer":"$\\mathbb E_q[W]=0.2$ (unbiased), $\\mathrm{Var}_q[W]=0.04$; $q\\propto|f|\\,p$ gives zero variance.","answer_type":"numeric","answer_value":0.04,"solution":"$W$ takes the values $0$ and $0.4$ with probability $\\tfrac12$ each, so $\\mathbb E_q[W]=0.2=\\mathbb E_p[f]$ (importance sampling is unbiased) and $\\mathbb E_q[W^2]=0.08$, giving $\\mathrm{Var}_q[W]=0.08-0.04=0.04$. With $m$ samples the variance of the average is $0.04/m$. The proposal $q^*\\propto|f|\\,p$ puts all mass on $x=1$, so $W\\equiv0.2$ is constant and the variance is zero, though in practice it needs the very integral you are trying to compute. This is the calculation to generalise in the importance-sampling question: $\\mathrm{Var}=\\frac1m(\\mathbb E_q[f^2p^2/q^2]-\\mathbb E_p[f]^2)$, and the optimal $q$ makes $|f|p/q$ constant. Trap: using $p$ rather than $q$ to average the weights, or forgetting that $q$ must cover the support of $fp$.","category":"pul","kind":"basics","difficulty":"easy","tags":["importance sampling","variance","proposal"],"origin":"original","status":"verified","leads_to":["m-pul-importance-sampling-optimal-q"],"entry":"Enter $\\mathrm{Var}_q[W]$, the variance of the single-sample estimate (work out $\\mathbb E_q[W]$ and the zero-variance proposal too)."},{"id":"m-pul-f-mh-acceptance-12","title":"Metropolis-Hastings acceptance for a symmetric proposal","prompt":"The target is $p=\\mathcal N(0,1)$ and the random-walk proposal is symmetric. The chain is at $y=1$ and proposes $z=2$. Compute the acceptance probability $\\min\\{1,p(z)/p(y)\\}$. Then say what happens to typical acceptance probabilities as the dimension $D$ grows if the step size $\\tau$ is kept fixed.","hints":["Only the ratio of densities matters, so the normalising constant cancels: $p(z)/p(y)=\\exp\\!\\big(-(z^2-y^2)/2\\big)$."],"answer":"$e^{-1.5}\\approx0.223$. Acceptance collapses as $D$ grows with fixed $\\tau$.","answer_type":"numeric","answer_value":0.22313,"solution":"$p(z)/p(y)=\\exp(-(4-1)/2)=e^{-1.5}\\approx0.223$, which is below $1$, so the move is accepted with probability $0.223$ (a move to higher density would be accepted for sure). Because the proposal is symmetric the Hastings correction $q(y\\mid z)/q(z\\mid y)$ equals $1$, and the unknown normalising constant cancels, which is why MH works for unnormalised targets. In $D$ dimensions with $z=y+\\tau\\varepsilon$ the expected log ratio is $-D\\tau^2/(2\\sigma^2)$, so the log ratio drifts down linearly in $D$ and acceptance falls exponentially unless $\\tau\\propto1/\\sqrt D$. That scaling is the content of the step-size and dimension exam question. Trap: assuming a smaller acceptance rate always means the chain is badly tuned; too high an acceptance with tiny steps also mixes slowly.","category":"pul","kind":"basics","difficulty":"easy","tags":["Metropolis-Hastings","MCMC","acceptance probability"],"origin":"original","status":"verified","leads_to":["m-pul-mh-gaussian-dimension","m-pul-importance-sampling-optimal-q"],"entry":"Enter the acceptance probability for the move from $y=1$ to $z=2$, as a probability (work out the dimension question too)."},{"id":"m-ai-f-kl-direction-01","title":"KL divergence is not symmetric","prompt":"$\\mathrm{KL}(q\\,\\|\\,p)=\\sum_zq(z)\\ln\\frac{q(z)}{p(z)}$. For two distributions on $\\{0,1\\}$, $q=(0.5,0.5)$ and $p=(0.9,0.1)$, compute $\\mathrm{KL}(q\\,\\|\\,p)$. Is $\\mathrm{KL}(p\\,\\|\\,q)$ the same? (Compute it too.)","hints":["$\\ln(0.5/0.9)\\approx-0.588$ and $\\ln(0.5/0.1)\\approx1.609$."],"answer":"$\\mathrm{KL}(q\\|p)\\approx0.511$, while $\\mathrm{KL}(p\\|q)\\approx0.368$, so they differ.","answer_type":"numeric","answer_value":0.510826,"solution":"$\\mathrm{KL}(q\\|p)=0.5\\ln\\frac{0.5}{0.9}+0.5\\ln\\frac{0.5}{0.1}=0.5(-0.588)+0.5(1.609)\\approx0.511$. In the other direction $\\mathrm{KL}(p\\|q)=0.9\\ln1.8+0.1\\ln0.2\\approx0.529-0.161=0.368$. Both are non-negative and zero only when $q=p$, but they weigh errors differently: $\\mathrm{KL}(q\\|p)$ averages under $q$, so it is infinite if $q$ puts mass where $p$ has none and ignores places $q$ avoids (mode-seeking); $\\mathrm{KL}(p\\|q)$ averages under $p$ and punishes $q$ for missing any region $p$ covers (mass-covering). Variational Bayes minimises the first form and expectation propagation locally minimises the second, which is the heart of the EP-versus-VB question; the VAE's KL term is also $\\mathrm{KL}(q\\|p)$ against the prior. Trap: swapping the two arguments.","category":"ai","kind":"basics","difficulty":"easy","tags":["KL divergence","variational inference","asymmetry"],"origin":"original","status":"verified","leads_to":["m-ai-ep-vs-vb-kl-direction","m-ai-vae-posterior-collapse","m-ai-linear-vae-ppca"],"entry":"Enter $\\mathrm{KL}(q\\,\\|\\,p)$ in nats (work out $\\mathrm{KL}(p\\,\\|\\,q)$ too; the solution covers it)."},{"id":"m-ai-f-jensen-gap-02","title":"Log of a mean versus mean of the logs (Jensen)","prompt":"Two importance weights are $w_1=1$ and $w_2=16$. Compute $\\ln\\big(\\tfrac12(w_1+w_2)\\big)$ and $\\tfrac12(\\ln w_1+\\ln w_2)$, and the difference. Which is larger, and why does Jensen's inequality say it must be?","hints":["$\\ln$ is concave, so $\\ln(\\mathbb E[w])\\ge\\mathbb E[\\ln w]$."],"answer":"$\\ln8.5=2.140$ versus $\\ln4=1.386$; the gap is $0.754$.","answer_type":"numeric","answer_value":0.753772,"solution":"The log of the mean is $\\ln8.5\\approx2.140$ and the mean of the logs is $\\tfrac12\\ln16=\\ln4\\approx1.386$, so the gap is $0.754$ and the log of the mean is larger. Because $\\ln$ is concave, $\\ln\\mathbb E[w]\\ge\\mathbb E[\\ln w]$, with equality only if $w$ is constant; the more spread out the weights the larger the gap. With $w=p(x,z)/q(z)$ the left side estimates the log evidence $\\ln p(x)$ and the right side is the ELBO, so the ELBO is always a lower bound and the gap is the cost of a variable weight. The importance-weighted bound averages $K$ weights inside the log, which shrinks the spread and hence the gap, and the IWAE-versus-ELBO calculation compares exactly these two quantities. Trap: swapping the order and thinking the ELBO overshoots the evidence.","category":"ai","kind":"basics","difficulty":"easy","tags":["Jensen's inequality","ELBO","importance weights"],"origin":"original","status":"verified","leads_to":["m-ai-iwae-vs-elbo-estimate","m-ai-iwae-bound"],"entry":"Enter the difference $\\ln\\big(\\tfrac12(w_1+w_2)\\big)-\\tfrac12(\\ln w_1+\\ln w_2)$, in nats (work out the two terms too)."},{"id":"m-ai-f-weight-variance-03","title":"Importance weights: unbiased evidence, variance depends on the proposal","prompt":"For one observation $x$ a latent $z\\in\\{1,2\\}$ has $P(x,z=1)=0.1$ and $P(x,z=2)=0.4$. Draw $z\\sim q=(0.5,0.5)$ and set $w=P(x,z)/q(z)$. (a) Find $\\mathbb E_q[w]$ and relate it to $P(x)$. (b) Compute $\\mathrm{Var}_q[w]$. (c) Which $q$ would make $w$ constant?","hints":["$w$ takes the values $0.2$ (if $z=1$) and $0.8$ (if $z=2$), each with probability $\\tfrac12$."],"answer":"$\\mathbb E_q[w]=0.5=P(x)$; $\\mathrm{Var}_q[w]=0.09$; $q(z)=P(z\\mid x)=(0.2,0.8)$ makes $w\\equiv0.5$.","answer_type":"numeric","answer_value":0.09,"solution":"$\\mathbb E_q[w]=\\sum_zq(z)\\frac{P(x,z)}{q(z)}=\\sum_zP(x,z)=P(x)=0.5$, so a single weight is an unbiased estimate of the evidence. Its variance is $0.5(0.04+0.64)-0.25=0.09$. If instead $q(z)=P(z\\mid x)=(0.2,0.8)$, then $w=P(x,z)/P(z\\mid x)=P(x)=0.5$ for every $z$ and the variance is zero, so the best proposal is the exact posterior. Variational inference tries to move $q$ towards that posterior; the importance-weighted bound and the particle filter use many weighted samples, and how well they work depends on how variable these weights are (the particle-filter weight variance question is the same calculation with the transition density as proposal). Trap: believing unbiasedness of $w$ means $\\ln w$ is unbiased for $\\ln P(x)$, which is what the previous Jensen question rules out.","category":"ai","kind":"basics","difficulty":"easy","tags":["importance sampling","evidence","weight variance"],"origin":"original","status":"verified","leads_to":["m-ai-iwae-bound","m-ai-particle-filter-weight-variance","m-ai-iwae-vs-elbo-estimate"],"entry":"Enter $\\mathrm{Var}_q[w]$, the variance of the importance weight (work out $\\mathbb E_q[w]$ and the constant-weight $q$ too)."},{"id":"m-ai-f-gaussian-kl-04","title":"The VAE's KL term for a Gaussian encoder","prompt":"A VAE encoder outputs the one-dimensional posterior $q(z\\mid x)=\\mathcal N(\\mu,\\sigma^2)$ and the prior is $p(z)=\\mathcal N(0,1)$. The closed form is $\\mathrm{KL}(q\\|p)=\\tfrac12\\big(\\sigma^2+\\mu^2-1-\\ln\\sigma^2\\big)$. Compute it for $\\mu=1$ and $\\sigma^2=0.5$. What are $\\mu$ and $\\sigma^2$ when the KL is exactly zero?","hints":["$\\ln0.5\\approx-0.693$."],"answer":"$\\tfrac12(0.5+1-1+0.693)\\approx0.597$; zero iff $\\mu=0$, $\\sigma^2=1$.","answer_type":"numeric","answer_value":0.596574,"solution":"Substituting gives $\\tfrac12(0.5+1-1-\\ln0.5)=\\tfrac12(0.5+0.693)\\approx0.597$. The KL is zero exactly when $q=p$, i.e. $\\mu=0$ and $\\sigma^2=1$: the encoder ignores the input and outputs the prior. The ELBO is 'reconstruction minus KL', so the KL is a price paid for each dimension that carries information about $x$. If the decoder can model the data without $z$ (for example a very powerful autoregressive decoder), the cheapest solution is to set $q(z\\mid x)=p(z)$ for that dimension, which is posterior collapse; this is what a near-zero KL in the blurry-VAE scenario signals. In the linear VAE question the same KL, with a factorised Gaussian $q$, is what ties its solution to PPCA. Trap: using $\\sigma$ in place of $\\sigma^2$ in the formula.","category":"ai","kind":"basics","difficulty":"easy","tags":["VAE","KL divergence","posterior collapse","ELBO"],"origin":"original","status":"verified","leads_to":["m-ai-vae-posterior-collapse","m-ai-linear-vae-ppca","m-ai-iwae-bound"],"entry":"Enter $\\mathrm{KL}(q\\|p)$ in nats for $\\mu=1$, $\\sigma^2=0.5$ (work out when it is zero too; the solution covers it)."},{"id":"m-ai-f-laplace-gamma-05","title":"Laplace approximation: mode, curvature, variance","prompt":"A posterior over a rate $\\theta>0$ is proportional to $\\theta^{14}e^{-2\\theta}$. The Laplace approximation is a Gaussian centred at the mode with variance $\\big(-\\frac{d^2}{d\\theta^2}\\ln p(\\theta)\\big)^{-1}$ evaluated there. Find the mode and the Laplace variance.","hints":["$\\ln p=14\\ln\\theta-2\\theta+\\text{const}$. Set the first derivative to zero, then differentiate again."],"answer":"Mode $\\theta=7$; second derivative $-14/49=-2/7$; variance $=3.5$.","answer_type":"numeric","answer_value":3.5,"solution":"With $\\ln p=14\\ln\\theta-2\\theta$, the first derivative $14/\\theta-2$ vanishes at the mode $\\theta=7$. The second derivative is $-14/\\theta^2=-14/49=-2/7$, so the Laplace variance is $1/(2/7)=3.5$. The exact Gamma distribution (shape $15$, rate $2$) has variance $15/4=3.75$, close but not equal, because the Laplace approximation matches the local curvature at the mode and ignores skewness. The recipe is always: find the mode (MAP), compute the Hessian of the negative log posterior there, and invert it for the covariance; in higher dimensions that Hessian is a matrix. Trap: using the second derivative of the density itself rather than of its log, or forgetting the minus sign.","category":"ai","kind":"basics","difficulty":"easy","tags":["Laplace approximation","Gamma","curvature"],"origin":"original","status":"verified","leads_to":["m-ai-laplace-variance","m-ai-ep-vs-vb-kl-direction"],"entry":"Enter the Laplace variance (work out the mode too; the solution covers it)."},{"id":"m-ai-f-meanfield-gaussian-06","title":"Mean-field variational Bayes under-estimates correlated variances","prompt":"The true posterior is a bivariate Gaussian with unit variances and correlation $0.9$: $\\Sigma=\\begin{pmatrix}1&0.9\\\\0.9&1\\end{pmatrix}$. Mean-field VB (minimising $\\mathrm{KL}(q\\|p)$ over $q=q_1(z_1)q_2(z_2)$) gives $q_1$ variance equal to $1/\\Lambda_{11}$, where $\\Lambda=\\Sigma^{-1}$ is the precision matrix. Compute it and compare with the true marginal variance.","hints":["For a $2\\times2$ matrix, $\\Lambda_{11}=\\Sigma_{22}/\\det\\Sigma$ and $\\det\\Sigma=1-0.81$."],"answer":"$1/\\Lambda_{11}=0.19$, versus the true marginal variance $1$.","answer_type":"numeric","answer_value":0.19,"solution":"$\\det\\Sigma=1-0.81=0.19$ and $\\Lambda_{11}=\\Sigma_{22}/\\det\\Sigma=1/0.19$, so the mean-field variance is $0.19$: the factorised $q$ matches the conditional variance of $z_1$ given $z_2$ rather than the marginal variance $1$. The means are right but the uncertainty is badly under-estimated, because $\\mathrm{KL}(q\\|p)$ punishes putting mass where $p$ has little, so $q$ shrinks to fit inside the narrow correlated ridge. This is the mode-seeking, over-confident behaviour the EP-versus-VB question asks about (EP, minimising the other direction locally, matches marginals and tends to be wider). It is also why mean-field updates in the ARD regression question are cheap but need care when weights are correlated. Trap: assuming mean-field uses the marginal variance $\\Sigma_{11}$.","category":"ai","kind":"basics","difficulty":"easy","tags":["variational Bayes","mean field","Gaussian"],"origin":"original","status":"verified","leads_to":["m-ai-ep-vs-vb-kl-direction","m-ai-ard-gibbs-vb"],"entry":"Enter the mean-field variance of $q_1$, $1/\\Lambda_{11}$ (compare with the true marginal variance too)."},{"id":"m-ai-f-gamma-conditional-07","title":"A Gibbs conditional: Gaussian weight, Gamma precision","prompt":"In an ARD model the weight $w\\mid s\\sim\\mathcal N(0,s^{-1})$ and the precision has prior $s\\sim\\mathrm{Gamma}(a,b)$ with density $\\propto s^{a-1}e^{-bs}$ (rate $b$). Given a value $w$, the conditional $p(s\\mid w)\\propto p(w\\mid s)p(s)$ is again Gamma. Find its parameters and, for $a=2$, $b=1$, $w=2$, its mean.","hints":["$p(w\\mid s)\\propto s^{1/2}e^{-sw^2/2}$. Multiply by the prior and read off the exponents."],"answer":"$\\mathrm{Gamma}(a+\\tfrac12,\\,b+\\tfrac{w^2}{2})=\\mathrm{Gamma}(2.5,3)$, mean $2.5/3\\approx0.833$.","answer_type":"numeric","answer_value":0.833333,"solution":"The product is $s^{a-1}e^{-bs}\\cdot s^{1/2}e^{-sw^2/2}=s^{a+1/2-1}e^{-(b+w^2/2)s}$, which is $\\mathrm{Gamma}(a+\\tfrac12,\\ b+\\tfrac{w^2}{2})$. With $a=2$, $b=1$, $w=2$ that is $\\mathrm{Gamma}(2.5,3)$ with mean $2.5/3\\approx0.833$. A large weight lowers the expected precision (it is evidence that the prior variance should be large) and a weight near zero raises it, which is how ARD switches irrelevant weights off. In the ARD question, a Gibbs sampler alternates this Gamma conditional with the Gaussian conditional for $w$ given $S$, and variational Bayes replaces $w^2$ by its expectation $\\mathbb E_q[w^2]$ in the same Gamma update. Trap: forgetting the $+\\tfrac12$ per weight, or mixing up rate and scale.","category":"ai","kind":"basics","difficulty":"easy","tags":["Gibbs sampling","conjugacy","ARD","Gamma"],"origin":"original","status":"verified","leads_to":["m-ai-ard-gibbs-vb"],"entry":"Enter the mean of $p(s\\mid w)$ for $a=2$, $b=1$, $w=2$ (work out its Gamma parameters too; the solution covers it)."},{"id":"m-ai-f-bp-chain-08","title":"Belief propagation on a three-variable chain","prompt":"A chain MRF $x_1-x_2-x_3$ of binary variables has $P(x)\\propto\\phi_1(x_1)\\,f(x_1,x_2)\\,f(x_2,x_3)\\,\\phi_3(x_3)$ with $f(a,b)=2$ if $a=b$ and $1$ otherwise, $\\phi_1=(0.8,0.2)$ and $\\phi_3=(0.3,0.7)$ (over values $0,1$). Compute the messages $m_{1\\to2}(x_2)$ and $m_{3\\to2}(x_2)$, and the belief $P(x_2=0)$.","hints":["$m_{1\\to2}(x_2)=\\sum_{x_1}\\phi_1(x_1)f(x_1,x_2)$, and similarly for $m_{3\\to2}$.","The belief is the normalised product of the incoming messages."],"answer":"$m_{1\\to2}=(1.8,1.2)$, $m_{3\\to2}=(1.3,1.7)$; $P(x_2=0)=2.34/4.38\\approx0.534$.","answer_type":"numeric","answer_value":0.534247,"solution":"$m_{1\\to2}(0)=0.8\\cdot2+0.2\\cdot1=1.8$ and $m_{1\\to2}(1)=0.8\\cdot1+0.2\\cdot2=1.2$; $m_{3\\to2}(0)=0.3\\cdot2+0.7\\cdot1=1.3$ and $m_{3\\to2}(1)=0.3\\cdot1+0.7\\cdot2=1.7$. The unnormalised belief is $(1.8\\cdot1.3,\\ 1.2\\cdot1.7)=(2.34,2.04)$, so $P(x_2=0)=2.34/4.38\\approx0.534$; brute-force enumeration of all eight states gives the same number. On a tree, BP is exact because each message summarises an independent subtree. On a graph with loops the same updates (loopy BP) are applied anyway, and their fixed points are stationary points of the Bethe free energy, which is exact for trees because the joint then factorises into pairwise and single-node marginals. Trap: forgetting to exclude the receiving node's own message when building an outgoing message in bigger graphs.","category":"ai","kind":"basics","difficulty":"easy","tags":["belief propagation","MRF","Bethe"],"origin":"original","status":"verified","leads_to":["m-ai-bethe-free-energy-bp"],"entry":"Enter the belief $P(x_2=0)$ as a probability (work out the two messages too; the solution covers them)."},{"id":"m-ai-f-detailed-balance-09","title":"Detailed balance on a two-state chain","prompt":"A Markov chain on two states has target $\\pi=(1/3,\\,2/3)$ and transition probability $T(1\\to2)=0.5$. Detailed balance requires $\\pi_1T(1\\to2)=\\pi_2T(2\\to1)$. What must $T(2\\to1)$ be? Why does detailed balance imply that $\\pi$ is stationary?","hints":["Stationary means $\\pi_j=\\sum_i\\pi_iT(i\\to j)$. Sum the detailed-balance equation over $i$."],"answer":"$T(2\\to1)=0.25$.","answer_type":"numeric","answer_value":0.25,"solution":"From $\\pi_1T(1\\to2)=\\pi_2T(2\\to1)$ we get $T(2\\to1)=\\frac{(1/3)(0.5)}{2/3}=0.25$. Why it gives stationarity: sum $\\pi_iT(i\\to j)=\\pi_jT(j\\to i)$ over $i$ to get $\\sum_i\\pi_iT(i\\to j)=\\pi_j\\sum_iT(j\\to i)=\\pi_j$, so $\\pi$ is left invariant. Detailed balance is a stronger, local condition (probability flow balances along each edge, not just in total), which is sufficient but not necessary for stationarity. Metropolis-Hastings is built to satisfy it: the acceptance $\\min\\{1,\\frac{\\pi(x')q(x\\mid x')}{\\pi(x)q(x'\\mid x)}\\}$ is chosen exactly so that $\\pi(x)q(x'\\mid x)\\alpha(x\\to x')=\\pi(x')q(x\\mid x')\\alpha(x'\\to x)$. Ergodicity is still needed separately for convergence, which is the 'essential vs sufficient' distinction asked about in the HMC question. Trap: believing a stationary chain must satisfy detailed balance.","category":"ai","kind":"basics","difficulty":"easy","tags":["detailed balance","Markov chain","stationary distribution"],"origin":"original","status":"verified","leads_to":["m-ai-mh-detailed-balance","m-ai-hmc-justification"],"entry":"Enter the transition probability $T(2\\to1)$ required by detailed balance, as a probability."},{"id":"m-ai-f-leapfrog-10","title":"One leapfrog step for a Gaussian target","prompt":"HMC targets $e^{-U(q)}$ with $U(q)=q^2/2$ and kinetic energy $p^2/2$. A leapfrog step of size $\\epsilon$ does $p\\leftarrow p-\\tfrac\\epsilon2U'(q)$, then $q\\leftarrow q+\\epsilon p$, then $p\\leftarrow p-\\tfrac\\epsilon2U'(q)$. Start at $q=1$, $p=0$ with $\\epsilon=0.1$ and compute the new $p$. Is the total energy $H=U+K$ exactly conserved?","hints":["$U'(q)=q$. After the first half step $p=-0.05$; then $q=0.995$."],"answer":"$p=-0.09975$ (and $q=0.995$); $H$ changes by about $-1.2\\times10^{-5}$.","answer_type":"numeric","answer_value":-0.09975,"solution":"First half step: $p=0-0.05\\cdot1=-0.05$. Position: $q=1+0.1(-0.05)=0.995$. Second half step: $p=-0.05-0.05\\cdot0.995=-0.09975$. The energy goes from $H=0.5$ to $\\tfrac12(0.995^2+0.09975^2)\\approx0.499988$, a tiny change: leapfrog does not conserve $H$ exactly, but it is reversible and volume-preserving, so the Metropolis accept step with probability $\\min\\{1,e^{-\\Delta H}\\}$ corrects the error and keeps the target exactly invariant. Those two properties (reversibility, volume preservation) are what the HMC justification question asks for, and the accept step gives detailed balance in the extended $(q,p)$ space. Trap: forgetting to flip the momentum for the reversibility argument, or thinking a small $\\Delta H$ makes the correction unnecessary.","category":"ai","kind":"basics","difficulty":"easy","tags":["HMC","leapfrog","Hamiltonian"],"origin":"original","status":"verified","leads_to":["m-ai-hmc-justification","m-ai-mh-detailed-balance"],"entry":"Enter the new momentum $p$ after one leapfrog step, negative if it is below zero (work out the energy question too)."},{"id":"m-ai-f-ess-11","title":"Effective sample size of a weighted particle set","prompt":"A particle filter has four particles with normalised weights $(0.7,\\,0.1,\\,0.1,\\,0.1)$. The effective sample size is $\\mathrm{ESS}=1/\\sum_iw_i^2$. Compute it. What are its values for equal weights and for one particle holding all the weight, and what do you do when it is small?","hints":["$\\sum_iw_i^2=0.49+3(0.01)$."],"answer":"$\\mathrm{ESS}=1/0.52\\approx1.92$; equal weights give $4$, a single dominant weight gives $1$.","answer_type":"numeric","answer_value":1.923077,"solution":"$\\sum_iw_i^2=0.49+0.03=0.52$, so $\\mathrm{ESS}\\approx1.92$: although there are four particles, the set is worth less than two independent samples. Equal weights $1/N$ give $\\mathrm{ESS}=N$ and a single weight of one gives $\\mathrm{ESS}=1$. The ESS falls as the weights become more variable, so it measures weight degeneracy. When it drops below a threshold (often $N/2$) you resample, which duplicates heavy particles and discards light ones at the price of some extra noise. The particle-filter weight variance question quantifies why degeneracy occurs when the proposal ignores the observation, and the same idea explains why importance-weighted bounds need many samples when $q$ is a poor match for the posterior. Trap: confusing ESS with the number of distinct particles after resampling.","category":"ai","kind":"basics","difficulty":"easy","tags":["particle filter","effective sample size","degeneracy"],"origin":"original","status":"verified","leads_to":["m-ai-particle-filter-weight-variance","m-ai-iwae-bound"],"entry":"Enter the effective sample size for weights $(0.7,0.1,0.1,0.1)$ (work out the other cases too; the solution covers them)."},{"id":"m-ai-f-gp-cost-12","title":"Why exact GP regression stops scaling","prompt":"Exact Gaussian process regression needs a Cholesky factorisation of the $N\\times N$ kernel matrix, costing $O(N^3)$ time and $O(N^2)$ memory. A sparse method with $M$ inducing points costs $O(NM^2)$. For $N=200{,}000$ and $M=1{,}000$, by what factor is the sparse method cheaper in time (ignoring constants)? How many entries does the full kernel matrix hold?","hints":["The ratio is $N^3/(NM^2)=(N/M)^2$."],"answer":"Factor $(N/M)^2=40{,}000$; the full matrix holds $4\\times10^{10}$ entries.","answer_type":"numeric","answer_value":40000.0,"solution":"$N^3/(NM^2)=N^2/M^2=(200)^2=40{,}000$, so the sparse method is roughly forty thousand times cheaper. The full kernel matrix has $N^2=4\\times10^{10}$ entries, about $320$ GB in double precision, so exact inference cannot even be stored, never mind factorised. The cure is to summarise the data through $M\\ll N$ inducing points (or random features, or local experts), giving a low-rank approximation so the cost is linear in $N$ and cubic only in $M$. The scaling scenario asks you to say which parts of GP inference are expensive (the $O(N^3)$ solve and log-determinant for the marginal likelihood, plus $O(N^2)$ memory) and which approximation you would choose; this arithmetic is what justifies the choice. Trap: forgetting that hyperparameter learning repeats the factorisation at every optimiser step.","category":"ai","kind":"basics","difficulty":"easy","tags":["Gaussian process","scaling","inducing points"],"origin":"original","status":"verified","leads_to":["m-ai-gp-scaling-inducing-points"],"entry":"Enter the factor by which the sparse method is cheaper in time (work out the kernel matrix entry count too)."},{"id":"m-bdl-f-prior-is-weight-decay-01","title":"A Gaussian prior on the weights is an L2 penalty","prompt":"A model has Gaussian noise with precision $\\beta=2$ (so $y\\mid x,w\\sim\\mathcal N(w^\\top x,\\beta^{-1})$) and a prior $w\\sim\\mathcal N(0,\\alpha^{-1}I)$ with $\\alpha=8$. The negative log posterior is $\\frac\\beta2\\sum_i(y_i-w^\\top x_i)^2+\\frac\\alpha2\\|w\\|^2+\\text{const}$. Dividing by $\\beta$, the MAP estimate minimises $\\frac12\\sum_i(y_i-w^\\top x_i)^2+\\frac\\lambda2\\|w\\|^2$. What is the equivalent ridge (weight-decay) strength $\\lambda$?","hints":["$\\lambda=\\alpha/\\beta$."],"answer":"$\\lambda=\\alpha/\\beta=4$.","answer_type":"numeric","answer_value":4.0,"solution":"Taking $-\\log$ of prior times likelihood gives $\\frac\\beta2\\sum_i(y_i-w^\\top x_i)^2+\\frac\\alpha2\\|w\\|^2$. Dividing through by $\\beta$ does not change the minimiser and leaves $\\frac12\\sum_i(\\cdot)^2+\\frac{\\alpha}{2\\beta}\\|w\\|^2$, so $\\lambda=\\alpha/\\beta=8/2=4$. A tighter prior (larger $\\alpha$) or noisier data (smaller $\\beta$) means stronger regularisation. So weight decay is MAP estimation under a zero-mean Gaussian prior. That is the starting point of the Bayesian linear regression question, where you then keep the whole posterior rather than only its peak, and it is why MAP, although it uses a prior, is still not Bayesian: it throws away everything except the mode. Trap: forgetting that the noise precision enters the ratio.","category":"bdl","kind":"basics","difficulty":"easy","tags":["MAP","ridge","Gaussian prior","weight decay"],"origin":"original","status":"verified","leads_to":["m-bdl-bayes-linreg-posterior","m-bdl-map-not-bayesian-ensembles","m-bdl-bayesian-vae-decoder"],"entry":"Enter the equivalent ridge (weight-decay) strength $\\lambda$ in $\\frac12\\sum_i(y_i-w^\\top x_i)^2+\\frac\\lambda2\\|w\\|^2$."},{"id":"m-bdl-f-blr-posterior-02","title":"Bayesian linear regression with one weight","prompt":"One weight $w$, prior $w\\sim\\mathcal N(0,\\alpha^{-1})$ with $\\alpha=1$, noise precision $\\beta=1$, data $x=(1,2)$, $y=(2,3)$. The posterior is Gaussian with precision $\\alpha+\\beta\\sum_ix_i^2$ and mean $\\beta\\sum_ix_iy_i$ divided by that precision. Compute the posterior mean and variance, and check that the mean equals the ridge solution with $\\lambda=\\alpha/\\beta$.","hints":["$\\sum x_i^2=5$ and $\\sum x_iy_i=8$."],"answer":"Precision $6$, so variance $1/6\\approx0.167$ and mean $8/6\\approx1.333$.","answer_type":"numeric","answer_value":1.333333,"solution":"The precision is $\\alpha+\\beta\\sum x_i^2=1+5=6$, so the posterior variance is $1/6$, and the mean is $\\beta\\sum x_iy_i/6=8/6\\approx1.333$. Ridge with $\\lambda=\\alpha/\\beta=1$ gives $\\sum x_iy_i/(\\sum x_i^2+\\lambda)=8/6$, the same, so the MAP of the Bayesian model is ridge regression. What the Bayesian view adds is the width: the variance $1/6$ shrinks as more data arrive, which ridge alone does not report. Completing the square in the exponent is exactly how you derive these formulas in the general question, with $\\Sigma_N^{-1}=\\alpha I+\\beta\\Phi^\\top\\Phi$ and $m_N=\\beta\\Sigma_N\\Phi^\\top y$. Trap: forgetting that precisions add but variances do not.","category":"bdl","kind":"basics","difficulty":"easy","tags":["Bayesian linear regression","posterior","ridge"],"origin":"original","status":"verified","leads_to":["m-bdl-bayes-linreg-posterior","m-bdl-linearised-predictive","m-bdl-map-not-bayesian-ensembles"],"entry":"Enter the posterior mean of $w$ (work out the variance and ridge check too; the solution covers them)."},{"id":"m-bdl-f-predictive-variance-03","title":"Predictive variance = noise plus weight uncertainty","prompt":"Continue the one-weight model with posterior variance $1/6$ and noise precision $\\beta=1$. For a new input $x_*=3$ the predictive distribution of $y_*$ has mean $m\\,x_*$ and variance $\\beta^{-1}+x_*^2\\,\\mathrm{Var}(w)$. Compute the predictive variance, and split it into the part that data can never remove (aleatoric) and the part that more data would shrink (epistemic).","hints":["The first term is the observation noise; the second comes from not knowing $w$ exactly."],"answer":"$1+9/6=2.5$: aleatoric $1$, epistemic $1.5$.","answer_type":"numeric","answer_value":2.5,"solution":"$y_*=w x_*+\\varepsilon$ with $\\varepsilon\\sim\\mathcal N(0,\\beta^{-1})$ independent of $w$, so the variances add: $\\beta^{-1}+x_*^2\\mathrm{Var}(w)=1+9\\cdot\\frac16=2.5$. The noise term $1$ is aleatoric: it remains even if $w$ were known. The term $1.5$ is epistemic: it comes from the remaining uncertainty about $w$, grows with $x_*^2$ (we extrapolate with more uncertainty far from the data), and shrinks as the posterior variance shrinks with more data. The linearised-Laplace predictive for a network has the same shape, $\\beta^{-1}+g^\\top\\Sigma g$, with the gradient $g$ playing the role of $x_*$, and this split is what the aleatoric-versus-epistemic scenario asks you to reason about. Trap: using the posterior variance of $w$ alone as the predictive variance.","category":"bdl","kind":"basics","difficulty":"easy","tags":["predictive distribution","aleatoric","epistemic"],"origin":"original","status":"verified","leads_to":["m-bdl-linearised-variance-calc","m-bdl-linearised-predictive","m-bdl-uncertainty-self-driving"],"entry":"Enter the total predictive variance of $y_*$ at $x_*=3$ (work out the aleatoric and epistemic split too)."},{"id":"m-bdl-f-gradient-quadratic-04","title":"Linearised network: predictive variance is a quadratic form","prompt":"A network is linearised around $\\mu$: $f_\\theta(x_*)\\approx f_\\mu(x_*)+g^\\top(\\theta-\\mu)$ with $g=\\nabla_\\theta f_\\theta(x_*)\\big|_\\mu$. If $\\theta\\sim\\mathcal N(\\mu,\\Sigma)$ then $\\mathrm{Var}[f_\\theta(x_*)]=g^\\top\\Sigma g$. Compute it for $g=(3,-1)^\\top$ and $\\Sigma=\\begin{pmatrix}0.5&0.2\\\\0.2&1\\end{pmatrix}$.","hints":["Expand: $g_1^2\\Sigma_{11}+2g_1g_2\\Sigma_{12}+g_2^2\\Sigma_{22}$."],"answer":"$4.5-1.2+1=4.3$.","answer_type":"numeric","answer_value":4.3,"solution":"The linear map $\\theta\\mapsto g^\\top\\theta$ of a Gaussian is Gaussian with variance $g^\\top\\Sigma g$. Expanding: $9(0.5)+2(3)(-1)(0.2)+1(1)=4.5-1.2+1=4.3$. The negative cross term reflects that the two weights are positively correlated while their effects on the output have opposite signs, so they partly cancel. Adding the observation noise $\\beta^{-1}$ gives the linearised Laplace predictive variance, exactly what the linearised-predictive derivation proves and what the small-network variance calculation evaluates. The reason for linearising rather than propagating a Gaussian through the full non-linear network is that only the linear map keeps the output Gaussian, which the true/false round warns is not true of the non-linear network. Trap: dropping the cross term, or using the sum $g_1^2+g_2^2$ weighted by only the diagonal of $\\Sigma$.","category":"bdl","kind":"basics","difficulty":"easy","tags":["linearised Laplace","Gaussian","predictive variance"],"origin":"original","status":"verified","leads_to":["m-bdl-linearised-variance-calc","m-bdl-linearised-predictive","m-bdl-tf-round"],"entry":"Enter the variance $g^\\top\\Sigma g$ of the linearised network output."},{"id":"m-bdl-f-laplace-hessian-05","title":"Laplace approximation: the Hessian gives the covariance","prompt":"A Laplace approximation fits $\\mathcal N(\\theta^\\star,H^{-1})$, where $\\theta^\\star$ is the MAP and $H$ is the Hessian of the negative log posterior at $\\theta^\\star$. For two parameters suppose $H=\\begin{pmatrix}4&0\\\\0&0.25\\end{pmatrix}$. Find the posterior standard deviation along each parameter. Which direction is the posterior most uncertain in, and why?","hints":["For a diagonal matrix, $H^{-1}$ has the reciprocal diagonal entries."],"answer":"Standard deviations $0.5$ and $2$; the flat (low-curvature) direction is the most uncertain.","answer_type":"numeric","answer_value":2.0,"solution":"$H^{-1}=\\mathrm{diag}(0.25,\\,4)$, so the standard deviations are $0.5$ and $2$. High curvature means the loss rises quickly if you move that parameter, so the data pin it down tightly; low curvature means many values fit about equally well, so the posterior is wide in that direction. For a network, $H$ is typically data curvature plus the prior precision $\\alpha I$, and the prior is what makes $H$ invertible when some directions are not constrained by the data. A Laplace approximation is a single Gaussian at one mode, so it cannot represent a multimodal weight posterior; that is the first claim in the true/false round, and why MCMC or ensembles are brought in when modes matter. Trap: reading the Hessian entries as variances rather than precisions.","category":"bdl","kind":"basics","difficulty":"easy","tags":["Laplace approximation","Hessian","posterior covariance"],"origin":"original","status":"verified","leads_to":["m-bdl-laplace-vs-vi-vs-mcmc","m-bdl-tf-round","m-bdl-linearised-predictive"],"entry":"Enter the larger of the two posterior standard deviations (work out the other one and the explanation too; the solution covers them)."},{"id":"m-bdl-f-total-variance-06","title":"Ensemble predictions: noise plus disagreement","prompt":"Three ensemble members each predict a mean for the same input, $\\mu_k=1,\\,2,\\,3$, and each reports the same noise variance $\\sigma^2=0.5$. The ensemble predictive variance is the mean of the members' noise variances plus the variance of their means. Compute it (use $1/K$ for the variance of means), and say which part is epistemic.","hints":["This is the law of total variance: $\\mathrm{Var}=\\mathbb E[\\mathrm{Var}]+\\mathrm{Var}[\\mathbb E]$."],"answer":"$0.5+2/3\\approx1.167$; the disagreement term $2/3$ is the epistemic part.","answer_type":"numeric","answer_value":1.166667,"solution":"The mean of the means is $2$, so the variance of the means is $(1+0+1)/3=2/3$. Adding the average noise variance $0.5$ gives $\\approx1.167$. The noise term is aleatoric: all members agree it is there and it will not shrink with more data. The disagreement term is epistemic: it measures how much the members differ because they are different plausible functions, and it grows for inputs far from the training data where nothing constrains them. This is why a deep ensemble is a rough approximation to Bayesian model averaging, with each member a sample from the 'posterior over functions', and why identical members (no diversity) report no epistemic uncertainty at all, a key caveat in the MAP-versus-ensemble question. Trap: reporting only the average member variance and missing the disagreement.","category":"bdl","kind":"basics","difficulty":"easy","tags":["ensembles","law of total variance","epistemic"],"origin":"original","status":"verified","leads_to":["m-bdl-map-not-bayesian-ensembles","m-bdl-uncertainty-self-driving"],"entry":"Enter the ensemble's total predictive variance (work out which part is epistemic too; the solution covers it)."},{"id":"m-bdl-f-ensemble-mi-07","title":"Epistemic uncertainty of a classifier ensemble","prompt":"Three networks predict $P(\\text{class }1)=0.9,\\,0.5,\\,0.1$ for the same input. The mutual information $I=H[\\bar p]-\\overline{H[p_k]}$ (entropy of the average prediction minus the average of the individual entropies, in nats) measures the epistemic part. Compute it. What would it be if all three predicted $0.5$?","hints":["$H(p)=-p\\ln p-(1-p)\\ln(1-p)$. $H(0.9)\\approx0.325$, $H(0.5)=\\ln2\\approx0.693$.","The average prediction is $0.5$."],"answer":"$\\ln2-0.448\\approx0.245$ nats; if all predicted $0.5$ then $I=0$.","answer_type":"numeric","answer_value":0.2453,"solution":"The ensemble average is $0.5$, so its entropy is $\\ln2=0.693$. The member entropies are $0.325$, $0.693$ and $0.325$, with average $0.448$. So $I=0.693-0.448\\approx0.245$. If all members predicted $0.5$ the two terms are equal and $I=0$, meaning the uncertainty is purely aleatoric (the input is genuinely ambiguous); here instead the members confidently disagree, so the model is unsure which function is right, which is epistemic uncertainty. High total entropy but low mutual information says 'noisy input'; high mutual information says 'out-of-distribution or under-trained region'. Trap: using the entropy of the average as a measure of epistemic uncertainty; it also includes the aleatoric part.","category":"bdl","kind":"basics","difficulty":"easy","tags":["mutual information","ensembles","epistemic uncertainty","classification"],"origin":"original","status":"verified","leads_to":["m-bdl-uncertainty-self-driving","m-bdl-map-not-bayesian-ensembles","m-bdl-calibration-check"],"entry":"Enter the mutual information $I=H[\\bar p]-\\overline{H[p_k]}$ in nats (work out the all-0.5 case too)."},{"id":"m-bdl-f-ece-08","title":"Expected calibration error from two bins","prompt":"A classifier's predictions are grouped into confidence bins. Bin 1 holds $300$ predictions with average confidence $0.95$ and accuracy $0.78$. Bin 2 holds $200$ predictions with average confidence $0.70$ and accuracy $0.65$. The expected calibration error is $\\mathrm{ECE}=\\sum_b\\frac{n_b}{n}\\,|\\mathrm{acc}_b-\\mathrm{conf}_b|$. Compute it. Is the model over- or under-confident?","hints":["The total is $n=500$."],"answer":"$\\mathrm{ECE}=0.6\\cdot0.17+0.4\\cdot0.05=0.122$; over-confident.","answer_type":"numeric","answer_value":0.122,"solution":"The weights are $300/500=0.6$ and $200/500=0.4$, and the gaps are $|0.78-0.95|=0.17$ and $|0.65-0.70|=0.05$, so $\\mathrm{ECE}=0.102+0.02=0.122$. Confidence exceeds accuracy in both bins, so the model is over-confident, which is typical of modern deep networks trained to near-zero loss. A well-calibrated model has accuracy equal to confidence in every bin, so ECE is near zero. High accuracy says nothing about calibration: a classifier can rank cases perfectly yet report probabilities that are too extreme. In the calibration-check scenario this table is the first diagnostic (a reliability diagram), and the fixes are temperature scaling on held-out data or a Bayesian treatment such as ensembling or a Laplace approximation that averages over weights. Trap: computing the unweighted mean of the gaps.","category":"bdl","kind":"basics","difficulty":"easy","tags":["calibration","ECE","reliability"],"origin":"original","status":"verified","leads_to":["m-bdl-calibration-check","m-bdl-tf-round"],"entry":"Enter the expected calibration error, as a number between 0 and 1 (work out over- or under-confidence too)."},{"id":"m-bdl-f-independent-mh-09","title":"Independent Metropolis-Hastings: the ratio of importance weights","prompt":"You can evaluate an unnormalised target $\\gamma(x)$ and a proposal density $q(x)$, with independent MH proposing $x'\\sim q$ regardless of the current state. The acceptance probability is $\\min\\{1,\\frac{\\gamma(x')\\,q(x)}{\\gamma(x)\\,q(x')}\\}$. The chain is at $x$ with $\\gamma(x)=0.2$, $q(x)=0.1$, and proposes $x'$ with $\\gamma(x')=0.3$, $q(x')=0.2$. Compute the acceptance probability and show it equals a ratio of importance weights.","hints":["Let $w(x)=\\gamma(x)/q(x)$."],"answer":"$w(x)=2$, $w(x')=1.5$, so acceptance $=1.5/2=0.75$.","answer_type":"numeric","answer_value":0.75,"solution":"$\\frac{\\gamma(x')q(x)}{\\gamma(x)q(x')}=\\frac{\\gamma(x')/q(x')}{\\gamma(x)/q(x)}=\\frac{w(x')}{w(x)}=\\frac{1.5}{2}=0.75$. So independent MH accepts a proposal in proportion to how its importance weight compares with the current one. If $q=\\pi$ every $w$ is constant, the ratio is $1$ and every proposal is accepted, but then you could sample from $\\pi$ directly, which is exactly what you cannot do. With a poor $q$, a state with a huge weight is very hard to leave, so the chain can get stuck, which is the practical warning in the Langevin-and-IMH question. The normalising constant $Z$ cancels in the ratio, which is why MH works with $\\gamma$ only. Trap: using $\\gamma(x')/\\gamma(x)$ alone, which is the right ratio only for a symmetric proposal.","category":"bdl","kind":"basics","difficulty":"easy","tags":["Metropolis-Hastings","independence sampler","importance weights"],"origin":"original","status":"verified","leads_to":["m-bdl-langevin-imh","m-bdl-mh-acceptance-calc"],"entry":"Enter the independent-MH acceptance probability for this proposal, as a probability between 0 and 1."},{"id":"m-bdl-f-langevin-mean-10","title":"The Langevin proposal drifts uphill","prompt":"The Langevin proposal with step size $\\epsilon$ is $x'\\sim\\mathcal N\\big(x+\\tfrac{\\epsilon^2}{2}\\nabla\\log\\pi(x),\\ \\epsilon^2\\big)$. For $\\pi=\\mathcal N(0,1)$, current state $x=2$ and $\\epsilon=0.5$, find the proposal mean. Which way does it move, and why does MALA still need an accept/reject step?","hints":["$\\nabla\\log\\pi(x)=-x$ for a standard normal."],"answer":"Mean $=2-0.125\\cdot2=1.75$, towards the mode.","answer_type":"numeric","answer_value":1.75,"solution":"The gradient is $-2$, so the drift is $\\frac{0.25}{2}(-2)=-0.25$ and the proposal mean is $1.75$; the proposal is pulled towards the high-density region and the noise $\\epsilon\\xi$ keeps it exploring. The proposal is not symmetric (the mean depends on the current point), so the MH ratio must include $q(x\\mid x')/q(x'\\mid x)$; the accept step then corrects the discretisation error and makes the chain exact. SGLD drops that step because the full-data density is too expensive to evaluate on large networks, using a minibatch gradient (scaled by $N/n$) with decaying step size instead, which is only approximately correct but cheap. This is the trade-off asked in the question. Trap: forgetting the $\\epsilon^2/2$ factor, so that the drift is $\\epsilon\\nabla\\log\\pi$.","category":"bdl","kind":"basics","difficulty":"easy","tags":["Langevin","MALA","SGLD","MCMC"],"origin":"original","status":"verified","leads_to":["m-bdl-langevin-imh","m-bdl-mh-acceptance-calc"],"entry":"Enter the mean of the Langevin proposal from $x=2$ with $\\epsilon=0.5$ (work out the accept/reject question too)."},{"id":"m-bdl-f-reparam-sample-11","title":"Reparameterised gradient from two samples","prompt":"We want $\\frac{d}{d\\mu}\\mathbb E_{x\\sim\\mathcal N(\\mu,1)}[x^2]$ at $\\mu=1$. Write $x=\\mu+\\varepsilon$ with $\\varepsilon\\sim\\mathcal N(0,1)$ and differentiate inside the expectation. With the two draws $\\varepsilon=(0.5,\\,-1.5)$ compute the sample estimate. What is the exact value?","hints":["$\\frac{d}{d\\mu}(\\mu+\\varepsilon)^2=2(\\mu+\\varepsilon)$."],"answer":"Estimate $\\tfrac12(2\\cdot1.5+2\\cdot(-0.5))=1$; exact value $2\\mu=2$.","answer_type":"numeric","answer_value":1.0,"solution":"With $x=\\mu+\\varepsilon$ the samples are $1.5$ and $-0.5$, and the pathwise derivative is $2x$, so the estimate is $\\tfrac12(3-1)=1$. The exact answer is $\\frac{d}{d\\mu}(\\mu^2+1)=2\\mu=2$. The estimator is unbiased (its expectation is $2\\mu$) but two samples are noisy, so the estimate of $1$ is not alarming. The trick is to move the randomness into $\\varepsilon$, whose distribution does not depend on $\\mu$, so the derivative passes through the expectation and you just back-propagate through $x=\\mu+\\sigma\\varepsilon$. That is the reparameterisation trick used in VAEs and Bayesian neural nets, and it is the estimator to prefer in part (a) of the gradient-estimators question where $x$ is continuous. Trap: sampling $x$ first and then trying to differentiate through the sampling step.","category":"bdl","kind":"basics","difficulty":"easy","tags":["reparameterisation trick","gradient estimator","Monte Carlo"],"origin":"original","status":"verified","leads_to":["m-bdl-grad-estimators","m-bdl-bayesian-vae-decoder"],"entry":"Enter the sample estimate of the derivative from the two draws (work out the exact value too; the solution covers it)."},{"id":"m-bdl-f-score-function-12","title":"Score-function gradient: unbiased but noisy","prompt":"Let $x\\in\\{0,1\\}$ with $P(x=1)=\\theta=0.25$, and $f(1)=3$, $f(0)=1$. The score-function (REINFORCE) estimator of $\\frac{d}{d\\theta}\\mathbb E[f(x)]$ from one sample is $g=f(x)\\,\\frac{d}{d\\theta}\\ln p(x\\mid\\theta)$, where $\\frac{d}{d\\theta}\\ln p=\\frac{x}{\\theta}-\\frac{1-x}{1-\\theta}$. Show that $\\mathbb E[g]$ equals the true derivative, and compute $\\mathrm{Var}[g]$.","hints":["True derivative: $\\frac{d}{d\\theta}[3\\theta+(1-\\theta)]=2$.","$g=12$ with probability $0.25$ and $g=-4/3$ with probability $0.75$."],"answer":"$\\mathbb E[g]=3-1=2$ (unbiased); $\\mathrm{Var}[g]=37.33-4\\approx33.3$.","answer_type":"numeric","answer_value":33.3333,"solution":"For $x=1$: $g=3\\cdot4=12$ with probability $0.25$; for $x=0$: $g=1\\cdot(-1/0.75)=-4/3$ with probability $0.75$. So $\\mathbb E[g]=3-1=2$, matching the true derivative, and $\\mathbb E[g^2]=0.25\\cdot144+0.75\\cdot\\tfrac{16}{9}=36+1.33=37.33$, giving $\\mathrm{Var}[g]\\approx33.3$, huge relative to the mean of $2$. Subtracting a constant baseline $b=1$ from $f$ keeps the estimator unbiased (the expected score is $0$) but reduces the variance to $12$. This noise is the price for needing no gradient of $f$ and working for discrete $x$, so for continuous $x$ the reparameterised estimator is normally preferred, while for discrete or non-differentiable cases (the Poisson and categorical parts of the question) you use the score function, ideally with a baseline. Trap: forgetting that the estimator multiplies $f$ by the score, not by $p$.","category":"bdl","kind":"basics","difficulty":"easy","tags":["score function","REINFORCE","gradient variance","baseline"],"origin":"original","status":"verified","leads_to":["m-bdl-grad-estimators","m-bdl-bayesian-vae-decoder"],"entry":"Enter $\\mathrm{Var}[g]$, the variance of the one-sample score-function estimator (work out $\\mathbb E[g]$ too)."},{"id":"m-rl-f-discounted-return","title":"Discounted return from a short reward sequence","prompt":"An agent receives rewards $R_1=3$, $R_2=0$, $R_3=8$ and then the episode ends. With discount factor $\\gamma=0.5$, what is the return $G_0=R_1+\\gamma R_2+\\gamma^2R_3$?","hints":["Multiply each reward by $\\gamma$ raised to the number of steps you have waited for it."],"answer":"$5$","answer_type":"numeric","answer_value":5.0,"solution":"$G_0=3+0.5\\cdot0+0.25\\cdot8=3+0+2=5$. The discount factor says that a reward received $k$ steps later is worth $\\gamma^k$ times as much, so $\\gamma$ close to $0$ makes the agent short-sighted and $\\gamma$ close to $1$ makes it far-sighted. This one line is the building block of everything else in the course: value functions are expected returns, and the corridor and reward-shaping questions are about how $\\gamma$ and the timing of rewards change what the agent prefers. Trap: starting the powers of $\\gamma$ at $1$ instead of $0$, so that the first reward is also discounted.","category":"rl","kind":"basics","difficulty":"easy","tags":["return","discount factor"],"origin":"original","status":"verified","leads_to":["m-rl-unreliable-corridor-value","m-rl-reward-shaping-loop"],"entry":"Enter the return $G_0$ for $\\gamma=0.5$."},{"id":"m-rl-f-incremental-average","title":"Updating a sample average one reward at a time","prompt":"In a bandit, arm $a$ has been pulled $N=4$ times and its sample-average value estimate is $Q=0.5$. You pull it a fifth time and get reward $R=-1$. Use the incremental rule $Q_{\\text{new}}=Q+\\frac{1}{N+1}(R-Q)$ to get the new estimate. (Check it equals the plain average of all five rewards.)","hints":["The old estimate times 4 is the sum of the first four rewards."],"answer":"$0.2$","answer_type":"numeric","answer_value":0.2,"solution":"$Q_{\\text{new}}=0.5+\\frac15(-1-0.5)=0.5-0.3=0.2$. Check: the first four rewards sum to $4\\times0.5=2$, adding $-1$ gives $1$, and $1/5=0.2$. The general shape is $\\text{new}=\\text{old}+\\text{step size}\\times(\\text{target}-\\text{old})$. You will see it again and again: with step size $1/N$ it is the sample average used by greedy and UCB in the bandit question, and with a fixed step size $\\alpha$ it becomes the TD and Q-learning updates. Trap: using $1/N$ instead of $1/(N+1)$ when $N$ counts the pulls before the new one.","category":"rl","kind":"basics","difficulty":"easy","tags":["bandits","sample average","incremental update"],"origin":"original","status":"verified","leads_to":["m-rl-bandit-greedy-ucb","m-rl-mc-vs-td"],"entry":"Enter the new value estimate $Q_{\\text{new}}$ after the fifth pull."},{"id":"m-rl-f-greedy-stuck","title":"Why a purely greedy bandit agent can get stuck","prompt":"Two arms give reward $+1$ with probabilities $0.9$ (arm A) and $0.4$ (arm B), but the agent does not know this. It starts with $Q(A)=Q(B)=0$ and always pulls the arm with the larger estimate, breaking ties at random. Suppose its first pull of A returns $0$ and its first pull of B returns $+1$. What does the greedy agent do from then on, and what is the name of the problem?","hints":["After those two pulls compare $Q(A)$ with $Q(B)$, and ask what would make the estimate of A change."],"answer":"$Q(B)=1>Q(A)=0$, so it keeps pulling B; A's estimate is never corrected. It fails to explore.","answer_type":"free-text","solution":"After the two pulls $Q(A)=0$ and $Q(B)=1$, so greedy pulls B. B then returns $+1$ with probability $0.4$ and $0$ otherwise, so $Q(B)$ drifts down towards $0.4$, which is still larger than $Q(A)=0$. The agent never pulls A again, so the unlucky first sample of A is never corrected and the agent loses reward forever. This is the exploration-exploitation trade-off: pure exploitation can lock onto a sub-optimal arm after noisy early data, so regret grows linearly. UCB, $\\epsilon$-greedy and Thompson sampling all fix this by sometimes trying arms whose estimates are uncertain; this is the idea needed in the greedy-vs-UCB bandit question. Trap: thinking the problem disappears with enough time. It does not, because the agent stops collecting data about A.","category":"rl","kind":"basics","difficulty":"easy","tags":["bandits","exploration","greedy"],"origin":"original","status":"self-marked","leads_to":["m-rl-bandit-greedy-ucb","m-rl-thompson-prob-calc"]},{"id":"m-rl-f-ucb-index","title":"Computing one UCB index","prompt":"UCB picks $\\arg\\max_a\\big[Q(a)+c\\sqrt{\\ln t/N(a)}\\big]$. At time $t=10$ with $c=1$, arm $a$ has $Q(a)=0.5$ and has been pulled $N(a)=4$ times. What is its UCB index? (Use the natural logarithm, and give 3 decimal places.)","hints":["$\\ln 10\\approx2.3026$. Divide by 4, take the square root, then add $0.5$."],"answer":"$\\approx1.259$","answer_type":"numeric","answer_value":1.2587,"solution":"The bonus is $\\sqrt{\\ln10/4}=\\sqrt{0.5756}=0.7587$, so the index is $0.5+0.7587=1.2587$. The first term rewards arms that look good, the second rewards arms that have been tried few times: the bonus shrinks as $N(a)$ grows, but grows slowly with $\\ln t$ so that an ignored arm is eventually tried again. Computing indices like this by hand, for all arms, is exactly what part (b) of the greedy-vs-UCB bandit question asks. Trap: using $\\log_{10}$ or forgetting the square root.","category":"rl","kind":"basics","difficulty":"easy","tags":["UCB","bandits","exploration bonus"],"origin":"original","status":"verified","leads_to":["m-rl-bandit-greedy-ucb"],"entry":"Enter the UCB index of arm $a$ at $t=10$ (natural log)."},{"id":"m-rl-f-beta-posterior-mean","title":"Beta posterior for a Bernoulli arm","prompt":"An arm pays $1$ with unknown probability $\\theta$ and $0$ otherwise. With a uniform $\\text{Beta}(1,1)$ prior you observe $3$ successes and $1$ failure. (a) What is the posterior distribution of $\\theta$? (b) What is its mean?","hints":["Add successes to the first parameter and failures to the second. The mean of $\\text{Beta}(a,b)$ is $a/(a+b)$."],"answer":"(a) $\\text{Beta}(4,2)$. (b) $4/6=2/3\\approx0.667$.","answer_type":"numeric","answer_value":0.6666666667,"solution":"The Beta prior is conjugate to the Bernoulli likelihood: the posterior is $\\text{Beta}(1+3,\\,1+1)=\\text{Beta}(4,2)$, with mean $4/(4+2)=2/3$. Thompson sampling draws one sample $\\theta$ from each arm's posterior and plays the arm with the largest draw. A useful fact for the Thompson probability question: if the rival arm is still $\\text{Beta}(1,1)=\\text{Uniform}(0,1)$, then $P(\\theta_{\\text{rival}}<x)=x$, so the probability that this arm wins equals $\\mathbb E[\\theta]$, here $2/3$. Trap: taking the posterior mean as $3/4$ (the raw success frequency) and forgetting the prior pseudo-counts.","category":"rl","kind":"basics","difficulty":"easy","tags":["Thompson sampling","Beta distribution","conjugacy"],"origin":"original","status":"verified","leads_to":["m-rl-thompson-prob-calc","m-rl-bandit-greedy-ucb"],"entry":"Enter the posterior mean of $\\theta$ (work out the posterior distribution too; the solution covers it)."},{"id":"m-rl-f-bellman-backup","title":"One Bellman backup for a state value","prompt":"In state $s$ a policy picks action 1 with probability $0.5$ and action 2 with probability $0.5$. Action 1 gives reward $1$ and moves deterministically to a state with value $10$. Action 2 gives reward $0$ and moves deterministically to a state with value $4$. With $\\gamma=0.9$, what is $v_\\pi(s)$?","hints":["$v_\\pi(s)=\\sum_a\\pi(a\\mid s)\\,[\\,r+\\gamma v(s')\\,]$."],"answer":"$6.8$","answer_type":"numeric","answer_value":6.8,"solution":"Action 1 is worth $1+0.9\\times10=10$ and action 2 is worth $0+0.9\\times4=3.6$. Averaging under the policy gives $0.5\\cdot10+0.5\\cdot3.6=6.8$. This is the Bellman expectation equation: the value of a state is the policy-weighted average of (reward now) plus (discounted value of where you land). Every later question, from the corridor value to the Bellman operator, is this same one-step look-ahead applied repeatedly. Trap: forgetting to discount the successor value, or adding the two action values instead of averaging them.","category":"rl","kind":"basics","difficulty":"easy","tags":["Bellman equation","state value","policy evaluation"],"origin":"original","status":"verified","leads_to":["m-rl-unreliable-corridor-value","m-rl-bellman-contraction"],"entry":"Enter $v_\\pi(s)$, the value of state $s$ under the 50/50 policy."},{"id":"m-rl-f-self-loop-value","title":"A Bellman equation with a self-loop","prompt":"In state $s$ the only action is: with probability $0.25$ the agent receives reward $2$ and the episode ends; with probability $0.75$ it receives reward $0$ and stays in $s$. With $\\gamma=0.8$, write the Bellman equation for $v(s)$ and solve it.","hints":["$v=0.25\\cdot2+0.75\\cdot\\gamma\\,v$. The unknown appears on both sides, so collect it on the left."],"answer":"$1.25$","answer_type":"numeric","answer_value":1.25,"solution":"Writing the equation, $v=0.25\\cdot2+0.75\\cdot0.8\\,v=0.5+0.6v$, so $0.4v=0.5$ and $v=1.25$. When a state can lead back to itself, you do not need to enumerate infinitely many paths: just write the Bellman equation, treat $v$ as an unknown and solve the resulting linear equation (with several states, a linear system). The terminal branch contributes no future value. This is the technique for the unreliable-corridor calculation, where the 'stay in place' probability creates exactly this self-loop. Trap: including a $\\gamma v$ term for the terminating branch, which has no successor.","category":"rl","kind":"basics","difficulty":"easy","tags":["Bellman equation","linear system","stochastic transitions"],"origin":"original","status":"verified","leads_to":["m-rl-unreliable-corridor-value"],"entry":"Enter $v(s)$ for $\\gamma=0.8$ (write the Bellman equation too; the solution covers it)."},{"id":"m-rl-f-td-update","title":"One TD(0) update","prompt":"A TD(0) agent has $V(s)=2$ and $V(s')=5$. It takes a step from $s$ to $s'$ and receives reward $r=1$. With $\\gamma=0.9$ and step size $\\alpha=0.1$: (a) what is the TD error $\\delta$? (b) what is the new value of $V(s)$?","hints":["$\\delta=r+\\gamma V(s')-V(s)$ and $V(s)\\leftarrow V(s)+\\alpha\\delta$."],"answer":"(a) $\\delta=3.5$. (b) $V(s)=2.35$.","answer_type":"numeric","answer_value":2.35,"solution":"The TD target is $r+\\gamma V(s')=1+4.5=5.5$, which is bigger than the current $V(s)=2$, so $\\delta=5.5-2=3.5$ and $V(s)\\leftarrow2+0.1\\times3.5=2.35$. TD bootstraps
