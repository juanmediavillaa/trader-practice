  var solved=SH.bank.filter(function(i){return shStatus(i.id)==="solved";}).length,due=shDueItems();
  var tools='<div class="card"><div class="cm-tools"><input type="search" id="sh-search" placeholder="Search questions" value="'+esc(SH.q)+'" aria-label="Search questions">'+
    sel("cat",cats,shIsML()?"Course":"Topic")+(shIsML()?sel("kind",Object.keys(ML_KINDS).map(function(k){return [k,ML_KINDS[k]];}),"Kind"):"")+sel("diff",[["easy","Easy"],["medium","Medium"],["hard","Hard"]],"Difficulty")+sel("st",[["unsolved","Unsolved"],["attempted","Attempted"],["solved","Solved"],["revealed","Revealed"]],"Status")+
    (shIsML()?'<button class="btn" data-shnextq="1">Next for me</button><button class="mini" data-shrandom="1">Random</button>':'<button class="btn" data-shrandom="1">Random unsolved</button>')+'</div><p class="small muted" style="margin:8px 0 0">'+SH.bank.length+' questions · '+solved+' solved · '+due.length+' due for review'+(shIsML()?' · “Next for me” climbs from basics to exam level'+(F.cat?' in '+esc(ML_CATS[F.cat]||F.cat):'')+'.':'')+'</p>'+
    (shIsML()?'<div class="small muted" style="margin-top:8px">Your path'+(F.cat?' in '+esc(ML_CATS[F.cat]||F.cat):'')+':</div>'+shPath(SH.bank.filter(function(i){return !F.cat||i.category===F.cat;})):'')+'</div>';
  var dueC=due.length?'<div class="card"><div class="card-h"><h2>Due for review</h2><span class="small">'+due.length+'</span></div><div class="cm-list all">'+due.map(shRow).join("")+'</div></div>':'';
  return tools+dueC+'<div class="card"><div class="card-h"><h2>Questions</h2><span class="small">'+list.length+' shown</span></div><div class="cm-list all sh-list">'+(list.length?list.map(shRow).join(""):'<p class="small muted">No question matches.</p>')+'</div></div>';}
/* ---- trainer screens ---- */

  if(SH.run){var R=SH.run,M=SH_MODES[R.mode]||{};return '<div class="card sh-round"><div class="sh-top"><span class="small">'+esc(shModeName(R.mode))+' · <b id="sh-score">'+shNet(R)+'</b> '+(R.penalty?'net':'right')+(R.max?' · question <span id="sh-prog">'+(R.n+1)+'</span> of '+R.max:'')+'</span><span class="small" id="sh-left"></span></div>'+
    '<div class="sh-barw"><i id="sh-bar"></i></div><div class="sh-q" id="sh-q">'+esc(R.cur.q)+'</div><input id="sh-in" class="sh-in" inputmode="decimal" autocomplete="off" aria-label="Answer">'+
    '<p class="small muted">'+(R.submit?'Enter submits'+(R.penalty?' · a wrong answer costs '+R.penalty+' point':'')+' · no skipping · Esc ends the round':'It moves on by itself when the answer is right · Tab skips · Esc ends the round')+'. Fractions as 3/8; decimals to at least 3 places.</p></div>';}
  var last=SH.last?'<div class="card"><div class="card-h"><h2>'+(SH.last.aborted?"Round stopped":"Round over")+'</h2><span class="small">'+esc(shModeName(SH.last.mode))+'</span></div><div class="kpis">'+kpi(SH.last.mode==="o80"?"Net score":"Score",String(SH.last.score))+kpi("Right",String(SH.last.right!=null?SH.last.right:SH.last.score))+kpi("Wrong or skipped",String(SH.last.wrong||0))+kpi("7-day average",shAvg7(SH.last.mode)==null?"—":String(shAvg7(SH.last.mode)))+'</div>'+
    (SH.last.mode==="classic"&&!SH.last.aborted?'<p class="small muted" style="margin-top:8px">Logged with your Zetamac scores too.</p>':'')+'<div class="cm-acts" style="margin-top:10px"><button class="btn" data-shstart="'+SH.last.mode+'">Again</button></div></div>':'';
  var types=SH_TYPES.map(function(t){return '<label class="sh-chk"><input type="checkbox" data-shtype="'+t[0]+'"'+(c.types[t[0]]?' checked':'')+'>'+esc(t[1])+'</label>';}).join("");
  var tests='<div class="card"><div class="card-h"><h2>Test replicas</h2><span class="small">formats from current trading screens</span></div>'+
    '<div class="sh-modes"><div><b>Optiver-style 80 in 8</b><p class="small muted">80 questions, 8 minutes, no calculator: integers, decimals, fractions, percentages and missing numbers. Enter submits; right +1, wrong −1. Around 55 net is often quoted as a pass line, 70+ as strong (candidate reports, not official).</p><button class="btn" data-shstart="o80">Start</button></div>'+
    '<div><b>Sequences test</b><p class="small muted">24 next-term questions in 12 minutes, like Akuna’s and Flow Traders’ number-sequence screens. Enter submits.</p><button class="btn" data-shstart="seq24">Start</button></div>'+
    '<div><b>Classic · 120s</b><p class="small muted">Zetamac’s ranges (+ − × ÷), moves on as soon as you’re right. Logged with your Zetamac scores.</p><button class="btn" data-shstart="classic">Start</button></div></div></div>';
  var start='<div class="card"><div class="card-h"><h2>Practice rounds</h2></div>'+
    '<div class="cm-acts"><button class="btn" data-shstart="custom">Custom round</button><button class="btn" data-shstart="weak">Weak spots</button></div>'+
    '<p class="small muted" style="margin:8px 0 12px">Both use the types below; Weak spots leans towards your slowest and least accurate.</p>'+
    '<div class="sh-types">'+types+'</div><div class="cm-acts" style="margin-top:10px"><label class="small">Length <select data-shdur="1">'+[60,120,180,300].map(function(s){return '<option value="'+s+'"'+(c.dur===s?' selected':'')+'>'+s+'s</option>';}).join("")+'</select></label>'+
    '<label class="sh-chk"><input type="checkbox" data-shhard="1"'+(c.hard?' checked':'')+'>Hard ranges</label></div></div>';
  var st7=shStats(7),st30=shStats(30),TN=Object.assign({o80:"Optiver-style mix"},SH_TN),rows=Object.keys(TN).filter(function(t){return st30[t];}).map(function(t){var a=st7[t],b=st30[t];

  var modes=Object.keys(SH_MODES).map(function(m){var r=(S.rounds||[]).filter(function(x){return x.mode===m&&!x.aborted;}).slice(-30);if(!r.length)return "";
    var mx=Math.max.apply(null,r.map(function(x){return x.score;}).concat([1])),w=280,h=50,pts=r.map(function(x,i){return (r.length<2?w/2:i*w/(r.length-1)).toFixed(1)+","+(h-4-(Math.max(0,x.score)/mx)*(h-10)).toFixed(1);}).join(" ");
