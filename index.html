classifier produces many more false positives than true positives, so precision is low although both sensitivity and specificity look high. Trap: confusing sensitivity (recall) with precision, and quoting accuracy or ROC AUC on imbalanced problems; report precision-recall, and consider the operating threshold and costs.","category":"core","kind":"calculation","difficulty":"easy","tags":["Bayes rule","precision","base rate","evaluation metrics"],"origin":"original","status":"verified","entry":"Enter the probability the case is truly positive given a positive flag, as a decimal between 0 and 1, not a percentage."},{"id":"m-core-log-loss-value","title":"Log loss of a small set of predictions","prompt":"A binary classifier outputs probabilities $0.9,\\,0.8,\\,0.3,\\,0.6$ of the positive class for four examples with true labels $1,\\,1,\\,0,\\,0$. Compute the mean cross-entropy (log loss) in nats, to 4 decimal places.","hints":["Take the log of the probability assigned to the true class."],"answer":"$-\\frac14(\\ln0.9+\\ln0.8+\\ln0.7+\\ln0.4)\\approx0.4004$.","answer_type":"numeric","answer_value":0.4004,"solution":"The probability assigned to the true class is $0.9,\\,0.8,\\,0.7,\\,0.4$, so the log loss is $-\\frac14(\\ln0.9+\\ln0.8+\\ln0.7+\\ln0.4)=\\frac14(0.1054+0.2231+0.3567+0.9163)=\\frac{1.6015}{4}\\approx0.4004$ nats. For reference a constant prediction of $0.5$ gives $\\ln2=0.693$.\n\nIntuition: log loss punishes confident mistakes heavily; the worst example (true label 0 predicted 0.6) dominates. Trap: using the wrong class for the log (use $1-p$ for negatives), mixing nats and bits, and reading a lower log loss as better accuracy: log loss measures probability quality (calibration and sharpness), accuracy only thresholds.","category":"core","kind":"calculation","difficulty":"easy","tags":["cross-entropy","log loss","evaluation metrics"],"origin":"original","status":"verified","entry":"Enter the mean cross-entropy (log loss) over the four examples, in nats (natural log)."},{"id":"m-core-calibration","title":"Calibration: what it is and how to fix it","prompt":"What does it mean for a classifier to be calibrated? How would you measure it, which common models are poorly calibrated and why, and how would you fix it? When does calibration matter more than accuracy?","hints":["Reliability diagram, ECE, Brier score, temperature scaling."],"answer":"A model is calibrated if $P(y=1\\mid \\hat p=p)=p$. Measure with reliability diagrams, ECE and Brier score; fix on held-out data with temperature scaling, Platt scaling or isotonic regression. It matters when probabilities drive decisions.","answer_type":"free-text","solution":"A classifier is calibrated if among all inputs predicted with probability $p$, a fraction $p$ are positive. Measure it with a reliability diagram (bin predictions, plot mean predicted probability against observed frequency), the expected calibration error $\\sum_b\\frac{|B_b|}{n}|\\mathrm{acc}_b-\\mathrm{conf}_b|$ (sensitive to binning), and proper scoring rules such as log loss and the Brier score, which combine calibration and sharpness.\n\nPoor calibration: modern deep networks are over-confident (trained to near-zero loss with cross-entropy, large capacity), naive Bayes pushes probabilities to the extremes, and SVMs and boosted trees give uncalibrated scores (random forests tend to be under-confident near 0 and 1); class re-weighting or resampling shifts the base rate. Fixes are done on a held-out set: temperature scaling (one parameter $T$ dividing the logits, preserves accuracy), Platt scaling (logistic regression on the score), isotonic regression (non-parametric, needs more data), or use proper losses plus ensembling.\n\nCalibration matters when probabilities are used directly: expected-cost decisions and thresholds, ranking mixed with other risk estimates, medical or financial risk, active learning, and LLM confidence. Trap: calibration is not discrimination, so a calibrated model can be useless (always predicting the base rate); and calibration drifts under distribution shift.","category":"core","kind":"concept","difficulty":"medium","tags":["calibration","temperature scaling","reliability diagram","ECE"],"origin":"original","status":"self-marked"},{"id":"m-core-kl-cross-entropy","title":"Why we minimise cross-entropy: KL, MLE and cross-entropy","prompt":"Define entropy, cross-entropy and KL divergence, and show how they relate. Why is maximum likelihood training the same as minimising cross-entropy between the empirical data distribution and the model, and why is $\\mathrm{KL}(p\\|q_\\theta)$ the natural direction for training while the reverse direction behaves differently?","hints":["$H(p,q)=H(p)+\\mathrm{KL}(p\\|q)$."],"answer":"$H(p,q)=-\\sum p\\log q=H(p)+\\mathrm{KL}(p\\|q)$. Since $H(p)$ does not depend on $\\theta$, maximum likelihood minimises $\\mathrm{KL}(\\hat p_{data}\\|q_\\theta)$; forward KL is mean-covering, reverse KL is mode-seeking.","answer_type":"free-text","solution":"Entropy $H(p)=-\\sum_xp(x)\\log p(x)$ is the minimal expected code length; cross-entropy $H(p,q)=-\\sum_xp(x)\\log q(x)$ is the expected code length when using a code for $q$; and $\\mathrm{KL}(p\\|q)=\\sum_xp\\log\\frac pq=H(p,q)-H(p)\\ge0$ (Gibbs' inequality), with equality iff $p=q$.\n\nFor data $x_1,\\dots,x_n$ the average log-likelihood $\\frac1n\\sum_i\\log q_\\theta(x_i)=\\mathbb{E}_{\\hat p}\\log q_\\theta=-H(\\hat p,q_\\theta)$, where $\\hat p$ is the empirical distribution. So maximising likelihood is minimising cross-entropy, which equals $\\mathrm{KL}(\\hat p\\|q_\\theta)$ up to the constant $H(\\hat p)$. This is also why classification uses softmax cross-entropy, and language models are trained with next-token cross-entropy (perplexity is its exponential).\n\nDirection: forward KL $\\mathrm{KL}(p\\|q)$ is infinite if $q$ is zero where $p$ is not, so $q$ must cover all modes (mean-seeking, may be blurry); reverse KL $\\mathrm{KL}(q\\|p)$, used in variational inference, lets $q$ lock onto one mode (mode-seeking, under-estimates variance). Trap: KL is not a distance (asymmetric, no triangle inequality), and cross-entropy numbers are only comparable if the log base and the data distribution are the same.","category":"core","kind":"concept","difficulty":"medium","tags":["KL divergence","cross-entropy","MLE","entropy"],"origin":"original","status":"self-marked"},{"id":"m-core-overfitting-diagnosis","title":"Training loss low, validation loss high","prompt":"You train a classifier: training accuracy is 99% and validation accuracy is 78%. Your interviewer asks what you would do. Walk through how you diagnose the problem, which causes you would rule out first, and what you try in what order. How would you decide between getting more data, regularising or simplifying the model?","hints":["Before regularising, check that the gap is real."],"answer":"Rule out leakage or a mismatch between train and validation first, then look at learning curves: a persistent gap that closes with more data is high variance. Try more data or augmentation, regularisation, early stopping, a simpler model; check validation size and noise.","answer_type":"free-text","solution":"First check the evaluation: is the validation set large enough that 78% is not noise (confidence interval), is it drawn from the same distribution as training (time, user, source), and is there leakage or duplicates in the training set that would make training accuracy meaningless? A gap from a distribution shift is not fixed by regularisation. Then plot learning curves (error versus training set size) and train versus validation loss over epochs. A large and persistent gap that shrinks with more data indicates high variance (overfitting); both curves high and close indicates high bias (under-fitting), where you need a richer model or better features instead.\n\nRemedies for variance in rough order of cost: more or better data and augmentation; early stopping on validation loss; stronger regularisation (weight decay, dropout, smaller $k$ or tree depth, pruning); a smaller model or fewer features; ensembling or bagging; transfer learning from a pre-trained model. Use cross-validation to choose among them, and keep a final test set. Which one helps is diagnosed by the learning curve: if validation error is still falling at the largest $n$, more data pays off.\n\nTrap: tuning against the same validation set many times overfits to it, and a lower training score from regularisation is expected, not a failure. Check per-class and per-slice errors for a systematic cause.","category":"core","kind":"scenario","difficulty":"medium","tags":["overfitting","learning curves","diagnosis","regularisation"],"origin":"original","status":"self-marked"},{"id":"m-core-imbalanced-metrics","title":"Fraud detection with 0.2% positives: choosing metrics","prompt":"Your fraud model has 99.8% accuracy on a test set where 0.2% of transactions are fraudulent. A stakeholder is delighted. Explain what is wrong, which metrics you would report instead, how you would choose a threshold, and what changes if the cost of a missed fraud is 50 times the cost of a false alarm.","hints":["What accuracy does the trivial classifier have?"],"answer":"Always predicting 'not fraud' also scores 99.8%. Report precision, recall, PR curve / average precision, and cost-weighted metrics at a chosen threshold; with a 50:1 cost ratio the optimal threshold on a calibrated probability is $1/51$.","answer_type":"free-text","solution":"A trivial classifier that always predicts \"legitimate\" already scores 99.8%, so accuracy carries no information at this base rate. Report the confusion matrix at the operating point, recall (share of frauds caught), precision (share of flags that are fraud), the precision-recall curve and average precision (ROC AUC can look good because the huge number of negatives keeps the false-positive rate small), and, if available, money saved. Use stratified or time-based splits and enough positives to get confidence intervals.\n\nThreshold: choose it from the costs and capacity, not at 0.5. With a calibrated probability $p$, flag when the expected cost of ignoring exceeds the cost of flagging: $p\\,C_{FN}>(1-p)\\,C_{FP}$, i.e. $p>\\frac{C_{FP}}{C_{FP}+C_{FN}}=\\frac1{51}\\approx0.02$ when $C_{FN}=50\\,C_{FP}$. If analysts can only review a fixed number of cases per day, pick the threshold that fills that budget and report precision at $k$. Calibrate the model first (class re-weighting or resampling distort probabilities).\n\nTraining tips: class weights, focal loss or under-sampling the majority class, then re-calibrate. Trap: oversampling before splitting leaks duplicates into the validation set; and monitor drift, since fraudsters adapt.","category":"core","kind":"scenario","difficulty":"medium","tags":["imbalanced data","precision-recall","threshold","cost-sensitive"],"origin":"original","status":"self-marked"},{"id":"m-core-loss-not-decreasing","title":"Training loss does not go down (or goes to NaN)","prompt":"A neural network's training loss stays flat at roughly $\\ln K$ for a $K$-class problem, and in another run it explodes to NaN after a few hundred steps. How do you debug each case? Give a checklist ordered by how quickly you can test each hypothesis.","hints":["$\\ln K$ is the loss of a uniform prediction. Try overfitting one batch."],"answer":"Flat at $\\ln K$ means the network predicts uniformly: check data/labels pipeline, learning rate, initialisation and dead activations; overfit a tiny batch. NaN: learning rate too high, bad numerics (log of 0, softmax overflow), exploding gradients; add clipping and check inputs.","answer_type":"free-text","solution":"Flat at $\\ln K$: the model outputs the uniform distribution, so it has learnt nothing. Fastest tests first: (1) overfit a single small batch, which a correct pipeline must memorise; if not, there is a bug. (2) Check the data and labels (shuffled or misaligned labels, wrong preprocessing, all-zero inputs, label noise), print a few examples with their targets. (3) Learning rate: too small is flat, too large oscillates; run a learning-rate sweep on a log scale. (4) Initialisation and normalisation: dead ReLUs, vanishing signals, features on very different scales, a missing normalisation layer. (5) Loss and optimiser wiring: wrong reduction, logits passed through softmax twice, gradients not zeroed or not reaching parameters (frozen layers, detached tensors). Check gradient norms per layer.\n\nNaN: (1) too high a learning rate or no warmup (lower it, add warmup). (2) Numerical issues: $\\log 0$, division by zero, softmax or exp overflow (use log-sum-exp and fused log-softmax cross-entropy), and mixed-precision overflow (use loss scaling or bf16). (3) Exploding gradients: clip the global norm (e.g. 1.0). (4) Bad data: NaNs or extreme values in the inputs, a division in feature normalisation, empty batches. Find the first step at which it occurs by logging the loss and gradient norm, and turn on anomaly detection.\n\nTrap: changing several things at once; change one factor and test on a tiny subset.","category":"core","kind":"scenario","difficulty":"medium","tags":["debugging","learning rate","initialisation","numerical stability"],"origin":"original","status":"self-marked"},{"id":"m-core-p-greater-n","title":"More features than samples: choosing the model","prompt":"You have $n=300$ patients and $p=20{,}000$ gene-expression features and want to predict a binary outcome. Describe your approach: why ordinary least squares or unregularised logistic regression fails, which methods you would try, how you would select hyperparameters and report performance honestly, and what pitfalls you expect.","hints":["Think about the rank of $X^\\top X$ and about where feature selection happens relative to cross-validation."],"answer":"With $p\\gg n$ the unregularised problem is under-determined (separable, $X^\\top X$ singular). Use ridge, lasso or elastic net (or PCA, or a simple baseline), tune $\\lambda$ with nested CV with all selection inside the folds, and report with confidence intervals.","answer_type":"free-text","solution":"With $p\\gg n$, $X^\\top X$ has rank at most $n$, so OLS has infinitely many exact interpolating solutions and logistic regression is almost surely linearly separable, so the MLE diverges. We need regularisation or dimension reduction. Candidates: ridge (stable, uses all features, equals the minimum-norm solution as $\\lambda\\to0$), lasso or elastic net (sparse, interpretable; elastic net handles correlated genes), PCA or PLS followed by a simple model, and a strong simple baseline such as a regularised linear model or a small tree ensemble. Standardise the features and handle batch effects.\n\nHonest evaluation: choose $\\lambda$ by cross-validation inside an outer loop (nested CV), with feature screening, scaling and any tuning done only on the training folds; selecting the top genes on all 300 patients and then cross-validating gives wildly optimistic estimates. Use stratified folds, repeat the CV with different seeds, and report the spread or a bootstrap confidence interval; with $n=300$ the estimate is noisy. Check stability of the selected features across folds, and validate on an external cohort if possible.\n\nPitfalls: confounders such as site or batch that the model can exploit, multiple testing in screening, and interpreting lasso coefficients causally. Trap: using a flexible nonlinear model without enough data.","category":"core","kind":"scenario","difficulty":"hard","tags":["high-dimensional","regularisation","nested CV","lasso","ridge"],"origin":"original","status":"self-marked"},{"id":"m-softmax-ce-gradient","title":"Gradient of softmax cross-entropy","prompt":"A classifier (or an LLM's next-token head) produces logits $z\\in\\mathbb{R}^K$, with $p=\\mathrm{softmax}(z)$ and loss $L=-\\sum_k y_k\\log p_k$ for a one-hot target $y$. Derive $\\partial L/\\partial z_j$. Then explain why this form makes training with cross-entropy better behaved than squared error on the probabilities.","hints":["First get $\\partial p_k/\\partial z_j$ for the softmax.","Use $\\sum_k y_k=1$."],"answer":"$\\partial L/\\partial z_j = p_j - y_j$: predicted probability minus target.","answer_type":"free-text","solution":"The softmax Jacobian is $\\partial p_k/\\partial z_j = p_k(\\delta_{kj}-p_j)$. Then $\\partial L/\\partial z_j = -\\sum_k y_k \\frac{1}{p_k}p_k(\\delta_{kj}-p_j) = -y_j + p_j\\sum_k y_k = p_j - y_j$. The log in the loss cancels the exponential in the softmax, so the gradient is bounded by 1 in magnitude and does not vanish when the model is confidently wrong. With squared error on $p$ there is an extra factor $p_k(1-p_k)$ from the softmax Jacobian, so a saturated wrong prediction ($p\\approx 0$ for the true class) gets almost no gradient and learning stalls. Intuition: the error signal at the logits is simply 'what you said minus what was true'. Trap: forgetting that the gradient also flows to the other logits through the normaliser, and computing softmax then log separately (use log-sum-exp for numerical stability).","category":"dl","kind":"derivation","difficulty":"easy","tags":["backprop","softmax","cross-entropy"],"origin":"original","status":"self-marked"},{"id":"m-init-variance-xavier-he","title":"Why Xavier and He initialisation scale as they do","prompt":"Consider a layer $y_i=\\sum_{j=1}^{n_{in}} w_{ij}x_j$ with independent zero-mean weights of variance $\\sigma_w^2$ and inputs of zero mean and variance $\\sigma_x^2$. Derive the weight variance that keeps the forward signal variance constant, and say how it changes for a ReLU network. What goes wrong in a 100-layer network if you simply use $\\sigma_w=0.1$ with $n_{in}=1000$?","hints":["$\\mathrm{Var}(y_i)=n_{in}\\sigma_w^2\\sigma_x^2$.","ReLU zeroes half the pre-activations."],"answer":"$\\sigma_w^2=1/n_{in}$ (Xavier uses $2/(n_{in}+n_{out})$); with ReLU $\\sigma_w^2=2/n_{in}$ (He). Otherwise the signal grows or shrinks geometrically with depth.","answer_type":"free-text","solution":"By independence and zero means, $\\mathrm{Var}(y_i)=n_{in}\\sigma_w^2\\sigma_x^2$, so we need $n_{in}\\sigma_w^2=1$ to preserve variance in the forward pass. The same argument on the backward pass gives $\\sigma_w^2=1/n_{out}$, and Glorot/Xavier takes the compromise $2/(n_{in}+n_{out})$. ReLU sets half of the pre-activations to zero, so the second moment of the output is $\\tfrac12\\mathrm{Var}(y)$, which He initialisation compensates with $\\sigma_w^2=2/n_{in}$. With $\\sigma_w=0.1$ and $n_{in}=1000$ the per-layer gain is $n_{in}\\sigma_w^2=10$, so activations grow by a factor of 10 in variance per layer, giving $10^{100}$ over 100 layers: overflow in the forward pass and exploding gradients (and the mirror image, vanishing, if the gain is below 1). Intuition: initialisation is about making every layer roughly variance-preserving so gradients are usable at step zero. Trap: this analysis ignores residual connections and normalisation layers, which is why modern transformers also scale residual-branch outputs by $1/\\sqrt{2L}$ or similar.","category":"dl","kind":"derivation","difficulty":"medium","tags":["initialisation","Xavier","He","gradients"],"origin":"original","status":"self-marked"},{"id":"m-layernorm-vs-batchnorm","title":"LayerNorm, RMSNorm and BatchNorm in transformers","prompt":"Why do transformers use LayerNorm (or RMSNorm) instead of BatchNorm? Describe what each normalises over, and explain the difference between pre-LN and post-LN placement and why most large models use pre-LN or a variant.","hints":["Think about batch size one at inference and variable-length sequences."],"answer":"LayerNorm normalises over features within each token, so it is batch independent and identical at train and test time. Pre-LN keeps an identity path on the residual stream and trains more stably.","answer_type":"free-text","solution":"BatchNorm normalises each feature over the batch (and positions), using running statistics at inference, so it depends on batch size, breaks with padding and variable lengths, and has a train/eval discrepancy. LayerNorm computes the mean and variance over the feature dimension of each token, $\\hat x=(x-\\mu)/\\sqrt{\\sigma^2+\\epsilon}$ times a learned gain (and bias), so it is per-token, independent of batch, and identical in training and inference. RMSNorm drops the mean-centring and bias, $x/\\mathrm{rms}(x)\\cdot g$, which is cheaper and works as well in practice (Llama-style models). In post-LN the norm sits after the residual addition, so gradients near the output are large at initialisation and need careful warm-up. In pre-LN the norm sits on the branch input and the residual stream stays an unnormalised identity path, which keeps gradients well scaled and allows larger learning rates and less warm-up. Trap: pre-LN can let the residual stream's norm grow with depth and slightly weakens the deep layers, hence variants such as extra post-norms or QK-norm.","category":"dl","kind":"concept","difficulty":"medium","tags":["normalisation","transformer","RMSNorm"],"origin":"original","status":"self-marked"},{"id":"m-attention-scaling-sqrt-dk","title":"Why scaled dot-product attention divides by $\\sqrt{d_k}$","prompt":"In scaled dot-product attention the logits are $q^\\top k/\\sqrt{d_k}$. Show why the scaling is needed, assuming the components of $q$ and $k$ are independent with zero mean and unit variance. What happens to the softmax and its gradients without it?","hints":["Compute $\\mathrm{Var}(q^\\top k)$.","Recall $\\partial p_i/\\partial z_j=p_i(\\delta_{ij}-p_j)$."],"answer":"$\\mathrm{Var}(q^\\top k)=d_k$, so dividing by $\\sqrt{d_k}$ restores unit variance and avoids a saturated softmax with vanishing gradients.","answer_type":"free-text","solution":"$q^\\top k=\\sum_{i=1}^{d_k}q_ik_i$ is a sum of $d_k$ independent zero-mean terms each of variance $1$, so $\\mathbb{E}[q^\\top k]=0$ and $\\mathrm{Var}(q^\\top k)=d_k$, i.e. the standard deviation is $\\sqrt{d_k}$. Dividing by $\\sqrt{d_k}$ gives logits with unit variance regardless of head dimension. Without it, for $d_k=128$ the logits have a standard deviation of about 11, so the softmax is nearly one-hot: one key gets almost all the weight and the Jacobian $p_i(\\delta_{ij}-p_j)$ is near zero, so the queries and keys receive vanishing gradients. Intuition: the scaling keeps the softmax temperature independent of head size. Trap: the assumption is about initialisation; during training the logits can still grow (attention entropy collapse), which is why some models add QK-norm or logit soft-capping.","category":"dl","kind":"derivation","difficulty":"medium","tags":["attention","transformer","softmax"],"origin":"original","status":"self-marked"},{"id":"m-kv-cache-memory-gqa","title":"KV-cache memory with grouped-query attention","prompt":"A decoder-only model has 32 layers, 32 query heads and 8 key/value heads (grouped-query attention) with head dimension 128. The KV cache is stored in 16-bit floats (2 bytes). How many GiB of KV cache does one sequence of 8192 tokens need? ($1\\,\\mathrm{GiB}=2^{30}$ bytes.) Answer as a number of GiB.","hints":["Both keys and values are cached, at every layer."],"answer":"1 GiB","answer_type":"numeric","answer_value":1.0,"solution":"Per token and per layer we store $K$ and $V$, each with $n_{kv}\\cdot d_h=8\\cdot128=1024$ values, so $2\\cdot1024=2048$ values, i.e. 4096 bytes at 16 bits. Over 32 layers that is $131{,}072$ bytes per token, and over 8192 tokens $2\\cdot32\\cdot8\\cdot128\\cdot8192\\cdot2 = 2^{30}$ bytes, i.e. exactly 1 GiB. With full multi-head attention (32 KV heads) the cache would be 4 GiB, so GQA gives a 4x saving, which directly raises the number of concurrent sequences you can batch. Intuition: decoding is memory-bandwidth bound, and the cache grows linearly in sequence length and batch size. Trap: forgetting the factor 2 for keys and values, or using the number of query heads instead of KV heads.","category":"dl","kind":"calculation","difficulty":"easy","tags":["KV cache","GQA","inference","memory"],"origin":"original","status":"verified","entry":"Enter the KV cache size for one 8192-token sequence, in GiB."},{"id":"m-flash-attention-io","title":"What FlashAttention changes and what it doesn't","prompt":"Explain how FlashAttention speeds up attention without changing the result. Where is the bottleneck in standard attention, what does tiling with an online softmax do, and does it change the asymptotic FLOPs or the memory?","hints":["Think about reads and writes to GPU high-bandwidth memory (HBM) versus on-chip SRAM."],"answer":"It is exact attention, but IO-aware: it never materialises the $N\\times N$ matrix in HBM, so memory is linear in $N$ and runtime falls because of fewer HBM reads and writes; FLOPs stay $O(N^2d)$.","answer_type":"free-text","solution":"Standard attention computes $S=QK^\\top$, writes the $N\\times N$ matrix to HBM, reads it back for the softmax, writes $P$, then reads it again for $PV$; it is memory-bandwidth bound, not FLOP bound. FlashAttention tiles $Q$, $K$, $V$ into blocks that fit in on-chip SRAM and computes the softmax incrementally: for each query block it keeps a running row maximum $m$ and normaliser $\\ell$, and when a new key block arrives it rescales the previous partial output by $e^{m_{old}-m_{new}}$. The result is mathematically identical to exact attention (up to floating-point rounding). Memory for activations drops from $O(N^2)$ to $O(N)$, because the backward pass recomputes the blocks instead of storing $P$; the FLOPs are still $O(N^2d)$ (slightly more because of recomputation), but wall-clock is 2-4x better thanks to far fewer HBM accesses. Trap: it is not an approximation like sparse or linear attention; and it speeds up training and prefill, whereas single-token decoding remains dominated by reading the KV cache.","category":"dl","kind":"concept","difficulty":"medium","tags":["FlashAttention","attention","GPU","memory"],"origin":"original","status":"self-marked"},{"id":"m-tokenisation-bpe-failures","title":"Tokenisation problems in a Spanish product","prompt":"You are adapting a mostly English LLM to a Spanish-language support product. You notice (a) token counts per document are about 1.6x higher than for English, (b) the model is unreliable at arithmetic on long numbers and at 'how many letters are in this word', and (c) a few odd user strings make it behave strangely. Explain BPE well enough to account for all three, and say what you would do about each.","hints":["BPE merges the most frequent adjacent pairs in the training corpus."],"answer":"BPE vocabularies reflect the training corpus: under-represented languages get longer token sequences, numbers and words are chunked inconsistently, and rare tokens are under-trained. Options: measure fertility, extend vocab or continue pretraining, normalise inputs and handle arithmetic with tools.","answer_type":"free-text","solution":"BPE starts from bytes or characters and greedily merges the most frequent adjacent pair until the vocabulary is full, so common English strings become single tokens while Spanish words with accents or rarer morphology split into several pieces. (a) is high 'fertility' (tokens per word): it raises cost, latency and context usage, and I would measure it on real traffic and consider a model with a more multilingual tokenizer, or vocabulary extension with new embeddings initialised from the mean of the sub-token embeddings and followed by continued pretraining. (b) Numbers are chunked inconsistently (for example '1234' versus '12' '34'), and the model never sees characters inside a token, so digit arithmetic and spelling are harder; the fix is tokenisation that splits digits individually, or better still routing arithmetic and counting to code or a calculator tool. (c) Rare or never-seen tokens (such as 'glitch' strings) have barely trained embeddings, so I would normalise whitespace and unicode, filter or test odd inputs, and add them to the evaluation set. Trap: changing the tokenizer after pretraining without retraining invalidates the embeddings; the cheap fixes are in the application layer.","category":"dl","kind":"scenario","difficulty":"medium","tags":["tokenisation","BPE","multilingual","LLM"],"origin":"original","status":"self-marked"},{"id":"m-decoding-temperature-calc","title":"Effect of temperature on a next-token distribution","prompt":"A language model outputs logits $(2,1,0)$ for three candidate tokens. What probability does the top token get when sampling at temperature $T=0.5$ (i.e. $p_i\\propto e^{z_i/T}$)? Give a number between 0 and 1.","hints":["Divide the logits by $T$ first."],"answer":"0.8668","answer_type":"numeric","answer_value":0.8668133321973348,"solution":"Dividing by $T=0.5$ gives logits $(4,2,0)$, so $p_1=e^4/(e^4+e^2+e^0)=54.60/62.99\\approx0.867$. At $T=1$ it would be $e^2/(e^2+e+1)=0.665$, so lowering the temperature sharpens the distribution; $T\\to0$ is greedy decoding and $T\\to\\infty$ is uniform. Temperature rescales logits for all tokens, whereas top-$k$ and top-$p$ (nucleus) truncate the tail and renormalise, which removes the long tail of low-probability garbage that temperature alone does not. Trap: temperature near 0 is not 'more correct', it just removes diversity, and it can cause repetition loops in long generations.","category":"dl","kind":"calculation","difficulty":"easy","tags":["decoding","temperature","sampling"],"origin":"original","status":"verified","entry":"Enter the probability of the top token at $T=0.5$, as a number between 0 and 1."},{"id":"m-lora-mechanics","title":"How LoRA works and when to prefer it","prompt":"Explain LoRA: the parametrisation, the initialisation of the two factors, the $\\alpha/r$ scaling, what it costs at inference, and how QLoRA changes the memory picture. When would you still choose full fine-tuning?","hints":["The update is constrained to low rank."],"answer":"$W' = W + \\tfrac{\\alpha}{r}BA$ with $B=0$ at init, so training starts from the base model; adapters can be merged for zero inference overhead; QLoRA keeps the frozen base in 4-bit.","answer_type":"free-text","solution":"For a frozen weight $W\\in\\mathbb{R}^{d\\times k}$, LoRA learns an update $\\Delta W=\\tfrac{\\alpha}{r}BA$ with $B\\in\\mathbb{R}^{d\\times r}$, $A\\in\\mathbb{R}^{r\\times k}$ and $r\\ll\\min(d,k)$. $A$ is initialised randomly and $B$ at zero, so $\\Delta W=0$ at the start and the model begins exactly at the base model; the $\\alpha/r$ factor keeps the update magnitude roughly constant when you change the rank. It trains $r(d+k)$ parameters instead of $dk$, and optimizer state and gradients are only needed for those, which cuts memory and lets you store many task adapters per base model. At inference you can merge $W+\\Delta W$ for zero extra latency or keep adapters separate for multi-tenant serving. QLoRA stores the frozen base in 4-bit NormalFloat with double quantisation and trains bf16 adapters through it, so a 65B model can be tuned on one 48 GB GPU. Choose full fine-tuning when you need to teach substantial new knowledge or a big distribution shift, you have lots of data and compute, or LoRA at higher ranks still underperforms: LoRA tends to learn less but also forget less. Trap: LoRA does not make the forward and activations memory smaller, and target modules and learning rate matter more than rank.","category":"dl","kind":"concept","difficulty":"medium","tags":["LoRA","QLoRA","fine-tuning","PEFT"],"origin":"original","status":"self-marked"},{"id":"m-lora-parameter-count","title":"Counting LoRA trainable parameters","prompt":"A transformer has 32 layers and hidden size 4096. You attach rank-8 LoRA adapters to the four attention projections ($W_q, W_k, W_v, W_o$, each $4096\\times4096$) in every layer. How many trainable parameters does LoRA add? Give an integer.","hints":["One adapter on a $d\\times d$ matrix has $2dr$ parameters."],"answer":"8388608","answer_type":"numeric","answer_value":8388608.0,"solution":"Each adapter has $B\\in\\mathbb{R}^{4096\\times8}$ and $A\\in\\mathbb{R}^{8\\times4096}$, so $2\\cdot4096\\cdot8=65{,}536$ parameters. There are $4\\times32=128$ adapted matrices, giving $128\\cdot65{,}536=8{,}388{,}608\\approx8.4$M trainable parameters. Each full projection has $4096^2\\approx16.8$M parameters, so one adapter is only about 0.4 percent of the matrix it modifies, and the 8.4M total is around 0.1 percent of a 7B model. Intuition: the cost is linear in rank and in the number of adapted matrices, not quadratic in the hidden size. Trap: counting only $A$ or only $B$, or forgetting to multiply by the number of layers and target modules.","category":"dl","kind":"calculation","difficulty":"easy","tags":["LoRA","parameter counting","fine-tuning"],"origin":"original","status":"verified","entry":"Enter the total number of trainable LoRA parameters added across all 32 layers, as an integer."},{"id":"m-dpo-derivation","title":"Deriving the DPO loss from the RLHF objective","prompt":"The RLHF objective is $\\max_\\pi \\mathbb{E}_{x,y\\sim\\pi}[r(x,y)]-\\beta\\,\\mathrm{KL}(\\pi\\,\\|\\,\\pi_{ref})$. Show how Direct Preference Optimisation (DPO) arrives at a classification-style loss on preference pairs $(x,y_w,y_l)$ without training a reward model or running PPO. State the final loss and the role of $\\beta$.","hints":["Solve the KL-regularised problem in closed form, then invert it for $r$.","Use the Bradley-Terry model $p(y_w\\succ y_l)=\\sigma(r(y_w)-r(y_l))$."],"answer":"$\\mathcal{L}=-\\log\\sigma\\!\\big(\\beta[\\log\\tfrac{\\pi_\\theta(y_w|x)}{\\pi_{ref}(y_w|x)}-\\log\\tfrac{\\pi_\\theta(y_l|x)}{\\pi_{ref}(y_l|x)}]\\big)$.","answer_type":"free-text","solution":"The KL-regularised objective has the closed-form optimum $\\pi^*(y|x)=\\frac{1}{Z(x)}\\pi_{ref}(y|x)\\exp(r(x,y)/\\beta)$. Rearranging gives the reward in terms of the policy: $r(x,y)=\\beta\\log\\frac{\\pi^*(y|x)}{\\pi_{ref}(y|x)}+\\beta\\log Z(x)$. Under Bradley-Terry the preference probability depends only on the reward difference, so the intractable $\\beta\\log Z(x)$ cancels: $p(y_w\\succ y_l)=\\sigma\\big(\\beta\\log\\frac{\\pi^*(y_w|x)}{\\pi_{ref}(y_w|x)}-\\beta\\log\\frac{\\pi^*(y_l|x)}{\\pi_{ref}(y_l|x)}\\big)$. Replacing $\\pi^*$ by the trainable $\\pi_\\theta$ and maximising the log-likelihood of the observed preferences gives the loss $-\\log\\sigma(\\cdot)$ above. The policy is therefore an implicit reward model, and $\\beta$ controls how far it may move from the reference (small $\\beta$ means weaker anchoring). Intuition: raise the likelihood of the chosen response relative to the reference and lower the rejected one. Trap: DPO is offline and sensitive to the data distribution, it can lower the likelihood of both responses, and it needs a good SFT reference model.","category":"dl","kind":"derivation","difficulty":"hard","tags":["DPO","RLHF","alignment","Bradley-Terry"],"origin":"original","status":"self-marked"},{"id":"m-rlhf-reward-hacking","title":"Reward goes up, humans like the model less","prompt":"You run PPO against a reward model trained on human preferences. The reward-model score keeps rising, but human raters' win rate against the SFT model peaks and then declines, and the outputs are getting longer and more flattering. What is happening, how would you confirm it, and what would you change?","hints":["Goodhart's law: the proxy stops tracking the true objective."],"answer":"Reward-model overoptimisation (reward hacking): the policy exploits RM quirks such as length and sycophancy. Confirm with KL versus gold-reward curves and length analysis; mitigate with KL control, early stopping, ensembles, better data.","answer_type":"free-text","solution":"This is reward-model overoptimisation: the reward model is a proxy trained on limited preference data, and as the policy moves away from the SFT distribution it finds regions where the proxy is high but true quality is not, typically through length, style, hedging or flattery biases. To confirm, plot proxy reward and a held-out signal (human or a stronger 'gold' judge) against KL from the reference, which usually shows the gold reward peaking and falling; check correlation of reward with length, and inspect the top-reward samples by hand. Mitigations: tune the KL coefficient $\\beta$ and stop at the peak of the gold curve, apply length-normalised or length-controlled rewards, use reward-model ensembles or uncertainty penalties, refresh the preference data on-policy so the reward model sees the new outputs, and add held-out human evaluation to the training loop. Alternatives are best-of-$n$ with a KL budget or a verifiable reward where possible (code tests, maths answers). Trap: reading the training reward curve as progress; the only trustworthy number is an independent evaluation.","category":"dl","kind":"scenario","difficulty":"medium","tags":["RLHF","reward hacking","alignment","PPO"],"origin":"original","status":"self-marked"},{"id":"m-chinchilla-compute-optimal","title":"Compute-optimal model size from a FLOP budget","prompt":"Training compute for a dense transformer is approximately $C\\approx 6ND$ FLOPs for $N$ parameters and $D$ tokens. Assume the Chinchilla compute-optimal rule $D\\approx20N$. For a budget of $C=10^{24}$ FLOPs, what compute-optimal parameter count $N$ results, in billions? Give a number.","hints":["Substitute $D=20N$ to get $C=120N^2$."],"answer":"about 91.3 billion parameters","answer_type":"numeric","answer_value":91.28709291752767,"solution":"With $D=20N$, $C=6N\\cdot20N=120N^2$, so $N=\\sqrt{10^{24}/120}\\approx9.13\\times10^{10}$, i.e. about 91B parameters trained on about 1.8T tokens. Chinchilla's point is that, for a fixed compute budget, parameters and tokens should be scaled up roughly equally, and many earlier models were too large and under-trained. In practice teams over-train smaller models (for example 100+ tokens per parameter) because inference cost scales with $N$ and is paid for each request, so the compute-optimal point for training alone is not the cost-optimal point over the model's lifetime. Trap: the $6ND$ rule ignores attention FLOPs at long context and the 20:1 ratio depends on the data quality and the fitted scaling-law constants.","category":"dl","kind":"calculation","difficulty":"medium","tags":["scaling laws","Chinchilla","compute"],"origin":"original","status":"verified","entry":"Enter the compute-optimal parameter count $N$, in billions of parameters (e.g. 70 means 70 billion)."},{"id":"m-llm-eval-contamination-judge","title":"Is a five-point benchmark gain real?","prompt":"Your fine-tuned model scores 5 points higher than the base on a public benchmark, and an LLM-as-judge says it wins 65 percent of head-to-head comparisons. Your manager wants to ship. How do you check whether these numbers can be trusted, and how would you build an evaluation you would actually rely on?","hints":["Consider contamination, judge biases and statistical noise."],"answer":"Check for contamination, noise and judge bias before trusting the gain; build a private, task-representative eval with human-calibrated judges and paired confidence intervals.","answer_type":"free-text","solution":"First, contamination: check n-gram overlap between the fine-tuning data and the benchmark, compare accuracy on original items versus paraphrased or re-ordered variants, and test on a fresh private set; a large drop on variants signals memorisation. Second, noise: with a few hundred items a 5-point gap may be within sampling error, so report a paired bootstrap confidence interval, fix the prompts and decoding settings, and average over seeds. Third, the judge: LLM judges show position bias, verbosity bias and self-preference, so swap the order of each pair, control for length, use a rubric, and measure agreement with a sample of human labels (for example Cohen's kappa) before relying on the 65 percent. Finally, the benchmark may not match the product: build a private set from real traffic stratified by task and difficulty, with a few hundred reviewed gold cases, regression tests for known failures, and slice metrics, and add online checks such as human review of a small sample. Trap: shipping on one aggregate number; also, a fine-tune can lift the benchmark while hurting safety or other capabilities, so run the regression suite too.","category":"dl","kind":"scenario","difficulty":"medium","tags":["evaluation","LLM-as-judge","contamination","benchmarks"],"origin":"original","status":"self-marked"},{"id":"m-pretrain-loss-spike-adamw","title":"Loss spikes in a large training run and AdamW","prompt":"Midway through training a 7B model in bf16, the loss suddenly spikes and either recovers slowly or diverges. List what you would check and what you would change. As part of your answer, write down the AdamW update and say why weight decay is 'decoupled'.","hints":["Separate data causes from optimisation causes from numerical causes."],"answer":"Look at the batch, learning rate and warmup, Adam's $\\beta_2$ and $\\epsilon$, gradient clipping and norms, and attention logit growth; rewind to a checkpoint and skip the data. AdamW: $\\theta\\leftarrow\\theta-\\eta(\\hat m/(\\sqrt{\\hat v}+\\epsilon)+\\lambda\\theta)$.","answer_type":"free-text","solution":"AdamW updates $\\theta\\leftarrow\\theta-\\eta\\big(\\hat m_t/(\\sqrt{\\hat v_t}+\\epsilon)+\\lambda\\theta\\big)$; the decay is applied directly to the weights instead of being added to the gradient (L2), so it is not rescaled by the adaptive denominator and acts as a true shrinkage independent of gradient scale. For the spike I would check, in order: (1) data, by logging batch IDs and looking at what was in the spiking batch (corrupt or duplicated text, extreme lengths); (2) the gradient-norm and per-layer update-to-weight ratio traces, since spikes usually follow a norm spike; (3) the optimiser: a too-high peak learning rate, short warmup, $\\beta_2=0.999$ (a value of 0.95 reacts faster to gradient changes) or a tiny $\\epsilon$; (4) numerics: bf16 versus fp32 for the softmax, loss and optimizer state, and attention logits growing (fix with QK-norm or a z-loss on the final logits). Typical remedy: clip gradients at 1.0, lower the learning rate, rewind to a checkpoint before the spike and skip the offending data batches, as in PaLM. Trap: just resuming at the spike or continuing through it, which can bake in a degraded model; and always keep frequent checkpoints so rollback is cheap.","category":"dl","kind":"scenario","difficulty":"hard","tags":["optimisation","AdamW","training instability","bf16"],"origin":"original","status":"self-marked"},{"id":"m-debug-model-wont-train","title":"Your model's loss won't go down","prompt":"You have written a new training loop for a fine-tuning job. After 2,000 steps the training loss is flat at roughly the value you would get from predicting the label prior. Walk through, in order, how you would debug it.","hints":["Start with the cheapest checks that rule out the whole pipeline."],"answer":"Overfit a single batch, check data and labels, learning rate, gradient flow and the loss wiring, then simplify.","answer_type":"free-text","solution":"I would first try to overfit a tiny batch (8-32 examples) to near-zero loss; if that fails it is a bug in the code, not the data or hyperparameters. Then check the basics: inputs and labels are aligned and not shuffled independently, the labels are correct and the tokenisation or masking is right (for example loss computed on padding or on the prompt), the loss expects logits not probabilities, the model is in train mode and the optimizer actually holds the parameters (no frozen layers, no missing `zero_grad` or detach). Next look at the optimisation: print gradient norms per layer (zero means a broken graph, huge means the learning rate is too high), sweep the learning rate over orders of magnitude, check the warm-up and scheduler, and check mixed-precision overflows (NaNs, loss scaling). Then reduce complexity: swap in a small known-good model or dataset and confirm the pipeline reproduces a published baseline. Intuition: bisect the pipeline from data to loss to optimiser. Trap: tuning hyperparameters before proving the pipeline can overfit one batch.","category":"sys","kind":"scenario","difficulty":"easy","tags":["debugging","training","overfit one batch"],"origin":"original","status":"self-marked"},{"id":"m-data-leakage-audit","title":"Suspiciously good validation score: find the leak","prompt":"A churn model for a SaaS product gets 0.97 AUC on validation but performs close to random in production. The data is customer-month rows with features such as usage, support tickets and billing, and the training script uses a random 80/20 row split. List the leakage routes you would look for and how you would fix the evaluation.","hints":["Think about time, entity and feature construction."],"answer":"Likely temporal and entity leakage plus leaky features; use time-based, group-based splits and build features only from data available at prediction time.","answer_type":"free-text","solution":"Random row splits put the same customer in train and validation, so the model can memorise customer identity and neighbouring months, and the future leaks into the past. Look for target leakage in features: anything computed after the prediction date, such as 'cancellation ticket count', 'days since last login' measured at the end of the window, or a billing status that changes after churn. Also check preprocessing fitted on the full data (scalers, target encodings, imputation, feature selection) before the split, and duplicates or near-duplicates across splits. The fix is to define the prediction point explicitly, build every feature as-of that date, split by time (train on earlier months, validate on later ones) with a gap equal to the label horizon, group by customer so one customer never spans splits, and fit all preprocessing inside the training fold only. Sanity checks: feature importances that are dominated by a single odd feature, and a sharp drop in AUC when you shift to a time-based split. Trap: reporting a time-split score after tuning on it repeatedly; keep a final untouched later period as the test set.","category":"sys","kind":"scenario","difficulty":"medium","tags":["data leakage","validation","time series split","churn"],"origin":"original","status":"self-marked"},{"id":"m-distribution-shift-response","title":"Detecting and responding to distribution shift","prompt":"A document-classification model in production has silently degraded over three months. You have access to the logged inputs and model scores, but ground-truth labels arrive only weeks later and for a small sample. How do you detect the shift, work out what kind it is (covariate, label or concept shift), and decide what to do?","hints":["What can you measure without labels?"],"answer":"Monitor input features, embeddings and score distributions, and prior shift via predicted-label rates; confirm with a delayed labelled sample; respond with reweighting, retraining on recent data or fallback.","answer_type":"free-text","solution":"Without labels, monitor the inputs and outputs: per-feature and embedding-drift statistics (PSI, KS test, or the AUC of a classifier trained to distinguish recent from reference data), the distribution of model scores and predicted classes, and data-quality signals such as null rates, language or length changes and new source systems. Covariate shift ($p(x)$ changes, $p(y|x)$ the same) shows up as input drift; label or prior shift shows up as a changing predicted class mix, and can be corrected with a confusion-matrix based reweighting (black-box shift estimation); concept shift ($p(y|x)$ changes, for example a policy or product change) can only be confirmed with labels, so I would pay for a rolling labelled sample from recent traffic, stratified by score and by predicted class, and track performance with confidence intervals. First rule out pipeline bugs (upstream schema change, tokeniser or feature-store change) as they are the commonest cause. Responses: retrain on recent data with time-weighted samples, importance reweighting for covariate shift, add the new categories, route low-confidence cases to humans, and set alerts and a rollback path. Trap: treating every drift alarm as a performance problem; many shifts are harmless, so tie alerts to labelled performance.","category":"sys","kind":"scenario","difficulty":"medium","tags":["distribution shift","monitoring","covariate shift","drift"],"origin":"original","status":"self-marked"},{"id":"m-rag-system-design","title":"Design and debug a RAG assistant over internal documents","prompt":"A client wants a question-answering assistant over 50,000 internal PDFs (policies, contracts, manuals). Early users say 'it hallucinates and misses obvious answers'. Describe the architecture you would build, and how you would tell whether failures come from retrieval or from generation.","hints":["Evaluate retrieval and generation separately."],"answer":"Chunking plus hybrid retrieval and reranking, grounded generation with citations; build a labelled question set and score retrieval (recall@k) and answer faithfulness separately to locate failures.","answer_type":"free-text","solution":"Pipeline: parse PDFs carefully (layout, tables, OCR) and attach metadata; chunk by structure (headings, 300-800 tokens with small overlap); index with dense embeddings plus BM25 (hybrid retrieval, because exact terms like clause numbers and product codes need lexical matching); retrieve about 30-50 candidates, rerank with a cross-encoder, pass the top 5-10 with source IDs, and instruct the model to answer only from context, cite sources and say 'not found' otherwise. Add query rewriting for follow-ups and metadata filters and access control. To diagnose, build 100-300 realistic questions with the gold source passages. Retrieval metrics: recall@k and MRR on whether the gold chunk is retrieved; if recall is low, fix chunking, embeddings, hybrid weighting or query rewriting. Generation: with gold context supplied, measure answer correctness and faithfulness (claims supported by the context, checked by an LLM judge calibrated on human labels); if retrieval is good but answers are wrong, fix the prompt, context ordering or model. Report end-to-end accuracy and the abstention rate. Trap: increasing the number of chunks to fix recall also adds distractors and cost ('lost in the middle'), so measure rather than guess.","category":"sys","kind":"scenario","difficulty":"medium","tags":["RAG","retrieval","evaluation","hallucination"],"origin":"original","status":"self-marked"},{"id":"m-retrieval-mrr-calc","title":"Computing MRR@10 for a retriever","prompt":"You evaluate a retriever on 5 queries, each with one relevant document. The relevant document is ranked at positions 1, 3, 2, 'not in the top 10', and 5. Compute MRR@10 (a query whose relevant document is not in the top 10 contributes 0). Give a number between 0 and 1.","hints":["Reciprocal rank is $1/\\text{rank}$."],"answer":"0.4067","answer_type":"numeric","answer_value":0.4066666666666667,"solution":"The reciprocal ranks are $1,\\ 1/3,\\ 1/2,\\ 0,\\ 1/5$, which sum to $2.033$, so MRR@10 $=2.033/5\\approx0.407$. For comparison, recall@3 is $3/5=0.6$ and recall@10 is $4/5=0.8$: MRR rewards putting the answer first, while recall@k tells you whether the generator could see it at all. For RAG the usual choice is recall@k at the number of chunks you pass to the model, with a reranker improving the order within that set. Trap: MRR only counts the first relevant item and ignores graded relevance, so use nDCG when several documents matter.","category":"sys","kind":"calculation","difficulty":"easy","tags":["retrieval","MRR","recall@k","metrics"],"origin":"original","status":"verified","entry":"Enter MRR@10 over the five queries, a number between 0 and 1."},{"id":"m-llm-agent-reliability","title":"Making a tool-calling agent reliable","prompt":"You are building an LLM agent that books meetings and answers questions using a calendar API, an email search tool and a CRM. In testing it succeeds on 70 percent of tasks; failures include wrong tool arguments, endless loops and acting on stale information. How would you improve the system, and how would you evaluate it?","hints":["Evaluate at the level of trajectories and final outcomes."],"answer":"Constrain the action space (typed schemas, validation, step limits), add retries and human confirmation for risky actions, and evaluate on a fixed task suite by outcome and trajectory with error breakdown.","answer_type":"free-text","solution":"First measure: build a suite of 100+ realistic tasks with programmatically checkable end states (calendar contains the right event, correct answer string), run each several times because agents are stochastic, and log full trajectories to categorise failures (wrong tool, bad arguments, planning error, tool error, looping). Then target the biggest buckets. Fewer, clearer tools with strict JSON schemas and validation of arguments, with error messages fed back to the model so it can repair; deterministic code for things the model need not decide (date parsing, ID lookups); step and cost budgets with loop detection; fresh state read at the moment of acting rather than from the conversation; and confirmation or dry-run for irreversible actions such as sending email. Break complex tasks into smaller stages or a simple plan-then-execute structure, add few-shot examples of tool use for the failure cases, and consider fine-tuning on successful trajectories once you have enough. Metrics: task success rate with confidence intervals, number of steps, cost and latency, and the rate of harmful or unauthorised actions; add the failures as permanent regression tests. Trap: per-step reliability compounds, so a 95 percent step success over 10 steps gives only about 60 percent end-to-end.","category":"sys","kind":"scenario","difficulty":"medium","tags":["agents","tool use","evaluation","reliability"],"origin":"original","status":"self-marked"},{"id":"m-imbalanced-precision-bayes","title":"Precision of a fraud detector at low prevalence","prompt":"Fraud occurs in 0.5 percent of transactions. Your classifier has a true positive rate of 90 percent and a false positive rate of 2 percent. If a transaction is flagged, what is the probability that it is truly fraud (the precision)? Give a number between 0 and 1.","hints":["Apply Bayes' rule with the base rate."],"answer":"0.1844","answer_type":"numeric","answer_value":0.18442622950819673,"solution":"By Bayes' rule, precision $=\\frac{\\mathrm{TPR}\\cdot\\pi}{\\mathrm{TPR}\\cdot\\pi+\\mathrm{FPR}\\cdot(1-\\pi)}=\\frac{0.9\\cdot0.005}{0.9\\cdot0.005+0.02\\cdot0.995}=\\frac{0.0045}{0.0244}\\approx0.184$. So only about 18 percent of alerts are real even though the model looks excellent on accuracy (about 98 percent) and TPR, because the 99.5 percent of legitimate transactions generate far more false alarms than the 0.5 percent of fraud generates true ones. This is why accuracy and ROC-AUC are misleading at low prevalence, and why you should report precision-recall curves, cost-weighted metrics and the alert volume a review team can handle. Trap: TPR and FPR are prevalence-independent but precision is not, so precision measured on a rebalanced test set will not hold in production.","category":"sys","kind":"calculation","difficulty":"easy","tags":["metrics","imbalanced data","Bayes","precision"],"origin":"original","status":"verified","entry":"Enter the precision, the probability a flagged transaction is fraud, as a number between 0 and 1, not a percentage."},{"id":"m-ab-test-sample-size","title":"Sample size for an A/B test on a conversion rate","prompt":"Your current conversion rate is 10 percent. You want to detect an absolute lift to 11 percent with a two-sided test at significance 0.05 and power 0.80. Using the normal approximation $n=(z_{1-\\alpha/2}+z_{1-\\beta})^2\\,\\frac{p_1(1-p_1)+p_2(1-p_2)}{(p_2-p_1)^2}$, how many users are needed per arm? Round to the nearest integer.","hints":["$z_{0.975}\\approx1.96$ and $z_{0.80}\\approx0.84$."],"answer":"about 14,748 per arm","answer_type":"numeric","answer_value":14748.0,"solution":"With $z_{0.975}+z_{0.80}\\approx1.960+0.842=2.802$, the squared sum is $7.85$. The variance term is $0.1\\cdot0.9+0.11\\cdot0.89=0.1879$ and the squared effect is $0.01^2=10^{-4}$, giving $n\\approx7.85\\cdot1879\\approx14{,}750$ per arm, about 29,500 users in total. Halving the detectable effect quadruples the sample size, which is why small lifts on low-traffic features are expensive to confirm. Practical points: fix the sample size or use a sequential method in advance, run for whole weeks to cover weekly cycles, and check the primary metric is the one the decision depends on. Trap: using the sample size for one metric when the metric you care about (for example revenue per user) has much higher variance.","category":"sys","kind":"calculation","difficulty":"medium","tags":["A/B testing","power","sample size","experiments"],"origin":"original","status":"verified","entry":"Enter the number of users needed per arm (each group separately, not the total)."},{"id":"m-ab-test-llm-pitfalls","title":"Pitfalls when A/B testing an LLM feature","prompt":"You launch a new LLM-powered answer feature to 50 percent of users. After three days the dashboard shows a p-value of 0.03 in favour of treatment and the product manager wants to stop the test. What problems could invalidate this result, and how would you design the test properly?","hints":["Consider peeking, sample ratio mismatch and novelty effects."],"answer":"Peeking inflates false positives; also check sample ratio mismatch, novelty effects, multiple metrics, interference and guardrails, and use pre-registered metrics and duration.","answer_type":"free-text","solution":"Stopping when the p-value first dips below 0.05 is optional stopping: repeated looks inflate the false-positive rate well above 5 percent, so fix the duration and sample size in advance or use sequential testing (alpha-spending, always-valid p-values). Check sample ratio mismatch (the arms should be 50/50; a chi-square test on counts detects broken randomisation or logging bugs). Three days is too short to separate novelty or learning effects from steady state, and misses weekly seasonality. If you track many metrics, correct for multiple comparisons or declare a single primary metric; add guardrail metrics such as latency, cost per request, refusal and escalation rates, and safety incidents. Randomise at the user level so that one person does not see both variants, and watch for interference when users share content or when treatment changes the traffic mix. Pair the online test with offline evaluation and human review of sampled outputs, because engagement can rise for the wrong reasons, for example longer, flatter answers. Trap: equating statistical significance with a practically meaningful effect; report the effect size and a confidence interval.","category":"sys","kind":"concept","difficulty":"medium","tags":["A/B testing","experiments","peeking","guardrails"],"origin":"original","status":"self-marked"},{"id":"m-llm-cost-prompt-caching","title":"Cost per day of an LLM endpoint with prompt caching","prompt":"A support bot sends 1,500 tokens of fixed system prompt plus 500 tokens of user-specific context to a hosted model on each request, and receives 300 output tokens. Pricing is 3 USD per million uncached input tokens, 15 USD per million output tokens, and cached input tokens cost 10 percent of the uncached price (assume the 1,500-token prefix always hits the cache). What does 1 million requests per day cost, in USD?","hints":["Cost per request first, then multiply by $10^6$."],"answer":"6450 USD","answer_type":"numeric","answer_value":6450.0,"solution":"Per request: cached input $1500\\times0.3$ USD per million $=450$ micro-USD (that is, $1500\\cdot0.1\\cdot3$), uncached input $500\\cdot3=1500$, output $300\\cdot15=4500$; the total is 6,450 millionths of a USD, i.e. 0.00645 USD per request, so 1M requests cost 6,450 USD per day. Output tokens are 70 percent of the bill even though they are fewer than the input tokens, and without caching the input would cost $2000\\cdot3=6000$, making the total 10,500, so caching saves about 38 percent. Levers to cut cost: shorter outputs and structured formats, a smaller model for easy requests with a router or cascade, caching the prefix and identical queries, batching offline work, and distilling a fine-tuned small model. Trap: assuming price scales with input only; also latency is driven by output length because decoding is sequential.","category":"sys","kind":"calculation","difficulty":"easy","tags":["cost","prompt caching","LLM serving","trade-offs"],"origin":"original","status":"verified","entry":"Enter the total cost of 1 million requests per day, in US dollars."},{"id":"m-llm-serving-latency","title":"Cutting latency and cost of self-hosted LLM serving","prompt":"Your self-hosted 13B chat model has a time-to-first-token (TTFT) of 2.5 s and generates 25 tokens per second per user at low load, but throughput collapses and latency rises sharply at peak traffic. Explain what governs TTFT versus per-token latency, and list the techniques you would apply, with their trade-offs.","hints":["Prefill is compute bound and decode is memory-bandwidth bound."],"answer":"TTFT is dominated by prefill (compute bound), inter-token latency by decode (memory-bandwidth bound, KV cache). Use continuous batching, quantisation, KV-cache management, speculative decoding, prefix caching and a smaller or distilled model.","answer_type":"free-text","solution":"Prefill processes the whole prompt in parallel and is compute-bound, so TTFT scales with prompt length and the queue; decode generates one token per step and is memory-bandwidth bound because every step reads all weights and the KV cache, so per-token latency depends on model size, precision and cache size. At peak, requests queue and the KV cache fills GPU memory, limiting batch size. Techniques: continuous (in-flight) batching with paged KV-cache management (vLLM style) to raise throughput without waiting for batches; prefix caching for shared system prompts; weight quantisation (8-bit or 4-bit AWQ/GPTQ) and KV-cache quantisation or GQA to cut memory traffic, with a small accuracy cost that you must evaluate; speculative decoding with a small draft model, which lowers latency at low batch size but helps less when the GPU is already saturated; chunked prefill so long prompts do not stall decoders; shorter prompts and capped outputs; and routing easy requests to a smaller or distilled model. Set SLOs (p95 TTFT, tokens per second) and load-test, since the trade-off between throughput and latency is set by batch size. Trap: optimising average latency instead of p95/p99, and ignoring that quantisation can regress quality on long-tail tasks.","category":"sys","kind":"concept","difficulty":"hard","tags":["LLM serving","latency","batching","quantisation","speculative decoding"],"origin":"original","status":"self-marked"},{"id":"m-prompt-rag-finetune-decision","title":"Prompting, RAG or fine-tuning?","prompt":"A startup client wants an LLM to (a) answer questions about a product catalogue that changes weekly, (b) write in their brand voice, and (c) output strictly valid JSON for a downstream system. They ask whether to fine-tune. How do you decide what to use for each requirement, and in what order would you try things?","hints":["Match the technique to the type of gap: knowledge, style or format."],"answer":"Use RAG for changing knowledge, few-shot prompting then fine-tuning for style, and constrained decoding or schema validation for format; start with the simplest approach and an evaluation set.","answer_type":"free-text","solution":"Diagnose the type of gap. (a) Knowledge that changes weekly belongs in retrieval (RAG over the catalogue with fresh indexing and citations), because fine-tuning bakes facts into weights, is expensive to update and does not prevent hallucination. (b) Brand voice is a style gap: try a strong system prompt with few-shot examples first; if consistency, length or cost matters at scale, fine-tune (SFT or LoRA) on a few hundred to thousands of curated examples, which also lets a smaller model do the job. (c) Strict JSON is a format gap best solved at decoding time, with structured-output or grammar-constrained decoding plus schema validation and retry, not by hoping the model complies. Order: build an evaluation set first (retrieval accuracy, factuality, voice rating, parse rate), get a baseline with prompting on the best available model, add RAG, then add constraints, and only fine-tune if the measured gap or the unit economics justify it. Combining RAG with a light fine-tune is common. Trap: fine-tuning to inject facts, or to fix a problem you have not measured.","category":"sys","kind":"scenario","difficulty":"medium","tags":["fine-tuning","RAG","prompting","decision making"],"origin":"original","status":"self-marked"},{"id":"m-sl-f-bayes-risk-01","title":"Bayes error at a single point (0-1 loss)","prompt":"A binary classifier must predict a label $\\hat y\\in\\{0,1\\}$ for an input $x$. Under the 0-1 loss ($1$ if wrong, $0$ if right), suppose the true conditional probability is $P(y=1\\mid x)=0.7$. Which label should you predict, and what is the expected loss (the conditional Bayes risk) of that best prediction?","hints":["Predicting $1$ is wrong exactly when $y=0$, which has probability $0.3$."],"answer":"Predict $1$; the expected loss is $0.3$.","answer_type":"numeric","answer_value":0.3,"solution":"Under 0-1 loss the expected loss of predicting a label is the probability that the label is wrong. Predicting $1$ is wrong with probability $1-0.7=0.3$ and predicting $0$ is wrong with probability $0.7$, so the best choice is the more probable class and the Bayes risk at $x$ is $\\min(\\eta,1-\\eta)=0.3$. Averaging this over $x$ gives the Bayes error, the best any classifier can do. This is the base case for the cost-matrix question: there you will replace 'wrong costs 1' by 'wrong costs $C_{y,\\hat y}$' and the rule becomes 'pick the label with the smallest expected cost' rather than 'the most probable label'. It is also the Bayes error that the Cover bound for 1-NN is measured against.","category":"sl","kind":"basics","difficulty":"easy","tags":["Bayes classifier","0-1 loss","conditional risk"],"origin":"original","status":"verified","leads_to":["m-sl-bayes-cost-matrix","m-sl-knn-k-and-cover"],"entry":"Enter the expected 0-1 loss (conditional Bayes risk) of the best prediction, as a probability (work out which label to predict too)."},{"id":"m-sl-f-cost-threshold-02","title":"Unequal costs move the decision threshold","prompt":"A screening test predicts disease ($\\hat y=1$) or healthy ($\\hat y=0$). A correct prediction costs $0$. Wrongly predicting healthy for a sick patient costs $5$; wrongly predicting disease for a healthy patient costs $1$. Let $p=P(y=1\\mid x)$. Predict disease exactly when $p$ is above what threshold?","hints":["Write the expected cost of predicting $1$ (it only costs when the patient is healthy) and of predicting $0$ (it only costs when the patient is sick).","Predict $1$ when its expected cost is smaller."],"answer":"Threshold $1/6\\approx0.167$.","answer_type":"numeric","answer_value":0.16666666666666666,"solution":"Expected cost of predicting $1$ is $(1-p)\\cdot1$, because it is only wrong when the patient is healthy. Expected cost of predicting $0$ is $p\\cdot5$. Predict $1$ when $1-p<5p$, i.e. $p>1/6$. With symmetric costs the threshold would be $1/2$, so costly misses push the threshold down and you flag more patients. In the general cost-matrix question the same recipe applies: compute $\\sum_y P(y\\mid x)C_{y,\\hat y}$ for each candidate $\\hat y$ and take the minimiser; with two classes this is just a moved threshold. Trap: using the costs the wrong way round and getting $5/6$.","category":"sl","kind":"basics","difficulty":"easy","tags":["Bayes classifier","cost matrix","decision threshold"],"origin":"original","status":"verified","leads_to":["m-sl-bayes-cost-matrix"],"entry":"Enter the threshold on $p=P(y=1\\mid x)$, as a probability between 0 and 1, above which you predict disease."},{"id":"m-sl-f-ridge-1d-03","title":"Ridge in one dimension by hand","prompt":"One feature, no offset. The inputs are $x=(1,2)^\\top$ and the targets are $y=(2,3)^\\top$. Ridge regression minimises $\\|y-xw\\|^2+\\lambda w^2$. Compute $\\hat w$ for $\\lambda=3$. (For comparison, what would plain least squares give?)","hints":["Set the derivative to zero: $-2x^\\top(y-xw)+2\\lambda w=0$, so $\\hat w=\\dfrac{x^\\top y}{x^\\top x+\\lambda}$."],"answer":"$\\hat w=1$ (least squares gives $1.6$).","answer_type":"numeric","answer_value":1.0,"solution":"Differentiating gives $(x^\\top x+\\lambda)\\hat w=x^\\top y$. Here $x^\\top y=1\\cdot2+2\\cdot3=8$ and $x^\\top x=1+4=5$, so $\\hat w=8/(5+3)=1$. Least squares ($\\lambda=0$) gives $8/5=1.6$, so ridge multiplies the least-squares answer by $x^\\top x/(x^\\top x+\\lambda)=5/8$. This shrinkage factor $s^2/(s^2+\\lambda)$, with $s^2=x^\\top x$ the squared singular value, is exactly what is summed over directions to get the effective degrees of freedom, and it is the one-dimensional version of the matrix formula $(X^\\top X+\\lambda I)^{-1}X^\\top y$ used in the offset-centring question. Trap: forgetting to add $\\lambda$ to the denominator only, not to the numerator.","category":"sl","kind":"basics","difficulty":"easy","tags":["ridge","closed form","shrinkage"],"origin":"original","status":"verified","leads_to":["m-sl-ridge-effective-dof","m-sl-ridge-offset-centering","m-sl-kernelised-gd"],"entry":"Enter the ridge estimate $\\hat w$ for $\\lambda=3$ (work out the least-squares value too; the solution covers it)."},{"id":"m-sl-f-centring-offset-04","title":"The offset is fixed by the means","prompt":"Fit $y\\approx wx+b$ by least squares to the points $x=(1,2,3)$, $y=(2,4,9)$. Centre both variables first (subtract $\\bar x$ and $\\bar y$), find the slope $w$ from the centred data, then recover the intercept $b$. What is $b$?","hints":["With centred data the slope is $\\sum_i x^c_iy^c_i\\big/\\sum_i (x^c_i)^2$.","The fitted line passes through $(\\bar x,\\bar y)$, so $b=\\bar y-w\\bar x$."],"answer":"$b=-2$ (the slope is $w=3.5$).","answer_type":"numeric","answer_value":-2.0,"solution":"The means are $\\bar x=2$ and $\\bar y=5$, so the centred data are $x^c=(-1,0,1)$ and $y^c=(-3,-1,4)$. The slope is $\\sum x^cy^c/\\sum (x^c)^2=(3+0+4)/2=3.5$, and the intercept is $b=\\bar y-w\\bar x=5-3.5\\cdot2=-2$. The key fact is that setting the derivative with respect to an unpenalised $b$ to zero forces the line through $(\\bar x,\\bar y)$, which is why you can centre first and solve for $w$ on its own. In the ridge-offset question you show the same thing for ridge: the penalty touches only $w$, so $w^*$ is the ridge solution on centred data and $b^*=\\bar y-\\bar x^\\top w^*$. Trap: centring $x$ but not $y$.","category":"sl","kind":"basics","difficulty":"easy","tags":["least squares","centring","intercept"],"origin":"original","status":"verified","leads_to":["m-sl-ridge-offset-centering","m-sl-ridge-effective-dof"],"entry":"Enter the intercept $b$, negative if it is below zero (work out the slope $w$ too; the solution covers it)."},{"id":"m-sl-f-kernel-feature-map-05","title":"Why an inner product of features is a valid kernel","prompt":"Let $\\phi:\\mathcal X\\to\\mathbb R^d$ be any feature map and define $k(x,z)=\\langle\\phi(x),\\phi(z)\\rangle$. Show that $k$ is a valid kernel, i.e. for any points $x_1,\\dots,x_n$ the Gram matrix $K_{ij}=k(x_i,x_j)$ is symmetric and positive semi-definite. Then use the same idea to compute $k(A,B)=2^{|A\\cap B|}$ for $A=\\{1,2,3\\}$, $B=\\{2,3,4\\}$ and say what a feature map for it could look like.","hints":["Look at $c^\\top Kc$ for an arbitrary vector $c$ and write it as a squared norm.","$|A\\cap B|=\\sum_{e}\\mathbf 1[e\\in A]\\mathbf 1[e\\in B]$ is a dot product of indicator vectors."],"answer":"$c^\\top Kc=\\|\\sum_ic_i\\phi(x_i)\\|^2\\ge0$, so $K$ is PSD. For the sets, $|A\\cap B|=2$ so $k=4$.","answer_type":"free-text","solution":"Symmetry is immediate because the inner product is symmetric. For positive semi-definiteness take any $c\\in\\mathbb R^n$: $c^\\top Kc=\\sum_{i,j}c_ic_j\\langle\\phi(x_i),\\phi(x_j)\\rangle=\\big\\langle\\sum_ic_i\\phi(x_i),\\sum_jc_j\\phi(x_j)\\big\\rangle=\\big\\|\\sum_ic_i\\phi(x_i)\\big\\|^2\\ge0$, so every Gram matrix is PSD and $k$ is a kernel. Sets: here $A\\cap B=\\{2,3\\}$, so $|A\\cap B|=2$ and $2^{|A\\cap B|}=4$. The indicator vectors $\\mathbf 1_A,\\mathbf 1_B\\in\\{0,1\\}^{X}$ give $\\langle\\mathbf 1_A,\\mathbf 1_B\\rangle=|A\\cap B|$, a valid kernel, and $2^{|A\\cap B|}=\\prod_{e}(1+\\mathbf 1[e\\in A]\\mathbf 1[e\\in B])$ expands as a sum over subsets $S$ of $\\mathbf 1[S\\subseteq A]\\mathbf 1[S\\subseteq B]$, i.e. a feature map indexed by subsets. This is exactly the hint in the set-intersection kernel question: find features indexed by subsets of $X$. Intuition: any similarity that is secretly a dot product is automatically a kernel. Trap: checking only a few small Gram matrices instead of proving PSD for all $c$.","category":"sl","kind":"basics","difficulty":"easy","tags":["kernels","PSD","feature map"],"origin":"original","status":"self-marked","leads_to":["m-sl-set-intersection-kernel","m-sl-kernelised-gd"]},{"id":"m-sl-f-gd-in-span-06","title":"One gradient step stays in the span of the data","prompt":"Linear model $\\hat y=w^\\top x$ with squared loss $\\ell=\\tfrac12(w^\\top x-y)^2$ on a single example $x=(1,2)^\\top$, $y=3$. Start gradient descent at $w_0=0$ with step size $\\eta=0.1$. After one step, write $w_1=\\alpha x$ and compute the new prediction $w_1^\\top x$ (note it equals $\\alpha\\,k(x,x)$ with the linear kernel).","hints":["The gradient is $(w^\\top x-y)\\,x$, which is a multiple of $x$.","$w_1=w_0-\\eta\\nabla\\ell(w_0)$."],"answer":"$w_1=0.3\\,x=(0.3,0.6)$ and the prediction is $1.5$.","answer_type":"numeric","answer_value":1.5,"solution":"At $w_0=0$ the residual is $w_0^\\top x-y=-3$, so the gradient is $-3x$ and $w_1=0\\,-0.1\\cdot(-3)x=0.3\\,x=(0.3,0.6)$. The prediction is $w_1^\\top x=0.3\\,(x^\\top x)=0.3\\cdot5=1.5$. The point to take away is that the gradient of a loss of the form $\\ell(w^\\top x_i,y_i)$ is always a multiple of $x_i$, so starting from $0$ every iterate is $\\sum_i\\alpha_ix_i$ and predictions only need inner products $x_i^\\top x$. In the kernelised GD question you prove this by induction and then replace $x_i^\\top x$ by $k(x_i,x)$, updating only the coefficients $\\alpha$. Trap: forgetting the sign, since the residual is negative here and the weights move towards the data.","category":"sl","kind":"basics","difficulty":"easy","tags":["gradient descent","representer","kernel trick"],"origin":"original","status":"verified","leads_to":["m-sl-kernelised-gd","m-sl-set-intersection-kernel"],"entry":"Enter the new prediction $w_1^\\top x$ after one gradient step (work out $\\alpha$ too; the solution covers it)."},{"id":"m-sl-f-laplacian-quadratic-07","title":"The graph Laplacian quadratic form","prompt":"A weighted graph has three vertices with edges $w_{12}=2$ and $w_{23}=1$ (and $w_{13}=0$). The Laplacian is $L=D-W$, where $D$ is the diagonal matrix of weighted degrees. For $u=(2,1,3)^\\top$ compute $u^\\top Lu$, and check it equals $\\sum_{(i,j)\\in E}w_{ij}(u_i-u_j)^2$.","hints":["Degrees: $d_1=2$, $d_2=3$, $d_3=1$.","The edge formula needs only the two squared differences."],"answer":"$u^\\top Lu=2(2-1)^2+1(1-3)^2=6$.","answer_type":"numeric","answer_value":6.0,"solution":"With $D=\\mathrm{diag}(2,3,1)$ we get $L=\\begin{pmatrix}2&-2&0\\\\-2&3&-1\\\\0&-1&1\\end{pmatrix}$ and $u^\\top Lu=6$. Via edges: $2(2-1)^2+1(1-3)^2=2+4=6$, which agrees. In general $u^\\top Lu=\\sum_iu_i^2d_i-\\sum_{ij}w_{ij}u_iu_j=\\sum_{(i,j)}w_{ij}(u_i-u_j)^2\\ge0$, so $L$ is PSD, and it is $0$ exactly when $u$ is constant on every connected component. That last fact is the bridge to the Laplacian eigenvalue question: constant vectors give eigenvalue $0$, and the number of zero eigenvalues is the number of connected components, which is why spectral clustering looks at the lowest eigenvectors. Trap: using each edge twice when summing over ordered pairs $(i,j)$ without the factor $\\tfrac12$.","category":"sl","kind":"basics","difficulty":"easy","tags":["graph Laplacian","spectral clustering","quadratic form"],"origin":"original","status":"verified","leads_to":["m-sl-laplacian-zero-eigenvalues"],"entry":"Enter the value of $u^\\top Lu$ for $u=(2,1,3)^\\top$."},{"id":"m-sl-f-hinge-loss-08","title":"Hinge loss at one point, and its subgradient","prompt":"The hinge loss is $\\ell(w)=\\max\\{0,\\,1-y\\,w^\\top x\\}$. For $w=(1,1)^\\top$, $x=(0.5,0.25)^\\top$ and $y=+1$, compute the loss. Then state a subgradient of $\\ell$ at this $w$ and what an online (sub)gradient step with step size $\\eta$ would do to $w$.","hints":["First compute the margin $y\\,w^\\top x$.","When the margin is below $1$, the loss is $1-y\\,w^\\top x$, which is linear in $w$."],"answer":"Loss $=0.25$; subgradient $-y\\,x=(-0.5,-0.25)$, so the step is $w\\leftarrow w+\\eta\\,y\\,x$.","answer_type":"numeric","answer_value":0.25,"solution":"The margin is $y\\,w^\\top x=0.5+0.25=0.75<1$, so the loss is $1-0.75=0.25$ (a correct but not confident prediction is still penalised). In this region $\\ell(w)=1-y\\,w^\\top x$ is linear, so its gradient, and hence a subgradient, is $-y\\,x=(-0.5,-0.25)$; where the margin exceeds $1$ the subgradient is $0$ and at the kink any value in between is allowed. A subgradient step is $w\\leftarrow w+\\eta\\,y\\,x$ when the margin is below $1$ and no change otherwise. This is the loss in the soft-margin SVM (where $C$ weights it against $\\tfrac12\\|w\\|^2$) and the convex loss to which the online-gradient-descent regret bound applies, since convexity and a bounded subgradient are all it needs. Trap: treating hinge loss as zero for any correctly classified point, forgetting the margin of $1$.","category":"sl","kind":"basics","difficulty":"easy","tags":["hinge loss","SVM","subgradient"],"origin":"original","status":"verified","leads_to":["m-sl-svm-hinge-c","m-sl-ogd-regret"],"entry":"Enter the hinge loss at this $w$ (work out the subgradient and update too; the solution covers it)."},{"id":"m-sl-f-exp-loss-bound-09","title":"Exponential loss as a smooth upper bound on 0-1 loss","prompt":"For a real-valued score $f(x)$ and label $y\\in\\{-1,+1\\}$, the 0-1 loss is $\\mathbf 1[y f(x)\\le0]$ and the exponential loss is $e^{-yf(x)}$. (a) Show the exponential loss is always at least the 0-1 loss. (b) Evaluate $e^{-yf}$ at margins $yf=2$, $0$ and $-2$. (c) Why does this make AdaBoost sensitive to mislabelled points?","hints":["Split into the cases $yf>0$ and $yf\\le0$.","$e^{2}\\approx7.39$."],"answer":"If $yf\\le0$ then $e^{-yf}\\ge1=$ 0-1 loss, and if $yf>0$ the 0-1 loss is $0\\le e^{-yf}$. Values: $0.135$, $1$, $7.39$.","answer_type":"free-text","solution":"(a) If $yf>0$ the 0-1 loss is $0$ and $e^{-yf}>0$. If $yf\\le0$ then $-yf\\ge0$, so $e^{-yf}\\ge e^0=1$, which equals the 0-1 loss. So $\\mathbf 1[yf\\le0]\\le e^{-yf}$ everywhere, and driving the exponential loss down drives the training error down too. (b) At margins $2,0,-2$ the loss is $e^{-2}\\approx0.135$, $1$ and $e^{2}\\approx7.39$. (c) A badly wrong point (large negative margin) costs exponentially much, so minimising the exponential loss, which is what AdaBoost greedily does, keeps pushing up the weight of such points,
